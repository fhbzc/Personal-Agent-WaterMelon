t":"{\n    \"active_application\": true,\n    \"active_window_title\": true,\n    \"filesystem_events\": true,\n    \"browser_history\": true,\n    \"process_isolation\": true,\n    \"native_notifications\": true\n}"},{"type":"p","text":"Components should detect capabilities at runtime."},{"type":"p","text":"Unavailable optional capabilities must degrade gracefully."}]},{"number":"29","label":"29.","id":"s29","title":"Runtime and Sandbox Layer","page":80,"blocks":[{"type":"p","text":"Location:"},{"type":"pre","text":"./runtime/"},{"type":"p","text":"This component enforces execution restrictions for agent-controlled code."},{"type":"p","text":"It should cover:"},{"type":"ul","items":["Generated Python scripts","Scheduler scripts","External commands","Subprocesses","Temporary files","Filesystem writes","Work runs (each in a child process of its own, scheduled by the resource governor)"]},{"type":"p","text":"A run of delegated work is a separate process at lower priority; a governor decides how many may run at once from the free processors and memory, lowers them when the computer is busy and pauses the newest when memory is short."}]},{"number":"30","label":"30.","id":"s30","title":"User-Authorized Writable Workspace","page":81,"blocks":[{"type":"p","text":"The writable root defaults to a folder in the user's home and can be moved; the user does not have to configure it before anything works."},{"type":"p","text":"For example:"},{"type":"pre","text":"\u003cAGENT_WORKSPACE\u003e/"},{"type":"p","text":"All agent-controlled writes must occur under this directory."},{"type":"p","text":"Examples:"},{"type":"pre","text":"\u003cAGENT_WORKSPACE\u003e/documents/\n\u003cAGENT_WORKSPACE\u003e/tasks/\n\u003cAGENT_WORKSPACE\u003e/generated/\n\u003cAGENT_WORKSPACE\u003e/downloads/\n\u003cAGENT_WORKSPACE\u003e/tmp/"},{"type":"p","text":"Agent-controlled writes go to the workspace, with one exception the user makes deliberately: a folder they grant to a piece of delegated work becomes writable for that work's runs. A whole drive or the home folder itself cannot be granted."},{"type":"p","text":"The directory the user configures is the single writable root defined in section 110.1. The agent workspace is the workspace subdirectory of that root, and the application's internal state is a sibling subdirectory of the same root."}]},{"number":"31","label":"31.","id":"s31","title":"Filesystem Security Model","page":81,"blocks":[{"type":"p","text":"The following operations must be restricted:"},{"type":"ul","items":["File creation","File modification","File deletion","Directory creation","Directory deletion","Downloads","Archive extraction","Temporary-file creation","Generated script output"]},{"type":"p","text":"The restriction also applies to indirect writes."},{"type":"p","text":"For example:"},{"type":"p","text":"Agent"},{"type":"pre","text":"|\nv"},{"type":"p","text":"Generated Python Script"},{"type":"pre","text":"|\nv"},{"type":"p","text":"Subprocess"},{"type":"pre","text":"|\nv"},{"type":"p","text":"Filesystem"},{"type":"p","text":"The subprocess must not gain additional write privileges."},{"type":"p","text":"**How this is enforced, and what it does not cover.** Generated scripts run"},{"type":"p","text":"under an in-process guard that replaces the filesystem surface of the standard"},{"type":"p","text":"library - `open`, `os.open`, the `os` and `shutil` operations that create,"},{"type":"p","text":"move or delete - so that every path is checked against section 32 before the"},{"type":"p","text":"call proceeds. Temporary files are redirected into the agent's runtime"},{"type":"p","text":"directory by the same mechanism."},{"type":"p","text":"That guard confines a script only as long as the script keeps using the"},{"type":"p","text":"functions it patched, and the requirement above - that a subprocess gains no"},{"type":"p","text":"additional privileges - is precisely where it stopped holding. Three routes"},{"type":"p","text":"went around it, each demonstrated writing a file outside both the workspace and"},{"type":"p","text":"the user's home directory:"},{"type":"p","text":"| Route | Why the filesystem guard did not see it |"},{"type":"p","text":"| --- | --- |"},{"type":"p","text":"| `subprocess`, `multiprocessing` | the child is a new process with the user's own authority and an unpatched standard library |"},{"type":"p","text":"| `os.system`, `os.popen`, `os.startfile`, `os.exec*`, `os.spawn*` | the same, by way of the shell or a direct exec |"},{"type":"p","text":"| `ctypes` | calls the operating system directly; no guarded function is involved |"},{"type":"p","text":"Starting a process and loading a native library are therefore refused outright"},{"type":"p","text":"inside generated scripts. The refusals sit at the lowest point each route"},{"type":"p","text":"passes through - process creation itself, and the native library loader -"},{"type":"p","text":"rather than on the familiar names, so that reloading `subprocess` or"},{"type":"p","text":"re-importing `os` yields a module whose escape route is still closed."},{"type":"p","text":"This costs generated scripts the ability to run external programs. That is the"},{"type":"p","text":"correct trade: a sandbox that permits an unguarded child process is not a"},{"type":"p","text":"sandbox, and section 32 already records that path validation alone is"},{"type":"p","text":"insufficient for arbitrary generated code."},{"type":"p","text":"What remains is a limit worth stating plainly. These blocks are applied inside"},{"type":"p","text":"the interpreter that runs the script, so they constrain a script that is merely"},{"type":"p","text":"careless or mistaken, and they raise the cost for one that is hostile without"},{"type":"p","text":"reducing it to zero. The durable answer is the OS-level isolation section 32"},{"type":"p","text":"asks for, and it now exists."},{"type":"p","text":"**Generated code now runs inside an operating-system sandbox where one is"},{"type":"p","text":"available** - an AppContainer on Windows, Seatbelt on macOS, bubblewrap or"},{"type":"p","text":"Landlock on Linux - which confines its files and its network whatever the code"},{"type":"p","text":"calls. Inside such a sandbox the outright refusals above are relaxed: a script"},{"type":"p","text":"may start Python again (with the guard loaded first) and load native libraries;"},{"type":"p","text":"any other program is refused. It opens no network connection, except the"},{"type":"p","text":"package installer, which reaches only the package index. Where no sandbox is"},{"type":"p","text":"available, the in-process guard is all there is, the run says plainly that it"},{"type":"p","text":"is not OS-isolated, and package installs cannot be automatic. There the guard"},{"type":"p","text":"should be read as a strong constraint rather than a proof."}]},{"number":"32","label":"32.","id":"s32","title":"Path Validation","page":82,"blocks":[{"type":"p","text":"Application-level validation must account for:"},{"type":"ul","items":["Absolute paths","..","Symlinks","Junctions","Relative-path ambiguity","Path normalization","Case normalization where relevant","Mount points","Temporary directory redirection"]},{"type":"p","text":"Conceptually:"},{"type":"pre","text":"def validate_write_path(requested_path, workspace_root):\n    resolved_path = resolve_securely(requested_path)"},{"type":"pre","text":"if not is_inside(resolved_path, workspace_root):\n    raise SecurityViolation()"},{"type":"p","text":"However:"},{"type":"quote","text":"Path validation alone is insufficient for arbitrary generated code."},{"type":"p","text":"OS-level execution isolation should also be used whenever technically possible."},{"type":"p","text":"**The agent acts, and writes in one place.** The agent is meant to do things,"},{"type":"p","text":"not only to describe them, so it holds a real write permission. That permission"},{"type":"p","text":"is confined to a single subdirectory of the workspace, `\u003cworkspace\u003e/agent/`,"},{"type":"p","text":"created for it and shaped like the workspace around it:"},{"type":"pre","text":"\u003cworkspace\u003e/\n    documents/      the user's own\n    downloads/\n    exports/\n    generated/\n    agent/          the agent's, and the only place it may write\n        documents/\n        downloads/\n        exports/\n        generated/\n        .agent_runtime/"},{"type":"p","text":"Reading and writing are therefore scoped differently, and deliberately so. The"},{"type":"p","text":"agent reads the whole workspace, because an agent that cannot see the work it"},{"type":"p","text":"is helping with is not much help. It writes only its own directory, because the"},{"type":"p","text":"workspace also holds the user's own material - what they put there, and what"},{"type":"p","text":"they asked the agent to produce and then edited themselves - and an agent that"},{"type":"p","text":"may write anywhere in the workspace may overwrite any of it. The cost of the"},{"type":"p","text":"narrower permission is one directory level; the cost of the wider one is the"},{"type":"p","text":"user's work."},{"type":"p","text":"Everything the agent produced is then in one place: the user can look at it,"},{"type":"p","text":"keep it, or delete the lot, without first working out which files were theirs."},{"type":"p","text":"Delegated work is the second place: each piece of work writes only in its own"},{"type":"p","text":"folder under `agent_work/` and in the folders the user granted it, and the"},{"type":"p","text":"operating system keeps one work's code out of another's folder. The chat's"},{"type":"p","text":"files are kept per conversation, in `\u003cworkspace\u003e/Chat/\u003cconversation title\u003e/`."},{"type":"p","text":"**The workspace is layered, not flat.** Three layers, from most open to least:"},{"type":"p","text":"| Layer | Read | Write |"},{"type":"p","text":"| --- | --- | --- |"},{"type":"p","text":"| `\u003cworkspace\u003e/agent/` | yes | yes |"},{"type":"p","text":"| the rest of the workspace - the user's own material | yes | no |"},{"type":"p","text":"| `internal/` - settings, credentials, the event log | no | no |"},{"type":"p","text":"The read-only layer is enforced on its own rather than left to follow from the"},{"type":"p","text":"narrow write root. Both rules would refuse the same write, but only one of them"},{"type":"p","text":"can say why it matters: *that is the user's own material* is a different fact"},{"type":"p","text":"from *that is not your directory*, and it is the one worth reporting. Naming"},{"type":"p","text":"the layer also means the protection survives any later change to where the"},{"type":"p","text":"agent writes."},{"type":"p","text":"The event log sits in the internal state, not the workspace, and so is neither"},{"type":"p","text":"readable nor writable by agent-controlled code. What was recorded about the"},{"type":"p","text":"user is not something the agent can quietly revise."},{"type":"p","text":"Relative paths resolve against the agent's own directory, in reads as well as"},{"type":"p","text":"writes, so `documents/notes.md` names one file rather than two. A read finds"},{"type":"p","text":"nothing there falls back to the wider workspace, which is how the agent reads"},{"type":"p","text":"the user's material by name."}]},{"number":"33","label":"33.","id":"s33","title":"Cross-Platform Sandbox","page":83,"blocks":[{"type":"p","text":"The implementation mechanism may differ between operating systems."},{"type":"p","text":"The common architecture should expose:"},{"type":"pre","text":"class SandboxProvider:\n    def execute(\n        self,\n        command,\n        writable_root,\n        readable_paths=None,\n        environment=None\n    ):\n        ..."},{"type":"p","text":"Platform implementations should attempt to guarantee that:"},{"type":"p","text":"write access = USER_DEFINED_WORKSPACE only"},{"type":"p","text":"while read access may be broader according to user permissions and system policy."},{"type":"p","text":"Platform-specific implementations belong under:"},{"type":"pre","text":"platform_layer/   (base.py, windows.py, macos.py, linux.py)\nruntime/isolation.py   (the OS-level sandbox backends)"},{"type":"p","text":"The rest of the agent should not depend on the specific sandbox technology being used."}]},{"number":"34","label":"34.","id":"s34","title":"Agent Heartbeat","page":84,"blocks":[{"type":"p","text":"Location:"},{"type":"pre","text":"./heartbeat/"},{"type":"p","text":"The Agent Heartbeat periodically activates a configured AI model."},{"type":"p","text":"The interval is user-configurable (fifteen minutes by default)."},{"type":"p","text":"The model used for Heartbeat reasoning may also be configurable."}]},{"number":"34.1","label":"34.1","id":"s34-1","title":"The State Calendar","page":84,"blocks":[{"type":"p","text":"A **state** is something that is true over a stretch of time."},{"type":"p","text":"A state is written by the agent heartbeat for the window of activity it has just read, and covers only that window; something longer-lived is the same situation written again in each window it survives. States are not extended or judged afterwards. The state heartbeat, on its own clock (every twelve hours by default), groups them into the tasks and projects the user sees. States are internal: they are looked at in the Debugger, and chat does not use them as context."},{"type":"p","text":"**Superseded: the floor.** States were once all put in front of the agent for every answer, and past a limit chosen among by keyword overlap with the question. Chat is no longer given states at all, and the index that overlap used no longer exists, so neither the floor nor the choosing remains."},{"type":"p","text":"Three things distinguish a state from a scheduled task:"},{"type":"ul","items":["**A state is not executed.** It says what is the case, or what is meant to happen. The scheduler is what makes things happen. Showing an intention and acting on it are different things, and conflating them turns every note about the future into something that fires","**A state covers a span, not an instant** - the stretch of the window it was written for, during which the user was, say, writing the report. A task has a moment; a state has a period","**A state says where it came from.** What the user said, what the agent inferred from watching them, or what accompanies a task the agent scheduled. An answer that treats those alike will eventually tell the user they decided something they never decided"]},{"type":"h","text":"A State Runs When It Actually Runs"},{"type":"p","text":"The period is stated by whatever writes the state, because only it knows what the state is about."},{"type":"p","text":"Offering a choice between two fixed shapes - a short one and a long one - and then assigning a fixed window to each produces spans that are simply false: every long state becomes exactly a week, centred on the moment it was written, and therefore still running for days afterwards whatever it describes. A state that began on Tuesday and ended on Thursday cannot be said at all."},{"type":"ul","items":["A state carries when it began and when it ended, inside the window it was written for","No horizon is asked for or computed. The dates say how long a state runs, and `span_hours` gives the same thing as a number","A state does not claim the days after the moment it was written. A state written now is being written about now, and extending it forwards claims a future nobody described"]},{"type":"h","text":"What Is Not a State"},{"type":"p","text":"Something that has already happened is not a state."},{"type":"p","text":"\"The decision was made\", \"they read the paper\", \"the meeting finished\" are facts about the past. Written to the calendar they sit there claiming to be the user's current situation, days after they stopped being anything of the kind - and they are then read back as though they were still going on."},{"type":"p","text":"A finished thing is an observation, not a state. A state holds what is true over a period that includes the window it was written for."},{"type":"h","text":"Two Horizons"},{"type":"p","text":"Superseded. There is no long term and short term any more: every state covers the window it was written for, and what spans days is made by the state heartbeat, which groups the window states into tasks and projects."},{"type":"h","text":"The Agent's Own Intentions Are States Too"},{"type":"p","text":"Superseded. The state step does not record the agent's own intentions as the user's state; a calendar of the agent's intentions described back to the user as their state is a calendar about the wrong person. A notification the agent schedules still has a state accompanying it, which the scheduler closes when the task is done."},{"type":"h","text":"A State Can Be Opened"},{"type":"p","text":"A state can be opened wherever it is shown - in the Debugger's states grid, and from a trail that names it."},{"type":"p","text":"Being told that the working day is US Eastern, with no way to ask who decided that, when it applies, or whether it was inferred rather than said, is worse than not being told: the user cannot judge it, and cannot correct it."},{"type":"ul","items":["Opening a state shows its period, its status, how many times it has been extended, and its detail","It says **where the state came from** in plain words - what the user said, what the agent inferred from watching them, or what accompanies a scheduled task. The difference between the agent's guess and the user's instruction is the whole reason the source is recorded","It says that a state is shown and never run, because that is the one thing that distinguishes it from the tasks beside it on the same grid"]},{"type":"h","text":"An Inference Carries Its Evidence"},{"type":"p","text":"A state the agent inferred records what it inferred that from, and how."},{"type":"p","text":"The agent is describing the user's own situation back to them, and it can be wrong about it. \"They are working on the report\", offered with nothing behind it, is a claim the user can only accept or delete - they cannot argue with it, correct the reasoning, or tell a good inference from a lucky one."},{"type":"ul","items":["The evidence is what was actually seen - the activity, the file, the page, the message - not a restatement of the conclusion","The reasoning says how that evidence gets to this state, which is the part the user can disagree with","Both are shown when the state is opened","An inferred state with no evidence recorded says so, rather than showing nothing where the reasoning should be. A missing justification that renders as empty space is indistinguishable from one that was never asked for","The trace is bounded. A state is not a place to keep a transcript"]},{"type":"h","text":"Ending a State"},{"type":"p","text":"Superseded. No heartbeat step judges, extends or closes states any more. A state ends where the window it was written for ends, so it simply stops covering the present once its end has passed; something still going is written again in the next window. Only the scheduler closes a state, the one accompanying a task it has finished."}]},{"number":"34.2","label":"34.2","id":"s34-2","title":"A State Is Also a File, and the File Is the State","page":84,"blocks":[{"type":"p","text":"Every state is a file in ``states/`` (section 39.1), and that file is rewritten whenever the state changes. Creation, extension, closing, and a move that came from the user editing the task on the calendar (section 60.1) all reach it."},{"type":"p","text":"**A state is the one thing in the library that is rewritten rather than added to.** Everywhere else a round writes new files and saying the same thing twice is how the library records that it happened twice (section 49.5). A state is not an observation - it is a claim about what is true *now*, and it has a status that supersedes whatever it said before. A folder holding one file per change would say a dozen contradictory things about one afternoon and leave the reader to work out which is current, which is the failure the state's own status field exists to prevent."},{"type":"p","text":"What changed is not thrown away: the history goes in the body, under the current text, so that opening the file shows what is true now and what it was before."},{"type":"p","text":"The file is a mirror, not the record. A state is written to the database first, and a failure to write its file is logged and otherwise ignored - the next change rewrites it. Losing a state because a disk was busy would be a far worse outcome than a file that is briefly out of date."}]},{"number":"35","label":"35.","id":"s35","title":"Heartbeat Checklist","page":85,"blocks":[{"type":"p","text":"The initial checklist contains:"},{"type":"ol","items":["Analyze the user's current state.","Determine whether there is anything useful the agent can do for the user.","Determine whether the heartbeat checklist should be updated."],"start":1},{"type":"quote","text":"**As amended, the checklist is five fixed steps and cannot be edited** - not by the user, and not by the agent."},{"type":"p","text":"\u003e"},{"type":"quote","text":"1. **Analyse the user's current state** and write it as states for this window (section 34.1)"},{"type":"quote","text":"2. **Find the people in this activity** and what they are doing, for Connections"},{"type":"quote","text":"3. **Determine what kind of person the user is** - kept but paused, because the user's nature is now learned from their lessons"},{"type":"quote","text":"4. **Determine which notifications to add or disable**"},{"type":"quote","text":"5. **Determine which next steps of the user's projects are now done** - skipped when there are none open"},{"type":"p","text":"\u003e"},{"type":"quote","text":"Steps 2, 4 and 5 belong to the Connections, Calendar management and Task organisation functions and stop when that function is switched off in Settings \u003e Functions. The step about updating the checklist is gone, because there is no longer a checklist to update, and so is the step that judged the states. Customized Recommendation is not a step: it runs on its own clock, at the configured times (08:00 by default)."},{"type":"h","text":"Why It Cannot Be Edited"},{"type":"p","text":"A heartbeat whose steps can be rewritten by the thing running them can quietly stop doing the one thing it exists for, and nothing shows that it happened."},{"type":"p","text":"The earlier design let the agent rewrite this list from its own output, and let the user retire steps from it. Both were wrong in the same way: the procedure that produces the agent's understanding is not one of the things that understanding may revise. What the agent may change is the *content* of what it knows - the states, the contacts, the notifications - never the procedure that produces it."},{"type":"ul","items":["The five steps are fixed in order and cannot be added to, removed or reordered. A step stops running only when the function it belongs to is switched off - or, for the nature step, while it is paused","The order is the reasoning: work out what is going on, who else is in it, who it is happening to, what is worth interrupting the user for, and which of their next steps are now done","Each step produces something a later step or another part of the application depends on. The states are read by the later steps and grouped into tasks and projects by the state heartbeat; the people go to Connections; the notifications go on the calendar; the ticks go to the projects' next steps","Where the checklist is shown, it is shown as fixed, with what each step is for"]},{"type":"p","text":"The checklist was once mutable, with changes taking effect only at the next execution and each run working from a snapshot captured when it started. With a fixed list there is nothing to change; a run still takes its list at the start."},{"type":"h","text":"A Step Can Finish"},{"type":"p","text":"Removed. The checklist is now five fixed, read-only steps, so no step is added, retired or restored, by the agent or the user. A step stops running only when its function is switched off in Settings \u003e Functions."},{"type":"h","text":"The List Has a Bound"},{"type":"p","text":"Removed. With five fixed, read-only steps the list cannot grow, so there is no bound to enforce and nothing to refuse."},{"type":"h","text":"The Three Written-In Steps"},{"type":"p","text":"Superseded. The checklist is no longer editable by anyone. It is a fixed list of five steps, in a fixed order: analyse the user's current state; find the people in this activity; determine what kind of person the user is (kept but paused); decide which notifications to add or disable; and tick the next steps of the user's work that are now done. A heartbeat whose steps could be rewritten by the thing running them could quietly stop doing the one thing it exists for. There is no per-step enable switch: a step stops running only when the function it belongs to is turned off in Settings \u003e Functions."},{"type":"h","text":"The Checklist Is Shown Beside the Graph"},{"type":"p","text":"Removed. The knowledge graph panel was replaced by the library folders, and the checklist display went with it; a fixed checklist has nothing that needs showing beside the graph. The Heartbeat tab of the Debugger shows each step of a run."},{"type":"p","text":"*Amended 2026-10-18:* THE NEXT-STEPS STEP IS GONE. Tasks have no next steps any more (section 37, as amended): the review's fifth step, which ticked the finished ones, is removed with them, and so is everything that showed or edited them. The user's own to-do list (section 129) is a different thing and stays.","amended":true}],"amendment_note":"2026-10-18: the next-steps step is gone with the tasks' next steps (section 37); the user's own to-do list stays.","amended":true},{"number":"36","label":"36.","id":"s36","title":"Heartbeat Lifecycle","page":85,"blocks":[{"type":"p","text":"Heartbeat Trigger"},{"type":"pre","text":"|\nv"},{"type":"p","text":"Load Checklist Snapshot"},{"type":"pre","text":"|\nv"},{"type":"p","text":"Read the Window of Activity Since the Last Review"},{"type":"pre","text":"|\nv"},{"type":"p","text":"Run Each Step in Turn, Each on Its Own Copy of That Window"},{"type":"pre","text":"|\nv"},{"type":"p","text":"Write States, Contacts, Notifications and Ticked Next Steps"},{"type":"pre","text":"|\nv"},{"type":"p","text":"Record Raw Edits"},{"type":"pre","text":"|\nv"},{"type":"p","text":"Exit"},{"type":"p","text":"No graph or library is searched: the window of activity since the last review is read and folded once, and each step gets its own copy of it. The only things a run writes are states, contacts, notifications added or disabled, and next steps ticked off."},{"type":"p","text":"The model should terminate after the Heartbeat completes."},{"type":"p","text":"It should not remain permanently active."}]},{"number":"36.1","label":"36.1","id":"s36-1","title":"An Agent That Never Acts","page":87,"blocks":[{"type":"p","text":"The instructions that govern what the agent does must name the cost of doing nothing, not only the cost of acting."},{"type":"p","text":"An instruction that says only \"interrupting has a cost, decide against it freely\" is answered correctly by never doing anything. The model is optimising the one cost it was given. The result is an agent that reports itself as running, produces a calendar with nothing on it, and cannot be told apart from one that is broken."},{"type":"h","text":"Scheduling Is Not Interrupting"},{"type":"p","text":"These are different acts with different costs, and treating them as one suppresses the harmless one along with the costly one."},{"type":"ul","items":["A **notification** interrupts. It takes the user away from what they are doing, so it must be worth that","A **scheduled task** did not. It was an entry on a calendar the user reads when they choose, and removes in one action"]},{"type":"p","text":"The heartbeat no longer schedules silent tasks. The step that decides what to do is now the notification step, and what it can add is notifications; a notification pops up when its time comes, so it interrupts. The step is therefore told that an empty list is the right answer most of the time, and never to add a duplicate of a notification already ahead."},{"type":"h","text":"Say What Would Be Worth Doing"},{"type":"p","text":"An instruction that lists only what not to do leaves nothing to do."},{"type":"p","text":"Alongside the caution, the step is told what does justify a notification: above all, a promise the user made to do something later, set for the moment it becomes useful. It looks for those first. Given examples of the shape of a useful notification, it can recognise one."}]},{"number":"36.2","label":"36.2","id":"s36-2","title":"Step Four Is Told What Has Run Out","page":87,"blocks":[{"type":"p","text":"Removed. The state-review step, with its prompt, its verdicts and its ended and running groups, was taken out of the heartbeat (commit 361a71b). Nothing closes a state any more: a state simply stops covering the present once its end has passed."}]},{"number":"37","label":"37.","id":"s37","title":"Heartbeat Invocation Restriction","page":86,"blocks":[{"type":"p","text":"The Heartbeat subsystem is controlled by its background timing mechanism. A full heartbeat is still started only by its timer or by the Debugger."},{"type":"p","text":"Two narrower things also happen on their own. When the screen shows a meeting invitation or a time being agreed, the notification step alone runs at once on that window, in one call. After the agent has been closed, the stretch it missed is read in turns to write states, and nothing else."},{"type":"p","text":"A user message should not directly invoke the Heartbeat process."},{"type":"p","text":"Direct user interactions use the normal agent execution workflow instead."},{"type":"h","text":"A Reason Written Where Nobody Reads It"},{"type":"p","text":"Every state the heartbeat wrote logged `no reason recorded for state ... created by agent`, and stored the sentence that says it is a fault in whatever created it."},{"type":"p","text":"The model had given a reason. The prompt asks for \"how that evidence gets you to this state\" and it answered - and the answer was written to the state's metadata, beside the evidence, rather than to the field the calendar, the API and the Debugger all read."},{"type":"p","text":"Read back afterwards, **\"no reason recorded\" and \"there was no reason\" are the same sentence**, which is the confusion section 52.7 exists to prevent. The warning was not wrong; it was firing on every state, including all the ones the model had explained, which is the way a real fault becomes background noise."},{"type":"h","text":"The Question Is Not In The Library"},{"type":"p","text":"Removed. Each step used to search the library for names taken from the activity, because its checklist item was a question about the user and matched nothing written in the library. Since the library index and search were deleted (commit fcf74e1), nothing is searched for: each step reads the window of activity itself, and can open any item in it whole by its id."},{"type":"p","text":"**A state is a card, not a sentence.** It said what it was and never what it rested on or how much of the window went to it - and two states covering one window are different claims if one took forty minutes and the other took two, while the calendar showed them the same way. Each now carries **`minutes`**, how much of the window it accounts for, and **`sources`**: every file, page and window it rests on, written out in full. The sources are kept apart from the evidence, which is the *argument* for believing the state; these are the things themselves, because a reader who disagrees needs the page rather than a description of the page, and \"a browser tab\" is not something anybody can go and look at."},{"type":"p","text":"**No horizon is asked for or computed.** A field saying whether a state was short or long was the same fact as its dates said twice, and a second place for the two to disagree, so the period says it and nothing else does. The dates say how long a state runs, and `span_hours` gives the same thing as a number."},{"type":"p","text":"**At least one state, unless nobody was there.** Activity in front of the step means something was going on, and returning nothing says the opposite: it puts an empty stretch on the calendar for a stretch that was not empty, and everything reading it later reads it as nothing having happened. The exception is a window that really is idle - the machine locked, background events and nobody at the keyboard - where no state and a sentence saying so is the honest answer."},{"type":"p","text":"**The instruction carries three worked examples**, invented, from a single window: two activities and a brief third, whose minutes add up to no more than the window. Each carries every field it is meant to demonstrate, because an example missing one teaches that the field is optional."},{"type":"p","text":"**And the title, the detail and the numbers each do one job.** The title is **one complete sentence** - not a phrase, not a label - because it is the line the user sees on their calendar with nothing around it, and *\"Replication work\"* names a subject while saying nothing about it. The detail says what the state *is* - what they are doing and what it is in aid of - and does not repeat how long it lasted or when, because that is what the fields are for and prose that restates them is a second place to be wrong."},{"type":"p","text":"**The period a state can be given is the window it was read from.** A review reads a few minutes, and the examples in the instruction were teaching otherwise: one spanned a week, and two claimed more minutes than the window has. An example is the shape the answer takes, so an example that does not fit the window teaches that the window is not the limit - and a state dated across three days on the strength of fifteen minutes is a guess wearing a date. Something longer-lived is either **already on the calendar**, in which case this window carries it on and its end moves - which is how a long state gets long, one window at a time - or it is a **habit rather than a situation**, and belongs to the step after."},{"type":"p","text":"### 34.3 The state heartbeat"},{"type":"p","text":"**A fortnight of one project is a hundred states.** The review that writes them reads a few minutes at a time, so the same situation is written again every window it survives - each true, each worded slightly differently, and nothing anywhere saying *this is one thing*. A reader of the calendar sees a hundred lines; a retrieval over it matches whichever four happen to share the most words with the question. So a **second review runs on its own clock** - every twelve hours by default, against the first one's quarter of an hour - and asks the other question: which of the states already written are about the same thing, and what is that thing?"},{"type":"p","text":"**States are compared by what they mean.** The grouping was word overlap, and on this calendar that measures the wrong thing: one model writes every state, in a stable vocabulary, about a handful of projects, so two states picked at random already share a sixth of their words and the words they share are the project's rather than the work's. *\"Rebuilding the SWR replication package\"* and *\"rebuilding the replication package for the SWR paper\"* are one thing said twice; overlap saw 0.74 of it and an embedding sees 0.93, against 0.06 for an evening of YouTube. **Local, English and small**: ninety megabytes, 384 dimensions, four milliseconds a state on the processor, and nothing leaves the machine - which matters more here than a larger model's accuracy would, because the material is a record of everything the user does. This is why states are written in English (section 34.1, as amended): the English-only model is a fifth the size of a multilingual one of the same quality. The vectors are kept against the text they were read from, so an edited state is read again and one merely seen again is not; and like everything else in this application that needs more than the standard library, with no model on disk it compares words, **says so on its page**, and carries on. **Only the title and the detail are read** - evidence and sources are paths and URLs, and a language model reading `C:/Research/.../fetch.py` is reading punctuation."},{"type":"p","text":"**And what it builds is a tree, not a list.** A flat grouping has to choose an altitude before it has seen anything, which is what the similarity threshold was doing quietly for every group at once. A fortnight on one paper is a handful of sittings on the scripts, a few on the figures and two on the letter: one thing at one altitude and three at another. So every state is joined to its nearest neighbour, those pairs to theirs, up to one root - **agglomerative clustering, average linkage**, average rather than single (which strings unrelated things into a chain through one near-duplicate) or complete (which refuses to join a large group to anything). Built with the **nearest-neighbour chain algorithm**: exact, and n-1 merges in the square of the state count rather than the cube. Cutting the tree at a height would give the flat grouping back; what is done instead is to read it as layers, described below."},{"type":"p","text":"**The tree is read as layers of tasks.** A cut is one height for the whole calendar, and the reason for having a tree at all is that a fortnight on one paper is one thing at one height and four at another. So the page is what a reader would ask for out loud - a few things I have been doing, and what was inside each - built from the tree by two rules."},{"type":"p","text":"**A task holds at least two hours of work or it is not a task**, counting how long each state says it lasted (capped at the window it was read from) rather than how many states there are. A piece smaller than that is not made into a task of one, and it is not hidden either: its states are listed on the task they sit in, as **states that fall outside every sub-task**. That is a finding about those states - they grouped with nothing - and saying it plainly is the only honest way to show it. The first version made every piece a task and then, when a layer came out with three hundred and fifty of them, gathered the smallest into one row labelled *\"the smallest 347 pieces of this task\"*, which told a reader nothing about what those 347 were."},{"type":"p","text":"**Collapse.** Every join is a pair, so a task whose five states came together one at a time is five nested pairs where it should be one layer of five. A join within **a fifth of the tallest join** of the top of its layer happened at the same distance as the layer itself, so its children are lifted into that layer rather than nested under it. Measured against the top of the layer and not against each join's own children: a tight clump is itself a chain of joins at one height, so a rule about a join and its children cannot tell the chain at the top of the tree from the chain inside a clump, and descends through both. A fraction rather than a distance because the tree sets the scale: on real states the joins climb in a smooth ramp - 0.07, 0.18, 0.25, 0.32, 0.36, 0.37, 0.52, 0.61, 0.74, 0.81 - where a fixed five hundredths collapses nothing, every layer is a pair, and eleven states come out as one task."},{"type":"p","text":"**Split.** A task is opened into sub-tasks only where its own join **stands out**: at least 1.15 standard deviations above the joins beneath it, counting a state on its own as a join at nothing. That is the inconsistency criterion, and 1.15 is the value scipy's own documentation uses for cutting a tree this way. It is measured against **every join in the subtree**, not against the heads of the parts: the heads are by definition the tallest things underneath, so a population of those has almost no spread and the score lands near the same value whatever the tree looks like - a number that decides nothing. Against the whole subtree it reads 5.9 for twenty states with a stranger among them and 1.3 for four states assembled at 0.10, 0.11, 0.12."},{"type":"p","text":"**And it stops for three different reasons, which it names.** Fewer than five states, so the states are shorter than a tree of them; nothing underneath but single states, so opening it would turn four states into four tasks of one; or a join that does not stand out, so what is under it is not separate from it. A layer showing more than eight sub-tasks keeps the eight largest and lets the rest join the loose states, because past that the layer is the list it was meant to replace."},{"type":"p","text":"**The picture is the tree.** A dendrogram: every state a leaf, every join a bracket at the height its two halves were apart, the leaves ordered by the tree rather than by when they were written - which is what stops the lines crossing. The cut is drawn **across** it rather than described beside it, colour is the group it leaves behind, grey is a group too small to summarise, and clicking a leaf opens the state. **Summaries are on.** A task gets one call when it is first found, and almost none after that: only a task whose membership has turned over by a third is written again."},{"type":"p","text":"**It had three parts before that, and only the last needed a model** - kept here because the reasons it was replaced are the reasons the shape above is what it is. *How alike two states are* was read off their words, twice: what they **said** (title and detail) and what they **rested on** (evidence and sources). Two measures rather than one, because two states can describe the same afternoon in different words or use the same words about different files, and a single score cannot tell those apart - so both were computed, reported and combined under weights. That is gone with the words: an embedding reads the first, and the second was a structural zero for half the calendar, since a third of it is task-accompanying states that carry no evidence at all. *Which of them formed a group* was label propagation over the graph those scores make: not clustering into a fixed number of parts, because how many things the user has been doing is exactly what is being asked and a method that must be told the answer in advance cannot report it; and not connected components, because one shared filename would then join two unrelated months - components answer \"is there a path\" and the question is \"is there a centre\". *What each group is* is one model call, and **only for groups of five states or more**: a handful of states is a handful of states, and summarising four spends a call to say roughly what the four of them already say. Smaller groups are still found and still shown, with the reason they were not written up."},{"type":"p","text":"**The summary is a record one level above the states it covers**, in the same folder they are mirrored to, naming them - so a reader who doubts it can open what it was made from - and carrying the term-to-state index that makes a summary something to search rather than a label."},{"type":"p","text":"**A task outlives the round that found it.** Everything above is how the tasks were *found*, and it used to run again from nothing every hour - which was right every hour and worthless over two. The tasks were numbered one to five in order of size, so task 3 on Monday and task 3 on Tuesday were unrelated things: nothing could be said about a task over time, not that it grew, not that it went quiet, not that the user had been at it for three weeks, because there was no *it*. And every summary was paid for again, in a model call, to describe a task that had gained one state. So a task is now a row that persists, and each state written since the last round is **appended** to the task it is nearest - one dot product per task - joining it if it is within **one standard deviation** of how far that task's own states already sit from its centre. Not a fixed distance: the same one is generous for a task whose states sit at 0.1 and mean for a task whose states sit at 0.4. A state no task will take is left **loose**, and offered again next round."},{"type":"p","text":"**The grouping is found again only when appending has stopped being honest**, which is five questions asked every round and answered on the page whether or not they fire - because the useful question on a quiet round is not *did it rebuild* but *how close was it*. Have the loose states reached **five**, the size at which they could hold a task at all - and does a group among them hold together as tightly as the tasks already accepted? Five states that each match nothing are five strangers, so the pile is clustered by itself and must pass the same test. Has a task's centre **drifted** more than **0.05** from where the last rebuild left it, which is the twist the whole mechanism guards against: a task fed one state at a time until it is about something else. Has it **widened** past 1.6 times its old spread, absorbing rather than matching. Do two tasks keep wanting the same states, so the boundary between them is stale. And the **backstop**: has the calendar grown by **a fifth** since the last rebuild, whatever the others say - drift is measured against a centre that drifting moves, so it can creep without ever tripping."},{"type":"p","text":"**And a rebuild is not a renumbering.** The new grouping is lined up against the old one **by who is in it**: a group sharing half its membership with a task that was already there *is* that task, and keeps its id, its age and its summary. What split, merged, arrived or ended is recorded as that, rather than reaching the reader as a change of numbers they would have to reverse-engineer from the sizes. A task that ends is kept and marked retired, not deleted - a task that stopped being a task is a fact about the user's months - and whatever replaced it points back at it. A summary is written again only where the membership under it moved by **a third**: a task that gained four states is the same task and says so, and rewriting it would pay a model call to produce the sentence it already has, worded differently, so that a reader watching the panel would see the description of unchanged work change every hour."},{"type":"p","text":"**Every one of those numbers was measured, not chosen.** Two hundred and forty states written the way the review writes them, embedded by the model that actually reads them - so the geometry is real even where the sentences are invented - replayed in arrival order, with three steady subjects and one project deliberately walking from the code to the writing-up in fifteen steps, because that last one is the case the mechanism exists for and it cannot be tested with two separate subjects: those make a new task, not a drifting one. At each step the appended grouping was compared with what a full rebuild would have said, as an **adjusted** Rand index - the plain one sits near 1 whatever happens when there are five groups, since most pairs are in different groups either way. Each limit was swept with the others switched off, because swept together they hide each other: the first attempt had the loose trigger firing every batch, so every other parameter was measured against a grouping that had just been rebuilt anyway and every curve came out flat."},{"type":"p","text":"**At the rate the heartbeat actually runs** - a hundred and twenty states already grouped, then three an hour, sixty rounds - appending alone agrees 0.90 with rebuilding, rebuilding every round is 1.00 by definition, and these limits give **0.986 with four rebuilds in sixty**. Ninety-three per cent of rounds are a few dot products, and seven eighths of the distance is recovered. One honest note on that table: in this regime the backstop was the only signal that fired, and turning the drift and loose checks off changed nothing. They are there for the shapes an hourly replay does not contain - a project that walks somewhere else over a month, a subject arriving all at once - and they earned their limits in the batch sweeps, where those shapes were forced. They are not carrying that result."},{"type":"quote","text":"The obvious way to count the backstop - adding up each round's arrivals - is wrong, and was wrong here first. A state that no task will take is offered again every round, so a handful of states that fit nowhere were counted over and over and would have forced rebuilds nothing had asked for. It is the calendar's own growth that is counted, which cannot double-count."},{"type":"p","text":"**And the round only pays for what it is doing.** Scoring every pair is the square of the calendar; appending a state is one dot product per task. Those were being paid together - every round joined every state to every other and *then* decided it had nothing to rebuild - which is the whole saving thrown away at the last moment. Now the pairs are scored, the tree is built and the layers are read **only on a round that rebuilds**. An appending round scores the new states against the task centres and nothing else: at a thousand states that is a few dozen comparisons against half a million. The dendrogram is kept from the last rebuild and shown labelled *as of* then, because a picture that vanished on every round but the rare one would be worse than one that is honest about its age; the colours on it are the tasks as they stand now, so a state that has joined a task since is coloured for it without having moved."},{"type":"p","text":"**The grouping covers a window, and says which.** With no tasks yet it reads **the last month, and at most a thousand states** - a user who has run this for a year has thousands, and a first grouping over all of them is a quarter of a million pairs spent describing months they are not asking about. Afterwards each round reads from that line forward, and when the count reaches the cap the line moves up and the tasks let go of what falls behind it. Four hundred was the old bound and it was the square that had to be paid *every hour*; a thousand is the square paid when the grouping is found again, which is four times in sixty rounds. And a thousand now costs less than four hundred used to: **eighteen seconds and a hundred and twenty megabytes**, against three seconds at four hundred, where the old code took two minutes and three hundred and sixty megabytes for the same thousand. Two things were paying for nothing. The pair scoring left the tensor library to walk half a million pairs in a Python loop - the docstring above it said a matrix multiply was milliseconds and a loop would be half a minute, and then wrote the loop - and each pair was described into a nine-field record, with a set intersection computed for it, so that sixty of them could be printed."},{"type":"p","text":"**Two limits, and only one of them excludes.** The day limit shapes the FIRST grouping and defers rather than excludes: a state older than a month is not read now, and is read on the next round if it is among the newest thousand by then. What holds a state out permanently is the COUNT - being outside the newest thousand - and while it is outside, the task that held it has let it go. The distinction matters because the page was stating the other thing: that anything older than the first round's window was \"treated as seen, not a backlog, and never read again\", which was true of an earlier design and false of this one. A page that is wrong about which of the user's states were looked at is worse than a page that says nothing."},{"type":"quote","text":"It was an earlier design, and the reason it went is worth keeping. The first version drew a line at the first grouping and read forward from it, which froze the window at whatever the count had been when the line was written: raising the setting from four hundred to a thousand changed nothing, because there were only four hundred states after the line. The window is now the most recent thousand, always, and the line is a record of how far back a round reached rather than a rule about what the next one may read."},{"type":"p","text":"**What is older than the line is treated as seen.** This is the part that is cheap to get wrong and expensive to have wrong. Those states are not a backlog waiting to be noticed: if they were left as unread, every later round would find four thousand states in no task, conclude that what fits nowhere has become a task of its own, rebuild on them - and then find that they are months of unrelated work, and do it again the next hour, forever. So the line is written down with each round and what is before it is before the beginning of this grouping. The same mechanism does both jobs: a state that falls outside the window is forgotten by the task holding it, which is the only honest thing to do with an id nobody can open any more."},{"type":"p","text":"**The states are written in English; the summaries are written in the language the application is set to.** Those are two different decisions and they were one for a while. English for the states is a decision about what the MACHINE reads: one small model has to read all of them, and an English-only model is a fifth the size of a multilingual one of the same quality. A summary is what the USER reads, and a model handed English states will answer in English however the application is configured - so the line that every user-facing prompt carries is carried here too, and a reader is not left with half their agent in a language they did not choose."},{"type":"quote","text":"The prompt that writes those summaries still told the model the states had been \"grouped because their words overlap\", a method that had already been replaced by the embeddings - so it was asking for a judgement about evidence that no longer existed. It now says they were grouped by meaning, and warns about the failure that measure actually has: that five sittings which are all *reading something* share a subject and not a purpose."},{"type":"quote","text":"And the first round used to run inside `start()`. That was harmless while a round was a handful of states, and became the application feeling stuck the moment it was not: the first round is the expensive one by a distance - the whole window, every pair, and the embedding model loaded from disk - and it was being paid while the window was still opening. It was worse on the way out, where a quit during that round could not interrupt it, so every heartbeat's join spent its full five seconds and closing took fifteen. Measured at three hundred states, with nothing else changed: **five and a third seconds to quit with the round inside start, against under one second with it deferred**. The first round now waits a minute after start-up, and also until a hundred states have been written that the grouping has never read. Fewer than that would be a dozen tasks of one, which is a list, and the panel says it is waiting rather than looking broken. A round that is asked to stop while a rebuild is due keeps what it has and lets the next round do it, because the signal that asked will ask again."},{"type":"p","text":"**A task is not a state, and does not live with them.** The summary was written into the states folder, one level above what it covered and distinguished by nothing else - so a reader holding a file could not tell which of the two they had, and a search could not ask for either. They are different claims: a state is about a stretch of time and is true or not; a task is the claim that a number of states are one thing, and it can be wrong in a way no individual state is, because the states can each be right while the grouping that joined them is not. Tasks now have **their own folder**, beside the states rather than among them, still naming what they cover so the claim can be checked against it."},{"type":"p","text":"**And the debugger runs the same code somewhere else.** Real states can only show what the grouping did; made-up ones show what it does to a shape you chose, which is the only way to tell those two apart. So there is a **sandbox**: a second library, laid out exactly like the real one - made-up states in `states/`, the tasks found from them in `state_tasks/` - and a round is handed one place or the other and does the same thing either way. Not a second implementation and not a branch inside the algorithm: a debugger that runs different code from the thing it is debugging is only testing itself, and there is a test asserting the grouping's own body never mentions the sandbox at all. The task rows are separated by a column rather than a second pair of tables, for the same reason: two schemas to keep in step is how a debugger stops testing what it claims to test."},{"type":"p","text":"**The sandbox is internal, and says so on the page.** It lives beside the database rather than in the workspace, because the workspace library is what the user reads - a made-up state answering a real question would be a fabrication however clearly the folder it came from was named. A sandbox round does not become the last report the status bar counts from, and its result carries a banner saying what it is, because the page looks exactly like a real round otherwise, which is the point of it and the risk in it. It summarises, as the real round does: a summary is the thing somebody opening the sandbox came to see, and the round is a press of a button rather than a timer, so the calls are asked for."},{"type":"quote","text":"Summaries written before this change are still in the states folder. They are not moved: rewriting several hundred of the user's files to tidy a layout is not a migration anyone asked for, and the records carry what they are, so they can be found where they are."},{"type":"p","text":"**The sandbox has one press that shows the whole mechanism**, because the parts only mean something together. It puts in **more states than the window holds**, so the cap is doing something rather than being a number in the settings; runs a round; adds a few and runs again; adds a few more and runs a third time. Three rounds and not two, because two do not show it: the second round over a fresh grouping nearly always rebuilds, and that is worth seeing rather than arranging away. Measured on a window of a thousand, with twelve hundred states written:"},{"type":"p","text":"| | round one | round two | round three |"},{"type":"p","text":"|---|---|---|---|"},{"type":"p","text":"| states read | 1,000 of 1,201 | 1,000 | 1,000 |"},{"type":"p","text":"| pairs scored | 499,180 | 499,180 | **96** |"},{"type":"p","text":"| rebuilt | yes, the first grouping | yes, the loose pile | **no** |"},{"type":"p","text":"| model calls | 8 | 1 | **0** |"},{"type":"p","text":"| took | 12.1s | 2.3s | **0.8s** |"},{"type":"p","text":"Round two rebuilt because a first grouping leaves states in no task - thirty-eight of them here - and those are offered again every round, so forty new arrivals became seventy-eight and forty-six of them matched nothing, over the eight at which a loose pile counts as a task nobody has noticed. It cost nothing in identity: all eight tasks kept their ids and seven of the eight summaries were kept, because their membership had not moved by a third. Round three is the ordinary hour: ninety-six comparisons against half a million, and no model at all."},{"type":"p","text":"**And the cap is the one place this loses something, so it says so.** With no tasks yet the grouping reads the most recent thousand; if more than a thousand arrive before the next round, it is the most recent thousand again and **the rest are never read - not then and not later**. The round says that in plain words when it happens rather than leaving it to be inferred from a count, and the setting says the arithmetic: at a few states an hour a thousand is about ten days of catching up, so a fortnight away is fine and a month away is not. It is a floor to raise rather than lower."},{"type":"p","text":"**Each summary is drawn over the whole calendar, not over what it read.** A list of tasks cannot show either of the two things that are missing from it - the states outside the window, which the grouping will never see, and the states inside it that matched no task, which it had nothing to say about. So above each summary is one picture: **when** each state happened along the bottom, **how many** happened in that stretch up the side, and each column drawn in three parts - held in a task, read and in none, not read at all. Underneath, one bar per task showing the stretch it drew on."},{"type":"p","text":"The numbers on it are **the folder's own**. It is drawn from every state in the source with no limit and no window, so the totals can be checked by counting the files, and two rounds an append apart show the same columns plus the new ones: ninety states, then a hundred and fifteen after twenty-five arrive. If the picture were drawn from the round's own reading instead, it would agree with itself and tell the reader nothing."},{"type":"p","text":"**The columns are the resolution, not the rule.** Forty across whatever the calendar spans, so a month reads as most of a day each. What is *read* is decided by two thresholds - a month back, and at most a thousand states - and both are drawn on the same axis as dashed edges, with a line saying which of them actually cut. Which one it is has to be read from what EXISTS rather than from what was read: asking whether the oldest state read is inside the limits answers nothing, because it always is, by construction. Twelve hundred states in a month means the count cut; forty states over ninety days means the month cut; and after the first round there is no month limit to name at all, because the window starts where that round drew its line."},{"type":"p","text":"**A round processes what it has not processed, and nothing else.** This was the whole intent and the first version failed it in a way that hid behind its own output. A state that fits nowhere looks exactly like a state nobody has looked at - neither is in a task - so every round offered the entire pile again. That re-processed what had already been processed, and, worse, held the count of *states that fit nowhere* permanently above the limit at which that means a task nobody has noticed: a first grouping that left thirty-eight states loose therefore forced a rebuild of all thousand on the next round, and on every round after it. The appending mechanism was paying the full price of a rebuild every hour to discover the same thirty-eight states."},{"type":"p","text":"So **being in no task is now written down**. Offered, taken by nothing, and not to be offered again - the pile is a record rather than something rediscovered. What arrives is only what has genuinely never been looked at."},{"type":"p","text":"**And the pile is clustered by itself.** Asking whether the leftovers have become a thing is a question about the leftovers, and answering it by rebuilding the calendar is a hundred times the work for a hundredth of the states - and throws away the appending just done, renumbering, rematching and resummarising every task to answer something none of them were asked. The pile is now grouped among its own members: what comes out big enough is a new task, with no history and no pretence of being anything that came before, and the rest go back to waiting. Measured, three hundred states and then forty at a time:"},{"type":"p","text":"**What makes the pile a task is not how many there are.** Five states that each matched nothing are five strangers as easily as they are a new subject, so the count decides only when to *look*; whether there is a task in there is decided by whether a group is about as tight as the tasks this calendar has already accepted - a standard it set itself rather than a number chosen here. The looking is now nearly free, so it happens as soon as the pile could hold a task at all: the same five that makes a task anywhere else. Eight was the old threshold, from when finding out meant rebuilding a thousand states and the question therefore cost a hundred times what it was worth."},{"type":"quote","text":"That test was got wrong twice, in opposite directions, and both were found by a test rather than by reading the code. Reading the pile as a hierarchy lost the answer: when the pile did not divide, the whole of it came back as one candidate, failed for being about several things, and took the one real subject inside it down with it. Judging a candidate by its MIDDLE then let a tight core swallow strangers - four identical states sit at nothing from each other, which pulls the average down far enough to take in two states about gardening and volcanoes. The tree is now cut where it is tight, and tightness is the middle PLUS the spread, which is the same statistic a task uses to decide whether to take a state. The four identical ones give that group a small middle and an enormous spread, and it is the spread that says it is not one thing."},{"type":"p","text":"| | arrivals | pairs scored | rebuilt |"},{"type":"p","text":"|---|---|---|---|"},{"type":"p","text":"| round 2 | 40 | **360** | no - one new task out of the pile |"},{"type":"p","text":"| round 3 | 40 | 72,010 | yes - the backstop, which is the one signal that does need everything |"},{"type":"p","text":"| round 4 | 40 | **360** | no - one new task out of the pile |"},{"type":"p","text":"Three hundred and sixty is forty arrivals against nine task centres. The same reasoning applies to the sub-tasks drawn inside each task: a task that took nothing has the same ones, and finding them again was sixty thousand comparisons an hour to redraw what had not moved, so they are kept until the task changes."},{"type":"quote","text":"A round that only appends can still make one model call: when the pile becomes a task, that task is new and has nothing written about it yet. The claim that appending costs no model call at all was wrong, and was written into both the rehearsal's own description of itself and the test that checked it."},{"type":"p","text":"**And the page follows a round rather than being refreshed.** There was a Refresh button, which is the wrong shape for the problem twice over: it asks the reader to keep pressing something to find out whether anything is happening, and it can only be pressed by someone who is already looking. A round now writes **named stages** into the report it is filling - reading the states, reading what they mean, scoring every pair, joining them into a tree, summarising task three of eight - and the page reads that same object every four hundred milliseconds **for as long as a round is in flight, and then stops**. Not a standing timer: a page that reloads itself every fifteen seconds is working when nobody is watching and still out of date when somebody is. Opening the tab takes one look and attaches to whatever is running, including a round the hour started, which the button never did."},{"type":"p","text":"Named stages rather than a bar that fills, because *scoring every pair* and *summarising task three of eight* are different kinds of waiting and a fraction says neither. Each stage keeps what it cost, and the first thing that bought was a surprise worth having: on a forty-state sandbox round, **thirty-four of the thirty-four seconds were the embedding model loading from disk**, and every other stage was hundredths. Nothing about the grouping was slow at all."},{"type":"quote","text":"Every button on that panel now says in brackets whose data it touches - one is `(real data)` and four are `(sandbox)` - because the two are the same code over different folders and their results look identical. That is the point of the arrangement and the hazard in it, so the labels carry the difference and a test counts them."},{"type":"quote","text":"The first version of that line asked the wrong question and reported \"nothing was cut\" for a folder where twenty-six of forty states had been left outside the month."},{"type":"p","text":"**The page no longer draws a force-directed graph.** An earlier page drew one node per state, four edges per node and the edges that did not join dashed, laid out with Yifan Hu's force model. It was superseded by the tree (\"The picture is the tree\", above): the page now shows the dendrogram, beside the timeline of tasks."},{"type":"p","text":"**The instruction is on the page beside the message.** A panel that shows what the model was *sent* and not what it was *told to do with it* shows half of the call, and the half that varies: the message is the states, and an answer that reads oddly is usually explained by the instruction. It is carried once rather than repeated under every group - it is the same text each time, which is also what it costs, since it is sent again with every call, and each group's line says both numbers."},{"type":"p","text":"**The table of pairs says what it is a table of.** It read *\"every pair that shared anything, highest first (60 shown)\"*, which names neither what was counted nor what was left out. It now says how many pairs were possible, how many had no word in common at all and were never scored, how many were, which of those are in the table, and that a grey row is a pair that scored below the threshold and did not join - which is the row to read when two groups should have been one."},{"type":"p","text":"**The words shown to a reader are the files, not the pieces they were broken into.** The grouping runs on words split at their punctuation, which is right for matching and wrong to read: a group whose shared evidence prints as `01749, 023, com, https` has named nothing anybody can open. Where every member of a group names the same file or page, that is what is shown - in the panel and in the message the model is sent."},{"type":"p","text":"**A node opens the state it stands for.** A tooltip answers *which state is this* and none of the questions that follow - what it rests on, when it ran, which group it landed in, what it nearly joined instead - and the picture is where somebody is standing when they want those. So clicking a node opens a card carrying the state in full, its group, and its strongest few edges by weight."},{"type":"p","text":"**The arithmetic is written out as steps, and then done on two real states.** It was one sentence of set notation - *`|shared| / |smaller| x sqrt(|smaller| / |bigger|)`* - which says what the arithmetic is to somebody who already knows it and nothing at all to anybody else. It is now four numbered steps: where the two sets of words come from and how they are split, how each half is scored, how the halves are weighted together, and what makes a pair an edge. **Beside them, the same arithmetic done once on this run's own strongest pair**: the two titles, the words each one has, the words they share, each half as `7 / 9 × √(9 / 10) = 0.74`, and the two combined against the threshold. A formula is a claim about what the numbers would be; somebody deciding whether 0.25 is the right threshold needs the numbers. That also makes the page checkable - the sizes are reported on every pair, so the worked example can be recomputed from them rather than believed."},{"type":"p","text":"**And the rest of the method is written beside it**: how an edge is weighed and how the groups are found, in words, built from the settings the run actually used. This is where somebody is standing when they ask why two states are joined, and a page that describes a formula it does not compute is a page that will describe the old one after the next change."},{"type":"p","text":"**A task is described in four parts, and they are updated one at a time.** A title and a paragraph are what the grouping produces; they are not what somebody asks when they come back to something after a week, which is *where was I doing this*, *what was it for*, *what is it*, and *how far did I get*. One paragraph answers all four at once and none of them well. So a task carries **`where`** (the folder, file, repository or site a person would open to carry on), **`goal`** (what will be true when it is over), **`doing`** (the substance - the one field where naming several parts is right) and **`status`** (where it stands and what is left). Each may be empty, and an empty one is a statement that the states did not say, which is better than an invented one."},{"type":"quote","text":"**They are amended, not rewritten.** A task that has been described before is shown its own description, under a heading, *after* the states rather than before them - a description read first is a conclusion, and everything after it gets read as evidence for it - and the instruction is to return only the parts that are now wrong. Anything left out is kept exactly as it was. A round where four states arrived usually moves `status` and nothing else, and rewriting the other three would be three claims restated by something with no new reason to restate them, in different words, so that a reader watching the page sees the description of unchanged work change every hour. The page marks which parts this round wrote, because otherwise four paragraphs give no way to tell this hour's claim from one that has stood for a fortnight. Stored as one JSON column and not four: which parts a task is described in is a property of the instruction that writes them and will move again, and a schema change per revision of a prompt is a schema nobody will revise."},{"type":"p","text":"**And whether it searched is said on the task.** It was recorded, and it was inside the cost block, which is a collapsed section inside a collapsed section - so the answer to *did the model look anything up* was two clicks down on a page whose whole purpose is to answer that. The statement is now on the task itself: searched, with how many times, or not. Where it searched, each search shows what was asked, the reply that asked for it, what came back, the follow-up prompt, and **whether it went on to search again** - *searched twice* and *searched, was not satisfied, and searched again* are the same number and different findings. Where it did not, the page says so and shows the answer it gave instead, because *it did not search* and *it was never offered a search* read the same otherwise."},{"type":"p","text":"**The grouping reads what was observed, not what the agent scheduled.** A state written to accompany a scheduled task - “Scheduled: check the FieldConf 2027 deadline” - is a real record and belongs on the calendar, and it is not something the user did: nobody did it, there is no evidence under it, and its words are the words of a task the agent wrote for itself. Twenty of them say one thing in twenty wordings, because the agent rescheduled one reminder twenty times, so they group tightly and perfectly - and the result was the agent's own backlog handed back to the user as a list of what they had been working on. The round now reads the `user` and `agent` sources only. **Filtered in the query rather than after it**, because these reads have a limit on them: taking the newest thousand and then dropping a third leaves seven hundred, and the caller asked for a thousand. The counts under the overview and the timeline it is drawn from use the same filter, so the picture matches what was actually grouped."},{"type":"p","text":"**Where a task stands is asked every round its states change, and the other three parts are not.** A summary is rewritten only when the task has changed size by a third, which is right for three of the four parts and wrong for the fourth. Where the work lives, what it is in aid of and what it consists of do not change because four states arrived; `status` is the part whose whole job is to move, and under the same rule it sat still for hours at a time while the work it described went on happening. So a task whose membership moved at all - **gained or lost** - gets one small call that answers `status` alone. A departure counts because it is the grouping deciding a state belongs somewhere else: the task is about less than it was, and a status describing the larger thing is wrong."},{"type":"quote","text":"**The call is small on purpose**: the description the task already has, and only the states that moved - eight each way at most - rather than the forty it holds. It is told it may answer that **nothing changed**, and that matters as much as the rest: another sitting on the same obstacle is not movement, and a status rewritten in new words every hour is precisely what the turnover rule was protecting the reader from. It is also told not to return the other three, and to put any suspicion that one of them has gone wrong into `why` for the full summary to judge - that call has every state in front of it, and this one has four."},{"type":"quote","text":"The turnover rule itself measures the **count**, not the membership: `|size now - size when written| / size when written`. A task of twenty states with ten of them swapped for ten different ones scores zero and is never rewritten - and the rebuild explicitly permits that, since a cluster keeps a task's identity down to a half of its membership. The docstring said it answered whether the summary still described what the task held; it answers whether the task changed size. The status call covers the part of that gap that moves most, and does not close it."},{"type":"p","text":"**The sandbox copies a whole state, not the two fields it reads.** A copy took a state's title and its detail and left the rest behind, and `_MadeUp` handed back an empty evidence list and an empty source list to every caller. So in the debugger every state rested on no file, recorded no evidence, had no reasoning behind it and no clock - which made the sandbox a test of a thinner state than the real round reads. What a state rests on, the evidence it recorded and the reasoning the review wrote it with are three of the things a summary is made from, and a search asking for a state *in full* was handing back four fields and three apologies. The copy now carries all of them, with **a local clock computed for the state's new moment** - the sandbox moves states onto a calendar of its own, so keeping the original's wall-clock time would put a Tuesday evening on a Friday morning."},{"type":"quote","text":"Both halves of that went through a record file, and a record's front matter holds scalars and lists. A nested map came back as its own `repr` and raised the moment anything treated it as a map; a LIST came back as a repr too, and iterating a string gives one character at a time - forty `rests on` lines spelling out a path, one letter each. Both are written as JSON now and read back tolerantly, so a record written by the older build does not break either."},{"type":"p","text":"**A search's answer says what was asked for.** The follow-up prompt said *“you asked for this, and here it is”* and then the states, which leaves the model to remember its own question across a turn and to work out whether what arrived answers it. It now names the words or the ids it asked for, says it looked in this group's states and nowhere else, and says what came back - and when nothing did, it says **the search ran and came back empty**, because a heading with nothing under it cannot be told from a search that never happened. The closing line tells it that an empty search is itself a finding it may write down, rather than a reason to guess."},{"type":"p","text":"**A summary that was not rewritten still has its words.** The kept branch built a summary out of a record id, a count and a reason - everyt
