in it. Every setting must therefore carry a short explanation, and the Settings screen must display that explanation beneath the setting's control, in a smaller and visually secondary style."},{"type":"quote","text":"No setting may be presented to the user without an explanation of what it does."},{"type":"p","text":"The explanation is part of the schema, not of the frontend, so that a setting cannot be added without one. An explanation should say what the value affects and what the consequence of changing it is - in particular for a setting whose effect is not evident from its label:"},{"type":"ul","items":["What the setting controls, in the user's terms rather than the implementation's","The practical effect of a higher or lower value, or of enabling or disabling it","Any cost the user is trading against, such as accuracy against speed, completeness against token use, or capability against privacy","Any condition that makes the setting inert, such as depending on another setting being enabled"]},{"type":"p","text":"Where a setting cannot be changed from the Settings screen - a value derived from the launch environment, for example - the explanation must say how it is changed instead, and the control must be presented as read-only rather than as an editable field that silently rejects input."},{"type":"h","text":"Choosing Rather Than Typing"},{"type":"p","text":"A setting whose value identifies something that exists on the machine - a directory, an application - is chosen with the operating system's own chooser, not typed."},{"type":"p","text":"This applies wherever such a value is configured, including a setting that holds several of them."},{"type":"quote","text":"A typed value is one the user has to get right unaided: it can be misspelt, can name something that does not exist, can be the wrong kind of thing, and gives no indication of any of that until something later fails."},{"type":"p","text":"An application is identified by choosing the application itself. The interface stores whatever form the rest of the system matches against, and shows the user what they picked - the user selects an application, not a string that has to correspond to one."},{"type":"p","text":"The requirements are:"},{"type":"ul","items":["Selecting opens the platform's chooser, starting from the current value where there is one, and offering the kind of thing the setting holds","What was chosen is shown, so the user can see what they selected","Where the setting holds several values, each can be added by choosing it and removed individually","A value that is unusable - it does not exist, or it is the wrong kind of thing - is reported when it is chosen, not when it is next used","Typing remains possible for a user who prefers it, and is validated the same way; the chooser is the default path, not the only one"]},{"type":"p","text":"Where the platform provides no directory chooser, the interface says so and accepts a typed path, validated as above."},{"type":"p","text":"The requirement is verifiable: a settings schema in which any setting has no explanation is invalid."}]},{"number":"12.1","label":"12.1","id":"s12-1","title":"User Defaults","page":15,"blocks":[{"type":"p","text":"There are two layers of default, and they belong to different owners."},{"type":"p","text":"The **built-in defaults** are declared by the program. They are identical on every installation and are not editable."},{"type":"p","text":"The **user's defaults** are the values this user has chosen. A setting the user changes becomes their default for that setting from then on, so a preference expressed once does not have to be expressed again."},{"type":"p","text":"The user's defaults are stored beside their settings inside the agent root, as their own file, and therefore travel when the root is copied (section 110.1). Copying the root to a new machine carries the user's configuration with it, without carrying the program's."},{"type":"p","text":"Resolution order, from lowest precedence to highest:"},{"type":"ol","items":["The built-in defaults","This user's defaults","The current value of the setting"],"start":1},{"type":"p","text":"A setting the application derives rather than the user chooses - the agent root and anything computed from it - is not a choice and is never recorded as a user default."},{"type":"p","text":"Resetting a setting means undoing the user's choice: their default for it is forgotten and the built-in value applies again. Resetting to the user's own default would do nothing, because their default is the value they last chose."},{"type":"quote","text":"The user must be able to see what they have chosen, distinguish it from what the program chose, and undo it for any one setting, with the button under its explanation. Undoing every choice at once is available through the API, not yet from the page."}]},{"number":"12.2","label":"12.2","id":"s12-2","title":"The Language the User Works In","page":15,"blocks":[{"type":"p","text":"The agent's memory is kept in English, whatever language the user speaks: its notes to itself, the natures it learns and the keywords it finds things by. One language is what makes comparison possible - the embedding model reads English only, and a word is found only as it is written. The user's language is the display language (below), and what the user reads is written in it."},{"type":"p","text":"**The record's text is never translated.** What a record says stays exactly as it was written. Translating the content would be an agent quoting back its own translation of something it half-understood."},{"type":"p","text":"Where the display language is not English, a task's and a project's words carry an English copy beside them, written in the same call that writes the words, so what is compared stays comparable. A copy that is missing or stale - written for words that have since changed - is filled in at the end of a state round, all of them together in a few short calls."},{"type":"p","text":"The earlier design - keywords in up to eight chosen languages on every record, with a relabelling backlog worked through a batch a round by the data heartbeat - was removed with the data heartbeat on 2026-10-06. There is no relabeller and no index, and no backlog to work through."},{"type":"p","text":"Every model call states the language its output is to be written in: the display language for what the user will read, English for what the agent keeps for itself."},{"type":"h","text":"Being Spoken To, and Being Able to Find Things"},{"type":"p","text":"These are two questions, and one setting was answering both."},{"type":"ul","items":["**Display language** - what the user is *shown*. Every word the agent composes for them to read. One of Chinese, English, Spanish, Japanese or Korean, defaulting to this computer's language when it is one of them, and English otherwise. The application's own screens follow it: Chinese screens for Chinese, English otherwise. Saving a new display language reloads the page","**Memory language** - what the user's memory is kept and *findable* in. Fixed to English in this version and not offered in Settings"]},{"type":"p","text":"They do not have to be the same. Someone whose machine is in English and who thinks in Chinese wants to be spoken to in Chinese; what their memory is kept in is a separate decision, and changing one does not change the other."},{"type":"p","text":"**Display language is not only for replies.** It is a property of the application, not of the conversation, so every prompt whose output the user will read carries it: the reply to a question, the note the heartbeat raises on its own, what a finished task reports, what goes on the calendar. A model writes in whatever language the material in front of it suggests, so a note composed from English source material comes out in English however this is set - and the user ends up reading half of their agent in a language they did not choose. Anywhere the instruction is missing is a place that reverts to the material's language, silently."},{"type":"p","text":"**What is quoted keeps its own words.** File paths, identifiers, error messages, code and anything quoted from a record stay exactly as they are. Translating an error message makes it useless for the thing it was quoted for, and a translated path does not exist."},{"type":"p","text":"Changing the display language does not rewrite anything already stored. A memory keeps the words it was written in (above), and so does a note that has already been raised."},{"type":"h","text":"An Interval Is Set in the Unit You Think In"},{"type":"p","text":"Intervals were stored in seconds, because that is what the loops reading them expected, and every one was also *shown* in seconds."},{"type":"p","text":"\"How often should the agent wake?\" answered as `3600`, under a label ending \"(s)\", is a unit conversion the reader performs in their head to check a value they never chose - and the two intervals that decide most of what the agent costs when nobody is talking to it are exactly those. A setting nobody can read is only nominally a setting."},{"type":"p","text":"The two intervals that decide most of what the agent costs - how often the agent heartbeat wakes and how often the state heartbeat groups - are both set in minutes, as plain number fields, whatever they are stored in (the agent heartbeat's in seconds, the state heartbeat's in hours). Other intervals stored in seconds keep the stored value in seconds and let the control convert. Such a control opens in the largest unit the value divides into evenly, because a value written as one hour was meant as an hour rather than as 3600 of something, and it says in words what the number means. Changing the unit does not change the interval: the same duration is re-expressed, converted from what the control is holding rather than from what it opened with, so a number typed before the unit was changed is not silently thrown away. A value below the setting's floor is brought up to it rather than stored as entered."},{"type":"p","text":"**And it takes effect now, not on the next wake.** The agent heartbeat and the state heartbeat read their interval when they decide how long to sleep, so a change was picked up when the sleep ended - and for the agent that end can be an hour away. Turning an hour down to five minutes then did nothing for up to an hour, which reads as a setting that does not work, while the panel went on reporting the next run an hour out because that is when it had been scheduled."},{"type":"p","text":"So the sleep is interruptible, and a change to one of these settings wakes the loop that depends on it. **A change does not trigger a run**: editing how often something happens is not asking for it to happen. The loop works out again when the run is due, counting from the same moment it was already counting from - so a shortened interval brings the next run forward, and one shortened past the time already spent waiting is due immediately. A setting nothing in the loop's timing depends on does not disturb it, and neither loop is woken by the other's setting."},{"type":"h","text":"Showing a Setting the User Cannot Change"},{"type":"p","text":"A value can be fixed in this version - the machinery takes a choice and this version does not offer one - and the interface has to say that without lying about how to change it."},{"type":"p","text":"Two different things get called read-only, and collapsing them makes one of them wrong:"},{"type":"ul","items":["**derived** - this follows something else, go and change that. The workspace path follows the agent root","**fixed** - the machinery takes a choice here and this version does not offer one"]},{"type":"p","text":"A pinned setting labelled \"read-only\" sends the reader looking for the setting it derives from, and there is not one. It is labelled \"fixed in this version\", and its description says why."},{"type":"p","text":"The memory language was the first such setting. It is now English only, and is not shown in Settings at all. When it was still two languages, Chinese and English, it was shown as what it was - two languages, both on - rather than as a value. A tick list stores one entry per line, and this setting was not written by a tick list: stored as `zh,en` and read a line at a time, it became a single entry named \"zh,en\", shown **ticked** and marked \"not offered here\", with the real zh and en sitting unticked beneath it. Every part of that is wrong about a setting whose entire content is that those two are on. So a stored line that is not an option, but is made entirely of options separated by commas, is read as those options - and a name that genuinely contains a comma is left alone, because it is an option itself."},{"type":"p","text":"What cannot be changed cannot be ticked, either. Disabling the control did nothing here, because the control is a group and the boxes inside it stayed clickable with nothing listening: a tick appeared to take and was silently discarded on the next render."}]},{"number":"13","label":"13.","id":"s13","title":"Graph Display","page":16,"blocks":[{"type":"p","text":"Removed. The knowledge graph was replaced by the library, a set of folders of readable files, on 2026-09-16 (section 39.1), and the graph view went with it, together with its relationship inspection and legibility rules: there is no graph tab, route or view. The graphs on the Experience tab are a different thing."}]},{"number":"14","label":"14.","id":"s14","title":"Debugger Overview","page":16,"blocks":[{"type":"p","text":"The Debugger should provide an interactive visualization of the entire Personalized Agent"},{"type":"p","text":"system, rather than only displaying resource metrics."},{"type":"p","text":"Its purpose is to allow whoever develops the agent to understand:"},{"type":"ul","items":["Which system components are currently running","How components are connected","What data or requests are flowing between components","Which component produced a specific error","What execution trace occurred inside a component","What diagnostic tests are available for that component or connection","Whether a subsystem is healthy, degraded, blocked, or unavailable"]},{"type":"p","text":"The Debugger should function as an interactive System Debug \u0026 Diagnostics Console."},{"type":"p","text":"The Debugger is for whoever develops the agent. A build made from source carries it, and every debugger tab, by default; `build.py --no-debugger` leaves them out, and the released installers and downloads are built that way, so a user's installation has no Debugger and its `/api/debugger` routes are not served."},{"type":"p","text":"Beside the System Map it has a tab for each part that needs one - experience, natures, reading, languages, chat, the agent heartbeat and the state heartbeat. The record of computer usage (section 9) is shown on the Debugger tab when the Debugger is present."}]},{"number":"14.1","label":"14.1","id":"s14-1","title":"System Visualization","page":17,"blocks":[{"type":"p","text":"The primary Debugger interface should display an interactive topology of the running system."},{"type":"p","text":"Conceptually:"},{"type":"pre","text":"           +------------------+\n            |    Desktop UI    |\n            +--------+---------+\n                     |\n                     v\n            +------------------+\n            |    Agent Core    |\n            +---+----------+---+\n                |          |\n      +---------+          +----------+\n      |                               |\n      v                               v\n+-----------+                  +-------------+\n| Heartbeat |                  |  Scheduler  |\n+-----+-----+                  +------+------+\n      |                               |\n      +---------------+---------------+\n                      |\n                      v\n            +------------------+\n            |  Memory Library  |\n            +------------------+"},{"type":"pre","text":"+----------------+\n|    Listener    |\n+-------+--------+\n        |\n        v\n+----------------+\n| Event Pipeline |\n+-------+--------+\n        |\n        +----------------------\u003e Raw Event Storage"},{"type":"pre","text":"+----------------+\n| Model Provider |\n+-------+--------+\n        |\n        +----------------------\u003e Agent Core\n        +----------------------\u003e Heartbeat\n        +----------------------\u003e Scheduler"},{"type":"pre","text":"+----------------+\n| Runtime /      |\n| Sandbox        |\n+-------+--------+\n        |\n        +----------------------\u003e Scheduler\n        +----------------------\u003e Agent Execution"},{"type":"p","text":"The visualization should reflect the actual runtime system, rather than being a static architecture diagram."}]},{"number":"14.2","label":"14.2","id":"s14-2","title":"Debugger System Nodes","page":20,"blocks":[{"type":"p","text":"Each major system or subsystem should appear as a clickable node."},{"type":"p","text":"Examples include:"},{"type":"p","text":"Agent Core"},{"type":"p","text":"Conversations"},{"type":"p","text":"Desktop UI"},{"type":"p","text":"Local API"},{"type":"p","text":"Listener Manager"},{"type":"p","text":"Browser Listener"},{"type":"p","text":"Filesystem Listener"},{"type":"p","text":"Application Listener"},{"type":"p","text":"Heartbeat"},{"type":"p","text":"Scheduler"},{"type":"p","text":"Memory Library"},{"type":"p","text":"Raw Event Storage"},{"type":"p","text":"Raw Edit Storage"},{"type":"p","text":"Model Manager"},{"type":"p","text":"Model Provider"},{"type":"p","text":"Credential Manager"},{"type":"p","text":"Runtime"},{"type":"p","text":"Sandbox"},{"type":"p","text":"Platform Layer"},{"type":"p","text":"Event Bus"},{"type":"p","text":"Notification Service"},{"type":"p","text":"Observability Service"},{"type":"p","text":"Agent Protocol"},{"type":"p","text":"The state heartbeat and delegated work runs are inspected in their own debugger tabs rather than as nodes on the map."},{"type":"p","text":"Nested components may be collapsed into a parent system by default."},{"type":"p","text":"For example:"},{"type":"p","text":"Listener"},{"type":"pre","text":"|\n+-- Browser Provider\n+-- Filesystem Provider\n+-- Application Provider\n+-- Integration Plugins"},{"type":"p","text":"The user should be able to expand or collapse these components."}]},{"number":"14.3","label":"14.3","id":"s14-3","title":"System Node Status","page":21,"blocks":[{"type":"p","text":"Each system node should expose its current runtime state."},{"type":"p","text":"Recommended states include:"},{"type":"pre","text":"starting\nrunning\nidle\nbusy\ndegraded\nblocked\nfailed\nstopped\nunavailable"},{"type":"p","text":"Additional information may include:"},{"type":"p","text":"last activity"},{"type":"p","text":"last successful operation"},{"type":"p","text":"last error"},{"type":"p","text":"active task count"},{"type":"p","text":"queue size"},{"type":"p","text":"CPU usage"},{"type":"p","text":"memory usage"},{"type":"p","text":"model usage"},{"type":"p","text":"restart count"},{"type":"pre","text":"uptime"},{"type":"p","text":"The system topology should update dynamically as component state changes."}]},{"number":"14.4","label":"14.4","id":"s14-4","title":"Clicking a System Component","page":22,"blocks":[{"type":"p","text":"Clicking a system node should open a detailed diagnostics panel for that component."},{"type":"p","text":"The panel should contain several logical sections."},{"type":"h","text":"Overview"},{"type":"p","text":"Display:"},{"type":"ul","items":["Component name","Component ID","Component type","Runtime state","Start time","Uptime","Version","Platform implementation","Current task","Dependencies","Consumers"]},{"type":"h","text":"Runtime Metrics"},{"type":"p","text":"Where relevant:"},{"type":"ul","items":["CPU consumption","Memory consumption","Thread/process count","Queue depth","Request count","Error count","Average latency","Model token usage","Last execution duration"]},{"type":"h","text":"Debug Trace"},{"type":"p","text":"The user should be able to inspect the execution trace produced by the selected component."},{"type":"p","text":"For example:"},{"type":"p","text":"16:31:02.143  Listener received filesystem event"},{"type":"p","text":"16:31:02.145  Event normalized"},{"type":"p","text":"16:31:02.147  Event submitted to event pipeline"},{"type":"p","text":"16:31:02.152  Raw Event persisted"},{"type":"p","text":"16:31:02.156  listener.event emitted"},{"type":"p","text":"The trace should support filtering by:"},{"type":"pre","text":"time\ntask_id\nseverity\nevent_type\ncomponent\nrequest_id\ntrace_id"}]},{"number":"14.5","label":"14.5","id":"s14-5","title":"Structured Trace Model","page":24,"blocks":[{"type":"p","text":"System execution should use structured tracing rather than relying only on plain-text logs."},{"type":"p","text":"A trace should conceptually contain:"},{"type":"pre","text":"TraceEvent:\n    id\n    trace_id\n    span_id\n    parent_span_id"},{"type":"pre","text":"timestamp"},{"type":"pre","text":"component\noperation"},{"type":"pre","text":"task_id\nevent_type\nseverity"},{"type":"pre","text":"duration"},{"type":"pre","text":"input_summary\noutput_summary"},{"type":"pre","text":"status\nerror"},{"type":"pre","text":"metadata"},{"type":"p","text":"Sensitive information must be removed before entering the Debugger trace system."}]},{"number":"14.6","label":"14.6","id":"s14-6","title":"End-to-End Trace","page":25,"blocks":[{"type":"p","text":"A single agent task may pass through many components."},{"type":"p","text":"For example:"},{"type":"p","text":"User Instruction"},{"type":"pre","text":"|\nv"},{"type":"p","text":"Agent Core"},{"type":"pre","text":"|\nv"},{"type":"p","text":"Model Provider"},{"type":"pre","text":"|\nv"},{"type":"p","text":"Runtime"},{"type":"pre","text":"|\nv"},{"type":"p","text":"Generated Task"},{"type":"pre","text":"|\nv"},{"type":"p","text":"Raw Edit"},{"type":"p","text":"There is no retrieval step: the agent core searches no memory, and answers from the instruction and the conversation it was asked in. Library search was removed with the data heartbeat on 2026-10-06."},{"type":"p","text":"All operations belonging to the same logical execution should share a common:"},{"type":"pre","text":"trace_id"},{"type":"p","text":"This allows the Debugger to reconstruct the complete task lifecycle."},{"type":"p","text":"The user should be able to select a task and see:"},{"type":"p","text":"Agent Core"},{"type":"pre","text":"|\n| 14 ms\nv"},{"type":"p","text":"Model Request"},{"type":"pre","text":"|\n| 3.2 s\nv"},{"type":"p","text":"Task Execution"},{"type":"pre","text":"|\n| 420 ms\nv"},{"type":"p","text":"Raw Edit Recording"}]},{"number":"14.7","label":"14.7","id":"s14-7","title":"System Connections","page":27,"blocks":[{"type":"p","text":"Connections between systems should also be first-class interactive objects."},{"type":"p","text":"A connection represents communication or dependency between two components."},{"type":"p","text":"Examples:"},{"type":"pre","text":"Listener -\u003e Event Pipeline"},{"type":"pre","text":"Event Pipeline -\u003e Raw Event Storage"},{"type":"pre","text":"Agent Core -\u003e Model Provider"},{"type":"pre","text":"Heartbeat -\u003e Scheduler"},{"type":"pre","text":"Scheduler -\u003e Runtime"},{"type":"pre","text":"Runtime -\u003e Sandbox"},{"type":"pre","text":"Scheduler -\u003e Notification Service"},{"type":"p","text":"Connections should be clickable independently from system nodes."}]},{"number":"14.8","label":"14.8","id":"s14-8","title":"Connection Diagnostics","page":28,"blocks":[{"type":"p","text":"Clicking a connection should open information about that communication path."},{"type":"p","text":"The interface should display:"},{"type":"ul","items":["Source component","Destination component","Connection type","Interface/API used","Current status","Request count","Failure count","Last successful transfer","Last failed transfer","Average latency","Queue depth where applicable","Recent messages/events","Relevant traces"]},{"type":"p","text":"For example:"},{"type":"p","text":"Connection"},{"type":"p","text":"Listener Manager"},{"type":"pre","text":"-\u003e"},{"type":"p","text":"Event Pipeline"},{"type":"p","text":"Type:"},{"type":"p","text":"Internal Event Stream"},{"type":"p","text":"Status:"},{"type":"p","text":"Healthy"},{"type":"p","text":"Recent Traffic:"},{"type":"p","text":"1,245 events / 10 minutes"},{"type":"p","text":"Average Latency:"},{"type":"p","text":"2.1 ms"},{"type":"p","text":"Last Error:"},{"type":"p","text":"None"}]},{"number":"14.9","label":"14.9","id":"s14-9","title":"Connection Trace","page":29,"blocks":[{"type":"p","text":"A connection should expose its own debug trace."},{"type":"p","text":"For example:"},{"type":"p","text":"Browser Provider"},{"type":"pre","text":"|\n| browser.navigation\nv"},{"type":"p","text":"Event Pipeline"},{"type":"pre","text":"|\n| normalized successfully\nv"},{"type":"p","text":"Raw Event Storage"},{"type":"p","text":"The interface should allow the user to inspect individual events where appropriate."},{"type":"p","text":"Sensitive event content must obey privacy and redaction rules."}]},{"number":"14.10","label":"14.10","id":"s14-10","title":"Debug Tests","page":30,"blocks":[{"type":"p","text":"Each component may expose diagnostic tests."},{"type":"p","text":"The available tests should depend on the selected component."},{"type":"p","text":"For example:"},{"type":"h","text":"Listener"},{"type":"p","text":"Possible tests:"},{"type":"p","text":"Test Browser Listener"},{"type":"p","text":"Test Filesystem Listener"},{"type":"p","text":"Test Active Application Detection"},{"type":"p","text":"Test Event Normalization"},{"type":"p","text":"Test Event Pipeline"},{"type":"p","text":"Test Listener Permissions"},{"type":"h","text":"Scheduler"},{"type":"p","text":"Possible tests:"},{"type":"p","text":"Test Scheduler Database"},{"type":"p","text":"Test Due-Task Detection"},{"type":"p","text":"Test Task Persistence"},{"type":"p","text":"Test Runtime Invocation"},{"type":"p","text":"Test Calendar Synchronization"},{"type":"h","text":"Model Provider"},{"type":"p","text":"Possible tests:"},{"type":"p","text":"Test Authentication"},{"type":"p","text":"Test Model Availability"},{"type":"p","text":"Test API Access"},{"type":"p","text":"Test OAuth Status"},{"type":"p","text":"Test Lightweight Model Request"},{"type":"h","text":"Memory Library"},{"type":"p","text":"Possible tests:"},{"type":"p","text":"Test Database Connection"},{"type":"p","text":"Test Node Read"},{"type":"p","text":"Test Transaction"},{"type":"p","text":"The library has no edges and no search, so there is nothing to traverse and no retrieval pipeline to test."},{"type":"h","text":"Sandbox"},{"type":"p","text":"Possible tests:"},{"type":"p","text":"Test Workspace Write"},{"type":"p","text":"Test Blocked External Write"},{"type":"p","text":"Test Subprocess Isolation"},{"type":"p","text":"Test Temporary File Restriction"},{"type":"p","text":"Test Symlink Escape Protection"}]},{"number":"14.11","label":"14.11","id":"s14-11","title":"Test Interface","page":32,"blocks":[{"type":"p","text":"Components should register diagnostic tests through a common interface."},{"type":"p","text":"Conceptually:"},{"type":"pre","text":"class DiagnosticTest:"},{"type":"pre","text":"id: str\nname: str\ndescription: str"},{"type":"pre","text":"component_id: str"},{"type":"pre","text":"risk_level: str"},{"type":"pre","text":"async def run(self) -\u003e DiagnosticResult:\n    ..."},{"type":"p","text":"A result may contain:"},{"type":"pre","text":"DiagnosticResult:\n    test_id\n    started_at\n    completed_at"},{"type":"pre","text":"status\nsummary"},{"type":"pre","text":"details\ntrace_id"},{"type":"pre","text":"recommendations"},{"type":"p","text":"Recommended result states:"},{"type":"pre","text":"passed\nwarning\nfailed\nskipped\nunsupported"}]},{"number":"14.12","label":"14.12","id":"s14-12","title":"Safe Diagnostic Tests","page":33,"blocks":[{"type":"p","text":"Diagnostic tests must not bypass normal system security controls."},{"type":"p","text":"Tests executed through the Debugger are subject to the same:"},{"type":"ul","items":["Filesystem restrictions","Credential restrictions","Permission system","Runtime sandbox","Platform restrictions"]},{"type":"p","text":"as normal agent operations."},{"type":"p","text":"The Debugger must not become an alternative unrestricted execution interface."}]},{"number":"14.13","label":"14.13","id":"s14-13","title":"Test Risk Levels","page":34,"blocks":[{"type":"p","text":"Diagnostic tests should declare their expected impact."},{"type":"p","text":"Recommended levels:"},{"type":"pre","text":"read_only\nsafe_write\nexternal_request\nstate_changing"},{"type":"p","text":"Read-only diagnostics may run directly."},{"type":"p","text":"Tests that modify persistent system state should clearly indicate this behavior."},{"type":"p","text":"Potentially destructive tests should not be included as normal diagnostics."}]},{"number":"14.14","label":"14.14","id":"s14-14","title":"Connection Tests","page":34,"blocks":[{"type":"p","text":"Connections may also provide tests."},{"type":"p","text":"For example:"},{"type":"pre","text":"Agent Core -\u003e Model Provider"},{"type":"p","text":"Tests:"},{"type":"pre","text":"Check provider reachable\nCheck authentication\nCheck selected model available"},{"type":"p","text":"or:"},{"type":"pre","text":"Scheduler -\u003e Runtime"},{"type":"p","text":"Tests:"},{"type":"pre","text":"Submit dry-run task\nVerify runtime receives task\nVerify sandbox initializes"},{"type":"p","text":"or:"},{"type":"pre","text":"Listener -\u003e Event Pipeline"},{"type":"p","text":"Tests:"},{"type":"pre","text":"Emit synthetic event\nVerify event normalization\nVerify event delivery"},{"type":"p","text":"Synthetic events used by tests should be clearly marked as diagnostic data and should not accidentally become normal user behavioral records."}]},{"number":"14.15","label":"14.15","id":"s14-15","title":"Diagnostic Test Registry","page":35,"blocks":[{"type":"p","text":"The system should maintain a central Diagnostic Test Registry."},{"type":"p","text":"Conceptually:"},{"type":"p","text":"Diagnostic Registry"},{"type":"pre","text":"|\n+-- Agent Core Tests\n|\n+-- Listener Tests\n|\n+-- Scheduler Tests\n|\n+-- Heartbeat Tests\n|\n+-- Memory Library Tests\n|\n+-- Model Tests\n|\n+-- Runtime Tests\n|\n+-- Platform Tests\n|\n+-- Protocol Tests"},{"type":"p","text":"This makes diagnostics extensible."},{"type":"p","text":"Listener plugins and other future integrations may register their own tests."}]},{"number":"14.16","label":"14.16","id":"s14-16","title":"Runtime System Graph","page":36,"blocks":[{"type":"p","text":"The System Debugger should obtain its topology from a structured runtime component registry."},{"type":"p","text":"A component should conceptually register:"},{"type":"pre","text":"SystemComponent:\n    id\n    name\n    component_type"},{"type":"pre","text":"parent_component"},{"type":"pre","text":"dependencies\nconnections"},{"type":"pre","text":"status_provider\nmetrics_provider\ntrace_provider\ndiagnostic_tests"},{"type":"p","text":"The Debugger should generate the visualization from this registry rather than maintaining a manually hard-coded drawing."},{"type":"p","text":"This ensures that future components automatically appear in the System Debugger."}]},{"number":"14.17","label":"14.17","id":"s14-17","title":"Dynamic Components","page":37,"blocks":[{"type":"p","text":"Some components exist only under certain configurations."},{"type":"p","text":"For example:"},{"type":"p","text":"OAuth Provider"},{"type":"p","text":"A desktop application connected through the application protocol"},{"type":"p","text":"VS Code Integration"},{"type":"p","text":"Linux-specific Listener"},{"type":"p","text":"Specific Model Adapter"},{"type":"p","text":"The System Debugger should show components that are:"},{"type":"ul","items":["Loaded","Configured","Running","Disabled","Unavailable"]},{"type":"p","text":"where useful."},{"type":"p","text":"A disabled component may appear differently from a failed component."}]},{"number":"14.18","label":"14.18","id":"s14-18","title":"System Hierarchy","page":38,"blocks":[{"type":"p","text":"The system visualization should support multiple levels of detail."},{"type":"p","text":"Initial view:"},{"type":"p","text":"Frontend"},{"type":"p","text":"Agent Core"},{"type":"p","text":"Observation"},{"type":"p","text":"Knowledge"},{"type":"p","text":"Scheduling"},{"type":"p","text":"Models"},{"type":"p","text":"Runtime"},{"type":"p","text":"Platform"},{"type":"p","text":"Expanding a system reveals individual components."},{"type":"p","text":"For example:"},{"type":"p","text":"Observation"},{"type":"pre","text":"|\n+-- Listener Manager\n|\n+-- Browser Listener\n|\n+-- Filesystem Listener\n|\n+-- Application Listener"},{"type":"p","text":"This prevents the visualization from becoming unreadable as the system grows."}]},{"number":"14.19","label":"14.19","id":"s14-19","title":"Live Activity Visualization","page":39,"blocks":[{"type":"p","text":"Where practical, the Debugger may visualize active execution."},{"type":"p","text":"For example:"},{"type":"p","text":"Agent Core"},{"type":"pre","text":"===\u003e Model Provider"},{"type":"p","text":"Scheduler"},{"type":"pre","text":"===\u003e Runtime"},{"type":"p","text":"An active connection may temporarily indicate that requests or events are flowing through it."},{"type":"p","text":"This visualization is intended for debugging and should not be required for core system execution."},{"type":"p","text":"Debugger rendering must not significantly affect runtime performance."}]},{"number":"14.20","label":"14.20","id":"s14-20","title":"Historical System View","page":40,"blocks":[{"type":"p","text":"The Debugger should allow inspection of recent historical activity, not only current state."},{"type":"p","text":"For example, a user should be able to inspect:"},{"type":"p","text":"Last 5 minutes"},{"type":"p","text":"Last 30 minutes"},{"type":"p","text":"Last hour"},{"type":"p","text":"Specific task"},{"type":"p","text":"Specific Heartbeat"},{"type":"p","text":"Specific state heartbeat round (in its own debugger tab)"},{"type":"p","text":"Specific Scheduler execution"},{"type":"p","text":"This allows failures to be diagnosed after the execution has completed."}]},{"number":"14.21","label":"14.21","id":"s14-21","title":"Heartbeat Debugging","page":40,"blocks":[{"type":"p","text":"Selecting the Heartbeat component should expose:"},{"type":"ul","items":["Last Heartbeat time","Next expected Heartbeat","Model used","Checklist version","Checklist snapshot","Records read (states opened by id)","Actions generated","Scheduled tasks created","Token usage","Execution duration","Failure information"]},{"type":"p","text":"The interface should make it possible to inspect an individual historical Heartbeat execution."},{"type":"p","text":"A single run, step by step, with every prompt and reply, is inspected - and can be started - from the Heartbeat debugger tab."}]},{"number":"14.22","label":"14.22","id":"s14-22","title":"Data Heartbeat Debugging","page":41,"blocks":[{"type":"p","text":"Removed. The data heartbeat and everything that read its output - the indexer, compaction, relabelling and search - were deleted on 2026-10-06, so there is no such component to select; raw activity is now let go by age after eight days. The rule that a model which cannot be used shows in the Debugger as the same failure that triggered the mandatory user notification still applies, to the agent heartbeat and the state heartbeat."}]},{"number":"14.23","label":"14.23","id":"s14-23","title":"Scheduler Debugging","page":41,"blocks":[{"type":"p","text":"Selecting Scheduler should expose:"},{"type":"ul","items":["Scheduler state","Next scheduled event","Pending task count","Running tasks","Completed tasks","Failed tasks","Disabled tasks","Last scheduler loop","Loop latency","Task execution trace"]},{"type":"p","text":"Selecting a task should show the complete execution chain."}]},{"number":"14.24","label":"14.24","id":"s14-24","title":"Runtime and Sandbox Debugging","page":42,"blocks":[{"type":"p","text":"The Runtime/Sandbox node should expose:"},{"type":"ul","items":["Active restricted processes","Workspace path","Process IDs","Allowed writable roots","Blocked write attempts","Exit codes","Resource consumption","Sandbox initialization errors"]},{"type":"p","text":"Security violations should be visually distinguishable from normal application errors."},{"type":"p","text":"For example:"},{"type":"p","text":"SECURITY VIOLATION"},{"type":"p","text":"Task:"},{"type":"pre","text":"task_1827"},{"type":"p","text":"Process:"},{"type":"p","text":"python task_1827.py"},{"type":"p","text":"Attempted Write:"},{"type":"p","text":"/Users/example/Desktop/output.txt"},{"type":"p","text":"Authorized Workspace:"},{"type":"p","text":"/Users/example/AgentWorkspace/"},{"type":"p","text":"Action:"},{"type":"p","text":"Blocked"}]},{"number":"14.25","label":"14.25","id":"s14-25","title":"Model Debugging","page":43,"blocks":[{"type":"p","text":"Selecting a model component should expose:"},{"type":"ul","items":["Provider","Model","Authentication method","Authentication status","Availability","Last successful invocation","Recent failures","Rate-limit status","Quota state where available","Input tokens","Output tokens","Invocation latency"]},{"type":"p","text":"Credentials must never be shown."},{"type":"p","text":"The Debugger may display:"},{"type":"p","text":"OAuth:"},{"type":"p","text":"Authenticated"},{"type":"p","text":"but never:"},{"type":"p","text":"Access Token:"},{"type":"p","text":"..."}]},{"number":"14.26","label":"14.26","id":"s14-26","title":"Debugger Search","page":44,"blocks":[{"type":"p","text":"The Debugger should support search by:"},{"type":"p","text":"task ID"},{"type":"p","text":"trace ID"},{"type":"pre","text":"component\nevent\nerror"},{"type":"p","text":"scheduled task"},{"type":"p","text":"Heartbeat"},{"type":"pre","text":"timestamp"},{"type":"p","text":"This allows a user to quickly locate a specific execution."}]},{"number":"14.27","label":"14.27","id":"s14-27","title":"Exportable Diagnostic Report","page":44,"blocks":[{"type":"p","text":"The user should be able to export a diagnostic report for troubleshooting."},{"type":"p","text":"The exported report may contain:"},{"type":"ul","items":["System topology","Component states","Selected traces","Errors","Test results","Platform capabilities","Application version"]},{"type":"p","text":"Before export, the system must apply secret and privacy redaction."},{"type":"p","text":"Exported reports generated by the agent must obey the authorized workspace write restriction."}]},{"number":"14.28","label":"14.28","id":"s14-28","title":"Debugger Performance Requirement","page":45,"blocks":[{"type":"p","text":"Observability must not substantially interfere with normal system operation."},{"type":"p","text":"Trace collection should therefore support:"},{"type":"ul","items":["Bounded retention","Sampling where appropriate","Log rotation","Configurable verbosity","Asynchronous persistence"]},{"type":"p","text":"High-volume Listener activity should not cause the Debugger database to grow without limits."}]},{"number":"14.29","label":"14.29","id":"s14-29","title":"Updated Observability Architecture","page":45,"blocks":[{"type":"p","text":"The recommended architecture is:"},{"type":"p","text":"System Components"},{"type":"pre","text":"|\n| traces / metrics / health\nv"},{"type":"p","text":"Observability Service"},{"type":"pre","text":"|\n+--------------------+\n|                    |\nv                    v"},{"type":"p","text":"Trace Storage         Metrics Storage"},{"type":"pre","text":"  |                    |\n  +---------+----------+\n            |\n            v\n  System Debugger UI\n            |\n     +------+------+\n     |             |\n     v             v\nSystem Node     Connection\n Inspector      Inspector\n     |             |\n     +------+------+\n            |\n            v\n    Diagnostic Tests"},{"type":"p","text":"System components should publish observability information through the common Observability Service rather than implementing their own independent Debugger UI."}]},{"number":"14.30","label":"14.30","id":"s14-30","title":"Debugger Core Requirement","page":46,"blocks":[{"type":"p","text":"The System Debugger must satisfy the following core behavior:"},{"type":"quote","text":"The user must be able to visually inspect the architecture of the currently running Personalized Agent, select either a system component or a connection between components, inspect its runtime/debug trace, and execute the diagnostic tests registered for that component or connection."},{"type":"p","text":"The visualization must be generated from actual runtime component registration and observability state whenever practical, rather than being purely static."}]},{"number":"14.31","label":"14.31","id":"s14-31","title":"Debugger UI Layout","page":47,"blocks":[{"type":"p","text":"The System Debugger should use a three-region layout designed for interactive inspection of the running Personalized Agent architecture."},{"type":"p","text":"The primary regions are:"},{"type":"ol","items":["Interactive System Map","Component / Connection Inspector","Trace Timeline"],"start":1},{"type":"p","text":"Conceptually:"},{"type":"p","text":"┌─────────────────────────────────────────────────────────── ───────────┐"},{"type":"p","text":"│ System Debugger                                      Search: [     ] │"},{"type":"p","text":"├───────────────────────────────────────────┬─────────────── ───────────┤"},{"type":"p","text":"│                                           │ Inspector                │"},{"type":"p","text":"│                                           │                          │"},{"type":"p","text":"│          Interactive System Map           │ Selected: Agent Core     │"},{"type":"p","text":"│                                           │ Status: Running          │"},{"type":"p","text":"│   Listener ───────\u003e Event Pipeline        │ CPU: ...                 │"},{"type":"p","text":"│                         │                 │ Memory: ...              │"},{"type":"p","text":"│                         ▼                 │                          │"},{"type":"p","text":"│                   Data Management         │ [Overview] [Trace]       │"},{"type":"p","text":"│                         │                 │ [Metrics]  [Tests]       │"},{"type":"p","text":"│            ┌────────────┴────────────┐    │                          │"},{"type":"p","text":"│            ▼                         ▼    │ Available Tests          │"},{"type":"quote","text":"▶"},{"type":"p","text":"│      Memory Library            Raw Storage│  Health Check          │"},{"type":"p","text":"│                                           │ ▶ Test Database Connection│"},{"type":"p","text":"│   Heartbeat ───────\u003e Agent Core            │                          │"},{"type":"p","text":"│                         │                 │                          │"},{"type":"p","text":"│                         ▼                 │                          │"},{"type":"p","text":"│                   Model Provider          │                          │"},{"type":"p","text":"│                                           │                          │"},{"type":"p","text":"├───────────────────────────────────────────┴─────────────── ───────────┤"},{"type":"p","text":"│ Trace Timeline                                                       │"},{"type":"p","text":"│                                                                      │"},{"type":"p","text":"│ 16:01:02  User → Agent Core → Model → Runtime → Raw Edit             │"},{"type":"p","text":"└─────────────────────────────────────────────────────────── ───────────┘"},{"type":"p","text":"The exact visual styling may vary, but the logical structure should remain consistent."}]},{"number":"14.31.1","label":"14.31.1","id":"s14-31-1","title":"Interactive System Map","page":48,"blocks":[{"type":"p","text":"The Interactive System Map is the primary visualization area."},{"type":"p","text":"It should display the topology of the currently running Personalized Agent system."},{"type":"p","text":"Each system component is represented as a node."},{"type":"p","text":"Examples include:"},{"type":"p","text":"Desktop UI"},{"type":"p","text":"Local API"},{"type":"p","text":"Agent Core"},{"type":"p","text":"Conversations"},{"type":"p","text":"Listener"},{"type":"p","text":"Event Pipeline"},{"type":"p","text":"Heartbeat"},{"type":"p","text":"Scheduler"},{"type":"p","text":"Model Manager"},{"type":"p","text":"Model Provider"},{"type":"p","text":"Memory Library"},{"type":"p","text":"Raw Event Storage"},{"type":"p","text":"Raw Edit Storage"},{"type":"p","text":"Runtime"},{"type":"p","text":"Sandbox"},{"type":"p","text":"Platform Layer"},{"type":"p","text":"Credential Manager"},{"type":"p","text":"Notification Service"},{"type":"p","text":"Observability Service"},{"type":"p","text":"Event Bus"},{"type":"p","text":"Agent Protocol"},{"type":"p","text":"There is no Data Heartbeat any more; nothing processes raw activity in the background, and the agent heartbeat reads its own window of activity directly."},{"type":"p","text":"Connections between components should be represented as directed edges."},{"type":"p","text":"For example:"},{"type":"p","text":"Listener"},{"type":"pre","text":"-\u003e"},{"type":"p","text":"Event Pipeline"},{"type":"pre","text":"-\u003e"},{"type":"p","text":"Raw Event Storage"},{"type":"p","text":"or:"},{"type":"p","text":"Agent Core"},{"type":"pre","text":"-\u003e"},{"type":"p","text":"Model Provider"},{"type":"p","text":"The map should support:"},{"type":"ul","items":["Zoom","Pan","Node selection","Edge selection","Expand subsystem","Collapse subsystem","Automatic layout","Manual repositioning where appropriate","Search highlighting","Runtime status visualization"]},{"type":"p","text":"The map must not be implemented as a static image."},{"type":"p","text":"It should be generated from the registered system components and connections whenever practical."}]},{"number":"14.31.2","label":"14.31.2","id":"s14-31-2","title":"Hierarchical System View","page":50,"blocks":[{"type":"p","text":"The system topology should support multiple levels of abstraction."},{"type":"p","text":"At the highest level, the Debugger may display major systems such as:"},{"type":"p","text":"Frontend"},{"type":"p","text":"Agent Core"},{"type":"p","text":"Observation"},{"type":"p","text":"Knowledge"},{"type":"p","text":"Scheduling"},{"type":"p","text":"Models"},{"type":"p","text":"Runtime"},{"type":"p","text":"Platform"},{"type":"p","text":"A user may expand a system to inspect its internal components."},{"type":"p","text":"For example:"},{"type":"p","text":"Observation"},{"type":"pre","text":"|\n+-- Listener Manager\n|\n+-- Application Listener\n|\n+-- Filesystem Listener\n|\n+-- Browser Listener\n|\n+-- Application Integrations\n|\n+-- Event Pipeline"},{"type":"p","text":"The screen, assistant and screenshot listeners are not yet drawn on the map."},{"type":"p","text":"Similarly:"},{"type":"p","text":"Models"},{"type":"pre","text":"|\n+-- Model Manager\n|\n+-- Primary Model Provider\n|\n+-- Credential Manager\n|\n+-- Provider Authentication"},{"type":"p","text":"This hierarchical view prevents the system map from becoming unreadable as additional components are added."}]},{"number":"14.31.3","label":"14.31.3","id":"s14-31-3","title":"Component Inspector","page":52,"blocks":[{"type":"p","text":"When the user selects a system node, the right-side Inspector becomes a Component"},{"type":"p","text":"Inspector."},{"type":"p","text":"The Component Inspector should provide tabs or equivalent sections for:"},{"type":"p","text":"Overview"},{"type":"p","text":"Trace"},{"type":"p","text":"Metrics"},{"type":"p","text":"Tests"},{"type":"p","text":"Errors"},{"type":"p","text":"Overview"},{"type":"p","text":"The Overview section should show:"},{"type":"ul","items":["Component name","Component ID","Component type","Parent subsystem","Runtime state","Version","Start time","Uptime","Platform implementation","Dependencies","Connected components","Current task","Last activity"]},{"type":"p","text":"Trace"},{"type":"p","text":"The Trace section should display structured runtime events generated by the selected component."},{"type":"p","text":"Metrics"},{"type":"p","text":"The Metrics section should display component-specific runtime metrics."},{"type":"p","text":"Tests"},{"type":"p","text":"The Tests section should display diagnostic tests registered by the selected component."},{"type":"p","text":"Errors"},{"type":"p","text":"The Errors section should display recent warnings, failures, degraded states, and security violations associated with that component."}]},{"number":"14.31.4","label":"14.31.4","id":"s14-31-4","title":"Connection Inspector","page":53,"blocks":[{"type":"p","text":"When the user selects an edge, the same right-side Inspector should switch into a Connection"},{"type":"p","text":"Inspector."},{"type":"p","text":"The Connection Inspector should display:"},{"type":"ul","items":["Source component","Destination component","Connection type","Interface or protocol","Connection status","Current activity","Recent request/event count","Average latency","Failure count","Last successful operation","Last failed operation","Queue depth where applicable","Recent connection traces","Available connection tests"]},{"type":"p","text":"For example:"},{"type":"p","text":"Connection"},{"type":"p","text":"Listener Manager"},{"type":"pre","text":"-\u003e"},{"type":"p","text":"Event Pipeline"},{"type":"p","text":"Type:"},{"type":"p","text":"Internal Event Stream"},{"type":"p","text":"Status:"},{"type":"p","text":"Healthy"},{"type":"p","text":"Traffic:"},{"type":"p","text":"1,245 events / 10 min"},{"type":"p","text":"Average Latency:"},{"type":"p","text":"2.1 ms"},{"type":"p","text":"Failures:"},{"type":"p","text":"0"},{"type":"p","text":"Tests:"},{"type":"p","text":"▶"},{"type":"p","text":"Emit Synthetic Event"},{"type":"p","text":"▶"},{"type":"p","text":"Test Event Delivery"},{"type":"p","text":"▶"},{"type":"p","text":"Test Event Normalization"},{"type":"p","text":"This allows communication failures to be debugged independently from failures inside either endpoint."}]},{"number":"14.31.5","label":"14.31.5","id":"s14-31-5","title":"Trace Timeline","page":55,"blocks":[{"type":"p","text":"The bottom section of the Debugger should provide a Trace Timeline."},{"type":"p","text":"The Trace Timeline displays the lifecycle of a selected task, request, Heartbeat, Scheduler execution, or other traceable operation."},{"type":"p","text":"For example:"},{"type":"p","text":"16:01:02.101"},{"type":"p","text":"User Instruction"},{"type":"pre","text":"↓ 2 ms"},{"type":"p","text":"16:01:02.103"},{"type":"p","text":"Agent Core"},{"type":"pre","text":"↓ 34 ms"},{"type":"p","text":"16:01:02.137"},{"type":"p","text":"Model Provider"},{"type":"pre","text":"↓ 418 ms"},{"type":"p","text":"16:01:02.555"},{"type":"p","text":"Runtime"},{"type":"pre","text":"↓ 7 ms"},{"type":"p","text":"16:01:02.562"},{"type":"p","text":"Raw Edit Recorded"},{"type":"p","text":"A compact form may also be displayed:"},{"type":"p","text":"User"},{"type":"p","text":"→ Agent Core"},{"type":"p","text":"→ Model"},{"type":"p","text":"→ Runtime"},{"type":"p","text":"→ Raw Edit"},{"type":"p","text":"Each step should correspond to one or more structured trace spans."},{"type":"p","text":"Selecting a step should navigate to the corresponding component and trace information where possible."}]},{"number":"14.31.6","label":"14.31.6","id":"s14-31-6","title":"Trace Timeline Filtering","page":56,"blocks":[{"type":"p","text":"The Trace Timeline offers these filters: user instruction, heartbeat, scheduled task, diagnostic test, errors only."},{"type":"p","text":"A trace can also be reached by its `task_id` or `trace_id`, by component, or by time range."},{"type":"p","text":"The user should be able to inspect historical traces after an operation has completed."}]},{"number":"14.31.7","label":"14.31.7","id":"s14-31-7","title":"Search","page":57,"blocks":[{"type":"p","text":"The System Debugger should provide global search."},{"type":"p","text":"Search should support values such as:"},{"type":"p","text":"component name"},{"type":"p","text":"component ID"},{"type":"p","text":"task ID"},{"type":"p","text":"trace ID"},{"type":"p","text":"event type"},{"type":"pre","text":"error"},{"type":"p","text":"scheduled task"},{"type":"p","text":"Heartbeat"},{"type":"p","text":"model invocation"},{"type":"pre","text":"timestamp"},{"type":"p","text":"Search results should highlight the relevant system node, connection, or trace."}]},{"number":"14.31.8","label":"14.31.8","id":"s14-31-8","title":"Runtime Activity Visualization","page":58,"blocks":[{"type":"p","text":"The System Map may visually indicate live communication between components."},{"type":"p","text":"For example:"},{"type":"p","text":"Agent Core"},{"type":"pre","text":"======\u003e Model Provider"},{"type":"p","text":"or:"},{"type":"p","text":"Listener"},{"type":"pre","text":"======\u003e Event Pipeline"},{"type":"p","text":"This may be represented through animation or another lightweight visual indicator."},{"type":"p","text":"Live visualization must be derived from observability events and must not interfere with system execution."},{"type":"p","text":"The Debugger should remain functional if live animation is disabled."}]},{"number":"14.31.9","label":"14.31.9","id":"s14-31-9","title":"Status Visualization","page":58,"blocks":[{"type":"p","text":"System nodes and connections should visually distinguish runtime state."},{"type":"p","text":"The UI should make it possible to quickly identify:"},{"type":"pre","text":"running\nidle\nbusy\ndegraded\nblocked\nfailed\nstopped\nunavailable"},{"type":"p","text":"Security failures should be visually distinct from normal runtime failures."},{"type":"p","text":"For example, an external write blocked by the Sandbox should be identifiable as a security event rather than merely a generic execution failure."}]},{"number":"14.31.10","label":"14.31.10","id":"s14-31-10","title":"Resizable Layout","page":59,"blocks":[{"type":"p","text":"The three primary regions should be resizable."},{"type":"p","text":"The user should be able to:"},{"type":"ul","items":["Resize the Inspector","Resize the Trace Timeline","Collapse the Trace Timeline","Collapse the Inspector","Maximize the System Map","Maximize the Trace view"]},{"type":"p","text":"This allows the same interface to support both high-level architecture inspection and detailed trace analysis."}]},{"number":"14.32","label":"14.32","id":"s14-32","title":"Debugger Interaction Behavior","page":59,"blocks":[{"type":"p","text":"The Debugger must define consistent interaction behavior for system nodes, subsystem nodes, connections, traces, and diagnostic tests."}]},{"number":"14.32.1","label":"14.32.1","id":"s14-32-1","title":"Single-Click Node","page":59,"blocks":[{"type":"p","text":"Single-clicking a component node should:"},{"type":"ol","items":["Select the node.","Highlight its direct incoming and outgoing connections.","Open the Component Inspector.","Display the component's current state.","Load recent traces and metrics associated with the component.","Display diagnostic tests registered for that component."],"start":1},{"type":"p","text":"The System Map should preserve the user's current zoom and viewport."}]},{"number":"14.32.2","label":"14.32.2","id":"s14-32-2","title":"Double-Click Node","page":60,"blocks":[{"type":"p","text":"Double-clicking a node that contains child components should expand that subsystem."},{"type":"p","text":"For example:"},{"type":"p","text":"Listener"},{"type":"p","text":"may expand into:"},{"type":"p","text":"Listener Manager"},{"type":"p","text":"Browser Listener"},{"type":"p","text":"Filesystem Listener"},{"type":"p","text":"Application Listener"},{"type":"p","text":"Application Integrations"},{"type":"p","text":"Double-clicking an already expanded subsystem may collapse it."},{"type":"p","text":"For leaf components with no children, double-clicking may focus the map on that component and its immediate neighborhood."}]},{"number":"14.32.3","label":"14.32.3","id":"s14-32-3","title":"Single-Click Connection","page":60,"blocks":[{"type":"p","text":"Single-clicking a connection should:"},{"type":"ol","items":["Select and highlight the connection.","Highlight its source and destination components.","Open the Connection Inspector.","Display recent traffic and latency.","Display failures associated with the connection.","Display connection-level traces.","Display diagnostic tests registered for the connection."],"start":1}]},{"number":"14.32.4","label":"14.32.4","id":"s14-32-4","title":"Trace Selection","page":61,"blocks":[{"type":"p","text":"Selecting a trace in the Trace Timeline should highlight the participating components and connections in the System Map."},{"type":"p","text":"For example, a trace:"},{"type":"p","text":"Agent Core"},{"type":"p","text":"→ Model Provider"},{"type":"p","text":"→ Runtime"},{"type":"p","text":"should highlight those nodes and edges."},{"type":"p","text":"This provides a visual representation of the execution path."}]},{"number":"14.32.5","label":"14.32.5","id":"s14-32-5","title":"Component-to-Trace Navigation","page":61,"blocks":[{"type":"p","text":"When viewing a Component Inspector, the user should be able to select a trace entry and open its full end-to-end trace."},{"type":"p","text":"For example:"},{"type":"p","text":"Selected Component:"},{"type":"p","text":"Model Provider"},{"type":"p","text":"Trace Entry:"},{"type":"p","text":"task_128 / model.invoke"},{"type":"p","text":"Selecting that trace may reveal:"},{"type":"p","text":"Agent Core"},{"type":"p","text":"→ Model Provider"},{"type":"p","text":"→ Raw Edit"},{"type":"p","text":"The Debugger should allow navigation in both directions:"},{"type":"pre","text":"Component -\u003e Trace\nTrace -\u003e Component"}]},{"number":"14.32.6","label":"14.32.6","id":"s14-32-6","title":"Error Navigation","page":62,"blocks":[{"type":"p","text":"Selecting an error should navigate to the component, connection, and trace responsible for that error whenever the relevant information is available."},{"type":"p","text":"For example:"},{"type":"p","text":"Error:"},{"type":"p","text":"Scheduler task failed"},{"type":"p","text":"Navigate to:"},{"type":"p","text":"Scheduler"},{"type":"pre","text":"-\u003e"},{"type":"p","text":"Runtime"},{"type":"pre","text":"-\u003e"},{"type":"p","text":"Sandbox"},{"type":"p","text":"Trace:"},{"type":"pre","text":"trace_1827"},{"type":"p","text":"This reduces the need to manually correlate independent logs."}]},{"number":"14.32.7","label":"14.32.7","id":"s14-32-7","title":"Running Diagnostic Tests","page":63,"blocks":[{"type":"p","text":"When the user selects a test and chooses to execute it:"},{"type":"ol","items":["The Debugger creates a diagnostic test execution.","A unique task ID and trace ID are assigned.","The test executes through the normal runtime and permission boundaries.","Test progress may appear in the Trace Timeline.","The result is returned to the Inspector.","The result is stored in diagnostic history."],"start":1},{"type":"p","text":"The result should contain:"},{"type":"p","text":"Status"},{"type":"p","text":"Summary"},{"type":"p","text":"Execution time"},{"type":"p","text":"Relevant trace"},{"type":"p","text":"Relevant error"},{"type":"p","text":"Recommendations where available"}]},{"number":"14.32.8","label":"14.32.8","id":"s14-32-8","title":"Tests Must Not Bypass Security","page":63,"blocks":[{"type":"p","text":"A diagnostic test must never receive additional permissions simply because it was launched"},{"type":"pre","text":"from the Debugger."},{"type":"p","text":"For example:"},{"type":"p","text":"Sandbox Test"},{"type":"pre","text":"|\nv"},{"type":"p","text":"attempt external write"},{"type":"pre","text":"|\nv"},{"type":"p","text":"Runtime Sandbox"},{"type":"pre","text":"|\nv"},{"type":"p","text":"write blocked"},{"type":"p","text":"The test verifies the restriction instead of temporarily disabling it."}]},{"number":"14.32.9","label":"14.32.9","id":"s14-32-9","title":"Synthetic Diagnostic Events","page":64,"blocks":[{"type":"p","text":"Tests may generate synthetic events."},{"type":"p","text":"For example, the Listener diagnostic may create:"},{"type":"p","text":"diagnostic.browser.navigation"},{"type":"p","text":"or:"},{"type":"p","text":"diagnostic.filesystem.modified"},{"type":"p","text":"Synthetic events must be explicitly tagged as diagnostic."},{"type":"p","text":"They must not accidentally be interpreted as genuine user behavior by the Data Management system."},{"type":"p","text":"Recommended metadata:"},{"type":"pre","text":"{\n    \"diagnostic\": true,\n    \"test_id\": \"...\",\n    \"trace_id\": \"...\"\n}"}]},{"number":"14.32.10","label":"14.32.10","id":"s14-32-10","title":"Historical Mode","page":64,"blocks":[{"type":"p","text":"The Debugger should allow switching from live runtime state to historical inspection."},{"type":"p","text":"The View offers: live, last 5 minutes, last 30 minutes, last hour. A custom range is not offered."},{"type":"p","text":"When historical mode is active, the System Map may display component state and communication corresponding to the selected period."}]},{"number":"14.32.11","label":"14.32.11","id":"s14-32-11","title":"Heartbeat Inspection","page":65,"blocks":[{"type":"p","text":"Selecting a historical Heartbeat should reconstruct its execution path where possible."},{"type":"p","text":"For example:"},{"type":"p","text":"Heartbeat"},{"type":"pre","text":"|\nv"},{"type":"p","text":"Model"},{"type":"pre","text":"|\n+------\u003e Scheduler / Notification\n|\nv"},{"type":"p","text":"Raw Edit"},{"type":"p","text":"The Inspector should show:"},{"type":"ul","items":["Heartbeat start time","Checklist snapshot","Model","Nodes accessed","Token usage","Actions","Scheduled tasks","Failures","Completion state"]}]},{"number":"14.32.12","label":"14.32.12","id":"s14-32-12","title":"Data Heartbeat Inspection","page":66,"blocks":[{"type":"p","text":"Removed. The Data Heartbeat was deleted on 2026-10-06, so there is no run of it to inspect. Raw activity is read directly by the agent heartbeat for its own window, and is otherwise only kept and pruned by age."}]},{"number":"14.32.13","label":"14.32.13","id":"s14-32-13","title":"Scheduler Task Inspection","page":67,"blocks":[{"type":"p","text":"Selecting a Scheduled Task should display its lifecycle:"},{"type":"p","text":"Task Created"},{"type":"pre","text":"|\nv"},{"type":"p","text":"Waiting"},{"type":"pre","text":"|\nv"},{"type":"p","text":"Scheduler Due Check"},{"type":"pre","text":"|\nv"},{"type":"p","text":"Runtime"},{"type":"pre","text":"|\nv"},{"type":"p","text":"Execution"},{"type":"pre","text":"|\n+----\u003e Completed\n|\n+----\u003e Failed"},{"type":"p","text":"The user should be able to inspect both the Scheduler component and the corresponding execution trace."}]},{"number":"14.32.14","label":"14.32.14","id":"s14-32-14","title":"System Map Focus Mode","page":67,"blocks":[{"type":"p","text":"The user should be able to focus on a selected subsystem."},{"type":"p","text":"For example:"},{"type":"pre","text":"Focus: Observation"},{"type":"p","text":"may temporarily display only:"},{"type":"p","text":"Listeners"},{"type":"pre","text":"-\u003e"},{"type":"p","text":"Listener Manager"},{"type":"pre","text":"-\u003e"},{"type":"p","text":"Event Pipeline"},{"type":"pre","text":"-\u003e"},{"type":"p","text":"Raw Event Storage"},{"type":"p","text":"Focus is chosen as the whole system or one subsystem."},{"type":"p","text":"Focus mode should not modify the underlying system topology."},{"type":"p","text":"It is only a visualization filter."}]},{"number":"14.32.15","label":"14.32.15","id":"s14-32-15","title":"Debugger Interaction Requirement","page":68,"blocks":[{"type":"p","text":"The following behavior is a hard UI requirement:"},{"type":"quote","text":"The user must be able to select any visible system component or connection, inspect its status and diagnostic information, navigate between component-level and end-to-end traces, and execute the diagnostic tests registered for that component or connection without leaving the System Debugger."}]},{"number":"14.32.16","label":"14.32.16","id":"s14-32-16","title":"Showing the Work in Progress","page":68,"blocks":[{"type":"p","text":"While the agent is working on a request, the interface shows what it is doing."},{"type":"p","text":"A request that takes twenty seconds and says only \"thinking\" is indistinguishable from one that has hung. The user cannot tell whether to wait, and the one thing the application could tell them - that it is retrieving, or calling a tool, or on its third pass - it already knows."},{"type":"p","text":"The stages are recorded as they happen and shown as a list beside the conversation:"},{"type":"ul","items":["Each stage says what is happening in words the user's own vocabulary would use, not the name of the component doing it","A stage says what it found, not only that it ran. \"Ran a script in your workspace, 2 files written\" answers a question that \"working\" does not","The stage now running is distinguishable from the ones already finished, and a finished stage says how long it took","The elapsed time is shown, because the question being asked is whether to keep waiting"]},{"type":"quote","text":"The display describes work in progress, so it goes away when the answer arrives. Finished work is described by the answer itself, and a stale list of stages left underneath it says otherwise."},{"type":"p","text":"Two constraints on where the stages come from:"},{"type":"ul","items":["Progress belongs to the request that is waiting. Background work - a heartbeat that happened to start meanwhile - must not appear in it, or the user is shown the agent doing something they did not ask for","The record of stages is bounded. A long tool loop must not grow in memory without limit","Recording progress must never be able to fail a turn. It is an aid to the person waiting, not part of producing the answer"]}]},{"number":"14.32.17","label":"14.32.17","id":"s14-32-17","title":"Showing What an Answer Was Built From","page":68,"blocks":[{"type":"p","text":"Removed. Since 2026-10-06 an answer is no longer built from gathered memories: the chat answers from the instruction and the conversation alone, so there is nothing to show beyond the conversation itself. The context trace and the library search it described went with the data heartbeat, and the Debugger's leftover \"Context assembled\" panel, which could only show an error or nothing, is being removed."}]},{"number":"14.33","label":"14.33","id":"s14-33","title":"A Panel for Each Module","page":40,"blocks":[{"type":"p","text":"Every module reports three things, and its panel shows all three:"},{"type":"ul","items":["**what it is** - its name, and what it is for in a sentence","**how it is** - the status and metrics it already provided","**what is in it** - a detail view of its own shape"]},{"type":"p","text":"The third is the new one. A module that reports only a health state and a row count can be wrong in every way that matters while looking healthy: the events are arriving, and they are the wrong events."},{"type":"h","text":"The Detail Is Per Module"},{"type":"p","text":"Modules are not alike, and one generic table for all of them reproduces exactly the summary that was already unhelpful. An event store is interesting broken down by event type; an edit log by which component wrote each entry; a graph by what kinds of node it holds; a scheduler by what is waiting and what failed."},{"type":"p","text":"Each detail view therefore defines its own axis, and offers:"},{"type":"ul","items":["a **summary** - the few numbers that characterise the whole module","a **choice** - the axis, with every value and how many of each, so one can be picked out","**groups** - the most recent entries of each value, at most ten"]},{"type":"p","text":"Ten of each, rather than the most recent ten overall, because a busy kind otherwise crowds out every other. A store holding four thousand focus events and two browser visits should show the two."},{"type":"h","text":"The Map Is Not the Panels' Spare Room"},{"type":"p","text":"The panels sit below the map, and both live in a shell the height of the"},{"type":"p","text":"window. The map is the part that flexes, so every pixel the panels below it"},{"type":"p","text":"wanted came out of the map - and once they added up to more than the shell,"},{"type":"p","text":"the map was nought pixels tall. A canvas that size draws nothing and raises"},{"type":"p","text":"nothing: the Debugger showed its panels, showed the states, and simply had no"},{"type":"p","text":"component graph, with no error anywhere to say why."},{"type":"p","text":"**The map keeps a floor.** It is not allowed to be squeezed below the height"},{"type":"p","text":"at which it is still a map, and the shell scrolls when what is in it does not"},{"type":"p","text":"fit, rather than clipping the last panel out of reach. A panel added later"},{"type":"p","text":"must not be able to silently evict the thing it was added beside."},{"type":"p","text":"The map is measured by what it draws, not by what it is told to be. An"},{"type":"p","text":"element of the right size with nothing painted on it is the same failure"},{"type":"p","text":"wearing the right dimensions."},{"type":"h","text":"Rows Are Shown Whole"},{"type":"p","text":"An entry is shown with every field it holds, not a chosen few. The reason to look at a stored row in a debugger is to see what was actually stored; a view that picks columns has already decided what the problem is not, which is the decision the reader came to make."},{"type":"h","text":"The Master Switch"},{"type":"p","text":"The Debugger's own monitoring has a single switch, and off means the monitoring does not run."},{"type":"p","text":"This distinction is the whole point of it. A switch that only stops the display leaves every span still being built, stored and evicted - the cost the user turned it off to avoid - while presenting an empty panel as though nothing were happening. So the switch is applied where the recording happens, at the point a span would be kept, and turning it off also drops what had been collected."},{"type":"p","text":"Two consequences follow, and both are stated in the panel rather than left to be discovered:"},{"type":"ul","items":["with monitoring off the panels have nothing to show, and say so, distinguishing *nothing was collected* from *nothing happened*","turning it back on starts collection from that moment. It cannot recover what was not gathered"]},{"type":"p","text":"The setting is written to settings as well as applied, because a switch that silently turns itself back on at the next launch is worse than no switch."},{"type":"h","text":"Where the Panels Live"},{"type":"p","text":"The panels sit beside the system map, not inside it. The map has a fixed-height container with its overflow hidden, so that it owns its area and can be panned within it; a grid of panels placed in that container competes with the map for a height neither can have. The map is squeezed to nothing - which makes every control that redraws it, the focus filter among them, appear to do nothing at all - and the panels below the fold are clipped away."},{"type":"p","text":"Focus narrows the panels as well as the map, for the same reason it exists at all: asking to see one subsystem means the whole of that subsystem, and a control that moves only the drawing is a control the reader will conclude is broken."},{"type":"p","text":"A live refresh must not destroy what is being read. The panels refresh on the same ten-second cycle as the rest of the Debugger, and rebuilding them wholesale each time collapses whatever entry the reader had expanded, loses their place in the list, and returns the type they had chosen to unfiltered - so the panel becomes unreadable exactly while it is being read, which is the only time it matters."},{"type":"p","text":"So a refresh writes the new numbers into the panels that are already there, and touches nothing else, whenever the set of modules is unchanged. Where a detail view is open it is re-read, and the entries the reader had expanded are expanded again, their place in the list kept, and the type they chose restored from what the interface itself recorded rather than from whatever the reply happened to echo back."},{"type":"p","text":"The panels are loaded when the Debugger is opened and refreshed with the rest of it, rather than at page load. A panel loaded at page load fetches for a tab that may never be opened, reads a focus control that has not been populated yet, and never updates afterwards. The agent's own work is unaffected either way: what stops is the recording of it."}]},{"number":"14.34","label":"14.34","id":"s14-34","title":"The Debugger Is a Build Option","page":40,"blocks":[{"type":"p","text":"Whether the Debugger exists is decided when the application is built. A build made from source carries the debuggers by default; `build.py --no-debugger` leaves them out, and the released installers and downloads are built that way. A build made without it does not contain it: not the panels, not the routes that serve them, not the entry that navigates to them."},{"type":"p","text":"This is a build-time choice rather than a setting, because a setting can be turned on. The point is not to hide the Debugger from a user who has not asked for it - it is for the shipped application not to have one."},{"type":"p","text":"Everything that depends on the Debugger must ask whether it is present rather than assume, and must behave correctly when it is not. A panel that is absent is not an error condition; it is the ordinary case."},{"type":"p","text":"*Amended 2026-10-17:* a RESOURCE DEBUGGER, a tab of its own and, as every debugger, left out of the released builds (`debugger/resources.py`). It says what the application costs the computer: its own process and every process it started, and what those started, each put under what it is for - the application itself, the embedding model, one of the user's runs of work, a way of the Work debugger, a model call outside any run, or anything else - found from the process that started it, the folder it runs in, or a run's folder on its command line. Every two seconds while the tab is open, and not at all while it is not: each process's share of the processors (of the whole computer, all its cores), its memory, and - on Windows, from the system's own counters as Task Manager reads them - its share of the graphics processor's busiest engine and its graphics memory; on Linux with an NVIDIA card the card's use and each process's graphics memory; on macOS it says graphics are not measured. The last fifteen minutes are drawn, a chart for each, the parts stacked so the top edge is all of the application, with the whole computer's own processor use beside it; the table of processes beneath has the same numbers. Then what it keeps ON DISK - its own folder part by part, each Work debugger project's folder, the folders the user's work runs in, and the models it fetched - measured behind the page when the tab opens, every ten minutes while it is open, and when asked. And any process an earlier run of the application LEFT GOING (section 120), with a way to end them, after the user confirms.","amended":true}],"amendment_note":"2026-10-17: a Resource debugger - what the application and every process it started cost the computer, and what it keeps on disk.","amended":true},{"number":"14.35","label":"14.35","id":"s14-35","title":"Token Usage Over Time","page":40,"blocks":[{"type":"p","text":"The Debugger shows what the model calls spent, per day by default (over 7, 14, 30 or 90 days) or across the last 600 calls, grouped either by **kind of work** - each heartbeat step, conversation, work runs, scheduled tasks, lessons - or by function (Activity and states, Task organisation, Calendar management, Connections, Customized Recommendation, Experience learning, and \"Started by you\"), and measured in total, input or output tokens or in estimated cost. The cost is the API list price, even when the calls are made on a subscription, and the chart says so. The seven kinds that spent most each keep a colour; the rest are drawn together as Other."},{"type":"p","text":"Separating the lines is what makes the chart worth drawing. The loops run at different intervals and cost different amounts per run, and those two facts pull in opposite directions - something cheap every five minutes outspends something expensive once a day. Only the series shows that."},{"type":"p","text":"Each line can be hidden and shown independently, because one loop spending an order of magnitude more than the rest flattens every other line into the axis."},{"type":"p","text":"This does not duplicate the existing heartbeat inspection panel (section 14.32.11). That answers what one run did; this answers what the runs cost over time, which is a question about the shape of the whole system and cannot be asked of a single run."},{"type":"h","text":"Over Time Means Across Restarts"},{"type":"p","text":"The calls were held in memory - a window of the last few hundred, and running totals - so everything began again at zero whenever the application started. That makes the one question worth asking unanswerable: *is this getting more expensive?* A week of heartbeats against last week's, a model against the one before it, the cost of a busy Tuesday: none of that survives a restart, and the agent restarts whenever anything is fixed."},{"type":"p","text":"So each call is **written down**: when, which model, which provider, which kind of work, the tokens in and out, how long it took, and what it is estimated to have cost."},{"type":"ul","items":["The totals and the breakdowns are computed **in the database**, because the point of keeping every call is that there are eventually a great many of them","The chart says **what window it is drawing** - the date of the earliest call it still has. \"Since the agent started\" was true before and was the problem, because it sounded like a claim about the agent rather than about the process","Calls are kept for a bounded time, 400 days, rather than for ever, and a day is cut at the reader's own local midnight. A row is small; a year of heavy use is tens of megabytes, and a comparison against last month needs last month and not the first month","What is about *this* run - what is executing now, what just failed - is still only in memory, because it means nothing from a process that has ended"]},{"type":"p","text":"*Amended 2026-10-15:* the parts removed from the application - the data heartbeat and the knowledge library, run until 2026-10-06 - count as Other (their calls stay in the chart's month), and take no colour from what still runs; a function only switched off keeps its own. Every kind that runs has its own: the seven that spent the most take the seven colours, the next seven the same colours striped (dashed, as a line); only past the fourteenth is a kind Other. A task in no module is shown by its own name (`common/modules.py`, `api/web/app.js`) Of the tokens read, what came from the provider's cache - at a fraction of the price - is the fade
