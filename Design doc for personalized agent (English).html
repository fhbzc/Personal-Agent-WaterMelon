hing except the title and the sentence, which lived only in the library record. So a task came out of the next round with its name blank although nothing about it had changed, on every round its summary was reused, which is most rounds. The words are now kept beside the four parts, where the page can read them."},{"type":"p","text":"**And a task is named on the comparison by what it is, not by where it sat.** `task_3` is a POSITION, and positions are filled by different work in different rounds, so a table keyed on them showed two rows both called `task_3` - which is the confusion the stable ids exist to end, reappearing in the one place built to compare tasks across rounds. Rows are named by the title the task was first given, with its stable id under it. The number in each column is **what the task held at the end of that round**, with what it gained or lost in brackets, because a bare number answers neither question on its own; and a round in which it did not exist says *not yet* or *gone* rather than nought."},{"type":"p","text":"**The states that moved are shown as the model read them.** The comparison listed six titles and then *“and 8 more”*, and the states left out of a truncated list are in no particular order - so the ones hidden are as likely as not to be the ones worth reading. Every state that arrived or left is now shown whole, in the same fields and the same order the model was given them: what it said, why the review wrote it, when it ran on the user's own clock, what it rests on and what it recorded, with each empty field SAID to be empty. What the model was given about a state is the only thing that explains what it made of it."},{"type":"p","text":"**The tree can be zoomed and moved.** A hundred states is a hundred rows, and at that size the names are a few pixels tall and the part worth looking at - which joins fall left of the cut - is a smudge. The picture is an SVG with a `viewBox`, so zooming is arithmetic on four numbers and needs no library. **Plain scrolling is left alone**: a figure that swallows the wheel inside a page this long is a trap, so the wheel zooms only with Ctrl or Command held, and there are buttons for the readers who will never discover that. It is bounded both ways - never wider than the drawing, never tighter than a fiftieth of it - and the box is remembered across a redraw, for the same reason the open blocks are."},{"type":"p","text":"**The debugger does not wait on the user's own round, and says which it is waiting for.** There was one lock for both scopes, so an hourly grouping over the real states blocked every press in the sandbox. That alone would be a wait; what made it a puzzle is that the page then gave the wrong reason. Emptying the sandbox asks whatever is running to stop before it deletes anything - right, when a person presses the button - and the round takes that request back only once it holds the lock, which it never got. So the flag was still set when the rehearsal looked, and the rehearsal reported that the sandbox had been emptied underneath it: two true statements, neither of them the reason. There is now a lock per scope, which is right on its own terms - a rehearsal reads made-up files in its own folder and writes its own rows, and has nothing to collide with in the real round but the lock. Two SANDBOX rounds still exclude each other, because those do share a folder."},{"type":"quote","text":"And a round that **never began** is no longer reported as one that **gave up**. The two have different answers - one is wait and try again, the other is that the data went away - and a page that gives the second when the first is true sends the reader looking for a fault that is not there. A rehearsal also stops treating its own first step as an interruption of itself: it empties the sandbox, so it takes the stop-request back before it starts."},{"type":"quote","text":"**A task is described by two objects, and that has now caused six bugs.** The drawing works from PLAN NODES - an id, a span, a size - and the round's answers live on LAYERS, which carry the summary, the weights and the pieces. The ids are different in kind: a layer's is positional, so `task_1` means \"the first row this round\", while the stored id belongs to a task for life. Every reader that took a field from the wrong one of the two produced a different-looking bug: the colour that disagreed with the panel, the card that went blank, the open task that collapsed on the next click, the sort that did nothing because every weight read as the default, the pulse that never appeared because a list of stored ids was searched for a positional one, and the emblems that swapped over when the order changed - a badge seeded from \"the first row\" follows the ROW. Each is now resolved by id at the point of use, and the lasting id travels with the node for the things that must not move. The lesson is the one the rest of this document keeps arriving at from other directions: two records of one fact will disagree, and the only question is which reader finds out first."},{"type":"p","text":"**A round that is resumed keeps what it already named.** The marking step tells every task a round will describe to say *loading*, and the loop asks about each in turn - so a round interrupted after naming nine of eleven came back, told all eleven to say *loading* again, and paid for the nine a second time. The round now records each name as it is written, before anything can interrupt, and that list is cleared only when a NEW line is drawn: a name written and not recorded is a name that gets written again."},{"type":"p","text":"**And a task waiting its turn still shows the name it had.** The words are kept beside the marker precisely so they are not lost, and the picture was not using them - so a task that had a name went blank the moment a round decided to describe it again, which reads as the name having been thrown away rather than as it being rewritten. The marker is the literal word *loading*, which is why the first attempt at this drew the word and never reached the name beside it. The row stays flagged as waiting, so the pulse and the panel can say the name on it is last round's."},{"type":"quote","text":"**An empty picture is the one thing that panel must not show.** A guard against the saved tasks being served mid-round - added because the stored copy says *loading* - left nothing at all on screen between a round starting and its shape being built, at the exact moment the reader had just been told a round was running. The guard is gone and the cause is fixed where it belongs, in which name gets drawn."},{"type":"p","text":"**What is not shown is not drawn.** The model decides whether a group is a task with an end or a way the user works, and only the first belongs in a picture of what somebody is in the middle of. The judgement comes OUT of the summary, so a task that has not been asked about yet is drawn and says it is loading; after the answer, a way of working disappears. It is kept with the task, because without that a restart draws every one of them again - including the ones already judged not worth drawing."},{"type":"quote","text":"**Animation that has to be waited out is not helping.** The limb of a branch drew itself, end to end, and the rows were staggered forty milliseconds apart; each was meant to say \"this came out of the thing you clicked\" and together they made expanding look like the picture being painted again from the left, which with ten rows is most of half a second. They fade in together now. The rows sliding down to make room already says where the new ones came from. Nor is a redraw an update: replacing the drawing when a name lands restarts every animation, loses the scroll position and rebuilds anything unfolded - so a name is written into the elements that are already there, each open task's branches are kept in their own group and left alone unless what they are drawn from changes, and a zoom resizes rather than redraws, because a zoom changes nothing about where anything is."},{"type":"p","text":"**The picture is the first card on the overview, and it is drawn from the saved tasks when no round is in memory.** The tasks are rows in a table - that is what keeping them is for - and the report that found them dies with the process, so after a restart the panel was saying *no grouping to draw yet* over a database holding nine tasks and five hundred states. What a round works out and does NOT save is each task's own layers, so those are saved with it now: a circle that opens onto *nothing inside this one divides* is a finding, and a circle that opens onto nothing because the working was thrown away is a bug wearing a finding's words."},{"type":"p","text":"**Every layer of one task is named before the next task begins.** Depth-first, because the alternative - all the second layers, then all the third - finishes no task until it has finished every task, and a reader wants one piece of work readable all the way down rather than every piece half readable. Only the immediate children were named before this, so with three layers configured the third was never named at all."},{"type":"p","text":"**What the user will see is summarised first, as far as that can be known - and it cannot be known in advance.** Whether a task is shown at all is `concrete`, and `concrete` comes OUT of its summary: the model is what decides that *the user keeps checking the same three sites* is a way of working rather than a thing with an end. So the order is every top task, then the pieces of the ones that ARE shown, and only then the hunt inside the ones that are not. That hunt is a search rather than a description and nothing on the page waits for it; it used to run second, so calls were spent on tasks the reader would never see while the ones in front of them still said *loading*."},{"type":"quote","text":"**An update must not cost the reader their place.** Three separate ways it did. The panel redraws every time a name lands, which is several times a minute while a round runs: it put the frame back to the beginning of a drawing the reader had dragged halfway across, until the scroll position was read BEFORE the HTML was replaced rather than after, when the old frame is already gone. It collapsed whatever they had open, because the branches are built into the drawing by hand rather than being part of its HTML - and the one place that rebuilt them looked only inside the debugger's copy, never the overview's. And clicking a task threw the picture to its right edge: every circle carries `tabindex` so it can be reached from the keyboard, a click focuses a focusable element, and the browser then scrolls it into view - and the discs sit at the MOST RECENT end of their lines, which on a long calendar is far off to the right. The focus is still given, with the scrolling refused."},{"type":"quote","text":"**A measurement left behind outlives the thing it measured.** The bottom layer was once the states themselves, drawn with their words to the LEFT of their circle, so the drawing asked for a left margin and the frame was scrolled right to keep the clicked row under the cursor. That layer is gone; the measurement stayed, counting a NOTE as leftward although a note is drawn to the right like everything else - so a task with no pieces, which draws exactly one note, asked for hundreds of pixels of margin it never used and the compensation threw the view to the right edge. Nothing is drawn left of the axis now and the box always starts at zero."},{"type":"p","text":"**The axis covers the whole calendar and the drawing is as wide as it needs to be.** It showed a fortnight with a dropdown and arrows to move it, because three months squeezed into the width of a panel puts a week inside four pixels - but the squeezing was the problem, not the three months. A window also hid everything older than itself behind a control, so a task that ran six weeks ago could not be seen without first working out that the control existed. Dragging and zooming were already there; the picture is simply allowed to be bigger than its frame."},{"type":"p","text":"**A row says what it means.** Its two weights were printed as *3/3*, which reads as three out of three and says neither which number is which nor what either is out of; they are named and scaled now, the way the card beside the picture already said them. The width is measured from THAT line as well as from the name - it is usually the longer of the two, was drawn at the same place, and ran off the right-hand edge where the furthest task's words could not be reached at all. Both are measured through the same function that draws them, because measuring `title` while drawing *loading...* is two lengths for one string."},{"type":"p","text":"**A task waiting its turn says `loading`; the one being summarised says `working`.** All of them saying the same thing is true and useless: a reader watching a round that takes minutes wants to know which task is costing the time. The round records which task it is on where it already records what it is doing, and it records the LAYER's id rather than the clustering's - `group_1` and `task_1` are two names for the same work, and comparing the wrong one meant nothing ever matched."},{"type":"p","text":"**A round is not a tick, and it is not on the hourly timer.** It is one model call per task, so on a busy folder it is minutes of work - and the other heartbeats are a few calls on a fixed schedule. An hourly timer either runs this when there is nothing new to find or collides with the round that writes the states it would read. So it is asked for **when an agent heartbeat finishes**: an unfinished round is resumed first; otherwise, if the last round that finished was longer ago than the configured interval (twelve hours by default), the next one starts. **There is ONE number for this, in hours** - the grouping's own loop sleeps on the same value the gate measures against, and both go through that gate. Two numbers for one interval is a bug waiting to be written: whichever the loop slept on, the other would be what the panel showed. The rename from seconds carries what was chosen rather than dropping it, because resetting somebody's deliberate ten minutes to six hours under cover of a tidy-up is a change to how their agent behaves that they would have no way to notice."},{"type":"p","text":"**The waiting is counted from the end, not the start, and an interrupted round outranks the clock.** Half a round leaves tasks reading *loading*, and the way out of that is to finish it rather than to wait six hours and start again. So an unfinished round is resumed before the interval is consulted at all."},{"type":"p","text":"**A round draws a line and reads up to it.** States keep arriving while it runs, and a round reading a moving window would summarise a task, have three more states land in it, and finish holding a description that was already out of date - with nothing to tell that apart from one that was never written. **A resumed round keeps the line the first attempt drew**, because moving it would pull in states that arrived during the part already done, leaving the tasks summarised early as the only ones that had not seen them. A state with no recorded time is kept rather than dropped: the line is there to stop a round reading its own tail, and a missing field is not evidence of that."},{"type":"p","text":"**A task waiting its turn says so.** The panel is read while a round runs, and the alternative is showing the words from six hours ago as though they were this round's - a reader cannot tell a name just written from one that is stale, and the whole point of a round is that something changed. What it said before is kept and offered AS that, last round's words, rather than silently reused. Only tasks that will actually be asked about are marked, by the same rule the summarising loop decides with: marking them from a guess at that rule told a task whose summary was about to be REUSED to say *loading*, and then never asked about it, so it would have said *loading* until something in it changed - which on a quiet task is forever."},{"type":"p","text":"**The top layer is finished before anything below it starts, and then the insides go one task at a time, most urgent first.** Both halves of that are for the reader watching it happen: finishing the top layer first means the picture has every task in it, named, within the first few calls - a tree that grows a branch at a time tells you nothing until it is done - and urgency order after that means an interrupted round leaves the pieces of the work that needs doing soonest rather than the pieces of whichever task happened to be first in the list. Urgency is known by then because the top layer wrote it."},{"type":"quote","text":"**A blank where a drawing goes is read as a broken drawing.** The picture returned an empty string whenever there was no plan to draw, and there is no way to tell *this round made no plan* from *the picture is broken* by looking at nothing. It now says which: the round is still going and the plan is the last thing it works out; or every summary was reused so no plan was asked for; or there is one task and a dependency picture of one task is a circle with nothing to depend on. **And the picture is the one block on the page allowed to open itself** - the rule is that nothing does, because every block had a good local reason and the sum was a page that unrolled everything it had, but a drawing behind a closed summary reads exactly like no drawing at all. That exception is written down as a test asserting AT MOST ONE, so the next block with a good local reason still fails."},{"type":"p","text":"**Everything running now, as one picture.** A disc per task on a time axis, at the most recent end of its own span with the history trailing back - because a reader scanning this is looking at what is happening NOW, and where a task started is the least interesting fact about one that is still going. Its whole name sits past the disc, wrapped onto a second line rather than cut: two tasks called *Answer reviewer 2 on the weighting paper's method section* and *...the weighting paper's figures* are the same string for their first forty-three characters, and the naming rules spend paragraphs getting those particulars in. Arrows are dependencies - the task an arrow points at could not be started until the other was done, which is not the same as coming later - and the same call that orders the pieces of one task is asked of the tasks themselves."},{"type":"p","text":"**A disc carries an emblem generated from the task's id**, which is the one thing about a task that lasts: appending, re-summarising, growing and being found again by a rebuild all leave it alone, so *the one with the spokes* stays the one with the spokes from week to week, and a new emblem means a genuinely new task. It is a handle and not a reading - nothing about the work chooses the motif, and the code says so, because a picture that looks meaningful will be read as meaningful."},{"type":"p","text":"**Clicking unfolds one layer, in the picture.** A task opens onto the tasks inside it, and those onto the tasks inside those: **every layer is summarised work, and a state is never a row.** The bottom layer is the bottom because nothing inside it divided again, not because it is a list of what was recorded - ending the tree in raw states put two different kinds of thing under one gesture, so the same click gave a summary in one place and a transcript in another, and nothing in the shape of a row told the reader which they were about to get. A layer with nothing under it says so in the splitter's own words rather than opening onto a gap, which reads as a drawing that failed. Which nodes are open is a SET and not the last one clicked, because three layers deep means a piece can be open inside an open piece. A circle is hollow until everything in it is finished and solid when it is, said once in a legend rather than spelled out on every row, where there is least space for it. The rows below slide down to make room, the node clicked does not move, and the drawing mutates rather than being redrawn - a redraw replaces the elements, and an element that did not exist a frame ago has nothing to move from."},{"type":"p","text":"**A panel under the picture reads out whatever was clicked** - any node at any depth, with its four parts, how long its own states cover, how many of them are finished, what is inside it or the reason nothing is, and its weight. A piece shows the weight of the TASK and says whose it is: the weighing is of the task, and bare numbers on a piece would read as a judgement of the piece that nothing in the round ever made. The picture selects and the panel reads, which is the arrangement a strategy game uses for the same reason: there is room beside a circle for a name and a count and for nothing else."},{"type":"quote","text":"**The picture is never fitted to its box**, and getting that wrong three times is worth recording. An SVG told to fit a box scales its whole drawing to do it, so opening a task made every row SMALLER instead of making the frame longer. The first fix set the pixel size and left the viewBox, which is the same instruction in another form. The second set both - correctly - in a rule that sat ABOVE the dendrogram's `.sb-graph`, and two single-class rules carry the same weight, so the later one wins and the override did nothing. What finally held it was asserting the COMPUTED style in the browser, which needed the test harness to load the stylesheet at all: it had been rendering the page unstyled, which is why a suite that draws the real page in a real browser had nothing to say about a cascade bug in it."},{"type":"p","text":"**The axis covers the whole calendar.** The drawing grows wider rather than squeezing - a fixed width per day - so a week never shrinks into a few pixels, and the frame scrolls in both directions. The drawing can be zoomed with Ctrl and the wheel - which is the gesture that works, because Ctrl with the plus and minus KEYS is a browser accelerator a page cannot reliably cancel, and offering it as if it could would be a promise the code cannot keep."},{"type":"quote","text":"**A 4 is an answer and not a blank**, and three faults of one shape hid that. The weight was kept only when the model volunteered a number in range - so a task summarised a second ago read *not weighed yet*, which is a claim about storage wearing the clothes of a claim about the task. The reason was written under one name by the summary and another by the status call, and the panel read the second, so the sentence explaining the numbers never appeared. And the status call updated the task's own copy while the ordering read the summary's, which would have sorted the tree by last round's urgency beside a card showing this round's. ONE NUMBER, ALWAYS KEPT, with a record of whether it was read off the states or stood in for their silence: a middling number with a reason and a middling number meaning nothing was said are different claims, and only the first can be checked."},{"type":"p","text":"**Ordered by urgency, or by importance, and the model is asked for both** on the 1-to-7 scale the traits already use, with every point anchored and six worked examples. A task the states say nothing about gets a 4 and has to say so: a middling number with *the states give no sign* is honest, and a 7 chosen because the subject sounds weighty is not. **Ties keep the order they had**, falling back to the seat - so sorting rearranges what the numbers actually separate and leaves everything else where the reader last saw it, which a tie-break reaching for size or recency would quietly undo."},{"type":"p","text":"**The grouping anchors before it scores anything.** What a state SAYS is the model's paraphrase of a quarter of an hour: two states about one afternoon are two summaries, written separately, of different slices, and their similarity is how alike the model happened to word them. It has a high noise floor for the reason given above - one model writes every state, in a stable vocabulary, about a handful of projects. **A path is not a paraphrase.** `survey-weights/scripts/fetch.py` is the same string every time or it is absent, and two states naming it are on one piece of work whatever either of them says about it. So a first pass joins those outright, and the tree runs with them already joined."},{"type":"p","text":"**The object, not the instrument.** What identifies work is what was open - the file, the page, the document - never what it was open in. One script edited in Sublime, run in a terminal and diffed in a git client is one workspace and three applications; a page is the same page in Firefox and in Chrome. Keying on the application does not merely add noise, it INVERTS the structure: it merges Gmail with YouTube for both being Firefox, and splits one paper across three tools. Applications are still read and still shown, and they identify nothing. There is no list of which ones to ignore - a list goes stale - only the question of whether a piece of evidence names a thing or a way of handling things. The one exception is a bare window title, where *Personalized Agent* (a repository page) and *Mozilla Firefox* (a browser) are both two capitalised words: nothing in the shape tells them apart, so the CORPUS does, since one of them also turns up as the application half of other titles."},{"type":"p","text":"*Amended 2026-10-16:* when grouping, a state's places are only those that tell which work it was: a folder or a file on disk, a document by its name, and a page at least two levels into a site that is not visited for everything (a site with forty different pages in what one round reads is a search engine, a video site or the mail). A window's title, an application's name, a conversation's title and a site's front page are no longer places at all: each turns up beside every kind of work, and credited as a shared place it put a day of one piece of work into another. Replayed over a week of the user's labelled states, the share put in the wrong task fell from 24% to 22% and no routine state went into a task of work, at the price of more states left in no task - the cheaper mistake. A new reading of places applies from the next state on; it never regroups what is kept.","amended":true},{"type":"p","text":"*Amended 2026-10-16:* NO UPGRADE REGROUPS THE TASKS. For a few hours one build counted how places are read among the settings the tasks were built with, so starting it rebuilt every task from the tree; on the user's calendar of 2,843 states the rebuild merged twelve different pieces of work into one and left most states in none. How places are read is no such setting, and a setting the record of the last build does not have is no change: an upgrade adds settings, and must not regroup anyone. That one rebuild is undone once, at the next round, where it happened: the tasks it retired are live again, with their names, summaries and projects, the two it made are retired, and its record no longer counts as the last build. And a task is one of leisure only when most of ALL its states are said to be leisure - not most of the few whose kind was said: two hundred states, fourteen of them said, eight of those leisure, had made a piece of work leisure.","amended":true},{"type":"p","text":"*Amended 2026-10-17:* NOT THIS WORK, AND THE PILE OFFERED AGAIN - both built, both switched off until measured and approved, because both move the user's states. The call that already sums a task up, and the one that says where it stands when states arrive, also name - by the numbers of the states shown - those plainly about something else (`not_this_work`): no call of its own. Switched on, they go to the pile; a task smaller than six states, or one that would lose more than half of itself, keeps them; each removal is recorded. Switched off, what the model named is only kept and shown, in the State heartbeat debugger, for the user to judge. A re-check by meaning and places alone was measured first, against the user's labelled week, and rejected: of what it would move, only five to six in ten were really in the wrong task. And the pile - states no task took - is offered to the tasks again each round, as new states are: offered is not taken, a state goes in only where it fits; a state the model took out of a task is offered back to that task only in a round the task gains others, so it rides on the status call made for them and never brings a call of its own.","amended":true},{"type":"p","text":"*Amended 2026-10-16:* ROUTINE IS NOT A TASK. The review that writes a state says, as its `kind`, when it is the part of a day that is no piece of work - meals, rest, entertainment, the news, chatting with friends and family, errands; anything done towards something, however personal, is work. Those states stay on the calendar and are never grouped: grouped with the rest, they made tasks of their own and their piles took work in. In the replayed week most of the states put in the wrong task went into a task that was mostly routine, and with the routine left out the share of work states in the wrong task fell from 36% to 25%. States written before the review said so carry no kind and are grouped as before.","amended":true},{"type":"p","text":"*Amended 2026-10-16:* LEISURE IS A TASK, OF ITS OWN KIND. The `kind` is one of three: work, leisure - what is done for enjoyment: films, shows, music, games, sport, the news, chatting with friends, browsing for pleasure - and routine, now only meals, rest, errands and chores. Leisure is grouped and summed up like work, for what is not summed up is never recommended from; but never with work. A state joins only a task of its own kind, what fits no task is made into tasks kind by kind, and a task read off the tree holding a task's worth of both has its smaller part made a task of its own. A task is of the kind most of its states were said to be; states that carry no kind go where they fit, as before.","amended":true},{"type":"p","text":"*Amended 2026-10-16:* the Overview's picture of the tasks has two views, chosen with the button beneath it: WORK ACTIVITY - the tasks of work alone, as the page opens - and FULL ACTIVITY, everything done: the tasks of leisure as well, and the groupings a summary judged not to be a task. A task is drawn as one of leisure when most of its states whose kind was said were said to be leisure, a project when all its tasks are.","amended":true},{"type":"p","text":"*Amended 2026-10-16:* RUN NOW, beside the Overview's tasks: a round of the state heartbeat begun at once, answered straight away, its progress drawn as it goes, with a line saying when the next regular round is due. The regular rounds are counted from when the last round FINISHED, whoever started it, so a round run now puts the next regular one off by as long. One round at a time: while a round is going - regular or run now - Run now does nothing and says so, and while one run now is going the timer begins no other; its visits only carry that round on, and two visits never run at once. And the first grouping waits for 20 states, not 100: with fewer, its first tasks - five states at least, so at most two - would be broad, and as tasks are never regrouped they would go on taking in whatever came near.","amended":true},{"type":"p","text":"*Amended 2026-10-16:* the button is the card's own, as \"Make an issue now\" is - full size, under the Summary task heading, called \"Update tasks now\", and \"Updating tasks...\" while a round runs.","amended":true},{"type":"p","text":"**A second kind, for work that names no file.** A conversation about a paper, a week of reading, an exchange with a reviewer - none of them name a path, and all of them say *FieldNotes* or *survey-weights* over and over. So states sharing **three or more words that almost nothing else in the window uses** are anchored too. Three and not one, because one rare word in common is a coincidence - two states each mentioning Lisbon may be a trip and a restaurant - and an anchor is meant to be the part that is certain. This is not what the embedding does, and could not be: the vectors are trained to know that *paper* and *manuscript* mean the same, which is exactly wrong for a proper noun, whose whole value is that nothing else is called that. The two kinds run over disjoint states and are never joined to each other - two kinds of evidence chained together is how a chain gets long - and the debugger shows them as two."},{"type":"quote","text":"**Anchors do not chain, and this is the whole of the difficulty.** The first version was union-find over any shared key, and on four hundred real states it produced one anchor of a hundred and forty-seven with NOTHING in common across it: A shared a file with B, B shared a page with C, and three unrelated months became one task. So a workspace anchor is the set of states sharing ONE key - a state naming several joins the rarest, which is the most specific thing it was open on - and a word anchor whose members share no word between all of them is refused whole rather than trimmed, because there is no honest way to choose which link of a chain was the real one."},{"type":"quote","text":"**And an anchor is bounded at both ends.** A key on a tenth of the window is where the work lives rather than what it is; but a bare fraction rounds to one on a small window, where nothing could ever anchor, and is unbounded on a large one - and an anchored group merges at distance nought, which puts it beyond the splitter's reach, so an anchor of two hundred states would be one task nothing could divide. Hence a floor and a cap of forty, which is the size of a large task."},{"type":"p","text":"**A shared ANCESTOR only pulls.** `Research/AA/BB` and `Research/AA/CC` may be one task with two parts or two papers on one shelf, and nothing in the path says which - so a shared folder shortens the distance in proportion to how much of the path agrees, at most by half, and leaves the question to the splitting rule. It never pushes apart: a shared workspace is nearly conclusive that two states are one task, while sharing none is almost no evidence that they are not, because one task spans a browser, an editor and a terminal. Only one of those directions is worth acting on. **A state that names nothing takes no part at all** - absence is not agreement, and letting two states with no evidence look alike to each other is what made the original two-measure design a structural zero."},{"type":"quote","text":"Read back out of the states' own prose for now, because the listener knows the paths exactly and the state-writing step dissolves them into sentences. That is a fault upstream, and until it is fixed this covers about two states in five."},{"type":"p","text":"**A task keeps its place on the page for as long as it exists.** The reading order was the age of the task and then its size, which is almost right and fails on the case that matters most: every task from the first rebuild shares one `created_at` to the second, so the tie-break decided the whole page and the tie-break was size. Two tasks that swapped sizes swapped places, and *the third row* was a different piece of work each hour - which is precisely the instability the persistent ids were introduced to remove, returning in the reading order after being fixed in the data. A task is now given a **seat** when it first appears and never reassigned one. Anything new sits after everything that already existed, so the page grows downwards and nothing above it moves. **A split keeps one piece in place**: the piece that inherits the old task's identity inherits its seat with it, and the others are new tasks that happen to have a parent, so they go where new tasks go. The tasks that existed before seats did are seated in the order they were already being shown in - a fix for an unstable order that reordered the page once on the way in would be a poor joke."},{"type":"p","text":"**And the two ways a task can have no search are different facts.** The page said *no call* on one row and *no search* on another, which read as two shades of one absence and left the reader to work out which absence. They are not related: *no call* is the round not asking the model anything, because the summary the task already has still describes what it holds; *no search* is the model being asked and answering out of the states it was shown. So the badge leads with the number of calls, which is the thing that differs - **0 calls - summary reused**, **1 call, no search**, **1 call, 2 searches** - and the sentence under it says which of the two happened in full."},{"type":"p","text":"**A prompt can be taken off the page whole.** Reading one is not having it: what a person does with a prompt that produced an odd summary is paste it somewhere and change a line, and selecting sixteen thousand characters out of a scrolling box is a minute of dragging that the panel then interrupts. A copy button sits in the summary row of each prompt block, so the prompt can be taken without opening it - which means the click has to be stopped from toggling the block it sits in. It copies **the instruction and the message and nothing else**: the block also holds what came back, and a button labelled `copy` beside the words *the prompt it was sent* must not hand over the model's replies as though they were part of it."},{"type":"p","text":"**And a rehearsal is compared task by task, not only round by round.** The table of sizes answers *did it grow* and nothing else, while the question a rehearsal exists to answer is what appending DID. So every task that existed in **any** round gets a row per round: how many states it held, which ones arrived - **named, not counted** - and how it was described, with each of the four parts marked *changed this round*, *unchanged*, or *written for the first time*. A round in which a task did not exist says so rather than leaving the cell empty, because a blank cell reads as *nothing changed*, which is the opposite of what happened. A task absent from the first round is a finding about the first round, and leaving it out of the table would hide the arrival the rehearsal was run to watch."},{"type":"p","text":"**Nothing on the debugger opens itself.** Each block had a good local reason to start open - the step's prompt, so it could be read while the answer was awaited; the top layer of tasks, because a page that runs something and then shows a row of closed rows has not shown anything; the comparison, because it is the point of a rehearsal - and the sum of those reasons was a page that unrolled everything it had the moment it finished. The rule that made the top layer open was written when a task was a title and a list of states. A task now carries its description in four parts, what the call cost, whether it searched, every reply it got and a tech tree; eight of those at once is not a result but a wall, with the one thing the reader came for somewhere inside it. So everything is closed, and the row itself says the title, the size and whether it searched - which is what choosing between them needs. **And every block remembers being opened**, because one that does not closes again on the next redraw, which while a round is running is about twice a second."},{"type":"quote","text":"Tested as one rule and not one block at a time, since testing them one at a time is how the page came to unroll itself: after a round, how many blocks are open, and how many have no key to be remembered by. Both answers are zero."},{"type":"p","text":"**A redraw that changes nothing does nothing, and never happens over a selection.** Following a round means asking every four hundred milliseconds and drawing what comes back, which is right for a progress bar and was quietly hostile to the one thing this page is for. The prompt is shown *before* the answer arrives - that is the point of it - so the reader is looking at it during exactly the seconds the panel is rewriting itself, and replacing the HTML drops the selection: text could not be copied out of the page at all while a round ran. Two rules, in order. **Nothing changed, nothing written** - a summary takes ten or fifteen seconds and the step list does not move between them, so most of those polls were rewriting identical HTML, and one string comparison removes the great majority of the redraws. **And never over a selection**: when something has changed and the reader is mid-drag, the new HTML is held and goes in when they let go, so the panel is at most one beat behind and only while somebody is holding onto it."},{"type":"quote","text":"The comparison has to be against what was last **written**, not against what the element reads back. `innerHTML` returns the DOM re-serialised - attributes in the parser's order, entities normalised - so comparing it with the string that produced it is false every time, and the first version of this guard did nothing whatsoever."},{"type":"p","text":"**And an id belongs to one element.** Three panels were sharing two names: the month-by-month states browser and the state heartbeat both answered to `dbg-states-body`, and the heartbeat's own body had taken the *review* heartbeat's `dbg-beat-body`. A lookup by id returns whichever element comes first in the document, so this is not a tidiness complaint - the browser was writing its states into the heartbeat's panel, binding its click handler there, and hiding it with its own collapse button. The existing test asked that every id the script reaches for exists, which was true throughout; what was missing was asking that no id answers twice."},{"type":"p","text":"**A summary is one statement at one altitude, not the states with their dates taken off.** Shown forty states, the easiest sentence to write is all forty of them: *“fix the census fetch step, re-run the scripts, check the figures against the published ones, and write back to the reviewer”*. It is accurate, it is the failure that looks most like success, and it says nothing a reader could not get by reading the forty titles - which is the thing the summary exists to save them from. What is missing is the only thing that had to be worked out: what all four were **for**. So the instruction now names the symptom rather than asking for concision, because concision is advice and this is a test the model can apply to its own draft: if the sentence joins clauses with *and*, *then* or *as well as*, it is listing, and the fix is to go up a level until the list becomes a single noun. A particular step may be named where it is the one thing the whole group is about, never as an item in a series."},{"type":"quote","text":"**The prompt's own GOOD example was written that way**, which is how the habit was being taught rather than merely tolerated - a model shown a worked example follows its shape over any rule stated beside it. And the shape is now **counted on every summary**: how many things the first sentence joins, with two or more marked on the debugger. Counted and not corrected, because going up a level is not something that can be done to a finished sentence - and counted per sentence rather than added up, since *“the visa and expense paperwork”* is one errand with two names and a rule that flags it is a rule that gets ignored."},{"type":"p","text":"**There are three layers by default - a task, the tasks inside it, and the tasks inside those - and the setting allows up to six.** The descent once stopped for reasons of its own and could go as deep as the tree allowed, which meant the page's depth was a property of the user's month, and a reader could not learn the shape of the page because it did not have one. So the depth is a setting. Every layer is summarised work: the bottom layer is the bottom because nothing inside it divided again, not because it is a list of raw states. **The limit is also information the cut can use**: knowing how many levels remain below it, the descent is choosing where to put its boundaries rather than seeding an open-ended recursion."},{"type":"p","text":"**Above tasks sit projects, and each carries its next steps.** Tasks that are one larger piece of work are grouped into a project: a project is found from where the work lives, and kept only once the model agrees the tasks are one piece of work. Each project, and each task that belongs to no project, keeps a short list of at most eight next steps. The model writes it, the user may edit it, and the agent heartbeat's to-do step ticks a step off when the activity shows it done. After each round the work is also written as stages, for the user's experience. A task left alone for three days is drawn as quiet, and after thirty days it is archived and no longer drawn; a state that fits nothing for thirty days is let go; a task's centre is a decaying mean with a half-life of fifty states. Calls in a round may run a few at a time - three by default - but never more than the computer can spare while the user is at it, on battery, or short of memory or processor. The whole of it can be turned off with the \"Task organisation\" Function in Settings."},{"type":"p","text":"**And the last layer is drawn as a tech tree.** A bulleted list of sub-tasks answers *what was inside this* and none of the questions a reader actually has next, which are *when* and *what had to happen first*. So the pieces are laid out left to right on a time axis at the point each one started, a circle each, sized by how many states it holds, with the finished ones marked as finished and dependencies drawn as arrows. **The times are arithmetic and the arrows are a judgement**, and they are got separately for that reason: when a piece ran is a minimum and a maximum over its states, while *which piece could not have been started until another was done* is not in the states at all - order of occurrence is not dependency, and a graph drawn from the timestamps alone is a chain through five things that merely followed one another. So the times and the closures are handed over as facts and the model is asked only for the edges, and told plainly that most pairs have none, because a model asked for a graph will draw one."},{"type":"quote","text":"That call was raising `NameError` on every round from the day it was written: it referred to a name nothing had bound, the round's own `except` turned that into the report's `error` field, and the tree simply never appeared. Six hundred and forty-one tests passed over it, because a round that catches its own exceptions still returns a full report and nothing was checking that field. A round now has to finish clean for the suite to pass, which is the assertion that was missing rather than the one that failed."},{"type":"p","text":"**And “the whole prompt” means both halves of it.** The step list showed each call's message under a heading reading *the whole prompt*, with a token line under that reading *0 of instruction, 0 of states* - so a reader following a round saw the states and concluded the model had never been told the output format, what counts as a task, or that it was allowed to search. The amendment above had put the instruction beside the message in one place and not in the other, which is the worse of the two failures: a panel that shows nothing invites a question, and a panel that shows half of something under the word *whole* answers one. One function now writes a prompt onto a step, it writes both halves, and it counts them apart - the instruction is identical on every call of a round and is what a cache hit is made of, while the message is the states and is different every time, so one number over the pair would hide which of them a round is paying for."},{"type":"p","text":"**Everything the model said is kept, whole, beside the task it produced.** What was left on disk was the summary: a title, four sentences, a list of ids - the part that is right when nothing went wrong. Everything that answers *why is this summary odd* lived in the report, which is in memory and lasts until the next round overwrites it: the reply that was not JSON and left every field empty, the search that came back with nothing and the summary written anyway, the state ids that had to be stripped out of a title before the user saw it. So each summary now writes a transcript - the instruction, every call in order with its reply unaltered, **whether it chose to search** and what it asked for, what the search returned, and what was kept from the answer against what arrived - and the record points at it. Whether it searched is written in words and written either way, because *no search* and *no record of a search* are different facts and a missing field reads as both. It goes in a sub-directory as `.json`, which is how the library comes to ignore it: a transcript is a log of how something was decided, not something the agent knows, and one coming back from a search would put the model's own draft answer in front of the user as a fact."},{"type":"quote","text":"**And then it was not.** The paragraph above is what was built, and it was measured after a day of real use: seventy files and two and a half megabytes a day, nothing ever deleting one, and about half of each file the same text stored twice - the searches repeated the prompts the exchange had already recorded, and the instruction was written once per call although it is identical in every call of a round. The argument for keeping it was that the report is in memory and lasts only until the next round overwrites it. The answer is that what a round PRODUCES is the task, its summary and its four parts, and those are records in the library written as they always were; how the model arrived at them is a thing to look at once, while looking at it. So none of it is written to disk. **Everything above is still collected and still reaches the panel whole** - every prompt, every reply unaltered, each search's question, result and follow-up, whether it chose to search, and what was stripped out of the answer. Only the file is gone, and the page says so in as many words, because a reader told nothing assumes it is filed somewhere."},{"type":"p","text":"**It is watched from a page of its own.** Not a card on the heartbeat page: that one is a single run of the review that writes states, step by step, and this is what the states already written add up to, read all at once. What a reader has to judge here is not the order things happened in but *why these were put together* - so the page is the groups, each opening into the states under it and the words they share, with every scored pair underneath, **including the ones that did not join**: the pair that nearly joined is what answers \"is the threshold wrong\"."},{"type":"p","text":"**Everything the agent adds says when it was added.** A state, a trait and a scheduled task each carry `created_at`: the moment the agent wrote it down. It is not the same fact as any other time they hold - a state has a period, a task has an hour it runs at, and a trait is about a person rather than a moment - and without it a state written this morning about a fortnight of work reads exactly like one written a fortnight ago, which is a very different claim about how long the agent has been watching. All three recorded it already; the **state card did not show it**, while the task card and the record page had all along."},{"type":"p","text":"**Stopping a loop does not wait out its interval.** Each heartbeat sleeps on the event that says *your interval setting changed*, with the whole interval as the timeout; `stop()` set a different event, so the thread slept through it and the join that follows spent its full five seconds failing. Three loops did that one after another, so quitting the agent took **fifteen seconds and looked like a hang** - the threads are daemons, so the process did eventually go, and what the user saw was fifteen seconds of nothing. Stopping now sets both events: the sleep returns at once, sees the stop and ends. Measured at 15.04s before and 0.001s after, with no threads left behind."},{"type":"p","text":"**The review is four steps that run** - states, people, notifications and next steps, the last only when there are open next steps - **plus a fifth, who the user is, that is kept but paused**: what the user is like is now learned from their lessons instead. There was once another step, and it judged what was on the calendar: it read every state whose end had passed and said *finished*, *extended* or *retired*. It is gone, with the verdicts, the two groups it was shown and the cap on how many it could apply. **What follows from that** is that nothing closes a state any more. A state stops describing the present when its end goes by - `covering` reads the dates, so what an answer is built from stays correct - but its status stays `active` for good, and the count of extensions, which existed to find a state nobody ever finishes, is no longer written by anything. The store keeps the queries; the heartbeat no longer asks them."},{"type":"p","text":"**How many notifications one review adds is not fixed.** None is the usual answer, because a notification interrupts; but a promise the user made to do something later is worth one, set for the moment it becomes useful. A notification invented to fill the list is an interruption the user has to dismiss, and a run that skips an obvious one because it had already named another has lost it."},{"type":"p","text":"**The step that decides what to do adds notifications, and disables ones whose thing is already done.** It reads the same window as the steps before it, the states this review has just written - which are not on the calendar yet, because nothing is written until every step has answered - every notification already ahead, what is waiting for a time, and the lessons learned from how the user treated earlier notifications. It can open anything in the window by its id, like the steps before it. **A notification is not a state**: a state says what is true and is only ever read, a notification is a thing that reaches the user at a time, and sharing a calendar is the whole of what they have in common."},{"type":"p","text":"**The confidence scale explains all seven of its points.** It ran 1 to 7 and described five of them, and the two it left out were 6 and 3 - either side of the middle, which is where most honest answers land."},{"type":"p","text":"**A step is not told how it was started.** *\"You run on a timer, not in a conversation\"* stood at the top of every call and named nothing the call could act on. Nor is a step told what it *itself* concluded a moment ago: each is its own call with its own context, so what an earlier step worked out arrives as material handed over - **what has already been worked out from this activity** - rather than as a memory of a conversation it was not in."},{"type":"p","text":"**The step that reads the window is not shown the calendar.** It used to be given every state running now, so that it could avoid writing one twice - and that is a review of the evidence that begins with last hour's conclusions, which is a review that mostly confirms them. The window is the evidence; the calendar is what earlier runs made of earlier windows. The section is not shown empty either: a heading reading *\"what you already believe\"* with nothing under it invites the model to account for the emptiness instead of reading what is in front of it, so the context is numbered by the sections it actually has. **What follows from it** is that the step can no longer name a running state to carry on: `continues` needed an id it is no longer shown, so the instruction and the field are gone from the prompt, and something still going is written for this window as this window saw it. The step after it still gets states - not these, but the ones this step has just concluded."},{"type":"p","text":"**The pass that rewrites them reads the states folder once.** Finding a state's file by its id searches the whole library - every folder, every file - so doing it once per state was thirteen hundred scans of twelve thousand files on a real library, on the startup path, and the application did not finish starting. It now reads the folder once, rewrites only the files that carry a horizon, and says how many before it begins: a few seconds of silence during startup is indistinguishable from the thing having hung."},{"type":"p","text":"**Every state says which stretch of activity it was read from.** A state that took forty minutes is a different claim depending on whether the review saw fifteen minutes or four hours, and the state carried no way to tell them apart - so each one written now carries the range the heartbeat covered: the bounds it asked for, the first and last event that actually fell inside them, and how many there were. Both halves earn their place, because a quiet quarter of an hour holding two events and a busy one holding three hundred are not the same evidence and the clock alone cannot separate them. **The model is never asked for it.** It is a fact about how the review was set up rather than a reading of anything, already known to the code that writes the state, and a number the model copies back is a number that can come back wrong - so the script stamps it and a range the model volunteers is ignored."},{"type":"p","text":"**Every state says where the user was standing.** Everything here is stored in UTC, which is right - one clock, no ambiguity, arithmetic that survives a move - and it is not what anybody's week looks like. A state running from 23:00 to 01:00 UTC is a Tuesday evening in Lisbon and a Wednesday morning in Shanghai, and every question a person asks about their own calendar - *what do my Mondays look like*, *do I work late*, *was that the weekend* - is a question about the second one. So each state carries the offset that was in force, the name the system gave the zone, both ends of its span in local time, and the day of the week. The day it is filed under is the day it **began**: a state that runs past midnight belongs to the evening it started in, which is the sitting a person remembers."},{"type":"p","text":"**And the grouping reads them in that week, not in UTC.** A `ran:` line put in front of the model is now the user's own clock, with the day of the week named and the zone in brackets - *Sunday, 18:30 to 20:00 [WEST]* - because *a Tuesday evening* and *a Sunday afternoon* are different facts about a person and `2026-09-27T17:30Z` is neither of them. A span that crosses midnight names both days. A state with no local time recorded says **UTC** in so many words rather than being shown in the same shape as the others: presenting UTC as though it were somebody's own clock is how a Wednesday morning becomes a Tuesday night, and the model has no way to notice. Both renderers go through one function, because the sample and the full state a search returns had drifted apart once already."},{"type":"p","text":"**The states written before any of this carry an assumed zone.** They cannot carry a real one: where somebody was in July is not something that can be read off a record, and the machine's zone today is not evidence about it. So they are read, once, as a zone the user names - and **marked as assumed, with the zone that was assumed**, because a state stamped as it was written knows where the machine was while these know only what they were told afterwards, and a reader deciding whether to trust a Tuesday should be able to tell the two apart. A calendar where two thirds of the entries can be placed in a week and the rest cannot is worse than either: every question about the user's Mondays would silently be a question about the last fortnight."},{"type":"quote","text":"**Named zone, not a fixed offset**, and this is the part that is cheap to get wrong: a calendar of any length spans a daylight-saving change, so half these states are on one side of it. The first version took the offset at the moment of the PASS rather than at the moment of the STATE, and a January state came out labelled `WEST` with `+01:00` beside local times reading `+00:00` - the record contradicting itself inside one dictionary. The offset is the one that was in force when the state ran."},{"type":"quote","text":"Stamped on the way in, at the store, rather than asked of whoever writes the state - it is a fact about the machine's clock, every writer would have to remember it, and one that forgot would leave a state that cannot be placed in anybody's week. And **not recomputed on the way out**: the user may be in another zone by then, and the honest answer is the zone they were in at the time. The zone is recorded as the name the system gives and an offset, not as an IANA key - there is no way to get one from the standard library on every platform, and a guessed `Asia/Shanghai` that is wrong is worse than `CST`."},{"type":"p","text":"**There is no horizon.** A state used to carry \"short\" or \"long\" beside its dates, read off the span by a threshold - which is the span again in a word, and a word beside the dates is a second place for the two to disagree. It was also the first thing on the line the agent read (*\"(short term, the user) ...\"*) and a keyword the file was filed under, so the least of what a state says led everything that quoted it. The period says all of it, and `span_hours` says it as a number. Nothing chooses between two fixed shapes any more either: a state that gives no dates at all falls back to **about now**, which is the only thing it can honestly mean, and something longer-lived is a state already on the calendar carried on one window at a time. **The files written before it was dropped are rewritten once**, because a folder holding two kinds of state file - where only the old ones answer to a word the agent has stopped using - is worse than either."},{"type":"p","text":"**And what a step wrote is reported as the thing it wrote.** `states_written` said `\"sources\": 2, \"evidence\": 3` - a count of a list nobody could then read, which is the one part of a state that cannot be checked. It now carries each state in full: the period, how much of the window went to it, the files and pages themselves, the argument, and the stretch the review read it from."},{"type":"p","text":"**An outcome nobody has reached yet is not an outcome of nothing.** What each step wrote is recorded after all four have answered, so for about a minute of every run step one had answered and had nothing on it - and that was shown as *\"Nothing came of this step\"*, which is the opposite conclusion and the one a reader watching the run was most likely to see. An empty outcome now says which kind of empty it is, and the panel waits rather than concluding."},{"type":"p","text":"**A trait has the shape a state has.** It was a title and a paragraph. It now carries the same three things, for the same reason: what it rests on, how it was reached, and **how sure the agent is** on a scale of one to seven. A trait is a claim about a person that they never made, and one whose basis they cannot see is one they cannot argue with. The scale matters more than a flag would: *\"I watched this hold for a month\"* and *\"this looked like a pattern once\"* are both worth writing down and are not the same claim, and the second written as the first is something the agent will act on and keep acting on. A confidence left unsaid is the middle, one off the scale is brought onto it, and nonsense in the field does not lose the trait. **The step that writes traits is now paused**: its prompt and code are kept, but it does not run. What kind of person the user is now comes from the lessons their own actions teach, not from guesses based on a few minutes of activity."},{"type":"p","text":"**A window is usually two or three states, and each is a summary rather than an event.** Opening a file is not a state; what the file was being opened *for* is. The instruction carries examples from both sides of that line - *\"working on the survey-weights replication\"* covering an editor, a paper and a terminal, and *\"watching videos on YouTube\"* covering nine video pages as one state - because the altitude is easier to see from two sides than from a definition, and the failures either side of it are \"opened search.py\" and \"using the computer\"."},{"type":"p","text":"**The state step is about the user.** Its instruction said otherwise - *what you intend to do for them is also a state* - so a calendar meant to describe the user's situation back to them filled with the agent's own intentions, described as though they were the user's. What the agent means to do is a scheduled task and a record of one; it is not the user's situation."},{"type":"p","text":"**And it covers everything in the window.** The first attempt told it not to write a state that was already there, and read together with \"write several states\" that means *say nothing about anything you are already tracking*. Seen in a test run: the analysis named four activities - preparing slides, a code review, reading, a message exchange - and wrote one state, explaining in its own words that the other three were already on the calendar. A window where somebody carried on with three things they were already doing is a window with three states in it, and one state describes a different evening."},{"type":"p","text":"Leaving them out is the thing that loses information: the window then says they never happened. The step once marked anything that was one of the running states with **`continues`**, the id of the state it carried on, so that the state's end moved rather than a second state being written. That is superseded by \"The step that reads the window is not shown the calendar\", above: the step is no longer shown the running states, so something still going is written for this window as this window saw it, and it names no running state. The code that handled `continues` is kept, but nothing reaches it."},{"type":"p","text":"### The Step After It Gathers For Itself Too"},{"type":"p","text":"The step after the state step wrote who the user is. It was first handed a context built from a query of names in the recent activity, which is the wrong material for *who is this*: a habit is the same afternoon four times, and the other three afternoons are not in this window. It was then given the same floor as the state step, with the states that step had just answered in place of the running ones, and told to write nothing rather than a habit it had seen once."},{"type":"p","text":"**That step is now paused.** Its prompt and code are kept, but it does not run, and its slot went to the people step, which writes the user's contacts. What the user is like is learned from the lessons their own actions teach."},{"type":"p","text":"Every step now gathers for itself: each gets its own copy of the same window, and the steps after the first are also shown the states this review has just written."},{"type":"h","text":"The Step Decides What It Needs To See"},{"type":"p","text":"Choosing in code what to look up, before the question is asked, is a guess: a fixed share of a fixed budget per folder is an allocation decided before anything is known about the morning being allocated for."},{"type":"p","text":"So every step is given a floor and left to decide what more it needs. Since the library index and search were removed (commit fcf74e1), there is nothing to search beyond the window:"},{"type":"p","text":"**Each part of that context says what it is.** The headings were labels - `WHAT IS HAPPENING`, `STATES RUNNING NOW` - which name a section without saying what is in it or where it came from, and the parts are read very differently: one is an observation of the user, and one is the agent's own conclusions. So each is introduced: the activity as recorded by the listener and *evidence*, and the states this review has just written as conclusions that can be wrong."},{"type":"ul","items":["**what is happening**, which is every event since the last review ended, folded - not a fixed number of the most recent, because four events in a window and four hundred are different situations and a `limit` reports the same figure for both","for the steps after the first, **the states this review has just written**. The state step is not shown what is already on the calendar"]},{"type":"p","text":"**The window is everything since the last review ended.** It began as a fixed few minutes and that is a second number saying what the interval already says: the heartbeat wakes every so often and asks what is going on, so the honest window for that question is *since it last asked*. Five minutes on a fifteen-minute interval throws away two thirds of what happened, every time, and nothing in the answer says that it did. A run started by hand uses the same window - it stands in for the run that would have happened, and a different window would make it a different thing. If the agent was closed for more than thirty minutes, the stretch it missed is read on its own, soon after start-up, in turns of at most three hundred events, oldest first."},{"type":"p","text":"That also removes a tool. The step used to be able to **look further back**, because the floor did not reach the beginning of what it was looking at; with the gap itself as the window there is nothing behind it that belongs to this review. What it can still ask for is to read one item in the window whole:"},{"type":"ul","items":["**open it by its id.** The window is folded, so a step sees each item briefly; what the item says in full is a second act, and it costs more, so it is asked for separately. Anything in the window can be opened this way - something the user did, a change the agent made, a state, a notification. A step may come back for more up to six times before it must answer."]},{"type":"p","text":"**And each call carries the message it sent**, whole. The row that ends the loop - the one that says the step answered rather than asking again - carried the answer cut at four hundred characters, so the row meant to show what the step concluded showed its first sentence and stopped mid-word."},{"type":"p","text":"A row that counts what went into it - *20 lines of activity, 146 states, 0 records* - says how much and never what, and what was sent is the only thing that explains what came back. A later round carries **what was added for it**, with how many messages it stands on, because the call holds every round before it as well and printing the whole conversation on each row is the same text four times. The standing instruction is there too: it is sent every round and appears in none of the messages, so a reader rebuilding the call from the message alone is missing it."},{"type":"p","text":"**A message that offers tools must not end by forbidding them.** This one did: after the paragraph inviting it to ask for more, and the context, and the time, it closed with *\"Return ONLY this JSON object\"* - an instruction not to call a tool, in the last and strongest position. The step read the nearest instruction and answered from its floor, so the tools it had been given went unused on exactly the round where using them was the point. It now ends with the two things it can do: call a tool and be asked again, or answer. Every step now has the same tool, so every step's message ends this way."},{"type":"p","text":"**So are the tools it was offered.** There is no separate call asking whether to look further - the message that asks for the answer carries the tools, and the model answers by using one or by not using one. The offer is therefore half of that ask, and it travels in the request beside the messages rather than inside them: a reader rebuilding the call from the message alone sees the step being told it may ask for things, and never what it could ask for or what each takes."},{"type":"p","text":"**Every step says what it cost, start to finish.** The header read *\"1 memories, 41 ms\"*, and the 41 ms was the gathering - the cheap half. The minute somebody waits through is the model calls, and it was reported nowhere; nor was what the step spent, which is the number anybody deciding about the interval actually needs. Per step, because a total for the run says a heartbeat is expensive and not which part of it is, and the state step's cost is not one message but the sum of several growing ones. Both clocks are kept: the gathering and the calls are different costs with different remedies, and one number covering both hides which is which."},{"type":"p","text":"**Sizes are in tokens.** They read *132,769 characters*, which is a fact about a string. What is capped, paid for and worth deciding about is tokens, and nobody does that division in their head. The counts come from the agent, using the same estimator the budgets use."},{"type":"p","text":"**The trail records the calls as well as their results.** Without them it reads `start, fold, search` - which looks like a search that happened before any model was asked, when the search is the *result* of the first call and is the only thing explaining why those words and not others. Each call is a row, numbered, with how much context it carried; the row that ends the loop says the step answered rather than asking again."},{"type":"p","text":"The panel's labels followed from the same confusion. \"The prompt it was sent\" is the **first** message of several, so it says so, and the block that used to read \"the text the model was given\" is **the context as it stood at the end** - which is not what the first call saw, and is the thing a reader compares against the trail."},{"type":"p","text":"**It stops when it says it has enough**, and a cap stops it when it does not. An answer given because the rounds ran out is not the same as one given because the step was satisfied, so the trail says which - a step that was still asking when it was cut off is a step that answered on less than it wanted."},{"type":"quote","text":"The cost is what it decides to spend. A step that has enough answers in one call, as before; a step that does not spends a few more, on the run where that was worth doing. The floor is small on purpose, which is what makes the asking affordable."},{"type":"p","text":"### A Name Is Not What Someone Is Doing"},{"type":"p","text":"The feed arrived with the text of every event stripped out of it."},{"type":"p","text":"`content` is the reading of the window - what the page actually said - and it was dropped on the way to the heartbeat, along with the rest of the address, leaving `firefox.exe` and a hostname. So a morning reading one paper and a morning buying a fridge reach the step as the same three words, and the step that is supposed to say what the user is doing was answering from the name of the program it was done in. Nobody works on a program."},{"type":"p","text":"So each event carries its title, its whole address and what it said, and the events are shown **as events** rather than as a slice of JSON - one to a line, with what does not fit dropped whole rather than the feed being cut off mid-string, which used to remove the text first and the oldest half of the window with it."},{"type":"p","text":"**The text has its own budget, spent newest first.** One reading can run to four thousand characters and a busy window is hundreds of them, so this is the difference between a step that sees what was on the screen and one handed a transcript of the afternoon in place of a question. An event whose text did not fit says so, rather than looking like an event that had nothing to say."},{"type":"p","text":"### The Same Thing Forty Times Is One Line And A Number"},{"type":"p","text":"An editor saving on a timer writes the same event forty times in a quarter of an hour. A window read every fifteen seconds writes sixty readings of one page. None of that is forty or sixty facts about the afternoon, and the step was being charged for every copy of it."},{"type":"p","text":"So the feed is **folded before anything is spent on it**: events with the same shape - the same application, the same kind of event, the same file or page - become one entry carrying **how many there were and the stretch they cover**. That is structure the model would otherwise have to infer from a list, worked out in code where it is free. Measured on a quarter of an hour of ordinary work, 6,556 tokens became 606."},{"type":"p","text":"A group carries **each of its own times**, not the stretch they span. A range was the first thing tried and it is an answer to a question nobody asked: `x3 over 02:20-02:21` reads identically for three clicks in four seconds and three visits spread over a minute, and those are a double-click and a person going back and forth. A dozen times are listed and the rest counted, which is enough to see the rhythm of a group."},{"type":"p","text":"**What folding must not do is flatten what changed.** Sixty readings of one page are not one reading: a page that was scrolled and a page that was stared at are the same row under a naive fold, and which of those happened is the one thing those readings are evidence about. So a group keeps the newest reading and **a few behind it that differ**, with the repetitions counted rather than kept - and the rest reported as a number. Identical readings are not kept twice, because they were never two things."},{"type":"p","text":"The budget then buys **distinct things** rather than sixty copies of one paragraph, which is the difference between a window whose shape the step can see and one whose first tenth it reads in full."},{"type":"quote","text":"**It says that it was folded**, and reports both numbers - what happened and what was sent. A step told \"12 events\" that is really looking at a fold of a hundred and forty has been given the wrong idea of how busy the window was, and how busy it was is part of the answer it is being asked for. A compression that reports only its own output is one nobody can check."},{"type":"p","text":"**It is a step in the trail, and the trail says code did it.** Everything else in a step-1 trail is somebody choosing something - the model deciding to search, the agent having been configured to look back fifteen minutes. Folding is neither: it is a transform, run in Python, the same way every time, with no model asked anything. That is a different sort of claim and it is labelled as one, because from a result alone the three are indistinguishable."},{"type":"p","text":"So the row carries **the same feed rendered the same way on both sides of it**, with the event count and the token count for each - on the line that opens each side, because \"before folding\" on its own says nothing about what is behind it. The row states what was saved rather than leaving two numbers next to each other for the reader to subtract, since what folding bought is the point of it. The two renderings differ in the folding and nothing else, or the comparison would be measuring the renderer. That is the whole of what a reader needs to check the compression rather than take it: what went in, what came out, and what it saved."},{"type":"p","text":"### An Event With No Text Of Its Own"},{"type":"p","text":"Only the screen provider reads text. The application provider says a window came to the front and no more, so a focus event arrived as `firefox.exe application.focused, Personalized Agent` - which names the window and not one thing in it, and reads as an event that had nothing to say rather than one whose text is kept somewhere else."},{"type":"p","text":"The reading of that same window **is** that text, so it is lent: the newest reading of the same application and title, shown against the event that has none. **Marked as borrowed, with the time it was taken**, because it is
