ven; the project or task the work is for; and what was **found** of the user's own records by the work's words (section 119.2).","**A high-level plan is drafted** from that context in one model call, in the display language. It is not the detailed plan, which stays the run's contract. It is only enough for the user to see at a glance whether the task was understood: a title, what the agent understands them to want, the goal, three to seven main steps, the deliverables, what is out of scope, and any question that would change the plan. The plan is drafted from what was collected and nothing else, so it comes back quickly.","**The user reads it, edits any part, and presses Start, or cancels.** Nothing runs before that.","**The run is started** with the approved plan given to it word for word, as the user's own (`instruction_of`), together with what was handed over and the references found."],"start":1},{"type":"p","text":"Two rules apply to every plan, whatever the model returned (`plan_of`). A plan with no title takes the first words of what was handed over. A plan whose deliverables do not mention a README has one added, because every run that makes something writes one (section 119.4). The draft also records whether the plan that started was the agent's or one the user changed (`plan_by`)."},{"type":"p","text":"The Add work button on a project or task, the to-do list, the avatar's menu, Explorer and selected text all open the same box. The page never calls the old direct start route. Only continuing an interrupted run skips the draft, because that run already has an approved plan and a contract. Work started from a project or task goes on that one. Work handed over from anywhere else becomes a project of its own (`create_work_project`, then `mark_delegated`). If granting a folder or starting the run fails, that new project is taken away again (`drop_workspace`), so a failed start does not leave an empty project behind."}]},{"number":"119.2","label":"119.2","id":"s119-2","title":"What Bears on the Work Is Found, Not Guessed","page":148,"blocks":[{"type":"p","text":"*Modules: `agent/work/context_search.py`, `agent/work/tools.py` (`search_records`), `agent/work/delegate.py` (`collect`, `instruction_of`).*"},{"type":"p","text":"The records that bear on a piece of work are the ones that match it, from any time. Matching is harder than it looks: the user may write in any of the five display languages, but what the agent keeps is in English - states, the English copies of tasks, the keywords of stages. So the search has two steps:"},{"type":"p","text":"*Amended 2026-10-15:* there are nine display languages now - English, Chinese, Spanish, Japanese, Korean, Russian, French, German, Italian - and the whole interface is shown in the one chosen (section 134).","amended":true},{"type":"ol","items":["**One model call turns what was handed over into English search words** (`english_words`): the text, the names of the folders and files, the page title and the name of the project. It returns 8 to 14 English keywords and phrases plus a one-sentence summary. Names of files, people, products and code keep their own spelling. Without a model, the words of what was handed over are used as they are.","**The records are searched with BM25** (`Index`, with the usual constants k1 = 1.2 and b = 0.75). The index covers every kept state, every live task (its English copy, falling back to its own words) and every live stage (its English keywords)."],"start":1},{"type":"p","text":"A match counts only if its **relevance**, meaning the share of the query's weight that the record matches, is at least **0.12**. That threshold was set on real queries of 8 to 14 words: records that clearly bore on the work scored 0.2 to 0.3, related records 0.12 to 0.2, and records that only shared a common word scored under 0.1. The matches that pass are ranked by relevance multiplied by **recency**. Recency halves every 21 days but never drops below a quarter, so an old record that is clearly on the subject still counts. At most twenty states, five tasks and five stages are kept."},{"type":"p","text":"What was found appears in the draft beside the plan, each item with its relevance and recency. The run receives it as a list of references in its instruction, most relevant and most recent first. A one-off search is not enough once the run starts on the details, so the run also gets a tool, **`search_records`**, which searches the same records by English keywords whenever it needs to. The tool builds its index once per run and returns at most twenty matches. It is offered only where a run has the user's records: the single-model variant of the Experience debugger has none, so it is not given the tool."},{"type":"p","text":"*Amended 2026-10-16:* the Work debugger (the Experience debugger as it was called) tries the same instruction again in TRIES: the folder the user chose holds `try_1`, `try_2`, ..., each with its three ways inside, and a new try is made with a button and shown. Each try is blind to every other: its ways may not read any other try's folder or anything under it - an evaluation the user holds in one try's folder included - nor what Claude Code or Codex sessions started anywhere under another try kept of themselves (`~/.claude/projects/\u003cthe folder\u003e`, and each Codex session file that ran there), refused by the run's own checks and, on Windows, by the operating system. Each try's ways have their own runs, trees and versions; the first try keeps the names projects had before tries, and a project made before tries has its ways moved into `try_1` - with its runs' records - the first time it is shown with none of them going. One gap is known: Codex, as the model, runs its own commands in a sandbox that keeps it from writing but not from reading, so what it reads by itself is not confined. Until Codex runs inside the run's own isolation, no call of a Work debugger run is given to it: the next model on the user's list answers, and with none but Codex the run says why it cannot go on.","amended":true},{"type":"p","text":"*Amended 2026-10-17:* a try is measured, so it is kept from everything that would let it tune itself to the measuring: beyond the other tries and its try's other ways, it may not read the rest of its own try (what the user writes at the top of a try is their evaluation of its ways), nor the sessions Claude Code and Codex kept of work in any try but its own way; nor the agent itself - its code (the checkout, or an installed copy's whole folder), its data folder's workspace (what it learned of the user, as files), and the sessions of work in either, among them the user's sessions with the assistant that builds the agent. The top of the project's folder stays readable: it is where the user puts what the work is to be done with. A try still draws on the user's experience through the agent's tools, never as files. None of this applies to real work.","amended":true},{"type":"p","text":"*Amended 2026-10-17:* and every run - real work as much as a try - may read the record of the user's Claude Code and Codex sessions (`~/.claude/projects`, `~/.codex/sessions`): a lesson can come from one. The rest of those folders - their sign-ins, settings, history and caches - stays closed with every other store of sign-ins in the home. Those records hold whatever was said in them.","amended":true},{"type":"p","text":"*Amended 2026-10-17:* and a try's way installs its packages with a download cache in its own folder, not one beside the ways: a shared cache told one way what another had installed. Real work keeps one cache for all its runs.","amended":true},{"type":"p","text":"*Amended 2026-10-17:* a try can be REMOVED, after the user confirms: its folder and everything in it - what its three ways made and what the user wrote at its top - is deleted, its runs and its ways' trees are forgotten, and the sessions Claude Code and Codex kept of work in it are deleted too, so a try later given the same number is not handed them as its own. The other tries keep their numbers; the only try left cannot be removed (Clear all empties it).","amended":true},{"type":"p","text":"*Amended 2026-10-17:* what a step of the work is given from the user's experience is held to what bears on it. A past stage counts only if it shares at least two of the step's words that tell work apart: a word found in more than a tenth of all stages counts for nothing (once there are fifty stages to judge that by), and so do a few that say nothing (\"per\", \"via\", \"app\"). Its words decide whether it counts at all; what kind of stage it is, its place and the rest only order those that do. Around each stage found, one stage before and one after, not more. A nature comes with it when the step shares two of its telling words; a pattern or principle only when it bears on the step as much as a third of the best one. No principle is handed over just for being the most shown. And a stage from a PROJECT LIKE THIS ONE ranks higher: this work's goal, in English words, is put against each past project's stages as a whole, with each word counted by how rare it is and how many of that project's stages say it. The projects scoring at least half as much as the closest one count as alike, more so the closer they come. Measured again on the five questions of a real run: about a third of the tokens it was given before (4 to 7 thousand rather than 16), with the stages of the like project moved up.","amended":true},{"type":"p","text":"*Amended 2026-10-17:* a project's learning is updated BY ITSELF at the times of day the user chooses, in this computer's time zone (\"03:00\" unless changed; none for never), as an issue of the Newspaper is made. The run takes every project that has changed since it was last learned: a task of it has states not yet learned, or a file in one of its folders (or one of its sessions with a coding agent) is newer than how far the folder was read. Each project has its own tick, on by default. While the run goes, a project's Start and Update wait. Cut short by the application closing, the run carries on when it starts again, each project from where its learning stopped. And a project can be REMOVED, after the user confirms: its stages and cards, and their links, are deleted, found by no search again, and it is not listed or learned again. The natures, patterns and principles stay, because another project may rest on them and what they say of the user is still true.","amended":true},{"type":"p","text":"*Amended 2026-10-17:* the projects of an automatic update are learned side by side, as many as the one pool gives places (section 120). When the run is over and its projects wrote natures of the user's work, the patterns and principles are built again from them at once - the state heartbeat's step, asked for then rather than when enough new ones have come in.","amended":true},{"type":"p","text":"*Amended 2026-10-16:* \"Try the retrieval\" - what a run would be given of the user's experience for a step - is the Work debugger's, at its foot, and no longer in Work: it is a tool for whoever develops the agent, and a build without the Debugger has none of it.","amended":true},{"type":"p","text":"*Amended 2026-10-17:* a run's token chart is drawn across either the clock or the run's OWN TIME - what it had run when each call ended: the time it was held paused and the time it waited for the user's answers left out, and the time between its sessions too, each session's own time carried on to the next. Each call is kept with that time (`active`); for calls kept before it was, it is estimated by leaving out every gap longer than a pause, and the chart says so. Across its own time there are no breaks to draw, and the ticks say how long it had run. Which of the two is one choice, kept in the browser.","amended":true},{"type":"p","text":"*Amended 2026-10-17:* a slide's notes sit beside it as sticky notes, as a note sits beside a reply in Chat - one for what it shows, its key terms, how to read it and what to take from it, each folded from its title - in a frame of the page as when shown alone; the frame is as tall as the slide or its notes, whichever is taller, so nothing in it scrolls. And every drawing has its own arrowheads: one shared by all of them took every arrow's head away whenever the first drawing on the page was hidden.","amended":true},{"type":"p","text":"*Amended 2026-10-17:* THE SAME CARD IS GIVEN THE SAME PAST WORK. What a run's reviewer is given of the user's experience for a card - when its criteria are written, and when a round on it is reviewed - is kept the first time, in the application's database (never in the run's plan, which goes with its versions into the work's own folder), and given again when the card is opened again, reviewed again, or carried on after the application closed, even while learning changes the record meanwhile. And nothing handed over for one card is held against another: a stage given before no longer counts half - each reviewer's call is new and holds none of what an earlier one was given, so the half only gave later cards weaker stages.","amended":true},{"type":"p","text":"*Amended 2026-10-18:* THE WORK DEBUGGER'S SECOND WAY DIFFERS FROM THE FULL ONLY BY THE CONTEXT. Its reviewer had instructions of its own, shorter than the full way's, and among what they left out was what the full way's reviewer is held to first: what the user asked comes first - the core promises - and no work is added that they did not ask for. The difference measured was then partly a different way of working. Now the second way's reviewer has the same rules, without those about the user's past work; it searches the web as the full way's does, and searches nothing of the user's own record, and is given none of it. When the reviewer comes to ask its questions and answer them, the second way will ask them too, answering from the web alone.","amended":true},{"type":"p","text":"*Amended 2026-10-18:* WHAT LEARNING WRITES IS IN ENGLISH. Every stage and card learned of the user's work, the links between them and the natures written with them are in English, whatever the user reads in (`stages.STAGE_LANGUAGE`): they are the agent's own - no longer shown to the user - read by its reviewers, matched and searched in one language, and the reviewer's own search of them was already asked in English. The user's own words, where a stage quotes them, stay as they wrote them. What was learned before stays as it was written until the project is learned again; what a run of Work writes for the user to read is in their display language, as before.","amended":true},{"type":"p","text":"*Amended 2026-10-18:* AND STILL FOUND BY THEIR WORDS. Written in English, the stages could be read by the small English model the states are grouped with (section 37), and finding them by meaning was built and measured on the user's own record - 774 stages, asked with the steps of 187 of its own cards and of 93 cards of new work: words found something every time, meaning left four of the five best in place for new work and found nothing words had not, and it cost a second and a half a search, three minutes to read every stage the first time and the model's own process beside each run. The user decided against it: stages are found by their words alone, no embedding model is used for them, and nothing of it was kept.","amended":true},{"type":"p","text":"*Amended 2026-10-18:* LESSON CARDS - WHAT WAS ASKED AND ANSWERED (`heartbeat/experience/lesson_cards.py`), the first part. A card is one answered question of the user's work: the question in English, the context it came up in (the project, the run, the card of its work, why it was asked), the specific answer, and the evidence it rests on, each piece typed - what the user said, the user's own code, a decision the user made, or the model's own knowledge. Its tier follows: from the user, or an assumption. NOTHING RESTING ON THE WEB IS KEPT, even partly: a page may be written to steer whoever reads it, and a lesson is read by every later run - so such an answer is used in the run that found it and gone, and a package from another computer cannot bring one in either. A card is never edited: a change is a new version that supersedes it, with the same lineage, the old one kept and marked. There is no fixed set of tags: what kinds of file and which stack the evidence points to, and the project, are worked out from the evidence; the topics are free words the model proposes. A card is found by its QUESTION, against the question asked - each word worth what it is rare among the questions kept, Chinese, Japanese and Korean in pairs of characters - one from the same project counting for more; the questions alone can be given too, to prompt questions a reviewer would not think of. Each use is recorded: which run, which card of its work, what it decided, which files. The cards are carried in the Lessons package with every version, and shown in the Lessons debugger. NOT YET: the reviewer writing and reading them as it works, and their upkeep with the state heartbeat's round - both change how a run is reviewed, and wait for the user's word.","amended":true},{"type":"p","text":"*Amended 2026-10-18:* LESSON CARDS IN A RUN - the user's decision. Before it writes criteria - of the contract, of the contract amended by the user's words, of each card as it opens - the reviewer is asked, IN AN ANSWER OF ITS OWN WITH NO WEB, what it must know of the user to judge the work as they would: its tools to read the user's files, records and past stages, and no web search, no page and no client's own web tool. It asks what will serve later work too - their preferences, conventions, constraints, environment and the decisions they make again and again, in any kind of work, not only code - and not facts of this work alone, what their instruction already says, or guesses. WHAT IT ANSWERS THERE MAY BE KEPT, each piece of evidence checked by the application: the user's words only when they are in the instruction, their file only when it was read in that answer with the words quoted in it, a decision of theirs only on a stage it was shown or opened - anything else is the model's own, an assumption. What it leaves open it answers as it writes the criteria, the web too, for that work only: nothing found there is ever kept. ONLY THE USER'S OWN WORK KEEPS THEM: each answer a candidate card - none resting on the web, none for a question a card shown already answers - and a card it names as replaced gets a new version (`Run._what_to_know`, `Run._keep_lessons`). The full way's reviewer is SHOWN the cards whose question is most like what it is asked, after the experience retrieved for it and kept with it, so the same card is given the same ones every time; each the criteria cite is recorded as a use, by the user's own work only. A Work debugger way of the whole system reads the user's cards in the same way and keeps nothing - no card, no new version, no use; the way with no context takes the same two steps with no card shown and nothing kept; one model on its own has no reviewer. The questions and answers are the agent's own notes, in English. Still to come: their upkeep with the state heartbeat's round.","amended":true},{"type":"p","text":"*Amended 2026-10-18:* THE USER'S OWN FILES ARE SEARCHED BY THEIR WORDS - THE LOCAL INDEX (`index/`). What was found of the user's past work was what learning had made of it; the files themselves - how they actually wrote a thing before - could only be listed and opened by name. Now the folders the user works in are kept searchable: every Work project's folders by default, the folders the user adds in Settings \u003e Search your files (each with everything under it), and, on one click, the records of their Claude Code and Codex conversations; no other folder of theirs is read, and the agent's own data never. Each text file is kept as the words of each forty lines (SQLite FTS5: Latin words, and Chinese, Japanese and Korean in pairs of characters, so no dictionary or model is needed), every other file by its name; caches, environments, version control and the places keys are kept are never gone into, a file named like a secret is never read, and a file only in the cloud is kept by its name without being downloaded. It is built in a process of its own at the lowest priority the system has - background mode on Windows, nice 19 with the disk idle or throttled on Linux and macOS - waits while the computer is on its battery, and reads again only what changed: a few minutes after the application starts, every few hours, and soon after the folders change. The agents search it with `search_files` - the full way and the user's own runs; not the single model, nor the way with no context, which are compared by having none of the user's context (that way's builder no longer has the search of the user's records either). Only what that agent may read is ever given back - the same rules as `read_file` - and what it finds and opens goes to the model it works with, as every file it reads does; the Settings card says so.","amended":true},{"type":"p","text":"*Amended 2026-10-21:* LEARNING STARTS AGAIN, AS CASES AND REASONS (`learning/`, the user's decision; the agreed design is kept beside this document, `docs/learning-and-work.md`). What was learned before - the stages each project was learned into, the natures written from them, their patterns and principles, the lesson cards - is backed up once, whole (the database and the natures' folder, in `internal/backups/before-new-learning-\u003ctime\u003e`), and no longer read for the user's work; nothing is made from it. A project is no longer learned by its own button. LEARNING reads the user's work - their Work projects (the state heartbeat's projects of the work kind, with their folders) and the PLACES they list in Work's Learning panel: folders, and with one click their Claude Code or Codex records; a record folder brings the project folders its conversations worked in (where a session started - or, started in a folder that holds everything, the project folders of the files it read and edited), and a folder brings every conversation that worked in it. A listed place is cut into units by a model, bottom up: each folder with no folders in it summarised, then each folder above judged from its own files and its children's summaries - which children are one thing (attempts at it, or the small tasks of one larger piece of work), and whether the folder covers most of what is in it; a folder that does not stops the climb. A unit is read in the order things happened - the user's words in their conversations whole, the agents' replies short, the agents' edits; the rules written for the agents (CLAUDE.md, AGENTS.md, Claude Code's memory of the project); the files, the first time as what is there and the start of the latest deliverables, after as each change against the copy kept when last read, a change the agent's where the lines it added are lines an agent's edit put there and the user's otherwise; the commits; for a Work project, its tasks - every word with keys, tokens and passwords taken out first - into CASES (a deliverable: what it is for and who for, in the shared words; where it is; what it looks like; how it was made) and the user's JUDGMENTS in them (what they decided, changed, turned down, approved or let stand, with their words and the date). What an agent decided, and anything a Work run does, is never learned. Then REASONS (`learning/reasons.py`): each new judgment is explained by the reasons that bear on it, picked by the shared words, without a word of them changed; a reason a judgment conflicts with is revised - a boundary, another reason winning there, narrowed or replaced, a one-off, or the user having changed from a date on - and a rewrite is held to all its evidence (none of the user's own words lost but what a change over time set aside, at least four fifths of the rest kept, a prediction that came true counting twice), refused twice it stands as a rival until the evidence tells them apart; what no reason explains is read together for a new one, falsifiable and as deep as can still be shown wrong. No weight fades by age: every judgment carries its date, and the model judges what is old. The shared words have a fixed top in each dimension (what the deliverable is, who it is for, how it reaches them, its purpose, its tools, and what in it a judgment is about); a word a model adds is on trial until a second case uses it, and folded back only after ninety days and a hundred judgments in its branch.","amended":true},{"type":"p","text":"*Amended 2026-10-21:* AN UPDATE, AND ITS CLOCK. Learning is updated at the times of day set in Work's Learning panel - several may be set - ONLY WHILE ITS SWITCH IS ON AND A TIME IS SET (off and none at first), or with Update now. An update reads up to its cutoff and keeps that cutoff through a pause, a day's limit (`learning_daily_tokens`) or the application closing; a time missed while the computer was off starts one when it is back, with that time as its cutoff; a time that passes while an update is open is skipped, and said so, and the next waits for the next time. One update at a time: Update now is greyed while one is open, Pause stops it until Continue. A first reading of a unit goes back six months first and reads what is older at the end. The panel shows how far it is, by the amount read, the places and what they bring (each found folder can be left out), and a bar a day of what learning spent.","amended":true},{"type":"p","text":"*Amended 2026-10-21:* WHAT A RUN'S REVIEWER IS GIVEN: ITS QUESTIONS, ANSWERED. Before it writes criteria - of the contract, an amended contract, each card - the reviewer writes, with no tools, the job's terms in the shared words and its QUESTIONS, each of a kind: an extra requirement the user would expect, the output's form and style, how a result is judged, how the work is done, a fact of the project. The work agent may ask too, with its round, and the reviewer answers. Then (`learning/find.py`): the reasons whose condition covers the job by its terms - or misses by one neighbouring term, or depends on what the job does not say - each read by a model against the job (holds, does not, or a question for the reviewer); a reason the user stated first, an inferred one only on two observations and said to be inferred; and, whatever reason they bear on, the cases most like the job - three in full (where the deliverables are, what they look like, every judgment, how they were made), diverse and covering the same deliverable and the same purpose, the next as an index - and what in them no reason explains yet. It may open more (`open_case`, `open_reason`) and search the user's files. It answers each question with where the answer comes from, strongest first: a reason the user stated, one inferred, common practice from the web chosen by the user's related preferences, common practice alone, its own assumption; what the record cannot answer is searched on the web, the queries framed by the user's situation and related preferences in general public words. A rule a funder or journal sets wins over a preference; general practice gives way to the user's reasons. What it writes is marked as its own. Every question and answer is logged with the run (`work_run_questions`), for reading back, and nothing of it is learned. Lesson cards are no longer written or given; those kept are read-only. The debugger's way with no context asks the same questions and answers them itself; the work agent never sees what was learned.","amended":true},{"type":"p","text":"*Amended 2026-10-21:* THE LOCAL INDEX READS WHERE LEARNING READS: one list, the Learning panel's - the Work projects' folders, the places listed and what they bring, the agents' records when listed. The Settings card \"Search your files\" is gone.","amended":true},{"type":"p","text":"*Amended 2026-10-24:* THE LOCAL INDEX GOES BY THE LEARNING'S CLOCK, AND IS KEPT SMALL (the user's decision). Measured on one machine, the index file was 2.4 GB and every start of the application walked 128,000 files again, taking minutes of the processor. Now it is brought up to date at the start of every learning update - Update now, or a time of the learning's clock (a time missed while the computer was off brings one when it is back) - with ONE SWITCH AND ONE CLOCK FOR BOTH; never when the application starts; a folder just added is read soon after, alone, while the switch is on. EVERY FOLDER IS WALKED ONCE AND ONLY ONCE: a folder inside another one indexed was walked on its own as well, and each walk took the other's files as new - read twice at every build; now it is walked with the folder it is in. A JSON file is read up to 200 KB (JSON was half of all that was read). A CONVERSATION RECORD IS KEPT AS WHAT WAS SAID AND DONE (`index/talk.py`): the user's words without what the tool put in their turn, none in a subagent's record; the agent's text replies, not its thinking; and each call as one line - the tool, the file changed or read with the lines in and out, the pattern, the page, a command's own description - never what was written, a command itself or what came back, only that it failed; a search shows that text. A record is bounded by what is kept of it (30 MB), not by the file: one of 1.3 GB keeps under 8 MB, and the longest records are the user's main work. The Learning panel shows the index's own bar beside the learning's - the share of the files the last build walked, the folder being read, or the file being made small - and the learning's says it waits for the index, rather than standing at 0%. When these rules change, the next build looks at each file again and reads again only what is now kept differently; and at the end of a build the file is written again without its free room (VACUUM) when that is more than a quarter of it.","amended":true},{"type":"p","text":"*Amended 2026-10-29:* WHAT A SEARCH SHOWS IS READ FROM WHERE IT IS (the user's decision). A search of the user's files took 16 and 81 seconds in a Work run, and the index was not why: it answered in half a second. Each piece found is shown as the file has it now, and for a conversation record that meant reading and converting the whole record to show six lines - the record was this very session's, 1.4 GB, 46 seconds every search, and the 81 also waited on a find_files going through seven virtual environments. Now each piece of a record is kept with WHERE IN THE FILE its first line comes from - the byte its turn starts at, and how many of that turn's lines come before it - and is shown by reading from there, a few turns: the same lines as read whole (306 pieces of that record compared, all the same), in under a twentieth of a second. A record is only ever added to, so where a turn starts stays where it is. An index made before reads each record again once, at its next build; until then, a record of more than 50 MB is shown by its name and line, not read whole. And a text file's piece is read up to its last line and no further - the index keeps data files of gigabytes, and one found was read whole for forty lines.","amended":true},{"type":"p","text":"*Amended 2026-10-24:* THE LEARNING LIST, AND LEARNING A TAB OF ITS OWN (the user's design). Beside the user's own folders, the learning reads ITEMS - a web page or site, a GitHub repository, a passage, a folder or a file - each the user's own (learned in full) or SOMEONE ELSE'S (learned as a reference they endorse, never as their own), with what to learn of it (cases, rules, a reference), the ANGLE it is learned from, its scope and how often it is read again (`learning/items.py`). The angle goes to the reading model: an emphasis for the user's own, the bounds of what is learned for someone else's - read with a prompt of its own into a case, the user's ENDORSED judgments (a new strength) and, when asked, rules ADOPTED from it (a new source of reason). The web is read only within an item's scope, public and signed in to nothing, robots.txt kept to; a page written to steer whoever reads it is set aside; the reading model has no tools and is told what it reads is material, never an instruction; small pages are kept as copies, large ones only as their address (`learning/online.py`). Items are added from the Learning tab, a \"Learn\" button beside Delegate work on selected text, and Explorer's \"Add to learning\" - each through a LEARNING PLAN drafted first, with what a reading costs (`learning/plan.py`) - and by the STATE HEARTBEAT, once a day, for what the user shows they endorse: the model judges the evidence (visiting is not endorsing; a statement counts only when it is certainly the user's), code holds that the evidence exists and names the thing (`learning/interests.py`). The first reading of the user's own work on the web and of what the heartbeat added waits for the user to keep it. Every lesson - project, folder, item - can be turned off (not read, nothing of it given) or deleted for good onto a NEVER LIST that nothing, the heartbeat included, adds back; the user can take an entry off it. Learning is a tab of its own, after Work.","amended":true},{"type":"p","text":"*Amended 2026-10-28:* WHAT IS HANDED OVER IS SPLIT BY THE MODEL, AND FOLLOWED (the user's design; `learning/sources.py`). A folder, a GitHub account, a repository or a site handed to the learning may hold several pieces of work, and whether it is one, and how it splits, is the model's to say - one way for all of them. CODE LISTS it as a tree of nodes, a level at a time and only as far as asked (a folder's folders, an account's repositories, a repository's top-level folders, a site's sections), each with its size, a peek (its README's start, its first files, its description) and what tells whose it is (its owner, a fork). THE MODEL JUDGES it in rounds - at most three - by one principle, given with examples and no hard rule: ONE PIECE OF WORK, OR ONE BODY OF REFERENCE ON A SINGLE TOPIC, IS ONE UNIT (a paper and the repository of its code are one; a library and its documentation site are one; nothing is split for size); each node is put in a unit, left out with why, or asked to be seen inside of. What it leaves out of all three is a unit of its own, unticked, for the user. A FOLDER OF THE COMPUTER, whatever its size, is mapped bottom up instead, by the measured engine its own folders are mapped by (`folders.py`), its units given the same way - one engine, so the same folder never splits two ways; at each update only what changed is summarised again (the user's decision; there is no size past which it switches). THE TOP LEVEL'S OWN CONTENT IS NEVER LEFT OUT OF A SPLIT: a folder's own files (read for themselves, not the folders in them), a repository's top-level files, a site's front page are each a node of their own, put with a unit, made one, or left out with why. THE USER CHOOSES in the plan: a line for each unit, ticked or not - a fork never ticked by itself - to join to the one above, split into its parts, rename, say whose; a part left out put back. Each unit kept is an item of its own (its other folders or addresses its `more`), learned and turned off on its own. FOLLOWED: at each learning update the source is listed again; a node new in it the model JOINS to the unit it belongs to with no question asked, or makes a NEW unit that waits in the Learning panel for the user to keep; a node gone is said gone, what was learned of it kept; a unit kept is never split again by itself. A whole source may be deleted, asked first: each of its items goes, onto the never list. A SITE THAT HOLDS IT BACK: each node is kept as it is listed, with its ETag (an unchanged listing asked for again costs nothing - GitHub does not count a 304), and each round of judgment is kept, so nothing is listed or judged twice. A site that says it is asked too often is not asked again before the time it gave; one that does not answer is waited for a while longer each time; one that refuses, a day (and is marked refused after three). The learning takes at most 40 of the 60 asks an hour GitHub gives one not signed in, leaving room for work and the user. THE DECIDED PARTS FIRST (the user's choice): what was judged before the site held it back is planned, and can be learned at once; what was not listed is listed when the site answers, and goes the way of anything new in it. A plan held back before anything was listed is finished when the site answers, and shown in the Learning panel to look at. THE DAY'S LIMITS, INPUT AND OUTPUT (the user's decision; as a Work run has two): learning reading and writing each have a limit a day, none by default; input counts what is read from the cache and written to it, each kind shown apart in the panel, as the Overview's Token usage counts them. A plan being drafted is held to them as an update is - one that reaches them waits for the next day, what was judged kept - and the plan says what drafting it took. Measured with a real model: a public account of fourteen repositories split in one round and one ask of GitHub, a library with its documentation repository and old website judged one unit, archived copies left out; one repository judged one thing; a folder of a paper, its figures and a second attempt at it judged one unit beside an unrelated one.","amended":true},{"type":"p","text":"*Amended 2026-10-29:* HANDED OVER, LEARNED AT ONCE - NO PLAN TO CHECK (the user's decision). Adding to the learning takes what to learn from - a web address, a passage, a folder or a file - and, if the user says it, what to learn of it, in their own words; then it starts. The plan is drafted as before and added as soon as it is ready, and reading begins (`Planner.on_ready`, `Learning._add_drafted`): a source that splits adds the units the model judged worth learning, each an item; one thing is one item. The user's words are each item's angle, verbatim, and the split is judged by them - a part they leave out is not learned. One held back - a site asking to wait, or the day's limit used up - is kept and added by itself when it may go on; with the limit used up and nothing to split, it is added as it is, its plan made without the model, and read when the limit allows. A unit found in a source at a later update is kept or not as the model judged, nothing waiting for the user. Selected text's Learn and Explorer's Add to learning go the same way. Everything added can still be changed, turned off or deleted in the list afterwards, and what is the user's own on the web, or added by the heartbeat, is still shown to them after its first reading before it is used. THE LEARNING PANEL: its settings on top - learning by itself and when, Update now, the day's limits, and the buttons to add - then what waits for the user, then what it learns from, what it has learned and what it spent, each folded until the user opens it.","amended":true},{"type":"p","text":"*Amended 2026-10-24:* A RUN CUT OFF LOSES AT MOST ONE ROUND (the user's decision). A version is still only a checkpoint - the contract approved, a full review passed, the run finished - but after every round the reviewer finds advanced a RESUME POINT is kept: the work's files, the agent's files in granted folders and where the run stood, as a version holds them, with no slides, not listed among the versions and no checkpoint the full review counts from. Only the latest of a line is kept, and only while it is after the line's head (a version saved since, or continuing from an older one, leaves it behind). A run the application closed on goes on from it - rolled back to it, the round it was in lost - and else from its last version. What no version and no resume point holds any more is removed from the run's version store (never anything written in the last half hour, and nothing at all when a version cannot be read); the work's own files are never touched by that. The single model keeps a version of each turn already.","amended":true},{"type":"p","text":"*Amended 2026-10-26:* A PROGRESS POINT EVERY TEN MINUTES OF WORK (the user's decision). Measured over 53 rounds of the user's runs, a round takes 27 minutes at the median and over an hour at the slowest quarter, and full reviews come further apart still - so a point only at a round's end left half an hour or more to lose. Now, besides the point after a round that advanced, one is saved in the middle of a round: after a tool of the work agent's has finished, once ten minutes of the run's own time (not paused, not waiting for the user) have passed since the last point or checkpoint (`PROGRESS_POINT_MINUTES`). It holds what the resume point holds, plus what the work agent did in the round so far; still the latest only, still not a version - the page shows it beside the versions as a progress point, *not checked*. A run cut off goes on from it, its round begun again and told what it had done (`MIDWAY`); a run stopped may be continued from it by the user's choice. Not one is saved while the reviewer works, and only one at a time.","amended":true},{"type":"p","text":"*Amended 2026-10-26:* WHAT DID NOT STOP CLEANLY GOES BACK (the user's rule). A run that stopped cleanly - wrapped up, at Stop or at a limit: it said where it was in its round and wrote its to-do list - goes on from where it stopped, its files as they are. A run that did not - cut off by the application closing, *stopped at once* by the user, or *failed* (`GOES_BACK`) - is Resume on the page, and goes back to its last save point: its latest progress point after its last version, else that version; what came after is given up (the user chose that over keeping a copy of it). Before, a run stopped at once while a model call was going ended as failed, which could not be continued at all (seen 2026-10-26: Stop, then Stop now, four seconds into the wrap-up); a run stopped at once between calls went on from files holding half a round nobody had said anything of; and a failed run could only be started again.","amended":true},{"type":"p","text":"*Amended 2026-10-28:* ONE BUTTON TO GO ON, AND WHERE FROM CHOSEN BESIDE IT (the user: Resume beside \"Continue from here\" read as two things). A run that has ended has one card in Work with one button, *Continue from here*, and a list beside it of where it goes on from. First is the most recent checkpoint: for a run that did not stop cleanly, its latest progress point after its last version (that version when it has none); for one that stopped cleanly, where it stopped; for a finished one, the finished work, which goes on only with what to do next. Then comes the progress point when it is not that, then every version, newest first, each going back to it as a new branch with the versions after it kept. The card says where the chosen one goes on from and what happens to the files; what to change, the packages, the sound and the sandbox are chosen on the same card. A version shown in the tree or the list, and the progress point's line, have no button of their own any more. A finished run that cannot go on from its latest offers its earlier versions alone. Elsewhere - a to-do's row, a way of the Work debugger - a run that ended is Continued too, never Resumed: *Resume* is left only for a paused run still going, which carries on from where it was held.","amended":true},{"type":"p","text":"*Amended 2026-10-27:* RESUME AT ONCE (the user: it seemed stuck a moment after Resume). A run going in a process of its own read what it was told twice a second, and the page, asking at once, was answered as before and drew Resume again until its next look. The child reads what it is told ten times a second and, having done something, writes where it stands at once with what it did; the agent waits for that - a second at most - before it answers, so what the page asks next is as it is now; and the button says \"Resuming…\" or \"Pausing…\" as it is clicked. A run being started in a process of its own - a Resume that rolls back thousands of files takes minutes - is among the runs going from the moment it is asked for, \"starting\", with what its process says it is doing every half second (\"rolling back to its progress point: 3,200 of 7,856 files checked\"), in Work's line and the to-do's; nothing to pause or stop until it goes. A rollback works out its folders' real paths once for all its files (`runtime.filesystem.remembering`, this thread's own, for that batch only): a file's check from 13 ms to 2.4. A progress point kept before its own line existed (a bare note, \"resume point saved\") is shown as one is now.","amended":true},{"type":"p","text":"*Amended 2026-10-27:* SETTINGS CHANGE WHILE IT RUNS, AND IT SAYS WHAT IT RUNS WITH (the user's decision). How packages are asked for (Ask or Auto, now Auto by default), the sandbox, the limits and the sound are changed in Work while a run goes, and are in effect from its next step - no pause, no Resume: each model call and each tool asks for them as it goes. The live session says the user changed them, and what it runs with is shown beside the session the whole time - its way, its limits, packages, the sandbox, the sound - and said as the first line of each session. What to do and the folders are not settings: they are taken at the next Continue. Two places hold settings, apart: the run's own, on a card at the top of its live session (\"Running with now\": its way, Python packages Ask first or Auto, the sandbox on or off, the sound at the end, its limits - each choice a lit segmented control), changed there and sent to the run at once; and Work's, for the next start or Continue, never sent to a run that goes. Work's settings are kept: they are what the work's latest run last ran with, changes made while it ran included, so the work opens again as it was left. Python packages are Auto by default for all work - a run that never chose, though it began when asking was the default, is Auto from its next session; one the user chose for keeps its choice; where the system cannot confine installs, each is asked all the same. Each run also offers its result to open beside its logs: what it handed over (an email in the user's mail, an event in their calendar, a file, a folder, text to copy) and what it made - the deliverables its deck lists, else its folder.","amended":true},{"type":"p","text":"*Amended 2026-10-24:* THE WORK FASTER, ITS JUDGEMENT UNTOUCHED (the user's decision, after the full way was measured slow). Four mechanical changes; nothing the reviewer judges or how strictly changes. (1) EDIT_FILE: part of a file changed in place - each old text, copied from the file, must be found in it exactly once, and the edits are applied all or none - under the same write rules as write_file; the work agent is told to use it rather than writing a whole file again or a script that patches it. (2) RUN_TESTS: a folder's tests run with pytest on a fresh copy of it; when EXACTLY the same tests already ran in this run - every file of the folder the same byte for byte (read whole, not told by its time; caches, the runtime's scratch, packages and versions aside), the same arguments, the same installed packages and the same Python - the result comes back at once, saying when it ran and who ran it (the work agent, the reviewer or the tester share one record); anything different, a run that timed out or was refused, a folder too large to read whole, or fresh=true, and the tests are run. (3) THE READING TOOLS SIDE BY SIDE: files, folders and searches asked for in one turn run together, at most four at once, and one at a time while the computer is busy as the work governor counts it (processors at 85% or memory short); writing, running code, jobs, installs and the web always run alone. (4) LOOKED UP AHEAD (the full way only): the cards a round opens have the reviewer's questions asked and what was learned found for them while the reviewer reviews that round - the same steps, kept as they always are for a card - and the next round writes their criteria from it if the card is still what it was, else looks it up again.","amended":true},{"type":"p","text":"*Amended 2026-10-25:* TESTS, AFTER TRY 6 WAS MEASURED (the user's decision): half the work agent's time went to running the work's own test suite and waiting for it. (1) The tests are told apart by what chooses and runs them - the files, the tests chosen (a file, -k, -m, -x, ...), the packages, Python - not by what only changes how the result is printed (-q, -v, -r..., --durations, colour, the cache): run_tests always runs with the whole report (each test's outcome, the 50 slowest), so the work agent's run is given to the reviewer however each asks. What a failure is shown with - the traceback style (--tb) and the locals (-l) - is given to the run: a result that passed is given again whatever was asked (it shows no failure), one with failures only to one asking for them as they were shown; otherwise the tests run again. A result given again says first that it is NOT A NEW RUN - who ran it, when - and that the tests can be run again (fresh=true): whoever reads it, the reviewer above all, runs them again when it judges it should - a test that may pass one time and fail the next, one that measures time, a result it doubts. A run's own folder (runs/run_\u003cid\u003e: its state and the reviewer's checks) is not the work: left out of the comparison and of the copy the tests run in. (2) The work agent runs the tests of what it changed while it works and the whole suite once, after its last change and before its summary - not after every change, nor twice; and goes on with what does not depend on a job while the job runs.","amended":true},{"type":"p","text":"*Amended 2026-10-25:* A TRY OF THE WORK DEBUGGER IS GIVEN THE USER AS THEY WERE WHEN IT BEGAN (the user's decision). A try runs for hours, and meanwhile the user's life is recorded and learned from as always - and it is about the try: the user reading a blind review of its ways, and which was better, was in their records within the hour and learned from at the next learning; searched by a way still going, after a restart, that is the answer given to the one being judged. So EVERY WAY OF A TRY - the single model, the way with no context, the full way alike - is given the user's records (its states, projects and stages) and what was learned of their work (its cases, judgments, reasons, references and word list) from ONE COPY made for the try with its start as the cutoff: the first start of any of its ways (`agent/work/as_of.py`, `Run._user_db`). Nothing written after it is in it - a state that began or ended after it, a case or a reason changed since, a judgment or a reference added since; a project rewritten since keeps only the folders it is worked in, which tell what is left out of the try, and none of its words. Its files the local index finds are given only when unchanged since. The copy is made when a way first needs it - one begun before there were copies, going again, is given one cut at its start - and lies beside the agent's database, where no way may read; forgotten when the try is removed, or all three of its ways cleared, so a try begun again is cut again. What the user took away since stays away: each time it is opened, what is no longer kept at all is taken out of it too, and a unit is held back as it is now; nothing is added. Without a copy, nothing of the user is given - never the database as it is now. Real work is given everything as it is now, as before.","amended":true},{"type":"p","text":"*Amended 2026-10-25:* EVERY RULE OF THE WORK DEBUGGER HOLDS FOR ALL THREE WAYS (the user's decision). What a way may not read - the other ways and tries, the agent's own code and data, the sessions kept of work in them, the folders left out of the project - and every call's reading sealed hold for the single model and the way with no context as for the full way; and whatever of the user any way is given comes from its try's copy above.","amended":true},{"type":"p","text":"*Amended 2026-10-25:* THE WORK'S COMMANDS, IN THE SANDBOX (the user's decision: the tools Claude Code has - a shell, jobs watched, helper agents, notebooks - given to the work's models, the sandbox kept). (1) RUN_COMMAND runs a command in a shell, as a terminal would - git, node, npm run, a build, a server: written to a script of its own in the work's runtime folder (no quoting to get wrong) and run by its shell from guarded code, so every rule of the sandbox holds for it and for all it starts - it writes only where the work may, reads what the work may, reaches no network, takes no input, and ends with the call or as a job. THE GUARD lets a program other than Python start only where the operating system alone keeps every rule - an AppContainer, Seatbelt or bubblewrap, with no network at all - exactly where a native library may load, which is the same power; never under Landlock, which cannot hide a folder, nor where the network is filtered by host name (the package installer); a Python child is still rewritten to load the guard. The tool is offered only there. ON WINDOWS THE SHELL IS CMD ALONE, measured in the AppContainer: Windows PowerShell cannot open its own file system there (the drive's root is not open to a container), so it starts no program and knows no folder; Git Bash's runtime does not start at all (0xC0000142); and cmd itself refuses a script named by its whole path, so it is named from the folder it starts in. The folders on PATH a command's programs are in that lie where sign-ins are kept (AppData - node installed per user, say) are made readable to the command each on its own, what is around them still shut. Its environment is the sandbox's own, clean - no key, no token - with the system's program folders, the per-user folders pointed into the work's runtime folder and every prompt turned off. (2) FETCHED OUTSIDE, RUN INSIDE (`agent/work/fetching.py`): a work's commands reach no network, so what it needs from it the agent fetches itself, outside the sandbox, and fetching is all it does there - nothing fetched runs outside. DOWNLOAD saves one https address that already exists (the same check as a page read, so nothing read can leave inside an address), at most 300 MB, never opened. GIT_FETCH clones a public https repository, shallow unless asked, with no configuration of the user's or the system's (no credential, helper, template or hook), no prompt, no submodule, no symbolic link, no protocol but https - and nothing is ever pushed; local git is the work's own, in its commands. INSTALL_PACKAGES takes npm too, as the user's package mode allows (asked first, or not): plain names and version ranges from the public registry only - an address, a git or file reference, a local path or an alias refused, in what is asked and in the package.json, and a lock that resolves elsewhere refused - npm run in a stage of its own holding only package.json and its lock (no configuration of the user's or the project's) with every install script off; a package that must build itself is built inside, by the work's own command (npm rebuild). node_modules, and the package caches in a debugger way's folder, are no part of a version. (3) WATCHED, NOT WAITED FOR: WAIT_FOR returns the moment a job ends, prints a line matching what was asked, a file appears or the work's own server answers (tried from inside the sandbox, where its loopback is) - on a job, until it ends; on a file or a server, at most five minutes a call, then it says it is still waiting; and every tool's result says which jobs ended since the last call (jobs_ended), so nothing has to be asked again and again. A tool that only waits takes no place among the tools. (4) EDIT_NOTEBOOK changes one cell of a Jupyter notebook - replaced, inserted or deleted, by number or id - everything else in the file as it was, a code cell changed losing its outputs; read_file shows a notebook as its cells, each with what it printed. A notebook is run by the work's command. (5) HELPER AGENTS: DELEGATE hands one task to a helper - a model of its own with the same tools but delegate, on the same sandbox and folders, under the same rules, with none of the asker's context but the task; it answers with a JSON object (done, summary, files_changed, open). An explorer only reads and searches; a worker may change files - one at a time - and is told another agent works on the rest. At most three at once, one while the computer is busy; in the background a helper is a job (waited for, watched and stopped as one). Its calls, tokens and limits are the run's, each a line of their own in the run's chart of calls (\"helper agents\"). The work agent's helpers explore or work; the reviewer's only explore; a helper has none of its own. Every way of the Work debugger has them all.","amended":true},{"type":"p","text":"*Amended 2026-10-25:* WORK WITHOUT THE SANDBOX (the user's decision; `agent/work/unconfined.py`). An option of the user's own work - each time it is started or continued, off unless chosen, with what it means written beside it - and never of a Work debugger way. Chosen, the work agent's calls and its helpers' (never the reviewer's, the tester's or the final checks') open the client's own tools: Claude Code's shell, file tools, web and agents run on this computer, as the user's account, from the work's folder. ITS PERMISSION SYSTEM STILL DECIDES: Claude Code runs in its \"auto\" mode with nobody to answer a prompt, so whatever would need a person's approval is refused at once; the model is told so and finds another way. A model with no tools of its own that the agent can hold back - Codex, whose own reading no hook reaches; a model reached by its API - keeps the sandbox's tools and is given RUN_OUTSIDE, which runs a command on this computer when a short judgment of it (a call of its own) finds it needs no approval - it changes or deletes nothing outside the work's folder, installs nothing, sends nothing out, leaves nothing running - and refuses it otherwise, the same way. NEVER, approved or not: the agent's own data, read or written; where sign-ins are kept (browser profiles, .ssh, cloud and tool credentials, the system's credential store), read; anything written out with the user's accounts (a push, a publish, an issue, a post, a message, an upload). Claude Code is held to it by its deny rules for its file tools and by a hook the agent answers before every command and file it touches; run_outside and every approval by the same check. A command's words are what is checked, and a command can be written to hide what it does: the client's own judgment (\"auto\") is the second line. ONLY WHEN EVERY OTHER WAY WAS TRIED may the model ask the user (REQUEST_APPROVAL): one exact command, why, and at least two other ways it tried - refused unless the run has seen something refused since it last asked. The run waits for the user (the live session shows the command, where it would run, why and what was tried); approved, the agent runs that command once, outside the sandbox, with the user's environment but its keys and tokens, and what it printed is the answer; denied, the model does not ask again - it works another way, or says what the user must do. Every refusal is kept with the run and said in its live session.","amended":true},{"type":"p","text":"*Amended 2026-10-25:* WHAT TRY 6 SHOWED OF COMMANDS AND JOBS (the user's decisions). (1) PYTHON STARTED BY A COMMAND starts as a program of its own, not through the guard, so it was without the guard's mending of a folder made with mode 0o700, which since Python 3.12.4 is shut on Windows to all but its user - and so to the AppContainer that made it: pytest's tmp_path failed (a PermissionError on its lock) and its old folders were never cleaned, two hundred of them. That mending alone is now given to it, as a sitecustomize first on PYTHONPATH that then loads whatever sitecustomize comes after it; nothing else of the guard, and no other program is touched. Measured in the AppContainer: a folder made 0o700 is the command's own with it, refused without it. (2) POWERSHELL, PWSH, GIT BASH, WSL OR SH called by a command - or asked for as its shell - is refused before anything runs, saying why and what to use instead (cmd's own commands, read_file, search_files, run_python), rather than the error it ends in, which explained nothing (a relative path taken as one under C:\\). A name only mentioned - searched for, echoed - is no call. (3) JOB_STATUS of a job still running says to wait_for it instead of asking again (half of the calls in try 6 only said \"running\"); and A JOB IS WAITED FOR ONCE: a second call of the same agent - job_status or wait_for - waiting on a job one of its calls waits on already does not wait, and is told so (seen: two calls in one turn, waiting 600 and 240 seconds on the same job). A helper's calls wait on their own. (4) WAITING ON A JOB LASTS UNTIL IT ENDS (the user's choice of the two ways offered: the other - the model ending its turn and woken when a job ends, as Claude Code's own background shells - asked more than it gave). wait_for on a job has no limit of its own: it returns when the job ends, however long - the job's own time bounds it - unless the model gives a timeout; on several jobs, when the first of them ends, saying which still run; and job_status is a look, its wait no longer capped. So a job is waited for in one call, not asked after every five or ten minutes - each asking a whole model turn, the context read again. Nothing cuts a long wait short: Claude Code's watch counts a tool at work as no silence, and its and Codex's tool timeouts are a day. A stop ends the wait at once; a pause lets it go on - the model is not running meanwhile - and holds its answer at the next safe point. What it costs: while it waits the model does nothing else (it is told to wait only when nothing else is left, and to wait on several jobs at once), its client stays open, and a job that never ends by itself - a server - is to be waited for by its \"ready\" line, not its end. (5) WHOEVER MAY START A JOB MAY WAIT FOR IT. The reviewer - and the tester - write nothing, but run code and tests, and so could start a job (run_tests with background=true) without being given job_status, wait_for or stop_job, which went with the writing tools: told to wait with a tool it did not have, the reviewer slept in run_python instead - time.sleep(270), then the time printed, again and again - 29 times in B's try 6, two hours in all, 15 times in C's, and never read the job's result. A job's three tools now go with run_python and run_tests wherever those are given; nothing else of the writing tools does.","amended":true},{"type":"p","text":"*Amended 2026-10-25:* NOT YET MEASURED. Git writing (a commit) and cmd with whole paths in a real work folder, in the AppContainer: the measurements were taken in a folder inside the application's own code, which a running debugger try seals - so its parents were shut and git refused; to be measured again when no try runs. Nothing was fetched from the network while these were built: download, git_fetch and npm are checked by tests with the network stood in for. Claude Code's \"auto\" mode and \"--permission-prompts none\" are as its own help says them; no call was made to try them. Codex is not installed on the computer they were built on.","amended":true},{"type":"p","text":"*Amended 2026-10-21:* A RULE IS THE USER'S ONLY ON EVIDENCE (`learning/authorship.py`). The two strongest kinds of evidence are held by code, not the model's say: \"a rule the user wrote\" only for a line of a rules file itself (CLAUDE.md, AGENTS.md - never a README) that is quoted and is the user's - a line an agent's edit put there (its `/init` among them) is the agent's, in a repository each line is its commit's (one signed as made with an agent is the agent's), and where nothing at all is known of who wrote a file its lines are no one's; any of those is at most what the user let stand. \"What an agent noted from the user's words\" only for an entry of an agent's memory whose source is found - the last thing the user said before the agent wrote it - else as something they said yes to.","amended":true}],"amendment_note":"2026-10-29: learning starts at once from what is handed over and what to learn of it - no plan to check; the Learning panel's settings on top, its contents folded. Earlier, 2026-10-28: one Continue from here, where from chosen beside it (most recent checkpoint, the progress point, any version); Resume only for a paused run. Earlier, 2026-10-27: settings changed while a run goes; Work's settings for the next start; Auto by default; light progress points, shown; Resume at once. Earlier, 2026-10-15: Russian, French, German and Italian added to the display languages - nine in all - and the whole interface shown in them from fixed tables (section 134).","amended":true},{"number":"119.3","label":"119.3","id":"s119-3","title":"Handing Work Over From Anywhere","page":148,"blocks":[{"type":"p","text":"*Modules: `platform_layer/explorer_menu.py`, `agent/work/handover.py`, `__main__.py` (`--delegate`), `ui/selection.py`, `ui/desktop.py`, `heartbeat/experience/store.py` (`mark_delegated`), `agent/work/delegate.py` (`output_folder_for`).*"},{"type":"ul","items":["**Explorer's right-click menu (Windows).** A \"Delegate work\" entry appears on files, folders and the empty part of a folder, labelled in the display language and with the avatar's face as its icon. It is written only under the user's own `HKCU\\Software\\Classes`, so no administrator is needed, and it is written again at every start so that the face and the words stay current. The uninstaller removes it (`--explorer-menu off`). When several items are chosen together, Explorer starts the program once for each of them (`--delegate PATH`). The first process leaves a note in `delegate_inbox` and waits 1.5 seconds while the others add their paths to it under a lock. It then starts the agent if the agent is not running and opens the page through a single-use sign-in link. The page *takes* the note, which reads and deletes it, and makes a draft from it. In the draft, a folder becomes one the work may change and a file is named in the request, with its folder as the place the work is done. The note holds only paths, and a note left untaken for an hour is discarded.","**A button beside selected text (Windows).** When the user finishes a drag of at least six pixels or a double-click, the focused control is asked what it has selected **through UI Automation**, the interface screen readers use. The clipboard is never touched and no key is pressed: Ctrl+C would overwrite what the user had copied, and in a terminal it would stop the running program. Password fields and the agent's own windows are never read. A small button appears for six seconds without taking the focus. The text is held in memory only while the button shows and is dropped when it disappears, unless the user clicks it.","**The avatar's menu** opens the box empty, for the user to say what they want done.","**The to-do list** on the front page has a delegate button on each item, which hands over that to-do's text."]},{"type":"p","text":"*Amended 2026-10-16:* A KEYBOARD SHORTCUT, Ctrl+Alt+D unless the user sets others in Settings \u003e Shortcuts, opens a QUICK DELEGATE WORK BOX, empty, on the screen at once, from whatever program is in front: the agent's own window, drawn as the avatar is, with a Title and a Description, Add folder and Add files, and Create - for the page's box, opened in a browser window of its own, took three and a half seconds of the browser starting before anything showed. Create makes the piece of work and opens the page on it, its context already being collected and its plan drafted; the title the user gave is the work's, said to the planner with the description and kept as the plan's title (and so its folder's name) in place of the one the planner would have given it. Nothing is read from the program that was in front. The keys are held with the system while the agent runs (Windows, RegisterHotKey): a combination another program already holds is refused and said so, and the keys before are kept; a shortcut needs Ctrl, Alt or Win, can be turned off, and goes back to its default with a button. The same page turns the button beside selected text on or off. On a Mac and on Linux the page says it is not available yet.","amended":true},{"type":"p","text":"Delegated work is listed under its own heading, **\"Delegated work\"**, in the Experience tab, separate from the projects the agent found from the user's activity."},{"type":"p","text":"*Amended 2026-10-26:* DELEGATED WORK AMONG THE REST, AND A TO-DO SAYS WHAT CAME OF IT (the user's decisions). Work's list of projects is in the order of their last activity, and the agent's own work on one counts: its latest run, by when it last moved - so work just delegated is at the top of the list, not, having no task of the user's, at its bottom; delegated work is marked \"delegated\" there rather than kept under a heading of its own. The list leaves out what is of LEISURE - a project whose tasks are all of leisure, the Overview's \"Leisure\" - which is no work to be done; a name is still looked up among them. A TO-DO HANDED OVER keeps the to-do's id with its work (`options.todo`), and the to-do says what came of it (`WorkDrafts.of_todos`, with `/api/todos`): \"Ongoing\" while its plan is drafted or waits for the user (which opens the plan again) and while the agent works (which opens it in Work); \"Open the result\" once its latest run is done - the deck's first deliverable still there, else its output folder, else the work's folder - opened in the program it opens with, except a file that would run as a program, which is shown in its folder; or where it stopped. Cancelled, it is as if it had never been handed over. Its Remove is a button beside Delegate work, asking \"Remove it?\" before anything goes.","amended":true},{"type":"p","text":"*Amended 2026-10-26:* QUICK OR THOROUGH - HOW A PIECE OF WORK IS DONE (the user's decisions). Not all work needs a builder, a reviewer and a contract: an email, a reply, a note is done as well by one agent told everything at the start. So EVERY BOX THAT STARTS WORK - Delegate work, from anywhere, and Add work on a project - offers two ways. QUICK: one agent on its own judgement, in its own loop until it says it is done - the single model of the Work debugger, but WITH THE USER'S CONTEXT: what was learned of how they work, for the job, given at the start (its terms and questions asked once, with no tools, and answered from what was learned, as a reviewer's are for a contract - kept with the run, so a run continued is given the same), and their own files, records and past cases and reasons to search; no contract, no cards, no reviewer, no slides; a version a turn; at its end THE PRIVACY CHECK ALONE - its quality is the user's to read; a README only when it made more than one file. THOROUGH: the builder and the reviewer, as before. THE PLAN SUGGESTS THE WAY, with one sentence of why, from what the work is - thorough when it is not sure - and the user chooses; no rule of the code's overrides either, as the user reads the plan before anything runs. The same box now holds the work's settings - the limits, how packages are asked for, a sound when it ends, without the sandbox - with Work's own defaults, or with what Work's own form was set to when it opened the box. A run goes on the way it began. TOO BIG FOR THE QUICK WAY, the agent stops and says why (status \"needs the thorough way\"), and CONTINUE THOROUGHLY - offered on every quick run not going - starts a thorough run of the same work, in the same folder, told what was asked, what the quick run made and reported, and why it needed more. Work's list and each run say which way it is.","amended":true},{"type":"p","text":"*Amended 2026-10-26:* ONE CLICK OR TWO, COUNTED (the user saw a double click on the avatar open two conversations). Tk's own double click breaks on any event between the two presses, and a click makes the avatar hop - the pixel under a pointer at its edge turns see-through and back, and Windows says the pointer left and came back between them; the second press was a single click again. And a single click waited 240 ms, half the system's double-click time, so presses 300 ms apart opened the chat and the Overview. Now the presses are counted (`DesktopAgent._on_click`): a second within the system's own double-click time (Windows' 500 ms unless the user set another) and within a few pixels of the first is a double click, whatever came between; a single click waits that long before it opens the chat; a drag is no click.","amended":true},{"type":"p","text":"*Amended 2026-10-26:* ONE BUTTON FOR A FOLDER OR A FILE, AND A HEADER THAT STAYS (the user's decisions). \"Add work directory\" is one button: Windows' own Browse for Folder, files shown in it (`chooser.choose_place`, `browse_folder_or_file`) - what is selected last is what is added, a file as a file (that file alone), a folder as a folder - each listed saying which it is. Where the machine has no chooser for both, the box asks which of the two first. Checked live in a process of its own: a file and a folder selected in it came back as each. The box's header, \"Delegate work\", stays at its top however far it is scrolled, and is where it is dragged from.","amended":true},{"type":"p","text":"*Amended 2026-10-26:* A SAVED DRAFT STAYS; REMOVED, NOTHING IS DELETED (the user's decisions). A draft once saved is opened again as it was saved, and CANCEL ONLY CLOSES the box - the draft stays as it was; Save as draft again keeps what changed. Only a box never saved is thrown away by Cancel. A draft, or a version of a to-do's work, may be REMOVED - always asked first (\"Remove V2?\" Yes / No): it is not shown again - in the to-do's work, in Work's drafts, and, started, its project not in Work's list (as Work's own Remove does) - and NOTHING IS DELETED: its files stay where they are. Not while it goes: it is stopped first (`WorkDrafts.remove`, `options.removed`, `/api/work/drafts/remove`).","amended":true},{"type":"p","text":"*Amended 2026-10-26:* NO CREATE: SAVE AS DRAFT, AND A BOX THAT FLOATS (the user's decisions). The Delegate work box has Start and SAVE AS DRAFT, no Create: Save keeps the box as it is - the instruction (taken as Create took it, the context then collected and the plan drafted meanwhile), where it works, the settings and the way chosen, the plan as changed (then the user's) - and closes; Work lists the DRAFTS saved, newest first, each to Open again (with all it was saved with) and start, or Remove (asked first); one started or removed leaves the list (`WorkDrafts.save`, `saved`, `/api/work/drafts/save`, `/api/work/drafts/saved`). THE BOX FLOATS: shown over the page, not in front of all of it - no dimmed backdrop, the page behind read, scrolled and copied from while it is open - and dragged by its title out of the way (the box of its own window, opened from Explorer or the selection, is that window).","amended":true},{"type":"p","text":"*Amended 2026-10-26:* WHERE IT WORKS IS THE USER'S TO SAY. Only what the user gives is where the work may change things, each listed in \"Where it works\", to take off: a FOLDER handed over (Explorer's Delegate work on a folder, Add work directory in the box) is worked in; a FILE handed over (Explorer on a file, Add files, Add a file in the box) is that file alone, changed in place - its folder is no longer opened by itself, which let the whole folder be changed when nobody asked. A single file is granted as a root of its own: the tools, the guard and the operating system's container (an entry on that file, inheriting nothing) let it be written and nothing beside it; the container's own home and its name are taken from a folder it writes, never from a file. Measured in the AppContainer: the file granted is written, the one beside it refused. Nothing the model says adds a folder: no tool grants one, the plan has none, and a folder it is pointed to as a reference is read, not written.","amended":true},{"type":"p","text":"*Amended 2026-10-26:* ONE PIECE OF WORK AT A TIME IN A FOLDER (the user's decisions). \"One run at a time\" was by project, and each version of a to-do handed over again is a project of its own: two versions given the same folder each changed it at once, the later over the earlier. Now, while work is going in a folder - paused too, as it will go on - no other work starts in it, nor in a folder inside it or around it (`WorkRuns.folder_in_use`, in `_busy`). A start the user asks for - Start, Continue, Continue thoroughly - is refused, saying which work is in the folder; a box whose folders, or whose project's, are in use does not offer Start, and says which work it waits for, asked again as the runs going change (`/api/work/folders/held`). A start that would go BY ITSELF waits for the folder instead: one waiting for room stays in the queue, saying what it waits for, while those behind it whose folders are free go on (`start_waiting`, `_folder_held`); one started before its plan was drafted waits, its to-do's version saying so, and goes once the folder is free (`_when_ready`). A run paused for the computer's memory and resumed by itself held its folder all along, so nothing else came in meanwhile.","amended":true},{"type":"p","text":"*Amended 2026-10-26:* WHERE IT WORKS, SAID AND OPENED (the user's decisions). The folders work is done in are chosen with the settings, before any plan (\"Where it works\": Add a folder, each taken off with its x), and go with Start at any step - a start that waits for its plan keeps them (`start_when_ready.folders`). A folder given is where the work is done: the run is told so in plain words - WHERE YOU WORK, the folders the user gave, worked in DIRECTLY, changing, adding to and fixing what is there, leaving alone what the work does not need changed - and its sandbox may write there: each is granted to the work (`work_folders`), and so is one of its write roots for the operating system's container, the guard in its code and its own tools alike. None given, it is told it makes what it makes in a folder of its own.","amended":true},{"type":"p","text":"*Amended 2026-10-26:* THE SETTINGS FIRST, AND START BEFORE THE PLAN (the user's decisions). The Delegate work box shows the work's settings - how it is done, the limits, packages, without the sandbox, a sound - from the moment it opens, under what was handed over and the instruction; the context collected and the plan come below them as they are ready, and nothing chosen in the settings is drawn over meanwhile. How it is done is \"As the plan suggests\" by default (the plan's way, shown with its why once drafted), or Quick or Thorough chosen. START MAY BE PRESSED AT ANY STEP: while the instruction is written (it is taken as Create takes it), or while the context is collected and the plan drafted - then the work starts once the plan is drafted (or could not be, and is written from what was handed over), with the plan as drafted and the settings as given, and nothing more for the user to approve (`WorkDrafts.start_apart` keeps `start_when_ready`, `_when_ready` waits for it; waited for again when the application starts). The box closes at once; a to-do's version says starting meanwhile; Cancel before it starts means it never does. Create stays, for a plan the user wants to check first.","amended":true},{"type":"p","text":"*Amended 2026-10-26:* A TO-DO HANDED OVER AGAIN, AND ITS WORK TRACKED (the user's decisions). Delegate work stays on a to-do however often it was handed over: each time is a VERSION of its own - V1, V2, ... in the order started, a cancelled one not counted - and a version after the first is named so, \"(V2)\", in Work's list and its folder (`WorkDrafts._next_version`, `options.version`). Bes
