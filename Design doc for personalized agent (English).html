d upper part of each bar. Calls made before learning and each kind of lessons had a name of their own are named when the database opens, once, and only where it can be told for certain: a learning's calls when every call in its window is its own and they come to what it counted; a lessons call by the one kind the engine processed that minute (`data_manage/storage/database.py`).","amended":true}],"amendment_note":"2026-10-15: every kind of work that still runs has its own colour; only parts removed from the application are Other - they had taken three of the seven colours, and what runs now was put in Other for them.","amended":true},{"number":"14.36","label":"14.36","id":"s14-36","title":"What Retrieval Costs, as the Library Grows","page":40,"blocks":[{"type":"p","text":"Removed. Retrieval timing and the library-wide search it measured were deleted on 2026-10-06. Nothing searches the library as a whole any more, so there is no retrieval cost to watch; what the model calls cost is shown by section 14.35."}]},{"number":"15","label":"15.","id":"s15","title":"Listener Module","page":69,"blocks":[{"type":"p","text":"Location:"},{"type":"pre","text":"./listener/"},{"type":"p","text":"The Listener observes user activity and converts it into normalized events."},{"type":"p","text":"The Listener must not perform high-level semantic interpretation."},{"type":"p","text":"Its responsibilities are:"},{"type":"ol","items":["Observe activity","Normalize activity","Timestamp events","Submit events to the raw event pipeline"],"start":1}]},{"number":"16","label":"16.","id":"s16","title":"Initial Listener Scope","page":69,"blocks":[{"type":"p","text":"The first version must support:"},{"type":"ol","items":["Browser activity","Filesystem activity","Application usage"],"start":1}]},{"number":"17","label":"17.","id":"s17","title":"Browser Activity","page":69,"blocks":[{"type":"p","text":"The Listener should capture browser navigation context."},{"type":"p","text":"At minimum:"},{"type":"ul","items":["Page title","URL","Browser name","Timestamp"]},{"type":"p","text":"Example:"},{"type":"pre","text":"{\n    \"event_type\": \"browser.navigation\",\n    \"timestamp\": \"...\",\n    \"application\": \"Chrome\",\n    \"data\": {\n        \"title\": \"Example Page\",\n        \"url\": \"https://example.com\"\n    }\n}"},{"type":"p","text":"Browser data collection implementation may differ across browsers and operating systems."},{"type":"p","text":"The architecture should therefore abstract browser collection from event normalization."}]},{"number":"18","label":"18.","id":"s18","title":"Future Browser Interaction Tracing","page":70,"blocks":[{"type":"p","text":"Detailed in-page tracing is not done. An earlier browser extension that captured page interactions - tab switches, clicks, forms, navigation sequences - was removed, together with its website integration and its web event types. What was on a page is known from reading the window in front (section 19.2) and from browser history."},{"type":"h","text":"Recording What Was Said"},{"type":"p","text":"The conversation itself is recorded, not only that a session happened."},{"type":"p","text":"Working through a coding assistant is where a large part of the user's thinking now happens. An agent that may read only the shape of that - which project, how long, how many exchanges - is guessing at the very work it exists to help with, and it will keep guessing however long it runs."},{"type":"p","text":"It is also the most personal thing this application holds, so every part of it is deliberate:"},{"type":"ul","items":["It stays on this machine. Nothing about it leaves","Unticking the assistant, or turning Assistant activity off in Settings \u003e Privacy, stops it at once","Switching it off stops it immediately, and **nothing said while it was off is picked up afterwards**. What was said while collection was off was said while collection was off","The parts of a transcript that are bulk rather than conversation - the assistant's own reasoning, tool calls, tool results - stay out unless separately asked for. They are long, they mostly restate the reply, and a tool result can be an entire file","A single turn is cut at a stated length rather than dropped, and says it was cut"]},{"type":"quote","text":"Transcripts are read forward from where reading last stopped, not re-read. A session that runs for hours is read once as it grows."},{"type":"h","text":"Which Conversations, Not Whether"},{"type":"p","text":"One switch for the whole machine is the wrong shape for this decision."},{"type":"p","text":"A coding assistant is used for everything its user does. On one real installation it had produced sessions in **31 separate projects** - the application being built, unrelated research, a ranking study, personal work - and the argument for recording what was said, that the agent should see the work it is helping with, does not apply to all of them equally. Offered only \"record everything said to any assistant anywhere\" or \"record none of it\", a user who wants the agent to understand one project has to hand it the other thirty."},{"type":"p","text":"So the recording is scoped, by three lists:"},{"type":"ul","items":["**which assistants** - ticked from what is installed. What is ticked is recorded; nothing ticked records nothing, and this list is therefore the switch. A separate on/off beside it would be two controls for one decision, and they can disagree - on with nothing ticked, off with everything ticked - where neither state reads as anything","**only these projects** - empty meaning all of the ticked assistant's projects","**never these projects** - checked last, so it overrides the list above"]},{"type":"p","text":"A line names a project, or a directory containing many, or a glob. Separators and case do not have to match what the user typed, because which slash they used is not a rule they should have to know. The exclusions being checked last is what lets a whole research directory be recorded with one project inside it held back."},{"type":"p","text":"An empty list of projects means no restriction. An empty list of assistants is not the same thing and must not be read as one: it is what the user leaves when they want none of this recorded, so unticking all of them records nothing. By default every assistant found on the machine is ticked, stored as `*`, so one installed later is included too."},{"type":"p","text":"The assistants are detected rather than typed. Naming one in a text box means knowing what the application calls it and being told nothing when the spelling is wrong, so the list is what was found on this machine and the choice is recognition rather than recall. An assistant that is known but not installed is listed as absent rather than omitted - an option that is quietly missing is one the user cannot reason about - and a name chosen elsewhere that this machine does not offer is kept rather than discarded."},{"type":"p","text":"The stored value remains a list of names, so what changed is the editor and not the shape every reader of the setting already expects."},{"type":"p","text":"The decision is taken per session, and each session event records which way it went. So a session that was seen but deliberately not transcribed is visible as such afterwards, rather than being indistinguishable from one the provider never noticed."},{"type":"h","text":"Not the Agent's Own Voice"},{"type":"p","text":"A session this application started is the agent thinking, not work done at this desk, and it is not recorded as activity."},{"type":"p","text":"The provider answers by running the coding assistant on this machine, and the assistant writes a transcript of every run into the same session store this Listener reads. So each model call came back a moment later as something that had happened at the user's desk: expanding a one-minute stretch of the browser once showed the agent's own background work - asking for keywords, asking what some raw activity meant, folding old records away - all filed under the browser, because the browser was the window in front while the agent worked in the background. (Those background jobs have since been removed; the problem holds for every model call the agent makes.)"},{"type":"p","text":"It is the loop section 39.1 closes for the agent's own writes, arriving by another road: there the agent heard its own files, here it hears its own voice. It is worse in one way, because interpreting that activity takes a model call, and that call's transcript is more activity. Measured on one installation, **888 of the 951 assistant events in recent history were the agent's own**."},{"type":"p","text":"It is told apart two ways, and either is enough:"},{"type":"ul","items":["**The session is named.** The provider chooses the session identifier before the run and marks it, so the transcript says whose it is wherever it is read. The identifier is the one thing that passes from the run to the transcript, and is still there when a later process reads it - which matters, because the transcripts outlive the process that made them and nothing in memory remembers them after a restart. The mark occupies part of an otherwise random identifier, so a user's own session can collide with it about once in four billion, and the cost of that is one session of theirs going unrecorded","**The session was run inside the agent's own storage.** Weaker, and the one that can be made about the past: it reads sessions recorded before there was a mark to read. Nobody runs a coding assistant inside the agent's storage on purpose"]},{"type":"p","text":"Turns already recorded from the agent's own sessions are skipped when transcripts are read and are not shown as the user's activity, because they never were. The agent's own calls also ask the assistant not to keep a session at all, so most of them leave nothing to skip."},{"type":"p","text":"A run must never reuse another run's identifier, and an unnamed run must not be silently allowed: both put the agent's own thinking back into the record of the user's day."},{"type":"h","text":"What the Extension Captured Is Content"},{"type":"p","text":"Removed. The browser capture extension was removed in October 2026, together with its website integration; conversations held in web pages are now seen only as screen text, read from the window in front (section 19.2)."}]},{"number":"19","label":"19.","id":"s19","title":"Filesystem Activity","page":71,"blocks":[{"type":"p","text":"The Listener should monitor local filesystem events such as:"},{"type":"ul","items":["Creation","Modification","Deletion","Rename","Move","Directory creation","Directory deletion"]},{"type":"p","text":"An event may contain:"},{"type":"pre","text":"id\nevent_type\ntimestamp\npath\nsource_path\ndestination_path\napplication\nprocess\nmetadata"},{"type":"p","text":"Example:"},{"type":"pre","text":"{\n    \"event_type\": \"filesystem.modified\",\n    \"timestamp\": \"...\",\n    \"data\": {\n        \"path\": \"/path/to/file\"\n    }\n}"},{"type":"p","text":"Listener permission failures must not terminate the entire Listener."},{"type":"h","text":"What Is Watched"},{"type":"p","text":"The monitor covers the user's own working space by default, not a location the user has to nominate before anything is recorded."},{"type":"quote","text":"A monitor watching only a directory the user never works in is indistinguishable, in what it records, from one that is switched off - but it reports itself as running."},{"type":"p","text":"The default scope is every drive on the machine (on Windows every existing drive letter, elsewhere the root). The user removes what they would rather it did not see, and may narrow, extend or replace the scope, but they must not have to configure it before the feature does anything; the shipped exclusions carry the churn."},{"type":"p","text":"Watching that much is only viable with exclusions, so the application ships them:"},{"type":"ul","items":["Operating-system and program directories, which are not the user's activity","Caches, temporary directories and trash","Dependency and build directories - installed packages, build output, virtual environments","Version-control internals","The agent's own internal directory, whose churn is the agent's, not the user's, and the agent's whole workspace, which holds only what the agents make"]},{"type":"p","text":"The shipped exclusions are defaults, visible and editable like any other setting, and the user's own exclusions are added to them rather than replacing them."},{"type":"p","text":"A directory that cannot be watched - it does not exist, or permission is refused - is reported as such, and does not prevent the remaining directories from being watched."},{"type":"p","text":"The volume this produces is the implementation's problem, not the user's: the monitor must remain responsive with a home directory of ordinary size, and where it cannot keep up it must say so rather than silently dropping events."},{"type":"h","text":"The Agent Does Not Hear Its Own Writing"},{"type":"p","text":"The agent keeps its memory in the workspace, and the workspace was once watched, on the reasoning that the user's own documents and downloads were kept there too. So every record the agent wrote, and every rebuild of the index it then had, arrived back as a filesystem event, became raw activity, and cost a model call to interpret. Measured on one day: **12,022 of 14,892 events** were the agent listening to itself, `index/state.json` foremost among them, which was rewritten every round."},{"type":"p","text":"That is a loop rather than an expense. Interpreting its own bookkeeping produces records about its own bookkeeping, which are files, which are events."},{"type":"p","text":"**The workspace is not watched at all.** It holds only what the agents make and keep - delegated work in `agent_work/`, the chat's files (kept per conversation in `Chat/\u003cconversation title\u003e/`), the memory library - and each work run writes from a process of its own, which no claim made in the main process could cover. What the user does with what was made is still seen by the window and screen listeners."},{"type":"p","text":"**Ownership, everywhere else.** Writes the agent makes outside the workspace - into a folder the user granted a work run, for example - are claimed for a few seconds so the watcher does not hear them as the user's. What distinguishes that noise is not where the file is but who wrote it, and the agent knows that at the moment it writes."},{"type":"p","text":"**And briefly.** A disclaimer lasts seconds. The same file the agent wrote this morning may be edited by the user this afternoon, and that edit is theirs; a permanent list of \"our files\" would suppress it for ever, where a short claim suppresses only the event the write itself caused."}]},{"number":"19.1","label":"19.1","id":"s19-1","title":"A Title That Is Only Being Animated","page":74,"blocks":[{"type":"p","text":"A window title that differs only in its decoration is the same title."},{"type":"p","text":"The Listener ends a period of focus when the title changes, because a changed title usually means the user moved to something else. But programs animate their own titles: a terminal running a task rewrites its title several times a second to spin a glyph at the front of it. Compared character by character, every frame is a different title."},{"type":"p","text":"The consequence is not cosmetic. One continuous hour of work is recorded as hundreds of stretches of a few seconds each, every one of them a separate row in the activity log, and the record of what the user actually did is destroyed at the point of collection."},{"type":"ul","items":["Leading decoration is stripped before two titles are compared","The decoration is identified by character category rather than by a list of known glyphs. The list of symbols people animate with is not one worth maintaining - an implementation that enumerated braille frames and half-circles met a star in the very next program","The same rule applies where titles are displayed, so a title is shown as what it says rather than as whichever frame it happened to be on","Data already recorded does not repair itself, so adjacent stretches of the same window separated by no more than a poll interval are shown as the one stretch they were"]},{"type":"quote","text":"A real gap is still a real gap. Going away and coming back is not a title animation, and must not be merged into a single stretch that claims the user never left."},{"type":"h","text":"Being Read Is Not Being Written"},{"type":"p","text":"The operating system reports a directory change for several different reasons - the content was written, the file was **read**, an attribute changed, the security descriptor changed - and the watcher library collapses all of them into one \"modified\"."},{"type":"p","text":"Recorded as written, a file the user only opened is a file they are told they edited. Measured on one machine: of 399 notifications, **four** were about a file written in the seconds before. The other 395 were files being *read*, reported up to an hour later, when the system got round to flushing the access time."},{"type":"p","text":"Which of the two it was is not in the notification, but it is in the file: content that changed has a new modification time, and content that did not, does not. So the two are told apart by remembering the shape of a file - its modification time and size - and asking, and the answer is recorded as a **different kind of event**."},{"type":"ul","items":["**Both are kept.** What the user opened is a thing that happened, and reading is most of what anybody does with a file. Dropping the notifications that are not writes would throw away the larger half of the record","A file heard about for the first time is a write if it was written in the last minute, and a read otherwise. The notification arrives in well under a second; an access is reported up to an hour late, so there is no overlap to get wrong","What is remembered is bounded, and the oldest goes first. A machine has more files than this is worth remembering about","The words are separate all the way through: the templater has its own verb for it, in every language it claims, so a memory about a file that was read does not say it was edited"]},{"type":"quote","text":"This also explains a failure that looked like something else. The rule that the agent's own writes are not activity works by claiming a path for a few seconds around the write - and it caught about one in a hundred, because most of what it was trying to catch were not writes at all, and the rest were reported long after any claim had expired. Ownership is the right test and it cannot be applied to a notification that arrives an hour late about something nobody wrote. The memory library, and now the whole workspace, is therefore excluded **by place**, which is honest for that directory: it holds nothing but what the agent and its runs make."},{"type":"h","text":"Only What a Person Did"},{"type":"p","text":"Watched across the whole disk, the record fills with what the machine does on its own."},{"type":"p","text":"Measured over twenty-five minutes on one installation: **3,499 file events, of which 2,950 were a single Windows registry hive log** - 84% of everything recorded, none of it anybody's work. The rest was a chat client's cache, a coding assistant's session files and its configuration, rewritten every few seconds. The file the user had actually opened in that window was not there at all."},{"type":"p","text":"Three things separate the user's activity from the machine's, and none of them is sufficient alone."},{"type":"p","text":"**Was a person there.** The one signal that says a human did something: how long since the keyboard or the mouse was last touched. A machine left alone goes on writing - hives, caches, sync clients, indexers - and recording that as the user's activity is not a small inaccuracy, it is most of the record. Applied to file events only: a page visited or a window brought to the front is already somebody doing something."},{"type":"quote","text":"A platform that cannot answer says so, and silence is read as **yes**. Refusing to record because we cannot tell would turn an unsupported platform into one that quietly monitors nothing, which is the failure this section exists to prevent."},{"type":"p","text":"**Which files churn regardless.** A directory exclusion cannot reach these: the registry hive log sits in the home directory itself, beside things worth watching. They are excluded by name, as patterns - hive logs, lock files, half-written downloads, editor backups, database journals, and a coding assistant's own configuration. What is on that list is noise on every machine, not a judgement about anyone's work."},{"type":"p","text":"**And whose change it was.** Being at the keyboard says *somebody* was working; it does not say that this particular write was theirs, because a background program writes while they work. What was in front when a file changed is the evidence for which of them it was, and it is **recorded rather than judged**: no rule here could tell an editor saving a file from a compiler writing one the user asked for, and a panel that says \"edited while you were in the editor\" or \"written while you were reading mail\" lets the reader tell them apart themselves."},{"type":"p","text":"That question is asked at most once a second. A burst of ten thousand file events must not become ten thousand calls into the window manager."},{"type":"p","text":"**And the strictest test.** A file change can be required to be about the window in front - its own name, or the name of a folder it is inside, appearing in the title. This is the only test here that speaks about *this* write rather than about the moment it happened in: a chat client's message index never appears in any title and never will. A folder above it counts, which is what saves a build started from a terminal whose title names the project and which writes a hundred files the title never mentions. A name of three letters does not count, because \"src\" and \"bin\" are inside half the titles on a machine. This window-title test is now part of \"Only what you did yourself\", which is on by default and asks about the moment the change happened, alongside the desktop's own record of opened files (see Whose Doing It Was)."},{"type":"h","text":"A Rule Added On Tuesday, And Monday's Records"},{"type":"p","text":"Excluding a file when it arrives does nothing about the days of raw activity already written down (eight are kept by default)."},{"type":"p","text":"Measured on one machine the day after the exclusions of this section went in: of **24,610 file events in the past day, 10,653 were `ntuser.dat.LOG2`** - a Windows registry journal, ten thousand writes in ten minutes, none of it anybody's work. Every one of them was recorded in the minutes before the rule existed, and every one was shown under Firefox, because Firefox was in front while Windows flushed its registry. Across the whole table it was worse: **50,784 of 54,309 stored file events, 93%**, were caught by rules that already existed."},{"type":"p","text":"So the same question - *is this a file that changes wherever it is, whoever is at the keyboard?* - is asked in three places by one function, reading one set of settings:"},{"type":"ul","items":["the **Listener** asks before recording, which is where it does the most good","the **Overview** asks before showing, because the panel is where the user meets the kept days that predate the rule","the **sweep** asks before deleting, for the same kept days"]},{"type":"p","text":"Asking it three different ways is how a filter and a panel come to disagree about what somebody did today."},{"type":"p","text":"### Showing And Deleting Are Both Needed"},{"type":"p","text":"Deleting alone leaves every rule that has not been thought of yet, and the panel would show its results until someone added one. Showing alone leaves the rows in the table, where the agent heartbeat reads them as part of its window and spends tokens on a registry journal."},{"type":"p","text":"The sweep runs in the raw-activity housekeeping loop, every six hours (the first five minutes after start-up), beside the prune by age, and is bounded: the database narrows by `LIKE` first - deliberately **wider** than the real rule, never narrower, because a basename match is not something SQLite will do - and the exact question is asked only of what comes back. A year of history is cleared over several rounds rather than one long one. On the machine above it took four: 19,876 rows, then 17,622, then 13,286, then nothing left to find."},{"type":"quote","text":"Getting that prefilter wrong is quiet rather than loud. Leaving folder rules out of it, the first version examined 14,763 rows out of the 50,784 its own rules would have caught, reported them all as swept, and looked entirely successful - everything excluded by **where it was** rather than by **what it was called** was invisible to the query and so was never asked about."},{"type":"h","text":"The Desktop Says So At Once"},{"type":"p","text":"The filesystem's account of a read arrives when Windows flushes the access time. The desktop's account arrives as the file opens."},{"type":"p","text":"Measured on one machine, for one file: the Recent folder had it at **17:10:35**, its access time said **17:11:17**, and the filesystem had still reported nothing three minutes later. The user, reasonably, said the agent had missed it."},{"type":"p","text":"So the record that is read as *evidence* about who opened a file - the Recent folder, `kMDItemLastUsedDate`, `recently-used.xbel` - is read as a *source* as well. What it covers, it covers immediately and with no inference at all: a program calling `open()` never enters it, so an entry appearing is a person having opened something."},{"type":"p","text":"**One opening is one event however many ways we hear about it.** The two timestamps for a single opening are close but not equal - the desktop stamps its shortcut when the application asks, the filesystem reports the access time when Windows flushes - so they are matched by nearness rather than equality, and whichever arrives first is the one recorded."},{"type":"p","text":"What this does not cover is the same gap as before: an editor that does not register what it opens leaves no entry, and neither does a command line. Those still wait for the filesystem. But the files a person opens **the way a person opens files** now appear while they are still looking at them."},{"type":"quote","text":"Paths are carried as the filesystem spells them. Normalising case is for comparing, and doing it at the source once put `readme.md` in front of somebody who had opened `README.md`."},{"type":"h","text":"A Thousand Files in One Second"},{"type":"p","text":"With the machine's own churn excluded and somebody checked to be at the keyboard, what was left was still mostly not the user."},{"type":"p","text":"A person opens one file at a time. A program walks a tree: a commit reads every file in a repository, a build writes a directory, a search touches everything under a root. All of it arrives while the user is plainly there, in a window that is plainly theirs, and every test above says yes."},{"type":"p","text":"Measured over two hours on one machine: of **16,721 file events, 40 arrived alone** in their second. 4,874 arrived in seconds holding more than a hundred. The busiest second held 1,076 - one commit. Recorded file by file, a tree walk is not a small error in the record; it is the record, and it buries the one file the user actually opened."},{"type":"p","text":"So how many happened together is itself the evidence. Events wait a second and are then judged in groups - measured from each event to the one before it, not by cutting the clock into seconds. A tree walk that starts at 11:59.998 is one tree walk, and dividing it at the boundary leaves a tail of three files that looks exactly like somebody opening three files; that was found by a test which failed about one run in ten - a handful is a person, since opening a file touches it and perhaps a lock or a backup beside it and saving touches two or three, while a dozen or more in the same second is a program."},{"type":"p","text":"Grouped by **the second the file was touched in, not the second we were told about it**. For a write those are the same; for a read they are not, and judging the arrivals as one batch would throw away every read there is - see below."},{"type":"ul","items":["The delay costs nothing. Nothing here is read as it happens; a second's lag on a record of what happened today is not a lag anybody can perceive","**That a sweep happened is counted**, even though its files are not. Dropping four hundred events without a trace would leave the record looking as though nothing occurred in a minute when a great deal did","Each window is judged on its own, so a sweep does not silence the work that follows it","What is still waiting when the listener stops is flushed, not dropped. Otherwise the last second of the user's day disappears every time the agent is closed"]},{"type":"p","text":"**And an event says what was in the file, not only that it moved.** A path and a timestamp say somebody touched `fetch.py`; they do not say whether they were fixing the rate limiting or reading it to remember what it did, and that difference is the whole of what a state is for. A read or a write of a text file now carries the beginning of it, bounded three ways, because this is the one provider that could turn a record of activity into a second copy of the disk: **how much of any one file** (twenty thousand characters, about eight pages - enough that a source file is whole and a paper recognisable), **which files are opened at all** (by suffix, because reading the first bytes of every file the operating system mentions in order to discover it was a `.dll` is the cost the list avoids), and **a setting that turns it off**, which can lower the cap and cannot raise it past the one in the code. An unbounded excerpt is not an excerpt."},{"type":"quote","text":"**A file whose name says it holds credentials is never opened**, and that check runs before the suffix one - `secrets.json` and `credentials.yaml` are text files by every test this code can apply, and `.env` is not in the suffix list at all, so putting the name check second skipped the commonest secret file for the wrong reason and left the event silent about why. The event is still recorded either way: that the file was opened is a fact about the afternoon, and it is recorded with the reason nothing from inside it was kept."},{"type":"h","text":"When a Read Happened, and When We Heard"},{"type":"p","text":"Windows keeps a file's last access time in memory and writes it to disk when it gets round to it. The notification comes with that write, not with the read."},{"type":"p","text":"Measured on one machine: three files read at 22:12:07 produced **no notification at all** in the following thirty-five seconds, while a single second - 03:02:35 - carried 47 files that had been read across the preceding hour. The lump is Windows flushing. It is not a person doing anything, and it is not the moment anything happened."},{"type":"p","text":"Dated by arrival, those 47 are all \"read at 03:02:35\", which is both wrong and useless: nobody opens forty-seven files in a second, and the hour in which they were opened one at a time is gone. The file itself knows when it was read, so it is asked, and the access time is what the event is dated by."},{"type":"p","text":"Two things follow, and both matter more than the timestamp:"},{"type":"ul","items":["**A burst is a burst of the moment it happened in.** Sixty files a program walked at 21:40 and four the user opened across the morning arrive together; by arrival that is one sweep and all of it is discarded, by the second each was touched in it is one sweep and four files somebody opened","**What is on screen now is no evidence about an hour ago.** An event dated further back than half a minute is not labelled with the window in front, because the alternative files a morning's reading under whatever happened to be open when Windows wrote"]},{"type":"p","text":"An access time from further back than six hours is not believed at all - beyond the flush it is describing something else, and a row dated to last Tuesday would land outside every window that would ever read it."},{"type":"quote","text":"This is a limit of the platform, not of the design: a file the user opens now appears when Windows says so, which may be within seconds or may be within the hour. **Writes are immediate.** What the user saves shows up at once; what they merely read shows up late, in the order it actually happened."},{"type":"h","text":"A Directory Reports Everything Inside It"},{"type":"p","text":"Windows reports a directory as modified whenever anything inside it changes. Writing one file therefore produced an event for the file and another for every directory above it - the same act, recorded two or three times."},{"type":"p","text":"Nothing ever read them. The Overview skips them, the templater discards them; they were a fifth of everything stored, carried through the filter, the database and the compaction to be dropped at the end by each reader in turn."},{"type":"p","text":"They are not mapped to an event type at all, so they are never emitted rather than emitted and discarded everywhere downstream, and the type is no longer declared as something the provider produces - a type nothing emits but every reader filters is a type everybody has to know about for no reason. A directory being **created**, renamed or deleted is still recorded: that is something the user did, not the contents reported a second time."},{"type":"h","text":"Whose Doing It Was"},{"type":"p","text":"Being at the keyboard says *somebody* was working. It does not say this file was theirs."},{"type":"p","text":"On a working machine it usually is not. An assistant, a build, a test run and a language server all read and write while the user sits there doing something else, and every test above says yes to all of it: a person is present, the files are not on any exclusion list, and the changes are spread out in time. Measured after the earlier filters were in place, the record was still mostly source files an assistant had read on the user's behalf - `templates.py`, `store.py` - which the user had never opened."},{"type":"p","text":"The notification cannot settle it. **On Windows it carries no process at all**, and the ways of getting one - ETW, object-access auditing, Sysmon - each need administrator rights and a permanent agent, which is not a reasonable thing to ask for a desktop application. So the question is answered from the side, by evidence that already exists."},{"type":"p","text":"**Two pieces, both positive.** Neither names an assistant, so neither needs updating when a different one is installed:"},{"type":"ul","items":["**The desktop's own record of what its user opened.** Every system keeps one for its own purposes - the Recent folder on Windows, `kMDItemLastUsedDate` on macOS, `recently-used.xbel` on Linux - and what makes it worth reading is what never goes in it. A program calling `open()` does not appear. Measured: reading three files from Python added nothing to the Windows Recent folder at all, while the files the user had opened in Explorer that evening were each there to the second","**The window that was in front at the moment it happened**, and whether its title was about this file. Every editor puts the filename in the title bar, which is what makes this work without knowing which editor it is; a folder above the file counts too, which is what saves a build started from a terminal whose title names the project"]},{"type":"p","text":"The two halves of that second test are not equally strong, and the weaker one has now failed **five** times. Each is worth naming, because every one of them was found in a real record rather than by reading the code, and because the shape repeats: **a string guaranteed to be in the title tells you nothing**, and each fix revealed the next guaranteed string."},{"type":"ol","items":["**A folder named after the application in front.** `extensions/browser/firefox/manifest.json`, recorded three times as the user's reading, because the title said \"Mozilla Firefox\" and one of its folders is called `firefox`. Firefox *was* reading it - as a program checking its own extensions, which is the exact thing the test exists to exclude","**The file itself named after the application**, the same clash arriving through the *stronger* test. Fixing the folder rule alone left it: the directory `.../browser/firefox` has `firefox` as its own name, so it matched as a filename and never reached the folder rule","**A title that is itself a path**, which has already named its file. Some editors put the whole path in the title bar, and the folder rule exists for the opposite case - a title naming only the project and leaving the file unsaid. Applied to a precise title it stops narrowing and starts vouching: with an editor showing `...\\personalized_agent_release\\HANDOFF.md`, a source file an assistant was editing and a file in an unrelated folder were both recorded as the user's","**A folder whose name names nothing.** `agent` - five letters, long enough to pass the length test, and inside \"Personalized Agent\". A source file an assistant was reading was recorded as the user's because its path contained a folder called `agent`. `src`, `docs`, `api`, `build` and their like are too common to be evidence and too useful to forbid as folder names, so they do not count towards this one test","**A name too short to mean anything** - the length test that the fourth slipped past"],"start":1},{"type":"p","text":"So a name **carrying an extension** is compared against the title as it stands, because `firefox.html` open in Firefox is a real file and its name appearing in full is evidence of its own. Everything else - a bare name, a folder - is compared against the title with the application's own name taken out of it."},{"type":"p","text":"The obvious worry about the first of these is the terminal: an assistant runs in one, and if its title named the project then every source file the assistant read would match a folder above it and be recorded as the user's work. Measured against eighteen hours of one machine's focus events, it does not. A terminal running an assistant shows the **conversation's** title - about the task, not about the tree - so the files it reads on the user's behalf match nothing. A terminal running a command the user typed shows that command, and the file named in it matches, which is also correct: they typed it. A file manager shows the folder it is looking at, and the files in that folder match, which is correct for the same reason."},{"type":"p","text":"Both say \"a person did this\". **Neither can say the opposite.** A file opened from a command line enters no Recent list; a moment before the agent started has no history behind it. So an absence of evidence is not treated as evidence, and anything that cannot be judged is kept - an agent that read silence as a refusal would quietly record nothing, which is the failure this section opens by warning about."},{"type":"p","text":"### Judged Again On The Way Out"},{"type":"p","text":"A rule improved here has to improve what is **shown**, or the panel goes on displaying what the Listener has by then learned not to record. Five fixes in one day, and each of them left the earlier records standing."},{"type":"p","text":"So the stored records are judged again when they are read, by the same function, and nothing is deleted to achieve it. Measured on one machine after the five fixes: of 172 stored file events carrying a window title, **170 stopped being shown** - and the two that remained were a file manager's window with the project folder open, which is somebody looking at their own files. The rest were an assistant's work on the machine."},{"type":"p","text":"Two reasons for showing rather than deleting, and the second is the important one:"},{"type":"ul","items":["most records cannot be re-judged at all. Of 3,542 file events kept on that machine, only 172 carried a window - the others predate the field. An event that cannot be judged is kept, which is the same answer the Listener gives","**the rules were still gaining a fix a day.** Deleting is a decision that cannot be revisited when the sixth failure turns up; filtering on the way out means every old record follows the rules as they stand, whenever they change"]},{"type":"p","text":"### What Was in Front, an Hour Ago"},{"type":"p","text":"The second piece needs a history, because the Listener only ever knew what was in front *now*. That is enough for a write, reported as it happens, and evidence about nothing for a read, reported when the access time is flushed up to an hour later."},{"type":"p","text":"Nothing new is sampled for it. The Application provider already emits an event whenever the window or its title changes, and those events pass through the manager on their way to storage, so the trail is fed from a stream that exists - a few thousand entries a day, held for the same six hours that a read's own account of itself is believed within."},{"type":"p","text":"It is fed **before** the privacy filter rather than after it. A window the user has excluded from being *recorded* is still evidence about who touched a file while it was in front."},{"type":"p","text":"### Where Each Platform Can Do Better"},{"type":"p","text":"Windows has no way to name the process without administrator rights. The other two do, and the design leaves room for it rather than levelling down to the weakest:"},{"type":"ul","items":["**macOS** has the Endpoint Security framework, which reports file events with the originating process attached - its identity, its code signature, and the *responsible* process, so a helper an assistant spawned is attributed to the assistant rather than appearing as an anonymous interpreter. It needs an entitlement from Apple, a signed application and the user's consent, which makes it a separate piece of work rather than a flag","**Linux** has fanotify, which reports the originating pid when it can be opened at mount-point scope. That needs `CAP_SYS_ADMIN`; without it the same code falls back to the general path"]},{"type":"p","text":"The general answer stays the same on all three, and a platform that can do better adds a layer rather than replacing one."},{"type":"h","text":"A Watcher That Stopped Says So"},{"type":"p","text":"Still an object is not still listening."},{"type":"p","text":"Watching a whole drive is the case that showed it: the notification buffer for a busy volume overflows, the emitter thread ends, and the observer goes on being an object with a root attached to it. The provider therefore reported **running**, **watching**, and no error, with its count frozen and nothing recorded at all - a monitor that is off and says it is on, which is the failure this section opens by warning about."},{"type":"p","text":"So the question asked is whether anything is still delivering, not whether an observer exists: the observer's thread and its emitters, each of which can end on its own. A root whose watcher has stopped is reported as stopped, and the reason says what to do about it, because \"stopped\" alone does not suggest the answer - the cause is almost always a directory too busy to watch, and the answer is to watch less of it."},{"type":"h","text":"A List Without A Period Is A Number Without Units"},{"type":"p","text":"Three hours of a browser is a morning or a fortnight depending on what the panel covers."},{"type":"p","text":"The Overview carried its window once, beside the total at the top, several panels above the lists it applies to. **Usage by application** is the panel people check against their own memory of the day, and by the time they reach it the period has scrolled away."},{"type":"p","text":"Every list drawn from that window now says so, beside its heading, in the window's own terms rather than the words \"24 hours\" - the period is a parameter, and a panel claiming a day while showing six hours is worse than one claiming nothing."},{"type":"p","text":"Marking one list and leaving the ones beside it bare would be worse than marking none: a reader takes the unmarked ones to be something else."},{"type":"h","text":"What Was Read, and What Was Written"},{"type":"p","text":"The Overview shows the recent file activity in the order it happened, with the two kinds apart."},{"type":"p","text":"This is a different question from the list of files worked on, which collapses everything about one file into a count and answers \"what has been worked on most\". This one answers \"what have I just been doing\", which is a sequence and has to keep its order."},{"type":"ul","items":["Repeated touches of one file in a sitting are **one row**, carrying how many and over how long. A file saved twenty times while it is being written is one stretch of work, not twenty things that happened","Coming back to it hours later is a second row, because that is a second sitting","Reading a file and editing it stay apart even when it is the same file in the same minute","A single touch claims no span, and a span of under a second is not reported as one"]}]},{"number":"19.2","label":"19.2","id":"s19-2","title":"What the Window Was Showing","page":71,"blocks":[{"type":"h","text":"WeChat on a Mac, Chats Read Often, and the Listener Debugger (2026-10-26)","amended":true},{"type":"p","text":"Merged from a contributor's change (pull request 7), with the user's choices where it differed from what was here.","amended":true},{"type":"p","text":"**What WeChat shows on a Mac.** *Amended 2026-10-27, measured on a Mac Studio (macOS 26.5, WeChat 4.1.15):* WeChat 4 gives Accessibility the same message list as on Windows - `chat_message_list`, one item a message with its words, its bubbles marked `chat_bubble_item_view` (a time is not), and the name as `current_chat_name_label` - so a Mac reads it as Windows does (`NativeReader.wechat_messages`, `wechat_items.parse_wechat_items`): WeChat's own words, whose each is from the window's picture (boxes in screen points turned to the Retina picture's pixels). On that machine five messages of five were placed right, both ways agreeing, in about 60 ms against Vision's 150. Where no list is given - an older WeChat - its window is read the way a picture is: by Apple Vision, in its accurate mode, Chinese and English, on the computer, in memory, within eight seconds (`platform_layer/window_ocr.py`). Accessibility is still asked first for every other window; Vision reads a window that gives fewer than forty characters. Secure fields, an Accessibility walk that did not finish, presence and the excluded applications all stop a reading before it starts; a window that loses the front while it is being read is thrown away, unless its picture was taken while it was in front - then the reading finishes, and the privacy checks are asked once more before it is kept. Pictures and documents are read by Vision too, as before (`platform_layer/ocr.py`): the change proposed Tesseract for both, and the user kept Vision.","amended":true},{"type":"p","text":"**Each message, not the whole window.** WeChat's reading is cut into what it is: the conversation's name from the window's top, and each bubble with its side - the user's on the right, the other person's on the left, unknown when it cannot be told (`platform_layer/wechat_layout.py`). The sidebar and the box being typed in are left out - and are not even read: the picture Vision is given is cut to the name and the bubbles (`prepare_wechat_ocr_cut`; on a drawn window, a fifth of its pixels), and what it finds is put back where it was in the window. Telling the bubbles apart looks at the picture's pixels with numpy at once, not one by one (measured 2026-10-26: 0.52 s a frame of 2000x1400 before, 0.37 s after, with the same answers). Each bubble becomes a message with its own local number, kept once however many times it is seen again (`data_manage/storage/wechat_store.py`, the `listener_wechat_*` tables); the text read is kept as it was read. Simplified and traditional characters are not folded together: OpenCC is no dependency (the user, 2026-10-26) - the words WeChat gives on Windows never vary, and a recognizer reading one character in the other script is rare beside its other mistakes, which the matching of messages already allows for. At worst a message read so is kept twice. Where OpenCC happens to be installed, it is used. These are what the screen showed, not WeChat's records: when a message was seen is not when it was sent, and the right side is the user's bubble, not proof of who wrote it. `docs/wechat-conversation-format.md` has the tables and the matching rules.","amended":true},{"type":"p","text":"**WeChat on Windows and on Linux, message by message too** (the user, 2026-10-26: the whole window as one text was less than a Mac gives). *Windows* (`platform_layer/wechat_items.py`, `window_text.WindowTextReader.wechat_frame`): WeChat 4 gives UI Automation its message list - automation id `chat_message_list`, one item a message named with its exact text - and the conversation's name (`...current_chat_name_label`); never the box being typed in (`chat_input_field`). Every item spans the whole list, so whose it is comes from the picture: in the item's band, the bubble's fill - green on the right for the user's, grey or white on the left for the other person's - or, for a photograph or a file, the avatar at one edge. The words are WeChat's own, not recognized. Asked with the reading thread made DPI aware, Automation's boxes are the picture's pixels (measured: not aware, they came scaled by 1.75). Measured on the user's machine, dark mode: four messages, all four sides right, two times left as nobody's; a read about 0.4 s. A WeChat without that list is read as any other window. *Linux* gives no window's words at all, and the agent reads none there - except WeChat's (`platform_layer/linux_wechat.py`): its picture, cut to the name and the bubbles, read by RapidOCR line by line with each line's box, and told apart as on a Mac. RapidOCR comes with adding Chinese or English for reading pictures; on X only, as Wayland gives no window's picture. Not yet tried on a Linux machine.","amended":true},{"type":"p","text":"**Chats, mail and social media read often - on every platform** (`listener/providers/fast_reading.py`). What passes in a chat or a mailbox is gone in seconds, and reading every few seconds every window would cost too much. So while a chat, a mail application, or a browser tab whose title says it is web mail, a chat or a social site is in front, its window is **looked at** every 3 seconds - a small picture of it and a 64-bit fingerprint - and **read** only when the picture changed. The looks slow to every 5 seconds after 30 seconds unchanged, and are back to every 3 at a change or at typing (how long since a key was pressed, never which key). A read is never overlapped by the next look. Reading may take at most 25% of one core over half a minute; past that, every 5 seconds until it is under again; on battery, never more often than every 5 seconds. Every other window keeps \"How often to look\". The lists of applications and titles, the pace, the budget and the battery floor are settings. The user asked first for every second, then for 3 seconds at the fastest: every second was too often.","amended":true},{"type":"p","text":"Measured on a Windows machine (2026-10-26): a look at a 2560x1356 window, about 0.12 s; a read of WeChat's window through UI Automation, about 0.42 s - two thirds of it spent inside WeChat answering - and reading it every second cost 12% of a core in the agent and 26% in WeChat. Looking first and reading only on a change is what keeps the cost to what changes.","amended":true},{"type":"p","text":"**The Listener debugger** (debugger builds only) shows, without turning anything on and without asking any model: whether each source runs, what each application gave and when reading it last failed, what the filters turned away, the records actually kept, and WeChat's conversations - numbered, never named - with their messages as JSON (`/api/debugger/listener/wechat/...`, which the installed build does not have). A screenshot is let past the excluded folders only when the screenshot source itself vouches for it and it lies in the agent's own pictures folder.","amended":true},{"type":"p","text":"**Not taken:** the change brought back private mode, which was removed in October 2026; it stays removed.","amended":true},{"type":"p","text":"Reading what is in front cannot promise every message: windows behind, messages scrolled past between two looks, and a black picture from a refused screen recording are not covered.","amended":true},{"type":"p","text":"Every other provider records **that** something happened. None records what was in it."},{"type":"p","text":"A desktop already publishes what its applications are showing, so that a screen reader can speak it. The same interface answers a question the agent cannot answer any other way, and it answers section 19's question for free as a side effect: what is on the screen in front of somebody is theirs by definition. An assistant reading a thousand files in the background appears in no window at all."},{"type":"h","text":"The Number That Made It Look Impossible"},{"type":"p","text":"`FindAll` takes a scope. `TreeScope_Descendants` is **4**; `TreeScope_Children` is 2."},{"type":"p","text":"Passing 2 returns a handful of shell elements and no content, from every application, with no error at all. Measured before the mistake was found: a text editor with a file open exposed **5 elements and 26 characters**, a browser showing a page exposed 34 elements and 42 characters, and the conclusion drawn from it was that the approach did not work on this platform. After: the editor exposed **61 elements and 951 characters**, including the text of the file."},{"type":"p","text":"The lesson is not about a constant. A wrong answer that arrives without an error, from every application, looks exactly like a fact about the world - and the way it was caught was a control: an application that certainly *does* expose its text. When Notepad returned nothing either, the reading was wrong rather than the platform."},{"type":"h","text":"What It Costs, and Therefore How It Is Done"},{"type":"p","text":"The cost follows the **number of elements**, not the amount of text. Measured on one machine:"},{"type":"p","text":"| | elements | walked | asked for documents |"},{"type":"p","text":"|---|---|---|---|"},{"type":"p","text":"| terminal showing 19,000 characters | 22 | 32 ms | 68 ms |"},{"type":"p","text":"| browser showing a busy page | 8,880 | **1,827 ms** | **294 ms** |"},{"type":"p","text":"| file manager | 223 | 179 ms | 287 ms |"},{"type":"p","text":"So a document-shaped element is asked for its text first - one call for the whole page - and walking every descendant is the fallback, capped at four hundred. The file manager is why the fallback exists: its list of files is a hundred names and not one text pattern between them."},{"type":"h","text":"Only What Is On The Screen"},{"type":"p","text":"A browser keeps **every open tab** in its tree. Asking a window for its documents returned twelve tabs and 64,371 characters, of which the user was looking at 1,617; one of the other eleven was a mail inbox that happened to be open behind it."},{"type":"p","text":"Elements the platform marks as offscreen are skipped, which brings that back to the one tab in front. This is not an optimisation - reading the other eleven is reading things the user is not looking at, which is not what was asked for and not what anybody would expect."},{"type":"h","text":"What Keeps It From Being A Keylogger With Extra Steps"},{"type":"p","text":"**It is on by default.** That is a product decision and its consequence is worth writing down rather than discovering: somebody who installs or upgrades begins recording the contents of their windows without doing anything. What has to make that defensible is everything that narrows it, and each of these is load-bearing:"},{"type":"ul","items":["**Only the window in front, and only while somebody is at the keyboard.** A machine left alone still has a window in front of it","**Never a password field.** The platform marks them, and a marked element is skipped wherever it appears","**A list of windows never read at all**, matched against both the application and the title - password managers, private browsing, authenticators, banking. This list matters more than any other in the Listener: a filename recorded by mistake is a filename, and a window recorded by mistake is everything that was in it","**Only what changed**, so a page left open is recorded once rather than several hundred times","**One switch stops it**, in the same place as every other category, and it is the first one anybody will reach for"]},{"type":"p","text":"The default list cannot be complete, and it is worth being plain about what it is: a set of words that catch the obvious cases on any machine. It does not know which of *this* user's windows they would not want written down. That is the setting immediately below it, and it is the one to look at before deciding whether the default above is right for a given installation."},{"type":"h","text":"Two Windows That Are Not The User"},{"type":"p","text":"**Its own.** Section 19 already says the agent does not hear its own writing, and reading the screen gives it two new ways to. Its desktop window is the certain case and is recognised by the process rather than the title - the user names the character, so there is nothing in the title bar to match on. Its interface in a browser is a tab like any other, and the application's name in the title is what there is to go on."},{"type":"p","text":"Without this, a record of somebody's day fills up with the agent's own summaries read back to it, which is a record of nothing."},{"type":"p","text":"**A terminal running an assistant**, which is kept, on purpose, and the reasoning is worth writing down because the conclusion looks like an oversight."},{"type":"p","text":"An assistant runs in a terminal, the terminal is in front, and what it writes there looks exactly like something the user is reading - which it also is. It cannot be told apart from the user's own work in a terminal by looking at processes: measured on one machine, `claude.exe`'s parent is `cmd.exe` and its grandparent is `explorer.exe`, while the terminal window's own process has **no descendants at all**, because Windows Terminal hosts its shells through ConPTY rather than as children. The only signal left is the window title, which an assistant sets to the name of the conversation - and matching on that means keeping a list of assistants, which is exactly what the rest of this section is built to avoid."},{"type":"p","text":"So it is recorded. The same conversation also reaches the Assistant provider, which reads it from the assistant's own transcript with the speakers marked, so the overlap is between a precise record and a rough one covering the same ground. Reconciling them belongs to whoever reads them, not to a guess made here."},{"type":"h","text":"Only What Changed"},{"type":"p","text":"A page left open is read every few seconds and is the same page every time. Measured: five readings of one browser tab produced **one record and four findings of no change**."},{"type":"p","text":"So what is stored is the lines that were not there at the last reading, and returning to a window after half an hour starts a new sitting rather than being compared against what it said before lunch. Without this, a record of a day's reading is the same thousand words written down several hundred times."},{"type":"h","text":"Reading Is Continuous, Events Are Not"},{"type":"p","text":"Every other provider records something that happened once - a file changed, a window came to the front - and one event is the natural unit of it."},{"type":"p","text":"Reading is not like that. Sampled every few seconds it turns one person reading one page into a hundred events, each a few lines long, and **each of them needs a model** to be understood. Window contents cannot be summed up by their fields the way a path or a duration can: \"firefox.exe showed 1,617 characters\" is not anything anybody wants - the application and the title are already recorded by the Application provider, so a screen reading without its words is nothing at all."},{"type":"p","text":"Measured on one machine: **133 readings over eleven minutes produced 98 events, about 535 an hour** - more than a heartbeat window can usefully carry. Screen sittings are read by the agent heartbeat's steps within their window."},{"type":"p","text":"So what is read is gathered into a **sitting** and reported once. A sitting ends when:"},{"type":"ul","items":["the user switches windows - the clearest signal that a stretch of reading is over, and it keeps the record one stretch per window rather than two interleaved","enough has been gathered to be worth a record on its own","it has been held too long, so that somebody reading slowly does not have their whole afternoon arrive in one lump when they finally switch away","the agent is closing, because what they were reading then is the part of their day most likely to matter"]},{"type":"p","text":"The same words reach the record; there are simply far fewer records carrying them, and each one is a stretch of reading rather than a five-second slice of one. The newest title is the one kept: a browser tab that has been navigated is still the same sitting, and where it ended up is the useful half of where it was."},{"type":"quote","text":"Looking less often helps in the same direction and is the cheaper lever - fifteen seconds rather than five - but it is not a substitute. Sampling alone still produces one event per sample; gathering is what makes the number of events follow the number of *things read* rather than the length of the day."},{"type":"h","text":"Where It Works, And Where It Does Not"},{"type":"p","text":"Terminals and browsers give up everything; editors and file managers give up what they show; **a self-drawn interface gives up nothing at all**, and no amount of work here changes that - the application has no accessibility tree to read. On the machine these measurements come from, a chat client returned 65 characters, all of them the names of its own window classes."},{"type":"p","text":"This is the honest limit of the approach and it is worth stating plainly rather than discovering later: the record will be complete for some of what somebody does and empty for the rest, and which is which is decided by the applications, not by the agent."},{"type":"quote","text":"On Windows this needs `comtypes`, which generates its bindings from a type library the first time it is asked. A frozen application cannot write inside itself, so the generation happens at packaging time; without it the capability reports itself unavailable rather than failing, in the ordinary way of section 27."}],"amendment_note":"2026-10-26: pull request 7 merged as the user chose - WeChat read by Apple Vision, message by message, on Windows and Linux too; chats, mail and social media looked at every 3 s and read on a change; the Listener debugger.","amended":true},{"number":"19.3","label":"19.3","id":"s19-3","title":"Reading What Has Not Changed","page":71,"blocks":[{"type":"p","text":"Asked whether the agent had become slow and whether C would help, the honest way to answer was to measure. What the measurements found was three of the same mistake, and none of them was about how fast a line of code runs."},{"type":"p","text":"| | one call | how often |"},{"type":"p","text":"|---|---|---|"},{"type":"p","text":"| summarising assistant transcripts | **4.4 s**, 557 MB read | every 120 seconds |"},{"type":"p","text":"| counting the library | 0.4–1.1 s | every status poll, every Memory tab, every heartbeat round |"},{"type":"p","text":"| the Memory tab | 1.7–3.6 s | it asked for the count **twice** in one request |"},{"type":"p","text":"(The Memory tab has since been removed; the library count is still read by the status poll and the Debugger.)"},{"type":"p","text":"**Summarising a transcript means parsing every line of it as JSON**, and a poll re-read every transcript from the last thirty days to find out whether anything had been added. 2,277 files, 557 MB, four and a half seconds of a core, every two minutes - to learn that almost nothing had changed. A transcript only ever grows, so its size and modification time together say whether the copy already read is still the whole of it. The same pass now takes **267 ms**, and one `stat` answers both questions asked of each file: old enough to skip, and changed since it was last read."},{"type":"quote","text":"A directory's clock is coarse, and relying on it alone was wrong in a way a test caught rather than a reader: six files written in a loop moved it **four** times, because its resolution is a millisecond or two and writes inside one tick are one tick. A round that writes three records would have added three files the count could not see. So the library says so itself when it writes or removes one, and a short expiry catches what changed outside this process inside the same tick."},{"type":"p","text":"**Counting the library walked every file.** `Path.is_file()` is another `stat` per entry, and a directory entry already carries the answer - so the walk itself was twice the price it needed to be. But the walk did not need repeating at all: a folder's modification time moves when a file is added to it or removed from it, and stands still when one is merely rewritten, which is exactly the distinction a count needs. **Five stats replace seven thousand**, and the answer is never stale rather than being stale for a bounded time."},{"type":"h","text":"Would C Have Helped"},{"type":"p","text":"No, and the measurements say why. The 4.4 seconds was reading half a gigabyte and parsing it; the 0.4 to 1.1 seconds was seven thousand filesystem calls. Both are work the machine does in the kernel or on the disk, and a faster language pays the same price for them. What made them go away was **not doing them** - the same thing that made every earlier optimisation in this document work:"},{"type":"ul","items":["asking a browser for its documents rather than walking 8,880 elements: 1,827 ms to 294 ms","narrowing the Recent folder by time before sorting and parsing it: 220 ms to 13 ms","writing a query the index can serve instead of one it cannot: 480 ms to 120 ms","excluding what should never have been recorded: 54,309 stored file events to 3,525"]},{"type":"p","text":"A rewrite is worth considering when a profile points at a function that is genuinely computing something. Nothing here was. The shape of this program - waiting for a model, waiting for a disk, waiting for another process across COM - is one where the language is rarely the limit, and where the thing to look for is work that is being done more than once."}]},{"number":"20","label":"20.","id":"s20","title":"Application Usage","page":72,"blocks":[{"type":"p","text":"The Listener should capture application usage."},{"type":"p","text":"At minimum:"},{"type":"ul","items":["Application name","Application identifier where available","Foreground/focus state","Activation time","Deactivation time","Foreground usage duration"]},{"type":"p","text":"Where permitted, the system may also collect:"},{"type":"ul","items":["Active window title","Process identifier","Executable identifier"]},{"type":"p","text":"The system must not assume that every operating system exposes identical metadata."},{"type":"h","text":"The Current Period Counts, and a Refusal Is Not Silence"},{"type":"p","text":"The Overview must count the application's current focus period up to the time of the request; it must not wait for the user to switch applications before showing that time. A period that is still running is still time spent, and an interface that shows it as nothing is wrong about the thing the user is doing *now*."},{"type":"p","text":"If the operating system refuses the foreground-application query, the Listener must say so in its status rather than present an empty activity history as though no activity occurred. An empty history and a refused permission look the same on screen and are not the same thing: one is a quiet day, the other is a setting the user can fix."},{"type":"p","text":"**Current activity does not wait behind churn.** There is no backlog: each heartbeat reads the window since the last one, whole, and a window too large for one review is read in turns, oldest first."}]},{"number":"21","label":"21.","id":"s21","title":"Normalized Listener Event Model","page":73,"blocks":[{"type":"p","text":"All Listener implementations must produce a common event representation."},{"type":"p","text":"Recommended conceptual schema:"},{"type":"pre","text":"ListenerEvent:\n    id: str\n    event_type: str\n    source: str\n    timestamp: datetime\n    application: str | None\n    data: dict\n    metadata: dict"},{"type":"p","text":"Example:"},{"type":"pre","text":"{\n    \"id\": \"event_...\",\n    \"event_type\": \"application.focused\",\n    \"source\": \"application\",\n    \"timestamp\": \"...\",\n    \"application\": \"Visual Studio Code\",\n    \"data\": {},\n    \"metadata\": {}\n}"},{"type":"p","text":"The exact serialization format may change, but the normalized abstraction should remain stable."}]},{"number":"22","label":"22.","id":"s22","title":"Listener Provider Interface","page":74,"blocks":[{"type":"p","text":"The Listener must provide a generic extension interface."},{"type":"p","text":"Conceptually:"},{"type":"pre","text":"from abc import ABC, abstractmethod"},{"type":"pre","text":"class ListenerProvider(ABC):"},{"type":"pre","text":"@abstractmethod\ndef start(self) -\u003e None:\n    ..."},{"type":"pre","text":"@abstractmethod\ndef stop(self) -\u003e None:\n    ..."},{"type":"pre","text":"@abstractmethod\ndef get_status(self) -\u003e dict:\n    ..."},{"type":"pre","text":"@abstractmethod\ndef supported_event_types(self) -\u003e list[str]:\n    ..."},{"type":"pre","text":"@abstractmethod\ndef get_capabilities(self) -\u003e dict:\n    ..."},{"type":"p","text":"Listener Providers should emit events through a shared event interface."},{"type":"p","text":"For example:"},{"type":"p","text":"emit(event: ListenerEvent)"},{"type":"p","text":"Providers must not directly modify Data Management storage or the memory library."}]},{"number":"23","label":"23.","id":"s23","title":"Listener Manager","page":75,"blocks":[{"type":"p","text":"A central Listener Manager should manage providers."},{"type":"p","text":"Conceptually:"},{"type":"p","text":"Listener Manager"},{"type":"pre","text":"|\n+-- Browser Provider (history)\n|\n+-- Filesystem Provider\n|\n+-- Application Provider\n|\n+-- Screen Text Provider\n|\n+-- Screenshot Provider\n|\n+-- Assistant Transcripts Provider\n|\n+-- Application Integrations (e.g. VS Code)"},{"type":"p","text":"Responsibilities include:"},{"type":"ul","items":["Provider discovery","Provider initialization","Provider configuration","Starting providers","Stopping providers","Health checks","Error isolation","Event routing"]}]},{"number":"24","label":"24.","id":"s24","title":"Listener Plugin System","page":76,"blocks":[{"type":"p","text":"Future Listener functionality should be installable through a stable extension model."},{"type":"p","text":"Each plugin should describe:"},{"type":"p","text":"Plugin ID"},{"type":"p","text":"Plugin Version"},{"type":"p","text":"Supported Platforms"},{"type":"p","text":"Supported Event Types"},{"type":"p","text":"Required Permissions"},{"type":"p","text":"Configuration Schema"},{"type":"p","text":"Start"},{"type":"p","text":"Stop"},{"type":"p","text":"Status"},{"type":"p","text":"Capabilities"},{"type":"p","text":"Example:"},{"type":"pre","text":"listener/\n    integrations/\n        ingest.py      (ships: the signed ingest for application integrations)\n        custom_app/    (a third-party module exposing create_providers is discovered here)"},{"type":"p","text":"A plugin failure must not terminate unrelated providers."},{"type":"h","text":"What Became of the Extensions"},{"type":"p","text":"Removed. The browser extension, its Debugger card and the code that reported on it were removed in October 2026. With nothing outside the process sending browsing data, there is nothing whose silence needs explaining; the browser is read from its own history."}]},{"number":"25","label":"25.","id":"s25","title":"Listener Privacy Controls","page":77,"blocks":[{"type":"p","text":"Monitoring categories must be configurable."},{"type":"p","text":"Each source is switched on or off by itself in Settings \u003e Privacy, which says beside each what is lost without it and what it costs the computer:"},{"type":"ul","items":["Application activity","Filesystem activity","Browser history","Application integrations","Assistant activity","Screen text","Screenshots"]},{"type":"p","text":"All are on by default. There is no single master switch; the sources are the switches."},{"type":"p","text":"Application and website allow/deny lists, directory and file-name exclusions, and a list of windows never read are all supported. Passwords, one-time codes and keys are cut out of everything recorded before it is kept (on by default)."},{"type":"p","text":"*Amended 2026-10-16:* THE RECORD LOG, a tab of its own before the Debugger and in every build: the latest hundred things recorded, from every source, each with its time, a title, a line of what it holds, the switch in Settings \u003e Privacy that recorded it and how many passwords or codes were hidden in it; opened, the whole record. Below it, what the rules kept out since the program started - by which rule and from which source, never what was in it, which is the point of keeping it out - with a count for each rule; the agent's own files, thousands an hour, are only counted. Two kinds of filtering are told apart there: a switch, an allow or deny list, an excluded folder or file name, \"only while you are here\" and \"only what you did yourself\" keep a record out WHOLE; hiding passwords and codes keeps the record and replaces only them with \"[hidden]\", except in a screenshot, which is not kept at all. Neither is decided by a model.","amended":true},{"type":"p","text":"*Amended 2026-10-16:* and the Record log shows WHERE something was hidden: the latest records of the last week with \"[hidden]\" in them, as they were kept - each field it is in, by name, with the place marked - and every \"[hidden]\" marked in the records above. What was there before is not shown: it was never stored, and keeping it to show would undo the filtering it shows. What a rule kept out is shown by its source and its rule only.","amended":true},{"type":"h","text":"Private Mode Is a Control"},{"type":"p","text":"Removed. Private mode was removed in October 2026; what is listened to is chosen one source at a time in Settings \u003e Privacy."},{"type":"h","text":"Assistant Activity"},{"type":"p","text":"Work done through an assistant - a coding assistant, a desktop agent - is user activity and is a source in its own right."},{"type":"p","text":"Recording only that such an application was in use is not sufficient: the application name and a duration describe none of the work. Where such a tool keeps a local record of its sessions, the Listener may read it as it reads browser history, and record for each session:"},{"type":"ul","items":["Which tool","Which project or workspace it was working in","When the session began and when it was last active","How much exchange it contained"]},{"type":"p","text":"This source is on by default. Session metadata is always recorded; what was said is recorded for the assistants ticked in \"Record conversations from\" (every one found, by default) and limited by the project lists (section 18), with the assistant's own reasoning and tool calls left out unless asked for and each turn cut at a stated length. It stays on this machine, it is covered by the same exclusions as every other source, and switching it off in Settings \u003e Privacy stops it at once."},{"type":"p","text":"*Amended 2026-10-17:* BESIDE EACH SWITCH, WHAT THE OPERATING SYSTEM MUST ALLOW for it, looked at without asking: allowed, not allowed, or that it cannot be told - with, where it is not allowed or cannot be told, a link that opens the very place it is switched on (`platform_layer/permissions.py`). On a Mac: Full Disk Access beside file and browser watching, Accessibility and Automation (System Events) beside the application in front and reading the screen, Screen Recording beside its pictures, and Notifications beside the notifications switch - which macOS lets no program read, only open. On Windows: notifications, off for every program or for this one, read from the user's own registry and never written; the link opens Settings at Notifications. On Linux: a Wayland session lets no program see the window in front nor picture it, chosen at sign-in rather than in a setting - said, with nothing to open. Looked at again whenever the page comes back into view, since that is where the user has just been. Nothing here changes a setting.","amended":true}],"amendment_note":"2026-10-16: the user asked for a Record log before the Debugger - the latest hundred things recorded, each saying which privacy switch recorded it, as the evidence for choosing which to turn off - and asked whether the filtering removes a record or only hides what is important in it.","amended":true},{"number":"26","label":"26.","id":"s26","title":"Platform Abstraction Layer","page":78,"blocks":[{"type":"p","text":"Location:"},{"type":"pre","text":"./platform_layer/   (base.py, windows.py, macos.py, linux.py)"},{"type":"p","text":"The OS-level sandbox backends live in `runtime/isolation.py`."},{"type":"p","text":"The Platform module isolates operating-system-specific functionality."},{"type":"p","text":"Supported systems:"},{"type":"ul","items":["Windows","macOS","Linux"]},{"type":"p","text":"Conceptually:"},{"type":"p","text":"Common Platform Interfaces"},{"type":"pre","text":"|\n+-- Windows\n|\n+-- macOS\n|\n+-- Linux"}]},{"number":"27","label":"27.","id":"s27","title":"Platform Interfaces","page":78,"blocks":[{"type":"p","text":"The common abstraction may include components such as:"},{"type":"pre","text":"class PlatformActivityProvider:\n    def get_active_application(self):\n        ..."},{"type":"pre","text":"def get_active_window(self):\n    ..."},{"type":"pre","text":"class PlatformNotificationProvider:\n    def send_notification(self, message):\n        ..."},{"type":"pre","text":"class PlatformProcessProvider:\n    def get_process_info(self, pid):\n        ..."},{"type":"pre","text":"class PlatformSandboxProvider:\n    def create_restricted_process(self, config):\n        ..."},{"type":"p","text":"High-level components should depend on these abstractions rather than platform-specific code."}]},{"number":"28","label":"28.","id":"s28","title":"Platform Capability Detection","page":79,"blocks":[{"type":"p","text":"Not every operating system will expose identical functionality."},{"type":"p","text":"The system should maintain a capability map."},{"type":"p","text":"Example:"},{"type":"pre","tex
