, or at least in its message. A refusal carrying none of that is not a rate limit merely because it arrives as one, and treating it as temporary promises the user a retry that can never succeed."},{"type":"quote","text":"Telling a user that the agent will retry, when nothing about the condition will change, is worse than telling them nothing: they wait instead of acting."},{"type":"p","text":"Where a credential is turned away for the use being made of it, that is a condition the user must act on, and the application says which credential and what to do instead."}]},{"number":"90","label":"90.","id":"s90","title":"Data Heartbeat Failure Behavior","page":126,"blocks":[{"type":"p","text":"Nothing marks raw data as pending or processed any more. The agent heartbeat keeps a \"summarised until\" mark instead, and moves it forward only when step one of a review answered."},{"type":"p","text":"If the heartbeat's model is unavailable:"},{"type":"p","text":"Activity since the last answered review"},{"type":"pre","text":"|\nv"},{"type":"p","text":"Model unavailable"},{"type":"pre","text":"|\nv"},{"type":"p","text":"\"Summarised until\" stays where it was"},{"type":"pre","text":"|\nv"},{"type":"p","text":"Once the model answers again, the missed stretch is read in turns, oldest first, until the reviews have caught up"},{"type":"p","text":"This prevents contextual data from being lost because of temporary authentication or quota issues. Raw activity is still removed after the keeping period (eight days by default) whether or not it was read, so activity older than that when the model returns is not read."}]},{"number":"91","label":"91.","id":"s91","title":"Data Heartbeat Notification Deduplication","page":127,"blocks":[{"type":"p","text":"Background heartbeats run every few minutes - the agent heartbeat every fifteen minutes by default, and the state heartbeat on its own clock - and the sign-in prompt can be raised by any of them."},{"type":"p","text":"The system must not display an identical warning at every run indefinitely."},{"type":"p","text":"The notification subsystem should deduplicate repeated model-availability warnings."},{"type":"p","text":"Conceptually:"},{"type":"p","text":"First detection:"},{"type":"pre","text":"Notify user"},{"type":"p","text":"Subsequent heartbeat:"},{"type":"pre","text":"Same unresolved problem\nDo not repeatedly interrupt"},{"type":"p","text":"State changes:"},{"type":"pre","text":"Notify again when materially useful"},{"type":"p","text":"A new notification may be appropriate when:"},{"type":"ul","items":["The error type changes","A configurable reminder interval has elapsed","The model briefly recovered and later failed again","User action is newly required"]},{"type":"p","text":"Warnings are deduplicated by key and signature. The reminder interval is the \"Repeat warning cooldown\" setting (one hour by default, from one minute to one week). A dismissed sign-in prompt stays dismissed until the model works again."}]},{"number":"92","label":"92.","id":"s92","title":"Model Recovery","page":128,"blocks":[{"type":"p","text":"When a previously unavailable model becomes operational again, the system should update its state automatically."},{"type":"p","text":"For example:"},{"type":"pre","text":"quota_exhausted\n      |\n      v"},{"type":"p","text":"API available again"},{"type":"pre","text":"      |\n      v\navailable"},{"type":"p","text":"When a model that had a failure state works again, a recovery event (model.recovered) is published. The state heartbeat resumes its unfinished round at once, the sign-in prompt is withdrawn and any dismissal of it is lifted, and the agent heartbeat catches up on the activity it could not read at its next run."},{"type":"p","text":"Optionally, the system may inform the user that background data processing has resumed."}]},{"number":"93","label":"93.","id":"s93","title":"Data Heartbeat Hard Invariant","page":129,"blocks":[{"type":"p","text":"The following is a system-level invariant:"},{"type":"quote","text":"No background heartbeat may silently skip model-dependent work because its model lacks valid authentication, login state, API availability, or required usage capacity."},{"type":"p","text":"If user action is required, the user must be informed."},{"type":"p","text":"Activity that was not read stays unread and is read when the model returns, within the raw-activity keeping period."}]},{"number":"94","label":"94.","id":"s94","title":"Model Fallback Policy","page":129,"blocks":[{"type":"p","text":"The user's model list is the fallback policy. A model is used only if the user put it on the list, and in the order they chose."},{"type":"p","text":"The system must not replace the user's models with any provider the user did not list."},{"type":"p","text":"Models, in order:"},{"type":"pre","text":"1. Model A\n2. Model B"},{"type":"p","text":"Fallback Conditions (the call moves to the next model on the list):"},{"type":"pre","text":"A reason only the user can fix: sign-in, key, credit,\n    a model not offered, a client not installed\nA usage limit the provider states"},{"type":"p","text":"A timeout or a busy moment is retried on the same model, not passed on. The call returns to the first model as soon as that model works."},{"type":"p","text":"With a single model on the list:"},{"type":"p","text":"Selected model unavailable"},{"type":"pre","text":"|\nv"},{"type":"p","text":"Nothing changes provider"},{"type":"pre","text":"|\nv"},{"type":"p","text":"Notify user when action is required"},{"type":"p","text":"The older single fallback setting is hidden, and is used only when the list is empty."},{"type":"p","text":"This preserves user control over:"},{"type":"ul","items":["Provider choice","Privacy","Billing","Model behavior","Data routing"]}]},{"number":"95","label":"95.","id":"s95","title":"Model Privacy Boundary","page":130,"blocks":[{"type":"p","text":"Changing model providers may change where user context is sent."},{"type":"p","text":"Therefore, the system must treat provider selection as a privacy-sensitive configuration."},{"type":"p","text":"Context, including what the agent draws from its memory library (section 39.1), is sent only to models the user has put on the list."},{"type":"p","text":"Adding a second model is consenting to its receiving the agent's context whenever the first cannot answer. The settings card says so when the order changes who is billed."}]},{"number":"96","label":"96.","id":"s96","title":"Updated Data Heartbeat Workflow","page":130,"blocks":[{"type":"p","text":"Removed. There is no Data Heartbeat (section 69), and no node or edge update, compaction or \"mark processed\" step; they were deleted on 2026-10-06. The model check now lives in the model manager, which checks a model before each call and passes a refused call down the model list (sections 86, 94), and the waiting and retrying live in each heartbeat (sections 86-92)."}]},{"number":"97","label":"97.","id":"s97","title":"Updated Security Invariants","page":133,"blocks":[{"type":"p","text":"The model subsystem introduces the following additional system invariants:"},{"type":"h","text":"Credential Isolation"},{"type":"p","text":"API keys, access tokens, refresh tokens, and private authentication material must never enter the Knowledge Graph or model context."},{"type":"h","text":"Explicit Provider Choice"},{"type":"p","text":"The user's models must not be silently replaced by another provider. A call moves only down the ordered list the user made (section 94)."},{"type":"h","text":"Heartbeat Visibility"},{"type":"p","text":"Authentication, login, or API-capacity failures that stop a background heartbeat must not fail silently."},{"type":"h","text":"Data Preservation"},{"type":"p","text":"Raw Events and Raw Edits are never discarded because a model is unavailable. They are kept for the configured period (eight days by default), removed by age whatever the model's state, and read when the model returns within that time."},{"type":"h","text":"Authentication Separation"},{"type":"p","text":"Model authentication implementation must remain separate from Agent reasoning logic."}]},{"number":"98","label":"98.","id":"s98","title":"Final Application Deliverable","page":134,"blocks":[{"type":"p","text":"The final Personalized Agent must be distributed as a platform-native executable application."},{"type":"p","text":"Providing only Python source code is not considered a complete implementation."},{"type":"p","text":"The project must support independent builds for:"},{"type":"ul","items":["Windows","macOS","Linux"]},{"type":"p","text":"Each platform should produce an artifact that can be launched by a normal end user without requiring the user to manually install Python or run Python scripts from a terminal."}]},{"number":"99","label":"99.","id":"s99","title":"Platform Build Outputs","page":134,"blocks":[{"type":"p","text":"The expected release artifacts are conceptually:"},{"type":"pre","text":"dist/\n    windows/\n    macos/\n    linux/"},{"type":"p","text":"Platform-specific output formats should follow normal conventions for the target operating system."},{"type":"h","text":"Windows"},{"type":"p","text":"The project must produce a Windows executable application."},{"type":"p","text":"The Windows build produces:"},{"type":"ul","items":["dist/windows/PersonalizedAgent/ - the application folder, with PersonalizedAgent.exe","PersonalizedAgent-Setup.exe - a per-user installer (Inno Setup)","PersonalizedAgent-\u003cversion\u003e-windows-portable.zip - the application folder as a portable archive"]},{"type":"p","text":"A release gives these files stable names (section 117)."},{"type":"p","text":"The installer first asks which of the five display languages to use (English, Chinese, Spanish, Japanese, Korean), speaks it from then on, and starts the installed program in it. Its last page asks whether the agent starts when the user signs in, ticked by default."},{"type":"p","text":"*Amended 2026-10-15:* there are nine display languages now - English, Chinese, Spanish, Japanese, Korean, Russian, French, German, Italian - and the whole interface is shown in the one chosen (section 134).","amended":true},{"type":"p","text":"The installed application should support normal Windows application behavior including:"},{"type":"ul","items":["Start Menu entries, including one that runs the agent without a window","Application icon","User-level configuration storage","Background services/processes where required","Clean uninstall: uninstalling removes the program, its start at sign-in and its \"Delegate work\" entry in Explorer's right-click menu, and leaves the user's agent root in place"]},{"type":"p","text":"Released installers do not include the Debugger (section 116)."},{"type":"p","text":"*Amended 2026-10-16:* the application is called **Personal Agent WaterMelon** wherever the user reads its name - windows, page titles, the tray, the installer, the Start menu, the uninstall list, the menu-bar name on macOS. What only the system reads keeps the old one, so a 1.0.0 installation upgrades in place: the program file `PersonalizedAgent.exe`, the installer's identity, the sign-in entry, the data folder's name, the download file names and the macOS bundle folder. Its own windows are still recognised as its own under either name. On screen the Experience tab is called Work, its debugger the Work debugger, and the module Work learning - in the tabs, the token chart and Settings - while the code, settings and addresses keep their names. The Start menu has no entry that runs the agent without a window; an upgrade removes the old Start menu folder and desktop shortcut that carried the former name.","amended":true},{"type":"p","text":"*Amended 2026-10-16:* and its files carry the name too: the program is `PersonalAgentWaterMelon.exe`, the downloads `PersonalAgentWaterMelon-Setup-windows-x64.exe`, `PersonalAgentWaterMelon-macos.dmg` and `PersonalAgentWaterMelon-linux-x86_64.AppImage`, the macOS application `Personal Agent WaterMelon.app`, the Linux package `personal-agent-watermelon`, and a new installation's data folder `~/PersonalAgentWaterMelon`. An upgrade loses nothing: the installer's identity is kept, the old program file is removed and an entry at sign-in that starts it is counted as this program's own, an existing `~/PersonalizedAgent` is used as it is, an update installed on macOS removes the old application, and the Linux package replaces the old one.","amended":true},{"type":"h","text":"macOS"},{"type":"p","text":"The project must produce a native macOS application bundle."},{"type":"p","text":"Expected primary artifact:"},{"type":"p","text":"Personalized Agent.app"},{"type":"p","text":"Where the tools exist, the build also produces:"},{"type":"p","text":"Personalized-Agent.dmg"},{"type":"p","text":"and:"},{"type":"p","text":"Personalized-Agent.pkg"},{"type":"p","text":"The .pkg is an installer whose Installation Type page asks whether the agent starts when the user signs in (ticked by default, through a LaunchAgent). A release gives both stable names (section 117)."},{"type":"p","text":"*Amended 2026-10-16:* the .dmg is the macOS download offered first: the application dragged from it into Applications is the user's own, so it can replace itself with a newer version, where the one the .pkg installs belongs to the system and could not without a password. Starting at sign-in is then the program's own setting, on by default, as it is for the portable folders. And the permissions macOS asks for one at a time - Full Disk Access, Accessibility, control of System Events, Screen Recording - are listed together in Settings \u003e Privacy, each looked at without asking, each with what it is for and a button to its own pane of System Settings, Full Disk Access first because it also covers the Desktop, Documents and Downloads folders; the Overview says so while one that a switch which is on needs is missing.","amended":true},{"type":"p","text":"*Amended 2026-10-16:* UPDATES. Once a day, and when asked, the program reads this project's published releases - never a commit, a merge, a draft or a pre-release, so a release marked pre-release reaches nobody. By default (Settings \u003e General \u003e Updates) the user is told, and shown every version newer than theirs with what each says of itself, and installs the one they choose - never an older one, which may not read what a newer one wrote. Installing by itself is off by default, in Settings and in the Windows installer's box, because a release that turned out broken would otherwise reach everyone within a day; chosen, the newest is installed by itself. A version being installed is downloaded into the data folder, checked against the release's own SHA256SUMS.txt - one that does not match is deleted and never run - and installed, never while a piece of work is running: on Windows the installer runs silently once the program has quit, keeping the program folder, the data folder, the language and the user's own start at sign-in, and starts the new version; on macOS the application from the .dmg is replaced; a Linux AppImage replaces itself. Or nothing is looked for at all. A copy that cannot replace itself - run from source, a portable folder, a .deb, the .pkg's application - is only told. The new version opens with what is new: the release's own description, in a window shown until it is closed.","amended":true},{"type":"p","text":"*Amended 2026-10-27:* AN UPDATE THAT HAPPENS, AND IS SEEN THROUGH (found when an update from 0.2.0 quit and never came back; the user's decision on how it is shown). On Windows the installer is started, once the program has quit, by a shell of its own - and that shell, started detached (with no console at all), ended at once without running its command: the installer was never started, and every Windows update until 0.2.8 quit the program and left nothing behind. It is started with no window instead, and says it is there (a file in the updates folder) before the program quits; one that does not say so within fifteen seconds and nothing is quit - the update is said to have failed, and why. The installer runs with its own progress window (/SILENT: no question, only the bar), for a page that is not open. The page, which outlives the agent, follows the update to its end: the download with its share done, checked, installing, the agent closed and starting again - asked each second, the update carried in the page's regular status so a page that did not start it follows it too - and opens on the new version by itself (the same address, its sign-in a cookie made from the installation's own key), with what is new; it says so when the new version is slow to answer. Copies before 0.2.8 cannot update themselves to it: their own updater has the fault - they are told to install it by hand once. CHECK NOW says what it found on the page, where the user is looking - no notice; that version counts as told, and only a look the agent makes by itself tells of one in a notice.","amended":true},{"type":"p","text":"*Amended 2026-10-27:* UPDATES THE USER DOES NOT FEEL (the user's decision: \"like Claude CLI's\" - every update, the one the user chose as much as one had by itself; told and chosen stays the default, in Settings and in the installer's box). A newer version is made ready in the background while the agent runs - while work runs too, since nothing of the running program changes - and taken up as the agent next starts (before it opens anything, once no other copy runs) or when the user has been away fifteen minutes and no work runs: a restart of seconds - or at once at the user's \"Restart now\" (platform_layer/quiet_update.py). Made ready beside what it replaces, on the same disk, so taking it up is renames: on Windows the release's portable folder unpacked into `\u003cprogram\u003e\\.update\\\u003ctag\u003e`, every file the same as the running one's (size, then CRC) a hard link to it - the libraries that do not change take no room and no time - and only what changed written; on macOS the application from the .dmg, copied whole as it was signed into a hidden folder beside the user's; on Linux the AppImage, likewise. A helper of its own, once the agent has gone, moves the running parts aside, the new ones in, starts the program and watches it: unless its page answers within two minutes (or, with no page, it lives thirty seconds), it is ended, every part moved back, the old version started - and that version is never made ready again; the user is told once that it was not kept. Run for real in the tests on both helpers, both ways. A copy that cannot be updated so - its program folder not the user's to write (installed for every user) - is updated by the installer as before, which also clears a full install's and an uninstall's way of what a quiet update left.","amended":true},{"type":"p","text":"The application bundle should contain all required runtime components."},{"type":"p","text":"The user should not need to manually install Python."},{"type":"p","text":"Where required for normal distribution, the build architecture should support:"},{"type":"ul","items":["Code signing","Hardened Runtime","Notarization","Application entitlements","Permission declarations"]},{"type":"p","text":"The application must correctly request permissions required for functionality such as activity monitoring or accessibility APIs instead of assuming those permissions already exist."},{"type":"h","text":"Linux"},{"type":"p","text":"The project must produce a launchable Linux desktop application."},{"type":"p","text":"At least one broadly usable packaging format should be supported."},{"type":"p","text":"The Linux build always produces a tar.gz of the application:"},{"type":"p","text":"personalized-agent-\u003cversion\u003e-linux-x86_64.tar.gz"},{"type":"p","text":"and, when their tools are installed, an AppImage and a .deb package:"},{"type":"p","text":"PersonalizedAgent.AppImage"},{"type":"p","text":"personalized-agent_\u003cversion\u003e_\u003carch\u003e.deb"},{"type":"p","text":"No .rpm is built. A release gives these files stable names (section 117). The architecture must not require the user to manually invoke Python scripts."}],"amendment_note":"2026-10-27: every update made ready in the background and taken up at the next start, when the user is away or at Restart now, taken back if it does not start (quiet_update.py) - told and chosen still by default; Windows updates started the installer from a detached PowerShell that never ran it - now with no window, and quitting only once it answers; the page follows the update to the new version; Check now without a notice. Earlier, 2026-10-15: Russian, French, German and Italian added to the display languages - nine in all - and the whole interface shown in them from fixed tables (section 134).","amended":true},{"number":"100","label":"100.","id":"s100","title":"Self-Contained Runtime","page":136,"blocks":[{"type":"p","text":"Release applications should bundle the runtime dependencies required by the Personalized Agent."},{"type":"p","text":"The user should not be required to manually install:"},{"type":"p","text":"Python"},{"type":"pre","text":"pip\nvirtualenv"},{"type":"p","text":"backend Python packages"},{"type":"p","text":"before launching the application."},{"type":"p","text":"The build system should package the Python backend and required runtime libraries into the final application."},{"type":"quote","text":"remains mandatory for development and reproducibility even when"},{"type":"p","text":"requirements.txt"},{"type":"p","text":"dependencies are bundled into release artifacts."}]},{"number":"101","label":"101.","id":"s101","title":"Source and Release Separation","page":137,"blocks":[{"type":"p","text":"The project should distinguish between:"},{"type":"p","text":"Development Environment"},{"type":"p","text":"and:"},{"type":"p","text":"Packaged Runtime Environment"},{"type":"p","text":"Development may use:"},{"type":"p","text":"Python"},{"type":"p","text":"virtual environments"},{"type":"p","text":"requirements.txt"},{"type":"p","text":"development tools"},{"type":"p","text":"debug tooling"},{"type":"p","text":"while release builds must provide a self-contained application suitable for normal users."},{"type":"p","text":"The application must behave consistently in both environments."}]},{"number":"102","label":"102.","id":"s102","title":"Build System","page":137,"blocks":[{"type":"p","text":"The repository must provide automated build scripts for all supported operating systems."},{"type":"p","text":"Recommended structure:"},{"type":"pre","text":"build/\n    windows/\n    macos/\n    linux/"},{"type":"p","text":"or equivalent scripts such as:"},{"type":"pre","text":"scripts/\n    build_windows.py\n    build_macos.py\n    build_linux.py"},{"type":"p","text":"One entry point builds for the current system:"},{"type":"p","text":"python build.py"},{"type":"p","text":"with --platform to name it:"},{"type":"p","text":"python build.py --platform windows"},{"type":"p","text":"python build.py --platform macos"},{"type":"p","text":"python build.py --platform linux"},{"type":"p","text":"It also takes --validate-only (run the build-time validation and stop), --skip-tests, --no-installer (Windows), --dist (where to publish the artifacts), --fast (a build for trying the application out: no tests, PyInstaller's cache kept, no installer or portable archive) and --kill-running (end a running built application that holds its own files)."},{"type":"p","text":"A build from source carries the Debugger and its tabs by default. python build.py --no-debugger leaves them out entirely, because a build for a user should not carry the agent's internals; the released downloads are built that way (section 116)."},{"type":"p","text":"A developer packaging a build locally can do so from a dedicated environment made by build/make_build_env.py. It lives outside the repository, holds only the application's requirements and PyInstaller, pins every package to the version installed in the development Python, and uses a CPU-only torch, so the build carries neither the developer's extra packages nor a CUDA torch."},{"type":"p","text":"The application's icons are made from the Watermelon avatar."},{"type":"p","text":"However, the build architecture must recognize that certain platform artifacts can only be correctly produced on their respective operating systems."}]},{"number":"103","label":"103.","id":"s103","title":"Native Platform Builds","page":138,"blocks":[{"type":"p","text":"The system should not assume that one operating system can reliably generate release packages for every other target operating system."},{"type":"p","text":"The release pipeline should support:"},{"type":"p","text":"Windows runner"},{"type":"pre","text":"-\u003e Windows application"},{"type":"p","text":"macOS runner"},{"type":"pre","text":"-\u003e macOS application"},{"type":"p","text":"Linux runner"},{"type":"pre","text":"-\u003e Linux application"},{"type":"p","text":"This is particularly important for:"},{"type":"ul","items":["Native libraries","Code signing","Platform-specific packaging","macOS notarization","Windows installers","Platform-specific Listener components","Sandbox components"]}]},{"number":"104","label":"104.","id":"s104","title":"Build Reproducibility","page":139,"blocks":[{"type":"p","text":"Builds should be reproducible from the repository."},{"type":"p","text":"At minimum, the project must contain:"},{"type":"ul","items":["Python dependency versions","Build configuration","Packaging configuration","Required frontend build configuration","Platform-specific build scripts","Version metadata"]},{"type":"p","text":"A clean build environment should be able to generate the application without undocumented manual steps."},{"type":"p","text":"In current practice, requirements.txt gives minimum versions only. A local packaging build takes exact versions from the tested development environment, through build/make_build_env.py (section 102). The release workflow installs from requirements.txt, so its builds are not pinned to exact versions."},{"type":"p","text":"PyInstaller builds are not byte-for-byte reproducible, so a released file cannot be checked by rebuilding it. What ties a released file to the code it was built from is its build-provenance attestation (sections 116, 117)."}]},{"number":"105","label":"105.","id":"s105","title":"Application Versioning","page":139,"blocks":[{"type":"p","text":"The Personalized Agent should use a consistent application version."},{"type":"p","text":"Example:"},{"type":"p","text":"1.0.0"},{"type":"p","text":"The same release version should be represented consistently in:"},{"type":"ul","items":["Executable metadata","Application UI","Installer metadata","Logs","Build artifacts","The Debugger, in builds that carry it"]},{"type":"p","text":"The single source of the version is personalized_agent/version.py. Released downloads carry no Debugger, so in a release the version is shown in the executable and installer metadata, the application UI and the logs."}]},{"number":"106","label":"106.","id":"s106","title":"Platform-Specific Components","page":139,"blocks":[{"type":"p","text":"Each build must include only the platform-specific implementations required for that operating system where practical."},{"type":"p","text":"For example:"},{"type":"p","text":"Each build packages its own platform module and leaves out the other two:"},{"type":"p","text":"Windows Build"},{"type":"pre","text":"personalized_agent/platform_layer/windows.py"},{"type":"p","text":"macOS Build"},{"type":"pre","text":"personalized_agent/platform_layer/macos.py"},{"type":"p","text":"Linux Build"},{"type":"pre","text":"personalized_agent/platform_layer/linux.py"},{"type":"p","text":"Higher-level code must remain shared. Sandboxing and listeners are shared code that ask the platform module for what differs: the operating system's isolation of agent code (AppContainer on Windows, Seatbelt on macOS, bubblewrap or Landlock on Linux) lives in runtime/isolation.py, and the activity providers are shared under listener/providers/."}]},{"number":"107","label":"107.","id":"s107","title":"Packaged Runtime Security","page":140,"blocks":[{"type":"p","text":"Packaging the application must not weaken the filesystem security model."},{"type":"p","text":"The following invariant remains mandatory in packaged applications:"},{"type":"quote","text":"No agent-controlled process may write outside the user-authorized workspace."},{"type":"p","text":"The packaged runtime must apply the same restrictions to:"},{"type":"ul","items":["Main executable","Embedded Python runtime","Generated scripts","Scheduler tasks","Child processes","External commands","Temporary files"]},{"type":"p","text":"The fact that the application is running from an installed executable must not grant generated code unrestricted filesystem write access."}]},{"number":"108","label":"108.","id":"s108","title":"Internal Application Files","page":141,"blocks":[{"type":"p","text":"The application itself may require limited writes outside the user's agent workspace for operating-system-managed application state."},{"type":"p","text":"These writes must be narrowly defined and must not be accessible as arbitrary agent-controlled output."},{"type":"p","text":"Examples may include:"},{"type":"ul","items":["Application configuration","Credential storage","Database state","Application logs","Crash information","Installation/update metadata"]},{"type":"p","text":"A strict distinction must exist between:"},{"type":"p","text":"Trusted Internal Application State"},{"type":"p","text":"and:"},{"type":"p","text":"Agent-Controlled Writes"},{"type":"p","text":"The user-authorized workspace restriction applies to agent-controlled task output and generated execution."},{"type":"p","text":"Internal application components must never provide generated model code with arbitrary access to the application's trusted state directories."},{"type":"p","text":"Superseded in part by section 110.1: the application must not write outside the user-specified root, including for operating-system-managed application state. Internal application files are written to the internal subdirectory of that root."},{"type":"p","text":"The distinction this section draws between trusted internal application state and agent-controlled writes is unchanged; it is now a distinction between two subdirectories of one root rather than between two separate locations."}]},{"number":"109","label":"109.","id":"s109","title":"Internal Data Directory","page":141,"blocks":[{"type":"p","text":"Each platform may maintain an application-owned internal data directory for persistent system state."},{"type":"p","text":"For example, conceptually:"},{"type":"pre","text":"APPLICATION_INTERNAL_DATA/\n    settings/\n    database/\n    scheduler/\n    graph/\n    credentials-reference/\n    logs/"},{"type":"p","text":"The exact path should follow operating-system conventions."},{"type":"p","text":"This directory is controlled by trusted application code."},{"type":"p","text":"It must not be treated as part of the agent's general writable workspace."},{"type":"p","text":"Model-generated scripts must not receive unrestricted write access to this location."},{"type":"p","text":"Superseded in part by section 110.1: the internal data directory is the internal subdirectory of the user-specified root. It does not follow an operating-system conventional application data path."},{"type":"p","text":"Everything else this section requires is unchanged: the directory is controlled by trusted application code, it is not part of the agent's writable workspace, and model-generated scripts receive no access to it."}]},{"number":"110","label":"110.","id":"s110","title":"User Workspace vs. Application State","page":142,"blocks":[{"type":"p","text":"The architecture must explicitly separate two storage domains."},{"type":"h","text":"Trusted Application State"},{"type":"p","text":"Used internally by the Personalized Agent implementation."},{"type":"p","text":"Examples, all under internal/:"},{"type":"ul","items":["The database: Raw Events, Raw Edits, the scheduler and conversations","Configuration","Credentials","Model usage metrics","Internal logs"]},{"type":"p","text":"Access is restricted to trusted application components."},{"type":"p","text":"The agent's memory library (section 39.1) - user_nature, user_feedback, states and state_tasks - replaced the knowledge graph and is kept in workspace/data/, so that the user can read it. Only the application writes it. Agent-controlled code may read it, but may write only inside workspace/agent/."},{"type":"h","text":"User-Authorized Agent Workspace"},{"type":"p","text":"Used for files generated or modified as part of user or agent tasks."},{"type":"p","text":"Examples:"},{"type":"p","text":"generated documents"},{"type":"p","text":"generated code"},{"type":"pre","text":"downloads\nexports"},{"type":"p","text":"task output"},{"type":"p","text":"agent-generated files"},{"type":"p","text":"All untrusted/model-directed writes must remain in this workspace."},{"type":"p","text":"The runtime sandbox must enforce this distinction."},{"type":"p","text":"Both domains live inside the single writable root defined in section 110.1, as sibling subdirectories. Their separation is enforced by the runtime sandbox and by path validation, not by their being in different parts of the filesystem."}]},{"number":"110.1","label":"110.1","id":"s110-1","title":"Single Writable Root","page":142,"blocks":[{"type":"p","text":"The user configures exactly one writable root directory."},{"type":"p","text":"Both storage domains of section 110 live inside that root, as separate subdirectories:"},{"type":"pre","text":"\u003cAGENT_ROOT\u003e/\n    workspace/            user-authorized agent workspace\n        documents/        the user's own (read-only to the agent)\n        downloads/        the user's own (read-only to the agent)\n        exports/          the user's own (read-only to the agent)\n        generated/        the user's own (read-only to the agent)\n        data/             the memory library (written by the application only)\n        agent/            the only place agent-controlled code may write\n            documents/\n            downloads/\n            exports/\n            generated/\n            .agent_runtime/   scripts, tasks, temp\n    internal/             trusted application state\n        settings/\n        database/\n        logs/\n        credentials/\n        characters/\n        cache/\n        guard/            the guard copy that child processes load\n        work_children/    each work run's spec, snapshot and control files\n        state_sandbox/    the Debugger's test library for the state heartbeat"},{"type":"p","text":"The application's own files are written only inside the root. This applies to the application itself as well as to agent-controlled execution:"},{"type":"ul","items":["Configuration, databases, logs, credential storage and installed packages are written under the internal subdirectory, not to an operating-system conventional application data location","Task output, downloads, exports and generated code are written under the workspace subdirectory","Two operating-system registrations are the exception, made the way each system expects and only in the user's own part of it: the entry that starts the agent at sign-in, when that setting is on (it is on by default) - the Run key under HKCU on Windows, a LaunchAgent in ~/Library/LaunchAgents on macOS, an autostart entry in ~/.config/autostart on Linux - and, on Windows, the \"Delegate work\" entry in Explorer's right-click menu, under HKCU\\Software\\Classes","Neither registration holds any of the user's data. Both are written again at each start - the sign-in entry according to its setting; the Explorer entry is always present and cannot be turned off - the uninstaller removes them, and they do not travel with a copy of the root"]},{"type":"p","text":"The separation of trust is unchanged and is now expressed by subdirectory:"},{"type":"quote","text":"Agent-controlled code may write only inside the workspace subdirectory, and may neither read nor write the internal subdirectory, even though both are inside the same root."},{"type":"p","text":"Because the internal subdirectory is a sibling of the workspace rather than a separate location, path validation must treat it as a protected region rather than relying on it being outside the writable area."},{"type":"p","text":"The root must be resolvable before any state is read, so it is supplied by the launch environment - a command line argument, an environment variable, or a documented default - and never read from a configuration file that itself lives inside the root."},{"type":"p","text":"Packaged applications follow the same rule: installing the application creates program files, but running it writes only inside the user's root (section 107)."},{"type":"h","text":"Relocatable Root"},{"type":"p","text":"Consolidating both domains into one root exists so that the installation can be moved by copying a single directory."},{"type":"quote","text":"Copying the root to another path, or to another machine, and launching with the new root must restore the same installation: the same settings, knowledge graph, scheduled tasks, conversations and workspace contents."},{"type":"p","text":"Nothing inside the root may depend on the root's absolute location. In particular:"},{"type":"ul","items":["Stored configuration values that point inside the root must be rewritten to the new location when the root moves, rather than left pointing at the old path","Scheduled task script paths and any other persisted references into the root must be rewritten the same way","Databases and packaged content inside the root must not embed the root's absolute path as an identifier"]},{"type":"p","text":"State the application deliberately keeps outside the root cannot travel with a copy. Operating-system credential storage is the expected case (section 83), so the application must make clear which state a copy does not carry, and must offer a storage mode whose credentials live inside the root for users who need the directory to be self-contained."},{"type":"h","text":"External Tools and the Write Boundary"},{"type":"p","text":"The single-root rule governs what the application writes and what agent-controlled code is permitted to write. It does not extend to a separate program that the user directs the application to run on their behalf."},{"type":"p","text":"Such a tool - an operating-system keychain service, a provider's command line tool performing a sign-in (section 75.2) - owns its own state, in its own location, under its own rules. The application neither writes there nor reads there beyond what the tool hands back."},{"type":"quote","text":"This is not an exception to the write boundary. It is the boundary: the application's own writes stay inside the root, and agent-controlled code is confined to the workspace subdirectory whether or not any external tool is involved."},{"type":"p","text":"The distinction the implementation must preserve:"},{"type":"ul","items":["Agent-controlled code may never invoke such a tool, and gains nothing from one being installed. Path validation and the runtime sandbox are unchanged by its presence","Only trusted application code, acting on an explicit user action, may run one","What the tool returns is stored by the application in the usual place - the Credential Manager for a secret - not left wherever the tool put it"]},{"type":"p","text":"Because that state lives outside the root, it does not travel when the root is copied, and the requirement above applies: the application must say so before the user relies on it."},{"type":"h","text":"The Data Outlives the Version That Made It"},{"type":"p","text":"A database made by an earlier version of this application must keep working when a later one opens it."},{"type":"p","text":"Declaring a table only if it does not already exist does nothing to a table that does, so a version that adds a column finds the old table unchanged and every query naming the new column fails. The user's data is theirs and it outlasts any one version; they are not expected to delete it to install an update."},{"type":"ul","items":["On opening, the application brings an existing store up to the current shape, adding what is missing","What is already there is left alone. A migration that rewrites existing rows can destroy data that the new version merely did not understand","Adding a column is not the same as filling it. A row written before the column existed has no value for it, and reading such a row must succeed"]},{"type":"h","text":"Writing Inside a Directory Other Things Watch"},{"type":"p","text":"Every file the application rewrites - its settings, the user's defaults, the credential store - is written beside the original and then moved over it, so that an interruption leaves the old file whole rather than half a new one."},{"type":"p","text":"That final move can be refused. On some systems, any other process holding the file open - even for the instant it takes to read it - makes the move fail rather than wait. Backup and sync clients, search indexers and virus scanners all open files they did not create, and the root is a directory the user is expressly invited to put wherever they like, including inside a synced folder, because being able to move it is the point."},{"type":"p","text":"So the refusal is expected, and it is waited out rather than reported:"},{"type":"ul","items":["A move that fails this way is retried for a short while before it is treated as a fault","The user is not asked to act on it. There is nothing they could do, and the file is saved a moment later","A refusal that outlasts the retries is a real fault and is raised, not silently swallowed - a setting the user changed must never be quietly lost"]},{"type":"p","text":"*Amended 2026-10-15:* the root - the DATA FOLDER - is chosen when the agent is installed and written beside the program (`data_root.txt`); run from source it is given with `python run.py --root \u003cfolder\u003e`. It is found in that order: `--root`, `PERSONALIZED_AGENT_HOME`, the installer's choice, then `~/PersonalizedAgent`. A different data folder is a different agent: its own calendar, contacts, lessons and settings, and its own keys in the system's credential store - only the standard folder keeps the plain service name, so a chosen one never reads or overwrites another's keys. State from the pre-110.1 locations is moved only into the standard folder, never into one the user chose. The data folder is never listened to, whatever the directory exclusions say (`common/file_noise.py`, `excluded_folders`), and Settings shows it locked, first among the folders not listened to. A data folder must be empty, or hold only an earlier agent's data (workspace and internal): everything in it is the agent's and never listened to, so a folder with other things in it - Documents, a drive, a project - would hide the work kept there; the program refuses to start in one, and the installer refuses to choose one (`common/paths.py`, `data_folder_problem`). Only one agent runs at a time, whichever folder it uses (110.2).","amended":true},{"type":"p","text":"*Amended 2026-10-29:* THE FOLDERS THAT ALREADY HOLD AN AGENT'S DATA ARE LISTED TO CHOOSE FROM (the user's decision). Installed anew on a computer whose agent had kept its data in the user's own folder (`~/PersonalizedAgent`, from before the installer asked), the box said `\u003cprogram\u003e\\data`, and the agent came up empty with the data beside it. The box now starts at the folder THIS copy used - the one its `data_root.txt` names, else the one chosen when it was last installed, else, over a copy from before either was written, the standard one it used - and for a copy installed anew at `\u003cprogram\u003e\\data`, as before. Nothing else is ever chosen for the user: one computer can hold the agent they live with and a copy installed to test it, and which one is meant is theirs to say. So under the box, every folder found holding an agent's data is listed - the one this copy used, the last install's, those the copies in the usual program folders read, the standard ones in the user's folder, and `data` beside the programs - each with when it was last used (the last its database, settings or log was written) and its size (counted for at most a second and a half, shown as \"\u003e ...\" when cut); clicking one puts it in the box, and the question already asked of a folder holding data asks again. A folder only ever given with `--root` is not known to the installer; it can be typed. An update - the installer run silently, or the quiet one, which never touches `data_root.txt` - keeps the folder the program reads, also one written into `data_root.txt` by hand (`build/windows/installer.iss`, `CopysData`, `FindFolders`, `DataToWrite`).","amended":true},{"type":"p","text":"*Amended 2026-10-29:* UNINSTALLING NEVER TAKES AN AGENT'S DATA, WHATEVER `data_root.txt` SAYS (the user's decision). The uninstaller kept only the folder `data_root.txt` named: with the file gone or unreadable, nothing was known to keep and the default data folder went with the program; and with the program's own folder chosen as the data folder - which the installer allowed for an existing data folder, holding only `workspace` and `internal` - the folder to keep was the one being emptied, while the program refused to start there (a data folder holds nothing else). Now the installer refuses a data folder that is the program's folder or holds it, and uninstalling never deletes a `workspace` or `internal` folder, nor any folder holding an agent's database or settings up to two folders down (`DataBelow`); the program's folder is left where such a folder is in it.","amended":true}],"amendment_note":"2026-10-15: the data folder is chosen when installing, and a different folder is a different agent - nothing shared, nothing taken from elsewhere, and never listened to.","amended":true},{"number":"110.2","label":"110.2","id":"s110-2","title":"Single Running Instance","page":141,"blocks":[{"type":"p","text":"One agent runs at a time."},{"type":"p","text":"Starting a second one must be refused, and the refusal must say that an agent is already running rather than failing obscurely or starting anyway."},{"type":"p","text":"The guard is acquired before any application state is opened - before the database, the scheduler, the Listener or the credential store - because those are what a second instance would damage:"},{"type":"ul","items":["One database, written by two processes","One scheduler, firing every task twice","One Listener, recording the same activity twice","One credential store, written by two processes"]},{"type":"p","text":"The refusal must identify the running instance as precisely as the guard can: at minimum that one is running, and where it can be seen - its process and the root it holds - so the user can find it rather than hunt for it."},{"type":"quote","text":"Reporting that the agent is already running is part of the requirement. Exiting silently, or failing with a message about a locked file or a port in use, does not satisfy it."},{"type":"p","text":"Requirements of the guard itself:"},{"type":"ul","items":["It is released when the process ends, including when the process is killed, so a crash does not leave the application permanently unable to start","It is not defeated by pointing the second instance at a different root","It writes nothing outside the root (section 110.1)","A read-only operation that does not run the agent - printing a status snapshot, printing the version - is not subject to it","Where the user cannot see a console, the refusal is shown where they can"]},{"type":"p","text":"The running agent may start its own child processes on the same root - one for each run of the user's work (Delegate work). They are part of that one agent: started, scheduled and ended by it, and never started by the user. They do not take the guard, and they write the database only through the same code the agent uses, with each run's spec, snapshot and control files kept in internal/work_children/. A resource governor schedules them - about one run per four processor cores and per 1.5 GB of free memory, at most four at once - lowers their priority when the processor is busy and pauses them when memory is short. They end when the agent ends."},{"type":"p","text":"The two parts of the guard are not equally waivable. The lock on the root is what prevents two agents from writing one user's state, and nothing may waive it. The machine-wide part exists so that a second agent is refused even when pointed at a different root, and a release validation harness - which runs a throwaway instance against a disposable root, on a machine where the user's own agent may legitimately be running - may waive that part alone, explicitly and visibly."},{"type":"quote","text":"A validation run that cannot run while the user has the application open is a validation run that will not be run."}]},{"number":"111","label":"111.","id":"s111","title":"Generated Script Location","page":143,"blocks":[{"type":"p","text":"All model-generated executable scripts must be created under the authorized workspace."},{"type":"p","text":"Recommended structure:"},{"type":"pre","text":"\u003cAGENT_WORKSPACE\u003e/\n    .agent_runtime/\n        tasks/\n        scripts/\n        temp/"},{"type":"p","text":"For example:"},{"type":"pre","text":"\u003cAGENT_WORKSPACE\u003e/.agent_runtime/scripts/task_123.py"},{"type":"p","text":"**As amended by section 32**, the runtime directory sits inside the agent's own"},{"type":"p","text":"directory rather than at the workspace root:"},{"type":"pre","text":"\u003cAGENT_WORKSPACE\u003e/agent/.agent_runtime/scripts/task_123.py"},{"type":"p","text":"Generated scripts and their temporary files are agent-controlled output like"},{"type":"p","text":"everything else the agent makes, and section 32 leaves nowhere else for the"},{"type":"p","text":"agent to write; keeping them at the workspace root would have required a second"},{"type":"p","text":"exception to the one rule about where the agent writes. It also puts the whole"},{"type":"p","text":"of what the agent produced under one directory the user can inspect or remove"},{"type":"p","text":"in one action. Both statements above still hold: the runtime directory remains"},{"type":"p","text":"inside the authorized workspace, and never in the installation directory."},{"type":"p","text":"The  directory may be hidden from normal user views if appropriate, but .agent_runtime"},{"type":"p","text":"remains inside the authorized workspace."},{"type":"p","text":"Generated code must never be stored inside the application's installation directory."}]},{"number":"112","label":"112.","id":"s112","title":"Packaged Application Resource Access","page":143,"blocks":[{"type":"p","text":"Packaged static resources should normally be read-only at runtime."},{"type":"p","text":"Examples:"},{"type":"p","text":"character assets"},{"type":"p","text":"UI resources"},{"type":"p","text":"default configuration"},{"type":"pre","text":"schemas"},{"type":"p","text":"built-in prompt templates"},{"type":"p","text":"platform binaries"},{"type":"p","text":"Runtime code should not modify packaged application resources."},{"type":"p","text":"Updates to packaged resources should occur through application update mechanisms rather than normal agent execution."}]},{"number":"113","label":"113.","id":"s113","title":"Build-Time Dependency Validation","page":144,"blocks":[{"type":"p","text":"Before producing a release artifact, the build pipeline should verify:"},{"type":"ul","items":["Required dependencies exist","Required platform binaries exist","No development-only secrets are included","Test configuration is not shipped as production configuration","Private developer credentials are not bundled","Platform-specific providers can load","Required application assets exist"]},{"type":"p","text":"Build failures should be explicit."},{"type":"h","text":"Dependency Completeness"},{"type":"p","text":"A dependency counts as present only if it can run."},{"type":"p","text":"Bundling a dependency's importable modules is not sufficient. The packaged artifact must also contain the helper executables, native libraries and data files that dependency launches or loads at runtime, and the build must verify this rather than assume the packaging tool discovered them."},{"type":"quote","text":"A dependency that imports successfully and then fails when used is indistinguishable, to the user, from a broken feature."},{"type":"p","text":"Where a capability is offered on the basis of a dependency being present, the check that decides whether to offer it must test the same thing the capability will later rely on. Testing that a module can be imported, while the capability needs a subprocess that module spawns, will advertise a capability that cannot work."},{"type":"p","text":"Release validation (section 114) must exercise, on the packaged artifact, at least the start of every capability the interface advertises, so that a capability which is unavailable in the packaged build is discovered by the build pipeline rather than by the user."}]},{"number":"114","label":"114.","id":"s114","title":"Release Validation","page":144,"blocks":[{"type":"p","text":"A release artifact is not considered valid until it passes a clean-machine launch test."},{"type":"p","text":"Testing should verify that a user can:"},{"type":"ol","items":["Install or launch the application.","Complete initial configuration.","Select a writable workspace.","Configure a model.","Authenticate using API Key or OAuth where supported.","Start every authentication method the interface advertises, at least as far as it can be started.","Launch the desktop agent.","Open the Overview.","Open Settings.","Start Listener components.","Run an immediate agent task.","Create a scheduled task.","Restart the application and verify persistent state.","Verify filesystem sandbox restrictions."],"start":1},{"type":"p","text":"The test machine should not rely on a developer Python environment."},{"type":"p","text":"scripts/release_validation.py walks these fourteen steps against a built artifact, not a developer checkout, using a throwaway data directory and workspace. In the release pipeline the artifact it validates is the release build, which carries no Debugger."}]},{"number":"115","label":"115.","id":"s115","title":"Platform Release Testing","page":145,"blocks":[{"type":"p","text":"Release testing must be performed separately on:"},{"type":"ul","items":["Windows","macOS","Linux"]},{"type":"p","text":"A successful build on one platform does not imply that another platform is working correctly."},{"type":"p","text":"Platform-specific tests should cover:"},{"type":"ul","items":["Application startup","Listener permissions","Active application detection","Browser monitoring","Filesystem monitoring","Notifications","Scheduler persistence","Background Heartbeats","Runtime sandbox","OAuth callbacks where applicable","Secure credential storage"]}]},{"number":"116","label":"116.","id":"s116","title":"Build Automation and CI","page":145,"blocks":[{"type":"p","text":"The repository should support automated release builds using CI or an equivalent build pipeline."},{"type":"p","text":"Conceptually:"},{"type":"p","text":"Git Commit / Release Tag"},{"type":"pre","text":"          |\n          v\n+-----------------------------+"},{"type":"p","text":"|      Automated Tests        |"},{"type":"pre","text":"+-------------+---------------+\n              |\n     +--------+--------+\n     |        |        |\n     v        v        v"},{"type":"p","text":"Windows    macOS    Linux"},{"type":"p","text":"Runner     Runner    Runner"},{"type":"pre","text":"  |        |        |\n  v        v        v\nOS isolation tests, for real\n  |        |        |\n  v        v        v\npython build.py --no-debugger\n  |        |        |\n  v        v        v\nRelease validation on a clean machine\n  |        |        |\n  v        v        v\n.exe      .pkg    .deb\n.zip      .dmg    .AppImage\n                  .tar.gz"},{"type":"p","text":"Stable names, build-provenance attestation, SHA256SUMS.txt"},{"type":"pre","text":"|        |        |\n+--------+--------+\n         |\n         v\n   Release Artifacts"},{"type":"p","text":"The pipeline is GitHub Actions (.github/workflows/release.yml). It runs on release tags (v*), on manual dispatch and on pull requests that touch code or build files."},{"type":"ul","items":["The test suite runs once, on Ubuntu, followed by python build.py --validate-only","Each native runner - Windows, macOS and Linux - then exercises the operating system's isolation of agent code for real (AppContainer, Seatbelt, bubblewrap), builds the application from the commit with --no-debugger, so no released download carries the Debugger, and runs scripts/release_validation.py against the packaged application","On a release tag, the files are given stable names (section 117), each receives a GitHub build-provenance attestation (actions/attest-build-provenance) that ties it to the tagged commit and the workflow run that built it, and a SHA256SUMS.txt listing every file's checksum is published with them"]},{"type":"p","text":"PyInstaller builds are not byte-for-byte reproducible, so a released file cannot be checked by rebuilding it from the source. The attestation, not a rebuild, is what ties a file to the code. Anyone can check it with:"},{"type":"pre","text":"gh attestation verify \u003cfile\u003e --repo fhbzc/Personal-Agent-WaterMelon"},{"type":"p","text":"The builds are not code-signed, so Windows SmartScreen and macOS Gatekeeper warn once when a downloaded file is first opened. Production signing credentials, if they are added, must be handled by the CI secret-management mechanism and must never be committed to the repository."}]},{"number":"117","label":"117.","id":"s117","title":"Release Deliverables","page":146,"blocks":[{"type":"p","text":"A complete project delivery must include:"},{"type":"p","text":"Source Code"},{"type":"p","text":"requirements.txt"},{"type":"p","text":"README.md"},{"type":"p","text":"Build Scripts"},{"type":"p","text":"Automated Tests"},{"type":"p","text":"Platform Packaging Configuration"},{"type":"p","text":"and successfully generated platform release artifacts:"},{"type":"p","text":"Windows:"},{"type":"pre","text":"PersonalizedAgent-Setup-windows-x64.exe       installer\nPersonalizedAgent-portable-windows-x64.zip    portable archive"},{"type":"p","text":"macOS:"},{"type":"pre","text":"PersonalizedAgent-macos.pkg                   installer\nPersonalizedAgent-macos.dmg                   disk image with the .app"},{"type":"p","text":"Linux:"},{"type":"pre","text":"PersonalizedAgent-linux-x86_64.deb            package\nPersonalizedAgent-linux-x86_64.AppImage       single-file application\nPersonalizedAgent-portable-linux-x86_64.tar.gz   portable archive"},{"type":"p","text":"and, with them:"},{"type":"pre","text":"SHA256SUMS.txt                                the checksum of every file"},{"type":"p","text":"The released downloads are built by GitHub Actions on Windows, macOS and Linux runners, from the tagged commit, with --no-debugger (section 116). Each carries a GitHub build-provenance attestation, which can be checked with gh attestation verify \u003cfile\u003e --repo fhbzc/Personal-Agent-WaterMelon. The files are not code-signed, so SmartScreen and Gatekeeper warn once."},{"type":"p","text":"The open-source release repository is github.com/fhbzc/Personal-Agent-WaterMelon, under the MIT licence."},{"type":"p","text":"The project is not considered complete if only development source code is provided."}]},{"number":"118","label":"118.","id":"s118","title":"Updated Final Deliverable Requirement","page":147,"blocks":[{"type":"p","text":"The final implementation must satisfy all of the following:"},{"type":"p","text":"Source code available"},{"type":"pre","text":"+"},{"type":"p","text":"Python dependencies versioned"},{"type":"pre","text":"+"},{"type":"p","text":"Windows build succeeds"},{"type":"pre","text":"+"},{"type":"p","text":"macOS build succeeds"},{"type":"pre","text":"+"},{"type":"p","text":"Linux build succeeds"},{"type":"pre","text":"+"},{"type":"p","text":"Applications launch without system Python"},{"type":"pre","text":"+"},{"type":"p","text":"Filesystem sandbox remains enforced"},{"type":"pre","text":"+"},{"type":"p","text":"Model authentication works"},{"type":"pre","text":"+"},{"type":"p","text":"Listener works"},{"type":"pre","text":"+"},{"type":"p","text":"Agent heartbeat and state heartbeat work"},{"type":"pre","text":"+"},{"type":"p","text":"Scheduler survives restart"},{"type":"p","text":"Only after these requirements are met should the implementation be considered a complete Personalized Agent release."}]},{"number":"119","label":"119.","id":"s119","title":"Delegating Work","page":148,"blocks":[{"type":"p","text":"Work comes to mind wherever the user is: looking at a folder, reading a page, scanning their to-do list. **Delegate work** is available in every one of those places, and every route ends at the same draft: the context is collected, a plan is drafted, and nothing runs until the user has read it and pressed Start."},{"type":"p","text":"The subsections say how a start is drafted (119.1), how what bears on the work is found (119.2), where work is handed over from (119.3), and what every run that made something leaves behind it (119.4)."},{"type":"p","text":"*Amended 2026-10-18:* NOT DONE UNTIL EACH CORE PROMISE WAS TRIED AND HELD. A final review that found nothing to fix ended a run done even when the tester had just said a core promise was \"untried\" - seen with a client whose tester could not open the file. Now a core promise that did not hold, or that nobody could try, is a high finding of the final review, named by its promise (`Run._final`), and goes to the same rounds of fixes; still unverified after them, the run ends not finished, saying which promise was never tried for real. One only the user can check stays theirs, on their list.","amended":true},{"type":"p","text":"*Amended 2026-10-18:* TWO FINAL CHECKS, BOTH TO PASS. After the final review, two reviewers who never saw how the work was built look at it, each in a context of its own (`Run._final_checks`): the QUALITY CHECK opens and tries it and says what the result should be, never how to write it; the PRIVACY CHECK looks through everything it made - code, documents, slides, data - for the user's private information or another real person's that the task did not ask for, for anything a program sends away that was not asked for, and for anything it installs or leaves outside its own folder (a startup entry, a service, a browser setting, a page reachable from the network). Each passes only when it could open what it checks and found nothing high or medium; one that could not look has not passed. What they find goes to a round of fixes, at most three for each, and both look again; one still failing after its three ends the run \"failed a final check\", saying which and what it found - and it can be continued. Every run is checked so: the user's own, and each way of the Work debugger, the single model too, which is given what they found and goes on until both pass. Each check is a kind of its own in the token charts - a line of its own in a run's chart of calls, and a task of its own in the application's (`work_quality_check`, `work_privacy_check`).","amended":true},{"type":"p","text":"*Amended 2026-10-18:* THE WORK TAB SHOWS THE AGENT'S OWN WORK. What was learned of the user's own work on a project - its stages and what they show of the user - is no longer drawn there: it is kept, and the agents use it, as the lessons are (section 124). The panel beside the projects shows the agent's own work on the one chosen, its runs and their stages; each project is still learned from its row.","amended":true},{"type":"p","text":"*Amended 2026-10-18:* A RUN'S OWN NOTES IN ENGLISH, WHAT IT DELIVERS IN THE USER'S LANGUAGE. The builder and the reviewers write their own notes on the work in English - the cards, the stages, the questions and their answers, the findings, the summaries, the version descriptions and the reports the Work tab shows - as everything else the agent keeps for itself is (section 119.2, as amended). What a run delivers is in the user's display language: the documents, pages, slides, messages and other files it makes, the words inside its programs that their users read, and the README (section 119.4) - unless the user's instruction asks for another language, and then in that one. Code itself is written as code is. It is said once, at the top of every call of the run (`WORK_LANGUAGE`), the display language first and the English notes as the exception to it, so the Language debugger shows it as sent.","amended":true},{"type":"p","text":"*Amended 2026-10-18:* THE FULL REVIEW IS THE REVIEWER'S TO ASK FOR, AND ONLY A CHECKPOINT IS A VERSION - the user's decisions. There is no full review every five rounds any more: with each round's review the reviewer says whether one is due now, at a milestone - a deliverable done, a core promise that now holds, the work's shape changed, a point worth coming back to, or a doubt that work done before still holds - and the application gives it what it can see as hints: the last checkpoint and the rounds since, whether the work agent says a card or the whole goal is done, the core promises not holding before the round, the deliverables done since; the call is the reviewer's. A full review covers EVERYTHING SINCE THE LAST CHECKPOINT, not the round alone: the rounds since, each with what it set out to do and came to, the files changed since (against the checkpoint's version), the cards done before it - each card those rounds touched checked against its criteria, every core promise tried again, a done card whose files changed checked again, and a card that no longer holds opened again; it is the only review that may end the run. It is one answer with room for it (36 rounds of tools), or, when more than six cards were touched, an answer a card and one that tries the promises and concludes. PASSED, IT IS A CHECKPOINT, and a version is kept; not passed, none is, and the work goes on with what it found. The versions a run keeps are its checkpoints alone: the contract approved, the contract amended by the user's new words, each full review passed, and the run done - not each round, not the final review or the deck (kept with the run done), not a pause, a stop or a limit. A run cut off - the application closed under it - goes back to its last checkpoint, as it went back to its last milestone before, and work since is done again; a pause goes on from where it stopped, its to-do list in its plan. Only a checkpoint can be gone back to. One model on its own has no reviewer, and keeps a version a turn as before.","amended":true},{"type":"p","text":"*Amended 2026-10-18:* WHAT THE USER WOULD EXPECT AND DID NOT SAY IS ADDED, AS ADDED - the user's decision. Reviewing the contract, the reviewer lists what the work should hold that the contract leaves out, from the user's past work and what they asked, each with what it rests on, in three kinds: \"implied\" - what their own words already call for (a payment that fails charges nothing) - joins that core promise as a failure it must survive; \"needed\" - without which what they asked would not serve them - is a supporting deliverable, done with the core; \"nice\" is a polish deliverable, done once every core promise holds. None is a core promise of its own: those are the user's words alone. The work agent says what the work showed the user would need, with what showed it - a file, a record, a result - and the reviewer decides whether it is added and as which kind. Each is recorded in the contract as added, by whom and on what, shown on the Work tab as \"Added - not your words\", and the user may take each out (on a run not working at the time): its deliverable is set aside, or the failure it added to a promise dropped, and the record keeps that it was. A finding the reviewer queues on a deliverable is now a part of it - before, it became a deliverable of its own, outside the contract and with no tier; one queued on the goal itself is added as a polish deliverable, as above. The work agent still never sees the user's past work: only the plain criteria the reviewer writes from it.","amended":true},{"type":"p","text":"*Amended 2026-10-28:* A RUN MADE FASTER - the user's decisions, after a run that was planned for ten hours took twenty-nine: 15.3 hours stopped, 4.8 lost to an update closing the application under it, 1.3 paused and 7.6 of work, its builder's calls slowing from a few seconds a step to 10-24 as each went on. Seven changes, none of them a split or a merge of the reviewer's calls. The builder does not try the core promises itself before it returns a round: the reviewer tries them in every round's review, and trying them twice - a replication run can take tens of minutes - would cost more than the round it might save (the user's decision).","amended":true},{"type":"ol","items":["THE CONTRACT'S PACKAGES, AHEAD. The contract names the Python packages the work will need; once it is approved they are installed in the background - asked once, when the user wants to be asked - and a round asking for one of them waits for that install instead of starting another.","A RESULT GIVEN AGAIN ONLY ON EXACTLY THE SAME INPUTS (`agent/work/reuse.py`). `run_python` and `run_tests` record, as the code runs, every file it opened to read - its data and every script it imported, however deep, wherever they are - every folder it listed and every file it wrote, in its own process and in any Python process it started (`runtime/guard.py`, `RECORD_ENV`). Asked again, the result is given again only while every one of them is as it was - each file by its size and the time it last changed, to the nanosecond, one look and nothing read (hashed, every file a script that walked the folder had read was read again after each run, for results a replication's exploring never asked for again; measured 2026-10-29), counted before any is looked at - with the same Python and packages (the packages by the top of their folder, as pip leaves them: walking all 25,961 files of a replication's took half a minute before each run), and it says so: whose run it was and when, what was checked, what cannot be seen (native code inside a library, the time, randomness), and that `fresh: true` runs it anew - the agent decides. Never given again: code that started a program other than Python, that loaded a library opening files in its own native code, that ended in an error, that ran under five seconds; `run_command` never.","BUILDER CALLS HANDED OVER BEFORE THEY GROW LONG. Each step of a call reads all of the call so far. Past 40 tool steps or 15 minutes of the model's own time (`CALL_MOST_STEPS`, `CALL_MOST_MINUTES`) - steps counted alike whether the run's own loop or the client runs the tools; the minutes its thinking and writing alone, not its tools running, the run held paused or a wait for the model, because code that runs long grows nothing (a replication's calls were handed over after 10-35 steps, their context still small, while the minutes counted its code) - the work agent writes a handover note: the card, what is done, what is next, the files it changed and how, what is open and what it ran to check. A fresh call goes on from the note, the brief as it is now and the files the round wrote; after six handovers in a round the last call is let finish. The note is in the plan: a progress point holds it, and a round gone on from that point goes on from it. Each handover is said in the live session with its steps and minutes - all of them, the model's own and its tools'. EVERY TOOL'S TIME IS KEPT in the run's log and its live session, never told the agent: its whole time and its wait for its turn, and for run_python and run_tests their parts - the key, the reuse check, the code itself, the look at the folder before and after, and what keeping the result for reuse took.","THE REVIEWER'S CALLS THAT WERE SEPARATE ALREADY, SIDE BY SIDE - no call split, none merged (`Run._at_once`, at most four at once, one at a time while the computer is busy). A full review of six cards or fewer is still one call. Past six, each card's own call - asked one after another before - now goes at the same time, each in a context made from the review's, and the call that tries the core promises and concludes still comes after them all, given their answers, so ending the run is decided with everything in view. The quality and privacy checks look at the same time. Each call checking beside another is told where in the checks folder its code writes; the code they run still goes one at a time.","INSTALLED ENVIRONMENTS LEFT OUT, AND WHAT CODE CHANGED HEARD (`environments.py`, `changes.py`). A replication's folder held seven virtual environments the builder had made to try an install - 46,956 files and 1.85 GB beside some 600 of the work - and before and after every run_python and run_command the tools looked at up to 20,000 files to see what the code changed: about half a minute a step. Now what code changes is HEARD while it runs - the system's notifications of the folders the work may write, as the listener hears the user's, from Python and any other program alike - and the walk is only the fallback. And every walk of the work's folder - that fallback, each version and progress point, a full review's files since its checkpoint, a rollback, the tests' key and copy - leaves an installed environment out, told by what it holds (a `pyvenv.cfg`, a `conda-meta`, a folder of installed packages: `site-packages`, `dist-packages`), never by a name a work might use for its own. Left out is not forgotten: each version keeps the packages each environment held; a rollback leaves them as they are and says what changed in each since; the full and final reviews and the final checks are told each is there, with its packages, to judge whether it belongs in what the work delivers. The work agents are told an environment of their own - only to try an install - goes in the scratch of the folder they write (`.agent_runtime/envs`), never in what the work delivers, and is removed after; what install_packages installed needs none. Every tool's time is kept besides, in the run's log and live session and never told the agent: its whole time, its wait for its turn, and run_python's and run_tests' parts.","A CLEAN STOP WHEN THE APPLICATION CLOSES - Quit, or an update taken up. Every run going is held at its next safe point and keeps where it stands now as its progress point (`WorkRuns.close`, at most 30 seconds): in a round - its work or its review - the round and what the work agent did in it; between rounds, after the last. Its status is left as it was, so the next start marks it interrupted, and it goes on only when the user continues it - nothing is said, nothing starts by itself - from that point, not from one before.","LINES FOUND BY A WORD, AND READ ON FROM THERE (2026-10-29). A step of reading looked slow in the live session, and was not: read_file took a hundredth of a second, and what followed was the model's next turn under its name. What cost was what it read: a fresh call after a restart read the work's main script and its 694-line document whole - six reads, some 144,000 characters, carried by every later step of the call - because a function looked for by its name could only be found by reading its file from the first line (find_files says which files hold a word, never where), or by writing a script to search. Now `find_in_files` gives each line that holds a word or a pattern with its file and number, as grep does - in one file or all through a folder, with the lines around it if asked, never into installed packages, saved versions, caches, binary files, the agent's scratch or the run's own folder unless asked to look there (searched from the top of a replication's folder, its 21,005 files took 73 seconds, 11,084 of them the reviewer's checks; without those, 6,993 in 8) - and read_file reads from that line to the line asked for (`to_line`; without it, on to the end), only the part needed. And since a start without an end is half of it, a line found that opens a block - a function, a class, a `{ ... }` block, a Markdown section - comes with where that block likely ends and how that was told (`blocks.py`): a Python function's or class's last line by Python's own parser, by indentation where the file does not parse; R's, C's, JavaScript's or Stata's by matching braces past strings and comments; a Markdown section's at the next heading as high. It is said to the agent as an ESTIMATE, its to change - read up to it, and on, or less, as it sees. find_files, which looked through everything a glob reaches, leaves out the same folders from above: from the top of a replication's folder `**/*.py` went through 53,154 files in 89 seconds, and goes through 2,924 in 6. On a replication's folder: 8,056 of 8,082 Python definitions, 2,034 of 2,045 Markdown headings, and every R function of the work's own (those left without were commented out, or one line with no braces). read_file's lines count from 1, as its code always counted (its description said 0); a read cut at 40,000 characters says where to go on from (`next_from_line`). And a builder call that hands over says, of each file it read that the next will need, what it holds and at which lines, so the fresh call reads those parts and not the whole again."],"start":1,"amended":true}],"amendment_note":"2026-10-28: a run made faster - the contract's packages installed ahead, a result given again only on exactly the same inputs, builder calls handed over before they grow long, the reviewer's calls that were separate already side by side, installed environments left out and what code changed heard while it runs, a clean stop when the application closes, and lines found by a word (find_in_files) and only those read (read_file from_line to to_line, a block's end estimated), with a handover that says what each file read holds and where (2026-10-29). Earlier, 2026-10-18: a run is done only when every core promise was tried and held, and when two independent final checks - quality and privacy - both pass; the Work tab shows the agent's own work, not what was learned; a run's own notes are in English, what it delivers in the display language; the full review is the reviewer's to ask for and a version is a checkpoint; what the user did not say is added as added.","amended":true},{"number":"119.1","label":"119.1","id":"s119-1","title":"Every Start of Work Goes Through a Draft","page":148,"blocks":[{"type":"p","text":"*Modules: `agent/work/delegate.py`, `api/routes.py` (`/api/work/drafts*`), the Delegate work box in `api/web/app.js`.*"},{"type":"p","text":"No work starts directly any more. Every start, from whatever place, makes a **draft** (a `work_drafts` row) and goes through four steps:"},{"type":"ol","items":["**The context is collected**, in a process of its own (section 120). It holds what was handed over; the window it came from, when text was selected in one (its title, its address, and the words the listener last read off the screen, never by signing in); the public page at that address, read as anyone could read it; the folders given (their entries and a README if there is one); the start of each file gi
