 evidence of a different kind - what the window held at another moment, which is usually the same thing and is never the same claim. A window nothing ever read stays as it was, because there is genuinely nothing to show."},{"type":"p","text":"### A Window That Says It Is Working Is Still One Window"},{"type":"p","text":"The first thing folding missed was a spinner."},{"type":"p","text":"Two entries from the live feed, fifty seconds apart, one terminal, one session, identical but for the character at the front: `◐ Upload instruction` and `✳ Upload instruction`. A window title carries decoration that ticks while the window does not - a spinner, an elapsed count, a percentage, a step out of a total - and each tick was a new thing to be told about."},{"type":"p","text":"So the title is reduced to **what is left when the parts that tick are taken out**, for the purpose of deciding what is the same thing and for nothing else: the step is still shown the title the window actually had. Digits are not stripped generally, because a title is mostly names and *Chapter 3* and *Chapter 4* are two files and two afternoons."},{"type":"quote","text":"Measured on the live feed afterwards: four hundred real events fold to fifty."},{"type":"quote","text":"**A burst shares a timestamp**, and the query that reads these events ordered by time alone left the order within each second to the query plan - so \"spend the budget on the most recent first\" was picking arbitrarily among the readings written in the same second. Ordered by insertion as well, which is the order they were observed."},{"type":"h","text":"What The Phrase Became"},{"type":"p","text":"Removed. Search rows, the words a search was reduced to, the words that matched, their scores, the field each was found in and re-indexing all went with the library index and search (commit fcf74e1). Nothing searches the library any more, so there is no match to explain: a step's trail shows the window it was given and the items it opened by id."},{"type":"h","text":"Which Word Found It"},{"type":"p","text":"Removed, with the search it explained (see above)."},{"type":"p","text":"### And Where, And Whose Word It Was"},{"type":"p","text":"Removed, with the search it explained (see above)."},{"type":"h","text":"Four Questions, Asked Four Times"},{"type":"p","text":"The four steps were four sections of one prompt, answered in one call."},{"type":"p","text":"That is one act of attention divided four ways. Four gatherings were poured into a single context and told apart only by a label, so whichever question was being answered had the other three's memories in front of it as noise. And it could not do the obvious thing: show the later steps **the states step 1 had just written in the same run**, because all the answers had to be composed at once."},{"type":"p","text":"Each step is now asked on its own:"},{"type":"ul","items":["its **own question**, and not the other three","its **own copy of the same window** of activity","**what the earlier steps concluded** - one line each, not their whole answers, because a step reading a second prompt's worth of JSON to find one fact is back where it started","and, for the steps after the first, **the states the first has just written**, which a single call could not show them"]},{"type":"p","text":"**A call is not told that it is one of four.** It was: the preamble said so, the instructions were headed `STEP 2 of 4`, one referred the reader to another step by number, and what earlier steps had worked out arrived as `Step 1 concluded:`. None of that is usable by a call that cannot see the list, and naming it invites answering the list rather than the job. Each call now gets its own job and the findings that already exist - *already established in this review* - with nothing in it that has an ordinal."},{"type":"p","text":"**The cost is real.** The preamble is repeated four times and the measured input roughly doubles. That buys three things the single call could not have: attention that is not divided, context that is not shared out, and a step that can see what the step before it decided."},{"type":"p","text":"**A model that is away ends the run rather than failing four times.** Asking three more times is three more failures and the same answer - and the steps are filled in before any call is made, so what every step had gathered is still there to look at."},{"type":"h","text":"Running One, And Seeing All Of It"},{"type":"p","text":"The heartbeat is the part of the agent nobody can watch. It runs on a timer, decides what is worth doing, and all that is visible afterwards is a calendar that has changed - so \"why did it do that\" had no answer short of reading a log."},{"type":"p","text":"The Debugger can run one on demand and show each step, including the calls it made:"},{"type":"ul","items":["**the window it was given**, and **what it chose to open in full**","**the text the model was actually given**, in full","**the prompt it was sent and the answer it gave**, since each step now has its own","**what came of it** - states written, contacts written, notifications added or disabled, next steps ticked - sorted back to the step that asked for it"]},{"type":"p","text":"The second of those is the one that earns the panel. What a step was *given* is already recorded and was already visible; what the model was *handed* is a different question, and the gap between them is where an answer that reads oddly is usually explained."},{"type":"p","text":"### Watched, Not Waited On"},{"type":"p","text":"Four calls take about a minute between them, and a panel that shows nothing until the last of them returns looks broken for that minute - which is section 15.1's point about a request that says only \"thinking\"."},{"type":"p","text":"The gatherings all finish **before** the first model is asked, so within a second or two of the button every step is showing the window it was given. What remains is four calls, and each appears as it answers: the step being asked says so, the ones behind it say they are waiting."},{"type":"p","text":"### One Run, Not A Description Of One"},{"type":"p","text":"The panel is only worth having if it shows the thing itself."},{"type":"p","text":"The button posts to the same `run_once` the timer calls. The trigger is checked once - only the timer and the Debugger may start a full run; the notification step alone also runs from on-screen triggers (section 37) - and then written down; **nothing branches on it**. Same gathering, same folding, same prompts, same tools, same window, since the window is fixed by the last review rather than by a number a debug path could choose differently. The two genuine differences are *when* the run happens, and that whoever asked for it gets the whole report while the polled copy has the events and the context stripped."},{"type":"p","text":"This is worth stating because the alternative fails quietly. A debug path that assembled its own context, or asked its own prompts, would be a panel describing a heartbeat rather than showing one - and it would drift in exactly the direction that keeps looking fine."},{"type":"p","text":"### Numbered, So A Reader Knows Where They Are"},{"type":"p","text":"The four steps were numbered and everything inside them was not."},{"type":"p","text":"A step holds several sections and a trail that can run to a dozen rows, so somebody scrolling met *\"the context, as it stood at the end\"* with nothing saying which step it belonged to or how far through it they were - and the four numbers they had been following were by then far above. Each section is numbered within its step, `1.1` to `1.7`, which carries both facts in the space of a heading. A label nested inside a section is not numbered, because it is not one."},{"type":"p","text":"**And a section the step has not reached does not report itself as reached.** The sections are stages, so a step on its second round has not arrived at most of them - and they were filling themselves in anyway. The summary said *\"the model chose what to look at, asked for more twice, and wrote the answer\"* while it had written nothing, which is not a summary of what happened but a guess at how it will end; the context was labelled *\"at the end\"* of a step that had not ended, beside a figure still growing. While a step is unfinished, the stages it has not reached say so and show nothing - including the context, which is not worth a running total: it changes with every round, so the number is out of date by the time the line it is on has been read."},{"type":"p","text":"**A step whose turn has not come says only that.** All four are gathered for before any of them is asked, so steps two, three and four had a context, a token count and a trail before the first was touched - and sat there reporting what they were holding while step one was still on its first round. They run one after another; until its turn comes, a step has one thing to say."},{"type":"p","text":"**Every row of a trail prints what it cost**, in time and in tokens. Without it a trail is a list of things that happened with no way to weigh them: the folding and a model call read alike, and somebody looking for where a minute went has nowhere to look. The zeros are printed too - a tool call spends no tokens, the folding spends none, the floor is a database read - because that is the fact rather than a gap in the measuring, and it is the fact the row exists to establish."},{"type":"quote","text":"A call's row is written before the call it stands for, so what it cost is filled in when the answer comes back. The row that ends a loop is the moment it stopped rather than a cost of its own: the answer arrived in the call above it and is charged there, not twice."},{"type":"p","text":"**And a step that has finished always prints what it cost**, including when that is nothing. A step that made no call spent no tokens and no time waiting for one, and a blank where the number goes reads as a step that was never measured - which is the one thing it must not be confused with."},{"type":"p","text":"**Nothing that happened inside the loop is shown above it.** No step is handed a context gathered from a query built before it ran: each starts from its window, and what it chooses to open is chosen during the loop, one row each, which is where it happened."},{"type":"p","text":"**The two levels are told apart by looking, not by parsing the number.** `1.2.7` and `1.3` are four characters apart and one of them is a step further in while the other is a step back out, so a reader meeting `1.3` after a trail has to work out which. The headings sit at the margin; everything belonging to a heading is indented under it behind a rule, and the outdent is then visible rather than inferred."},{"type":"p","text":"**Including the trail's own rows.** Two numbering schemes were running down the same column - the sections, and the round each call is on - so *\"answer round 3\"* sat directly above *\"1.3\"* and the two read as one counter disagreeing with itself. Every row of a trail carries its place inside its section, `1.2.1` to `1.2.7`, so the only numbers on the page are one sequence and the section after a trail follows its last row."},{"type":"p","text":"**And the numbers are a sequence.** They were not: the list opened with a summary of who decided what, then the gathering, then the context - which is what the gathering produced - so the numbers counted up while the story went back and forth. They now run in the order the step ran: the window it was given, what it did round by round, what that left it holding, the call, and what came of it. The two summaries are summaries, so they come after the thing they summarise and say that they are ones."},{"type":"quote","text":"The tab is **Heartbeat debugger**, not Heartbeat. Beside the user's own tabs - Overview, Calendar and the rest - a tab called Heartbeat reads as another of those rather than as a tool for looking at one."},{"type":"p","text":"### A Page Of Its Own, That Waits To Be Asked"},{"type":"p","text":"Two things followed from putting this inside the Debugger, and both of them got worse as it grew."},{"type":"p","text":"**It is a page, not a panel.** Reading one run means reading four prompts, four contexts, every event behind them and the trail of what each step decided - and it was sharing a scroll with the timeline, the states and the token usage. So it is a tab beside the Debugger rather than a panel within it. A build without the Debugger has no heartbeat page either: it is the same kind of door, and removing one while leaving the other is how a build ships an internal tool it meant to leave out."},{"type":"p","text":"**And it stopped refreshing itself.** Watching the run meant asking for it twice a second for the length of a run, and every answer now carries every event every step has read. That is a minute of the interface sharing its connection with the largest request it makes, which is what turned watching a heartbeat and using the Overview into two separate sittings."},{"type":"p","text":"The run is still watchable - a half-finished one comes back with the steps it has answered, and there is a button that asks. What is gone is the page deciding for itself when to want it. **It says so on the page**, because a run that is still going and a run that has stalled look identical on a display that does not move."},{"type":"p","text":"### What The Gathering Did, Round By Round"},{"type":"p","text":"Removed. The gathering trail - the plan, a search per folder, the fallback, the ranking, and taking or stopping against a budget - went with the library index and search (commit fcf74e1). A step now reads its window and opens items in it by id, and its trail shows exactly that."},{"type":"p","text":"**A step that is still going is not a step that concluded.** Almost everything shown about a step is written as a conclusion - *it did not search*, *nothing came of it*, *what it did* - and a step being watched has not decided yet. The state step read \"it did not search\" right up to the moment it searched, which is most of the minute somebody is actually looking at it. While a step is unfinished it says so and draws no conclusion."},{"type":"p","text":"**The steps are filled in before the model is asked**, so a run the model refuses still shows each step's window rather than an error and nothing - which is most of what anybody opening this panel wants to see."},{"type":"p","text":"### What A Step Could Have Done"},{"type":"p","text":"An outcome shows what happened, and cannot be read for what did not."},{"type":"p","text":"\"Nothing\" covers three different things: a step that considered something and decided against, a step that had nothing to decide about, and a step that was **never able** to do the thing the reader had in mind. The third is the common one - somebody looking at the state step for a notification is looking at the wrong step, and an empty outcome does not tell them so."},{"type":"p","text":"So each step lists **everything it is able to do**, with how many of each it did, including the zeroes - and ends with what it cannot do at all, because that is the question an empty list actually raises. The state step writes states and nothing else; notifications belong to one step, and only that one."},{"type":"p","text":"**The things that arrive in one list are counted apart.** The notification step's two acts - adding a notification and disabling one whose thing is already done - are counted apart, because *3 actions* answers neither of the questions anybody has about them. Each step's list is fixed: the state step writes states, the people step adds or updates contacts, the notification step adds or disables notifications, and the to-do step ticks next steps. No step judges states."},{"type":"p","text":"**And \"nothing\" is said in the step's own terms.** One sentence was shown for all four - *\"Nothing. Deciding against is an outcome - interrupting has a cost.\"* - which is true of the step that interrupts and of no other. A step that writes states was explaining itself by the cost of a notification it is not able to send. Each now says what nothing means where it stands: no state written, no one in this window, nothing worth interrupting for, no next step finished."},{"type":"p","text":"### Who Decided, And Why"},{"type":"p","text":"Two kinds of trail now run through the same panel and read identically."},{"type":"p","text":"No step chooses how far back to look or which folder to search: the window is fixed by the interval and the last review, and there is nothing to search beyond it. What every step chooses for itself, during the run, is which items in the window to open in full. From the results alone a choice and a setting read as the same list, and *why did it look there* has a different answer in each case: one is a decision to examine, the other is a setting."},{"type":"p","text":"So **every row says when it was decided and by what** - `the model chose, during this run`, `fixed before the run` with the name of the setting that fixed it (the window), `code, no choice and no model` (the folding) - and **each step says how much of it was the model's**."},{"type":"p","text":"The middle label said \"the agent chose\", which was worse than vague: the model is part of the agent and so is the code, so it named the thing all three have in common. The axis that distinguishes them is **when the decision happened and whether anything could have gone otherwise** - during the run by the model, before it by a setting, or not at all. And a row that was fixed in advance **names the setting**, because \"the agent chose\" is not something a reader who thinks it is wrong can act on. That last part is not the same as the rows, because \"the model did this step\" is true of all four and distinguishes none of them: what differs is whether the model chose what it was looking at or only what to say about it, and a reader should not have to reconstruct that from a list."},{"type":"p","text":"**And what the model said when it asked.** The arguments say what it wanted; they do not say why it wanted it. A list of ids opened is a list, and the question a reader has is what made those the ones worth reading - so whatever the model wrote in the same turn as the call is kept beside it. That sentence is the only account of the decision there is."},{"type":"p","text":"### The Events, Not How Many There Were"},{"type":"p","text":"The trail said `12 events`, in a panel whose whole purpose is to say what the step read."},{"type":"p","text":"The events are the answer to almost every question somebody opens this with, and a count is the one part of them that answers none. Each is now shown as itself - the time, the application, the window title, the whole address, and what it said - with the text of each capped, the list capped, and the remainder reported as a number rather than dropped silently."},{"type":"p","text":"**The states a later step starts from are the same failure one line down.** The state step starts from no states; the later steps start from the ones this review has just written, and a count of them is a count of the thing the step was reading. Each is named, and each says **how long it runs** - a state of forty minutes and one that has held for a fortnight are different claims about the user, and a title says neither. Each opens the card the Debugger's states grid opens: what it is, its period, whose it is, where it came from and on what judgement the agent believes it. The question a reader has here is the same question, so it is the same card rather than a second one that drifts."},{"type":"quote","text":"This is most of a run's size, so it goes to whoever asked for the run and not into the status polled every few seconds - the same split the context already has. The rows keep their shape either way, so nothing downstream has to know which copy it is holding."},{"type":"quote","text":"Step 1's floor is timed like any other gathering, although it is not a search. The call it feeds is charged against that row, and without it the step's tokens were attributed to nothing and the heartbeat reported three gatherings where it had made four."},{"type":"quote","text":"The text of one step runs to tens of thousands of characters. It is shown in a window that scrolls and opens out in place, because scrolling a window is not the same as reading a page."},{"type":"quote","text":"The context of four steps is tens of kilobytes of record text, and the status carrying the last run is polled every few seconds by the interface. Whoever asked for the run gets the text in the answer to that request; the polled copy carries everything else about the run and none of the text."},{"type":"p","text":"### Kept, Not Redrawn From Nothing"},{"type":"p","text":"The run was held in the page. Reloading the Debugger threw it away, and the panel came back empty with its button waiting to be pressed again - which is four model calls and a minute to see something that had already been worked out."},{"type":"p","text":"What was lost is the part that cannot be reconstructed by looking anywhere else: the prompts, and the text each step was handed. So the agent keeps the last run whole, and the panel asks for it when it opens. A reload now costs a request rather than a run."},{"type":"p","text":"The two readers stay two readers. The status polled every few seconds is still the light copy without the text (above); the whole one is fetched once, by a panel that is being opened. Before anything has run, that request answers that nothing has, rather than failing."},{"type":"p","text":"*Amended 2026-10-18:* TASKS AND PROJECTS, MADE PER RUN (section 34.5 in the code, `heartbeat/states/task_projects.py`, `project_round.py`). The grouping of states into tasks is replaced, the user's decision, measured first on a labelled week. EACH RUN that finds states written since the last one - twelve hours on the schedule, sooner when run by hand, none when nothing is new - makes ONE model call over them: the states are written down as TASKS, the distinct things the user did in that stretch, each with a title and a summary in English and a copy in the display language, its kind (work, leisure, or routine - kept, and grouped into nothing), the states it holds, how long it was actually worked on (the states' own minutes, each held to its span and the stretch's together to the stretch, scaled down alike when over) and where (its folders and pages). The writer is shown the user's PROJECTS - those with a task in the last seven days - each as one line saying what it IS, one level above any occasion, and may say a task continues one: when it serves the same thing - the same paper, the same product, the same application - whatever the activity, writing, submitting, presenting or discussing it; a shared topic, field or site is not continuing. The examples it is given are made up: one taken from the user's own subjects is an answer, and voided a measurement. PROJECTS are the week's tasks grouped by one partition over two layers - what the tasks mean (cosine of their English text, from 0.6) and what the writers said they continue - in an implementation of our own (the usual libraries are GPL). A project keeps its id while its main body goes on, measured in WORKED MINUTES, not in counts: two substantial parts (a fifth each) of different projects coming together is a merge, one coming apart in two is a split - each a new project, the old ones ended and pointing at where their work went - and a small piece coming or going changes nothing. A project's line is written when it is new, merged or split; its title is its most typical task of its latest run. A project with no task in seven days is dormant and is not continued: new work on the same thing later is new. No hierarchy and no pieces inside a task: the partition is flat. The projects are rows of `state_tasks` marked with this scheme, so Learning, Work, the English copies and the rest read them unchanged; the tasks are rows of `state_run_tasks`. The path of a task's folders was measured as a third layer and left out: one research folder pulled unrelated work together. Measured on the labelled week, written stretch by stretch as the runs would: 24 projects, the paper and its talks in one, the big subjects clean. THE SWITCH is on for everyone, this machine included: the first run marks every task and project of the earlier scheme as history - their content and their states untouched, never regrouped - and writes the last week in twelve-hour stretches, one after another, so the projects are there from the start; any state is enough to begin (the wait for twenty is gone). The Overview draws only the projects, as the tasks were drawn - a row each, with bars where it was worked on - with how long each was worked on, filtered by days and by at least 15 minutes, an hour, six hours or a day, longest worked on first, and its leisure ones shown only with full activity, under the work and headed apart from it; a project opens onto its card - what it is, what is being worked on in it, since when, where - not onto a list of its tasks (a project of one task is that task); the debugger's task panel shows each stretch written, with what was sent and what came back, and each project as a row over time with its tasks along it.","amended":true},{"type":"p","text":"*Amended 2026-10-19:* HOW A PROJECT CARRIES ON, the user's decision after a read-only replay of the week. THE WINDOW is no longer seven days but the latest tasks until 48 HOURS OF WORK (work and leisure), however many days that takes - days the computer was off do not count; its tasks are grouped again each run, the writer is shown the projects in it, and a project with no task in it is dormant. Over the window's tasks only, each earlier project is CARRIED ON by the new project that took 70% of its worked minutes, or by none: the one carrying it on takes all its tasks, those before the window too, so the Overview draws its history as its own, and takes its stages, its cards and which of its states were already read, and goes on learning from there. The new project keeps the id of the one it carries on that is also 70% of what it was made of - its tasks grouped before, not the new ones - and is the same project, renamed when it has grown; otherwise it has a new id, carrying on what it carries on all the same. An earlier project carried on by none ends: its tasks before the window and what was learned from it stay its own, as history, and the Overview still draws them; a new project carrying none on is learned from the start. A split is nothing of its own: neither half took 70%. NAMES are the model's, not a task's title: a project is named - a short title and the line saying what it is - when it is new, and again when its worked time has grown by 30% and by half an hour since it was last named, never otherwise; all the names a run needs are asked in the call that writes its tasks or in one call after them (twenty a call), and the names a project had, and those of the ones it carries on, are kept and shown in Work. A learning queued for a project that ends while it waits ends quietly: nothing is learned in its place, and the one carrying it on is learned when a run finds it changed.","amended":true},{"type":"p","text":"*Amended 2026-10-19:* A PROJECT COMING BACK. Work picked up again after days away is not in the window, so nothing carries it on there. So every project named or renamed in a run is looked for among the dormant projects and the ended ones that kept their history, of its kind (work or leisure): its English name and line against each of theirs and each name they had before, from a cosine of 0.55, the ten most alike - measured on the labelled record, named blind: from 0.55 the subject it came back to was among them 35 times in 40 by day and 5 in 8 by project, with a fifth of a wrong one beside it; shared folders found nothing the meaning did not, and are not used. One call shows the model the new projects and these look-alikes, each with some of its tasks, and it says which earlier one each new one IS - one at most, and none for a project that already kept an earlier id - and which it CARRIES ON, any number. An earlier project goes to one new one, being the same before carrying on, then the most alike. Being the same revives the earlier id - the new project's tasks, and what it carried on, go to it, and its learning and its setting go on; carrying on takes the earlier project's tasks, its names and, when learning next follows the tasks, its stages and what of it was read - to the end of a chain, when the one it went into went on into another. Each link keeps the model's reason, shown in the debugger.","amended":true}],"amendment_note":"2026-10-16: the user asked that every task's grouping be checked against their labelled week, and that small subjects may get a little worse; reading only telling places put fewer states in the wrong task.","amended":true},{"number":"38","label":"38.","id":"s38","title":"Data Management","page":86,"blocks":[{"type":"p","text":"Location:"},{"type":"pre","text":"./data_manage/"},{"type":"p","text":"What the agent keeps lives in two places: the raw activity the listener and the agent record, held in the local database for a few days (section 48.2), and a small library of files under the user's workspace (section 39.1). The directed knowledge graph this section first described is kept, unused, in deprecated/."}]},{"number":"39","label":"39.","id":"s39","title":"Knowledge Components","page":87,"blocks":[{"type":"p","text":"Superseded by section 39.1. A memory is now one file in one of the library's folders, not a graph node. The list and the schema below are kept as the record of the original design."},{"type":"p","text":"A Knowledge Component may represent:"},{"type":"ul","items":["Raw activity","User behavior","Agent activity","Conversation","Task","Application usage","Aggregated information","Observation","Summary","Project information","User-created information","Agent-created information"]},{"type":"p","text":"Recommended conceptual schema:"},{"type":"pre","text":"KnowledgeNode:\n    id\n    type\n    title\n    summary\n    content\n    created_at\n    updated_at\n    source\n    metadata"},{"type":"p","text":"The exact schema should remain extensible."}]},{"number":"39.1","label":"39.1","id":"s39-1","title":"The Library: Five Folders of Files","page":87,"blocks":[{"type":"p","text":"What the agent knows is kept as **files in folders**, under the user's workspace, where the user can read them and correct them."},{"type":"pre","text":"data/\n  user_nature/      who the user is\n  user_feedback/    what they thought of what the agent did\n  states/           what was true over a span\n  state_tasks/      what a run of states adds up to"},{"type":"p","text":"One record is one file: a short front matter block, and then the text. The folders `others/` and `agent-lesson/` are names only now - nothing writes or reads either any more - and an `index/` directory is still created empty, but nothing builds or reads an index. Nothing searches the folders as a whole: a record is read by its id, or a folder listed, by whatever wrote it."},{"type":"p","text":"**Every record says where it came from.** A record without that is an assertion with nothing behind it, and putting the agent's memory in files that anyone can open fixes nothing on its own if the files do not say where their contents came from - that was the graph's structural failure, not an accident of its storage. Three different questions, so three fields:"},{"type":"p","text":"| | |"},{"type":"p","text":"|---|---|"},{"type":"p","text":"| `source` | which part of the system wrote it - the agent heartbeat, the state heartbeat, the feedback service, the user |"},{"type":"p","text":"| `references` | which particular things it was drawn from, concretely enough to go back and look: a file path, an application, a URL, the id of a raw event, a task or question id |"},{"type":"p","text":"| `created_at`, `updated_at`, `observed` | when it was written, when the file last changed, and what stretch of activity it is about |"},{"type":"p","text":"The last of those three is not one fact. When something happened and when it was written down are different, and a round can write about yesterday - so a record that carries only the moment it was created is a pile of undated statements in which \"the deadline moved\" from August and from September are indistinguishable, both sounding true and one of them wrong."},{"type":"p","text":"Whatever writes a record fills these in, and where a model writes one, the round adds its own pointers on top of whatever the model cited - so a record whose model forgot to cite anything can still be traced back to the activity it came out of."},{"type":"p","text":"**Each folder carries an ``intro.txt``** saying where its contents come from and what belongs in it, so that opening the folder explains it. This is not decoration: a folder of four hundred files explains itself no better than a database did. An intro is written when it is missing and never overwritten: a user who rewrites one has said something about how they want that folder used."},{"type":"p","text":"**The parser is forgiving, because a file the user edited by hand is the normal case.** A missing field, a stray line, a key they invented - all are survived. A file with no front matter at all is still a record: its first line becomes the title. Refusing to read a note somebody dropped into a folder would be the wrong answer to a reasonable thing to do with a folder."},{"type":"p","text":"What made the graph a graph is not carried over:"},{"type":"ul","items":["Its weights, its evidence and its twelve probabilistic walks are gone. A number nobody can check, that decides what the agent remembers, is worse than no number"]},{"type":"p","text":"**A record is not rewritten for convenience.** The exceptions are a state, which is rewritten while it changes (section 34.2), and a nature, which gains examples as the same trait is seen again and can be merged with another nature that turns out to be the same trait."}]},{"number":"39.2","label":"39.2","id":"s39-2","title":"Lessons the Agent Writes for Itself","page":87,"blocks":[{"type":"p","text":"Removed. Nothing writes or reads `agent-lesson/` any more, and the chat has no memory tools, so the tool that wrote a lesson is gone. What the agent learns is now held by the lessons engine, which learns only from the user's own actions and covers notifications, connections and the natures of the user's work."}]},{"number":"40","label":"40.","id":"s40","title":"Knowledge Graph Edges","page":88,"blocks":[{"type":"p","text":"Removed. Graph edges went to deprecated/graph/ with the rest of the knowledge graph (commit a4d08c6), when the library of files (section 39.1) replaced it. Nothing in the application creates or reads an edge; the old `nodes` table survives only as schema."}]},{"number":"40.1","label":"40.1","id":"s40-1","title":"A Weight Is a Likelihood, Not a Rating","page":88,"blocks":[{"type":"p","text":"Removed. Edge weights went with the graph (commit a4d08c6). Nothing in the application weights, judges or reads an edge."}]},{"number":"41","label":"41.","id":"s41","title":"Graph-Based Context Retrieval","page":89,"blocks":[{"type":"p","text":"Removed. Retrieval by graph traversal went with the graph, and since commit fcf74e1 (2026-10-06) nothing retrieves over the library at all."}]},{"number":"41.1","label":"41.1","id":"s41-1","title":"Searching, and Searching Again","page":89,"blocks":[{"type":"p","text":"Removed. Nothing searches the library as a whole (commit fcf74e1, 2026-10-06). The chat answers from what it is asked and the conversation so far; the scheduler runs notifications and gathers nothing; the agent heartbeat reads its own window of activity and opens anything in it by its id."}]},{"number":"41.2","label":"41.2","id":"s41-2","title":"The Agent Searches For Itself","page":89,"blocks":[{"type":"p","text":"Removed. The chat has no search tool and gathers nothing before the model is asked. The floor, searching under several phrasings, summary expansion, rare-term weighting and the setting that turned agentic search on all went with the library search in commit fcf74e1."}]},{"number":"41.3","label":"41.3","id":"s41-3","title":"What Is Retrieved Together, Counted Before It Is Used","page":88,"blocks":[{"type":"p","text":"Removed. Counting what was retrieved together went with the data heartbeat that ran it and the usage log it read (commit fcf74e1). Nothing is retrieved, so there is nothing to count."}]},{"number":"42","label":"42.","id":"s42","title":"Retrieval Lifecycle","page":89,"blocks":[{"type":"p","text":"Removed. There is no graph and no traversal (commits a4d08c6 and fcf74e1), so there is no retrieval lifecycle. What each part of the agent reads is described where it is used: the chat in section 67, the agent heartbeat in sections 36 and 37."}]},{"number":"43","label":"43.","id":"s43","title":"Global Graph Escape","page":90,"blocks":[{"type":"p","text":"Removed, with graph traversal (see section 42)."}]},{"number":"44","label":"44.","id":"s44","title":"Retrieval Budget","page":91,"blocks":[{"type":"p","text":"Removed, with graph traversal (see section 42). There is no traversal to budget."}]},{"number":"44.1","label":"44.1","id":"s44-1","title":"Walking the Graph, and Learning from It","page":92,"blocks":[{"type":"p","text":"Removed. The nine probabilistic walks, the state-first gathering, the learned weights, and the judgement and shortening passes done in the data heartbeat went with the graph and the data heartbeat (commits a4d08c6 and fcf74e1). Nothing gathers before every model call any more: the chat is answered from the conversation alone, the scheduler runs only notifications, and only the agent heartbeat reads context before it asks - its own window of activity."}]},{"number":"44.2","label":"44.2","id":"s44-2","title":"A Walk Is Recorded Whole or Not at All","page":92,"blocks":[{"type":"p","text":"Removed. No walks are made and no round judges them, so there is no trace of walks to record. The general rule behind it - bound the data, not its serialised form - still holds wherever a record is cut to fit."}]},{"number":"44.3","label":"44.3","id":"s44-3","title":"An Answer Shows What It Rests On","page":88,"blocks":[{"type":"p","text":"The chat no longer answers from memory: it is answered from the instruction and the conversation it was asked in, so an answer has nothing under it to cite, and there is no \"built from\" panel and no citations in a reply."},{"type":"p","text":"The card described here lives on in the Debugger. A record or a state named in a heartbeat's trail opens a card beside it showing what it says, when it was written, what it was read from and, where the trail recorded them, the words that found it on that occasion. The card shows the record's title and, quietly, its id, because a title is not a handle and a reader who wants to come back to a record needs something to copy. It shows the text itself, scrolling rather than cut and opened at the first marked word, because the question a card is opened with is usually about a word in the body. What the record was read from is laid out as labelled facts, with the raw items it was built from counted rather than listed. A line about a folder or a window with nothing behind it is not a button."},{"type":"h","text":"A Call That Left Something Out Says So"},{"type":"p","text":"A tool schema marks arguments required, and under a text protocol that is a description of what should arrive rather than a check on what did."},{"type":"p","text":"The client has no tool protocol of its own here, so a call is whatever the model wrote, and the required list is something it may simply not have followed. A call arrived with no id; every tool met the absence in its own way; and what reached the user was `expand_memory finished {error: no record None}` (from a memory tool since removed) - naming neither the tool, nor the argument, nor what to do next, and reading like a memory that had gone missing rather than a call that was never complete."},{"type":"p","text":"So the check is made once, where calls are dispatched, and the answer names the tool, the argument and the next step. An argument supplied empty counts as left out, because a tool that takes an id can do nothing with `\"\"` and a search given an empty list has not been asked anything; a number or a boolean is never empty, since `0` and `false` are answers. What a tool requires is read from its schema rather than declared again, so a tool added later is covered by having a schema rather than by remembering to check."},{"type":"p","text":"It answers in general terms - which tool, which argument, call it again - because most tools met a missing argument however they happened to. A tool that refuses in its own words says more than that: scheduling explains what each field is *for* - what tells a task from every other one, whether it interrupts - and the general answer would replace that with less. Such a tool says so where it is registered, and is left to refuse. The default is the general check, so the cost of forgetting is a plainer message rather than no message."},{"type":"p","text":"Where a tool takes **either** of two arguments, the schema cannot say so and the tool must say it itself. The case that taught this was the chat's memory search, which accepted a list of phrasings or a single one and, called with a limit and nothing else, answered *\"nothing matched - try other words\"* to a question that was never asked. That tool has since been removed with the chat's other memory tools, and no chat tool now takes either of two arguments."},{"type":"p","text":"An answer that says what was actually wrong costs one line and ends it."},{"type":"h","text":"A Progress Line Says What Is Being Asked"},{"type":"p","text":"The line under a reply exists to tell the reader what the agent is doing while they wait."},{"type":"p","text":"It showed the first two arguments in the order they were written, and that order is not reliably what a call is *about*: a limit is how much of something, and the reader cannot see the something. Arguments that name the subject - the phrasings searched for, what was asked about, which record - are shown first, and a list reads as its words rather than as a list. A call carrying nothing but a limit still shows the limit: the line reports the call that was made, including when that call was a poor one."}]},{"number":"45","label":"45.","id":"s45","title":"Raw Events and Raw Edits","page":91,"blocks":[{"type":"p","text":"The system distinguishes between:"},{"type":"h","text":"Raw Event"},{"type":"p","text":"Primarily produced by Listener components."},{"type":"p","text":"Represents observed external activity."},{"type":"h","text":"Raw Edit"},{"type":"p","text":"Records what the agent did: an instruction received, a tool called, a model invoked, a task scheduled or run, a heartbeat run."},{"type":"p","text":"Examples:"},{"type":"ul","items":["Information accessed","Agent action","Task execution","File modification","Scheduler modification","Model operation"]},{"type":"p","text":"Raw events and raw edits are read as they are - by the agent heartbeat, the Overview and the Debugger - and are removed by age (section 48.2). Nothing turns them into memories."}]},{"number":"46","label":"46.","id":"s46","title":"Raw Edit Schema","page":92,"blocks":[{"type":"p","text":"Recommended conceptual schema:"},{"type":"pre","text":"RawEdit:\n    id\n    timestamp\n    task_id\n    source\n    event_type\n    instruction\n    accessed_information\n    action\n    result\n    related_nodes\n    metadata\n    processed"},{"type":"p","text":"The format should be optimized for cheap and reliable foreground writes. `processed` and `related_nodes` are kept in the table but are no longer used: nothing processes raw activity into records."},{"type":"p","text":"It does not need to be fully semantically organized immediately."}]},{"number":"47","label":"47.","id":"s47","title":"Agent Activity Recording","page":93,"blocks":[{"type":"p","text":"Every meaningful agent action should be recorded."},{"type":"p","text":"Examples:"},{"type":"ul","items":["User instruction received","Files read","Files created","Files modified","Scripts generated","Scripts executed","Scheduler tasks created","Scheduler tasks edited","Agent responses","Heartbeat actions"]},{"type":"p","text":"These records provide:"},{"type":"ul","items":["Traceability","Debugging","Future learning"]}]},{"number":"48","label":"48.","id":"s48","title":"Data Management Heartbeat","page":93,"blocks":[{"type":"p","text":"Removed. The data heartbeat (./data_manage/data_heartbeat/, every five minutes) was deleted in commit fcf74e1 (2026-10-06), with the indexer, compaction, folding and relabelling. Its one remaining job, removing old raw activity, is done by a small housekeeping loop that first runs five minutes after start-up and then every six hours (section 48.2)."}]},{"number":"48.1","label":"48.1","id":"s48-1","title":"Reading, Interpreting, and the Difference","page":90,"blocks":[{"type":"p","text":"Removed. Raw events are no longer read into library records, by template or by model, and there is no index: the reader and the indexer were deleted with the data heartbeat in commit fcf74e1. Raw activity is read as it is, by the agent heartbeat, the Overview and the Debugger."}]},{"number":"48.2","label":"48.2","id":"s48-2","title":"Raw Activity Is Material, Not a Second Copy","page":90,"blocks":[{"type":"p","text":"Raw activity is **material**, not a memory: a state copies what it relies on when it is written, so the raw rows behind it are needed only for a while."},{"type":"ul","items":["Raw activity is kept for a set number of days, eight by default, and then removed by age, whether or not anything was made from it","Only the agent heartbeat (its last few hours), the Overview (the last day and the past week) and page visit history read it, so older rows are read by nothing","File events that were never anyone's activity are swept out as soon as they are noticed","The window is a setting, and setting it to zero keeps everything"]}]},{"number":"49","label":"49.","id":"s49","title":"Data Heartbeat Workflow","page":94,"blocks":[{"type":"p","text":"Removed. The data heartbeat round was deleted in commit fcf74e1 (2026-10-06), and the graph it updated is kept, unused, in deprecated/."}]},{"number":"49.5","label":"49.5","id":"s49-5","title":"Every Round Writes New Nodes","page":94,"blocks":[{"type":"p","text":"Removed, with the data heartbeat (see section 49). No round writes nodes."}]},{"number":"49.6","label":"49.6","id":"s49-6","title":"What a Round Is Offered to Connect To","page":94,"blocks":[{"type":"p","text":"Removed, with the data heartbeat and the graph (see section 49). No round draws edges."}]},{"number":"49.7","label":"49.7","id":"s49-7","title":"The Index Is Built Here","page":94,"blocks":[{"type":"p","text":"Removed. The library index - the term index, the per-folder listings, the resident index, the stat guard and the splitting of compound terms - was deleted with the search in commit fcf74e1. The `index/` folder is still created empty, but nothing writes or reads it."}]},{"number":"50","label":"50.","id":"s50","title":"Data Compression","page":94,"blocks":[{"type":"p","text":"Removed. Graph compaction went with the graph (commit a4d08c6), and the library's compaction was deleted in commit fcf74e1."}]},{"number":"50.1","label":"50.1","id":"s50-1","title":"Fitting a Node as It Is Written","page":94,"blocks":[{"type":"p","text":"Removed, with compaction (see section 50)."}]},{"number":"50.2","label":"50.2","id":"s50-2","title":"Folding What Has Gone Cold","page":94,"blocks":[{"type":"p","text":"Removed. The index ceiling, folding cold records into summaries and the fold queue were deleted in commit fcf74e1, and the \"Data management\" settings group is now empty. A record still carries the `level` and `covers` fields that folding wrote, so older files still load."}]},{"number":"50.3","label":"50.3","id":"s50-3","title":"Being Used Brings a Record Back","page":94,"blocks":[{"type":"p","text":"Removed, with folding (see section 50.2). Nothing is folded, so nothing needs bringing back."}]},{"number":"50.4","label":"50.4","id":"s50-4","title":"A Summary Is an Index","page":94,"blocks":[{"type":"p","text":"Removed, with folding (see section 50.2). A record still parses a summary's own index fields, so older files still load, but nothing reads them."}]},{"number":"50.5","label":"50.5","id":"s50-5","title":"How Far a Retrieval Will Walk","page":94,"blocks":[{"type":"p","text":"Removed, with folding and retrieval (see sections 50.2 and 42). There is no walk to limit."}]},{"number":"51","label":"51.","id":"s51","title":"Data Heartbeat Invocation Restriction","page":95,"blocks":[{"type":"p","text":"Removed. There is no data heartbeat to restrict (see section 48)."}]},{"number":"51.1","label":"51.1","id":"s51-1","title":"Keywords, Maintained Each Round","page":99,"blocks":[{"type":"p","text":"Removed. Neither the data heartbeat nor any walks remain, so no round revises keywords to choose where a walk begins. Records still carry a `keywords` field."}]},{"number":"51.2","label":"51.2","id":"s51-2","title":"The Interval Is How Often to Look, Not How Often to Run","page":99,"blocks":[{"type":"p","text":"Removed. The data heartbeat's backlog loop, its five-minute idle check and the rule that an excess must shrink went with it in commit fcf74e1. The agent's own review keeps its own interval, fifteen minutes by default: its steps - states, people, notifications and, when there are open next steps, the to-do step - are asked one at a time, each with its own question, and the first is a loop that may ask for more up to six times, so a run is several model calls. That is the setting that decides most of what the agent costs when nobody is talking to it."}]},{"number":"52","label":"52.","id":"s52","title":"Scheduler","page":95,"blocks":[{"type":"p","text":"Location:"},{"type":"pre","text":"./scheduler/"},{"type":"p","text":"The Scheduler keeps the user's notifications: reminders and notices that appear at a set time. It runs nothing else. No script, agent run, model task or check can be put on the calendar, and a task of any other kind that turns up there is cancelled with a note saying why, not run."},{"type":"p","text":"Conceptually, it executes a scheduling loop approximately once per minute."}]},{"number":"52.1","label":"52.1","id":"s52-1","title":"A Task Says What It Is","page":101,"blocks":[{"type":"p","text":"Every task the agent creates carries a title and a detail, written for the user, or it is not created. The user's own calendar form needs only a title: the event is created at once, and anything the user left blank is filled in afterwards (section 60.1)."},{"type":"p","text":"The title is what the user sees in a list beside everything else scheduled. The detail is what will happen when it runs and why it was scheduled. A task with neither is one the user cannot tell apart from any other, and cannot decide whether to keep."},{"type":"h","text":"The Detail Is the Plan; the Reasoning Goes Somewhere Else"},{"type":"p","text":"Asking one field for both the plan and the reasoning was a mistake, and the agent answered it exactly as written. Real descriptions ran from 488 to 905 characters - the evidence, the prior, what a negative result would rule out, what other task depended on the answer - written agent to agent:"},{"type":"quote","text":"Runs tomorrow at 18:15Z, 45 minutes before the afternoon-gap test. Compares the day's activity envelope against Lisbon and Madrid boundaries. Narrowed from an open investigation to a confirmation: a +0100 offset has already been observed on 3 Sep [...]"},{"type":"p","text":"Read in a calendar, that is not a task. It also opens by restating the scheduled time, which the calendar is already showing."},{"type":"p","text":"The two are therefore separate fields:"},{"type":"ul","items":["**description** - what will happen when it runs, in plain sentences. This is what the calendar shows. It carries a ceiling of 2000 tokens, which is a stop against a runaway rather than a style rule: what keeps the detail readable is knowing that the reasoning has a home of its own, not a tight character count.","**rationale** - why the agent scheduled it, and on what evidence. As long as it needs to be, stored with the task and shown folded away, so the user opens it only when they want it."]},{"type":"p","text":"The reasoning is worth keeping. It is the same material section 34.1 keeps as an inference trace for a state, and for the same reason: the user should be able to ask *why do you think that* and get a real answer. It just is not the thing they open a task to find out."},{"type":"h","text":"A Placeholder Is Worse Than a Refusal"},{"type":"p","text":"Substituting \"Scheduled task\" for a missing title does not rescue the call. It produces an entry nobody can identify, in a list where every such entry looks the same, and from that moment the mistake is invisible: nothing distinguishes a task that was named badly from one that was never named at all."},{"type":"ul","items":["A creation by the agent's own tool without a title or a detail is refused, and the refusal says what was wanted, so the caller can supply it","The user's form needs only a title. An event the user creates is never refused for leaving the other fields empty; they are filled in afterwards, so the calendar still shows no placeholder","The refusal reaches the agent as an ordinary tool error, which it can act on. It is not a crash and it is not silent"]},{"type":"h","text":"The Detail Is Shown, Including When It Is Missing"},{"type":"p","text":"Where a task is displayed, its detail is displayed with it."},{"type":"p","text":"An empty detail rendered as empty space is invisible, and that is precisely how a task that says nothing about itself goes unnoticed. Where a task has no detail, the interface says so in as many words rather than leaving a gap that reads as though nothing was omitted."}]},{"number":"52.2","label":"52.2","id":"s52-2","title":"Scheduling Is Not Interrupting","page":101,"blocks":[{"type":"p","text":"Putting something on the calendar and interrupting the user are two decisions, and a task states them separately."},{"type":"ul","items":["A **silent** notification only leaves its message on the calendar when its time comes. The user reads it when they choose. This costs them nothing at the moment it runs.","An **interrupting** notification takes the user away from what they are doing. It has to be worth that."]},{"type":"p","text":"Everything on the calendar is now a notification for the user; `notify` says which of the two it is."},{"type":"p","text":"Every task therefore carries an explicit choice, `notify`, and it is required. There is no default, because a default is how the question stops being asked: an agent that is not made to answer it will let the flag sit wherever it was initialised, and on real data that meant every task interrupted."},{"type":"h","text":"Silence Is the Resting State"},{"type":"p","text":"The agent no longer queues checks or any other work for itself: only notifications can be scheduled. The agent heartbeat's notification step proposes the notifications to add and the ones to switch off, and is shown the user's notification lessons when it does so. A task run by the scheduler is not given the tool to schedule more."},{"type":"p","text":"`notify` is justified when the answer is something the user would want put in front of them at that moment, and would be annoyed to have missed. A recurring break reminder qualifies. \"Did the build advance\" does not."},{"type":"h","text":"A Notification Obeys the User's Settings"},{"type":"p","text":"A scheduled task's notification is an ordinary notification. It respects the global setting, the quiet hours, and the duplicate suppression, like every other."},{"type":"p","text":"Forcing delivery past those is reserved for the cases where the application cannot function until the user acts - an expired sign-in, and errors of that kind. A task the agent scheduled for itself is not one of them. Using the same escape hatch for routine output makes the user's own preference decorative."},{"type":"h","text":"The Choice Is Visible and Reversible"},{"type":"p","text":"Which tasks will interrupt is shown on the calendar itself, not only inside each task, because that is the property the user most wants to read off a calendar somebody else filled in. Opening an event states it in words - it interrupts you, it stays on the calendar, or it does not run because the user disabled it. The card can edit the event (title, message, time, repeat), disable it or delete it; whether it interrupts is no longer switched from the card."},{"type":"p","text":"A setting the user cannot see is not a setting; it is a behaviour they have to reverse-engineer from being interrupted."},{"type":"h","text":"Tasks That Predate the Choice"},{"type":"p","text":"Tasks scheduled before `notify` existed do not carry it, and must not simply fall to the new default: that would silently switch off the ones that exist in order to interrupt. Each is decided once, on the best evidence available - a task whose whole purpose is the notification keeps notifying, and the rest become silent, which is what the agent was already trying to express through the payload keys nothing read."}]},{"number":"52.3","label":"52.3","id":"s52-3","title":"Repeating Tasks","page":101,"blocks":[{"type":"p","text":"A task repeats on an interval and stops on a limit. The rule lives in one field, `recurrence`, and is empty for a task that runs once - which is what every task was before this."},{"type":"pre","text":"{\"every_seconds\": 2700}                       every 45 minutes, indefinitely\n{\"every_seconds\": 2700, \"count\": 8}           eight times, then finished\n{\"every_seconds\": 86400, \"until\": \"2026-12-01T00:00:00Z\"}   daily until a date\n{}                                            runs once"},{"type":"p","text":"The interval may also be given as `every` plus `unit` - minutes, hours, days or weeks - so a caller can say \"every 45 minutes\" without arithmetic. Where both `count` and `until` are given, whichever arrives first ends the run."},{"type":"h","text":"A Closed Shape, Not Another Open One"},{"type":"p","text":"This is a dictionary, like `task_payload`, and the difference is that its keys are fixed and checked on the way in. `task_payload` accepts anything, and across one real database it accumulated more than fifty distinct keys - most used once, none read by any code. `retry_policy` is a dictionary too, and has held exactly two keys since it was written, because nothing else is allowed in it."},{"type":"p","text":"A rule that cannot be honoured is refused when it is written, with the reason, rather than discovered when it fires:"},{"type":"ul","items":["an interval below a minute is a loop rather than a schedule, and would spend the scheduler's tick on one task","a count below one run is not a schedule","a repeat with no interval is not a repeat"]},{"type":"p","text":"A repeat with no end is allowed, because some things genuinely do continue, but it has to be stated rather than fallen into."},{"type":"h","text":"The Same Task, Moved Forward"},{"type":"p","text":"When a repeating task finishes a run, that row is moved to its next time and set back to pending. It is not copied."},{"type":"p","text":"A fresh row per run would bury the rest of the calendar within a day, and each copy would begin again with none of the history: the notification choice the user made, the reasoning the agent recorded, how many times it has run. One task that has run eleven times is a thing the user can look at and judge; eleven tasks are a mess they have to reconstruct."},{"type":"p","text":"`runs` counts the completed runs, and is separate from the rule, the way `attempts` is separate from `retry_policy`."},{"type":"h","text":"Time Is Measured From the Schedule, Not From the Run"},{"type":"p","text":"The next occurrence is calculated from the previous *scheduled* time, not from when the task actually ran. A task that runs three minutes late would otherwise be three minutes later on every cycle, and a daily task would walk around the clock within a month."},{"type":"p","text":"Where the application was closed and several occurrences have passed, the schedule advances by whole intervals to the next one in the future. It does not run the missed ones. Coming back from three days away to ninety-six queued reminders is worse than having missed them: the point of a reminder is the moment it names, and that moment is gone."},{"type":"h","text":"Every Run Is Drawn on the Calendar"},{"type":"p","text":"One row is the right shape for the data and the wrong shape for a calendar. A reminder every 45 minutes has to appear every 45 minutes, or the calendar is not showing the day the user is going to have - it shows one block and leaves them to do the arithmetic for the rest."},{"type":"p","text":"So the calendar draws a repeating task as each of the runs it will have. The blocks are computed from the rule when the calendar asks for a window, and nothing is written down: the stored row is still the one task, and each block carries its own time, its number in the series, and the identity of the row that owns it."},{"type":"p","text":"Acting on a block acts on the series. There is one task here however many times it is drawn, so on the calendar Edit, Disable and Delete on the third block act on the whole reminder. A new time or a new repeat starts the series again from its next run, its count of runs restarts, and any earlier change to a single occurrence is dropped. The API can still skip or change a single occurrence, recorded as an override against the series, but the calendar does not offer it."},{"type":"p","text":"A run that has not been reached is drawn differently from the one that is next, because the calendar should not claim more than it knows. Only the next run is a real pending row; the rest are the rule, drawn out."},{"type":"h","text":"A Repeat With No End Needs a Horizon"},{"type":"p","text":"A repeat that never stops has no last occurrence to draw, so something has to bound the drawing. Thirty is enough to see the shape of the thing - a 45 minute repeat fills the day, a daily one fills the month - and because the window moves with the calendar, reaching the end of one batch reveals the next. There is nothing to top up and no batch to run out of, which is what drawing from the rule buys over writing thirty rows and maintaining them."},{"type":"p","text":"Where the repeat does have an end - a count or a date - it is drawn to that end, or to the horizon if the end is further away than thirty runs."},{"type":"p","text":"*Amended 2026-10-20:* A TIME IS KEPT ON A CLOCK, BY ZONE NAME, and the offset worked out for its date by code, never by the model (scheduler/core/zones.py). The notification step gives a time as a clock shows it (\"at_local\") and whose clock (\"zone\": the user's, or the IANA name of a place - a time a source gives in another place's time, or one it gives with no zone but clearly the sender's, is kept on that place's clock), with the time as the source wrote it; the moment is worked out from the zone's rules for that date, daylight saving included, because an offset taken today and stamped on a date after the clocks change is an hour wrong. A wall time the clocks skip is taken as long after the jump as it was meant to be; one that comes twice, the first time. The user's own time is the zone this computer is in WHEN THE TIME IS MADE, kept by its name - the browser's, sent with each request, while its offsets are this computer's; else one with this computer's offsets over two years - so a reminder made in Lisbon for 9:00 stays 9:00 Lisbon time, and the calendar, always in the zone the computer is in now, shows it at 4:00 in New York. A REPEAT OF WHOLE DAYS KEEPS ITS CLOCK: it steps by days on the clock of its zone - a weekly meeting at 10:00 Paris time stays at 10:00 there, and so lands an hour apart for someone in New York in the week between Europe's change and America's; a repeat of minutes or hours is elapsed time, as before, because a dose every eight hours is due eight hours later on that night too. The series grid steps the same way. The calendar card says what a time was taken from - \"written as 'Thursday at 3pm', taken as Europe/Berlin time, 14:50 there\" - and when the clocks change that night, so a wrong guess of the zone is seen and moved with Edit.","amended":true},{"type":"p","text":"*Amended 2026-10-21:* A ZONE THE MODEL WRITES IS A PLACE'S NAME, AND A NOTIFICATION IS NEVER DROPPED FOR ITS ZONE. Accepted are an IANA name of the form Region/City (\"Europe/Paris\"), \"UTC\", and \"user\" for the user's own time. Refused are an abbreviation (\"PST\"), an offset, a city alone, and the old names the time-zone database also knows without a slash or under Etc/ - because some are not what a person writing them means: \"EST\" is UTC-05:00 all year, so \"3pm EST\" in July, meaning New York's time, would land an hour off unseen, and \"Etc/GMT-8\" is UTC+08:00. One refused is sent back to the model once, told why it was refused and what is accepted, with what the notification step was shown, to name the place; its answer is held to the same rule. Still refused, or no answer, and the time is taken as the user's own - and the calendar card says so: \"the time's zone could not be read ('PST'); taken as your own time\". What was written and what it was taken as are kept with the time, and in the run's report. THE CHAT GIVES ITS TIMES THE SAME WAY, read by the same reader with the same rule (scheduler/core/given.py): its schedule_task no longer takes a UTC moment the model worked out itself, but \"at_local\", \"zone\" and \"as_written\", and its prompt says the time now on the user's clock, by name, instead of in UTC. A zone refused there is the tool's error, with why and what is accepted - the asking once more; refused again for the same task, the time is the user's own, the card says so, and the tool's answer tells the model to tell the user. This computer's own zone is not held to the rule: it is the system's, not a guess.","amended":true}],"amendment_note":"2026-10-20: a time is kept on a clock by its zone's name and its moment worked out by code, daylight saving included; 2026-10-21: a zone the model writes must be a place's name, and the chat gives its times the same way.","amended":true},{"number":"52.4","label":"52.4","id":"s52-4","title":"Asking the User, and Keeping the Answer","page":101,"blocks":[{"type":"p","text":"The agent schedules on its own judgement, and what the user does with what it scheduled tests that judgement."},{"type":"ul","items":["An **approval**, asked *before* a task ran, has been withdrawn: since only notifications run, nothing is held for one.","The **answers** a notification carries are offered *after* it has reached the user. Nothing waits on them."]},{"type":"p","text":"Both end in the same place: a judgement of the agent's own decision, kept where the agent will meet it again."},{"type":"h","text":"Asking Before Acting"},{"type":"p","text":"Removed. Nothing asks first any more. Since only notifications run, nothing is held for approval: `approval` is stripped from a new task, the status `awaiting_approval` is never set, and every task runs at its time. A notification the user does not want is disabled or deleted on the calendar, and that action is kept as a lesson."},{"type":"h","text":"Asking After Interrupting"},{"type":"p","text":"Every notification that actually reaches the user carries its own answers. They are offered at delivery rather than at scheduling, because until the notification has gone out nobody has been interrupted and there is nothing to judge."},{"type":"p","text":"A reminder offers **Got it** (no more notifications), **Remind me later** (with how long) and **Add to to-do** (no more notifications; listed in To do on the Overview). A notice offers **OK** and **Add to to-do**. Every notification also has **Bad notification**, which dismisses it and asks for fewer like it in future, and a plain notification with no question has a button to be reminded in thirty minutes. A great deal of what an agent gets wrong is not the decision but the timing, and Remind me later is how the user says so without saying the notification was wrong. Bad notification is how the user says it was not worth it: it becomes a notification lesson, so fewer like it are scheduled."},{"type":"h","text":"The Answer Becomes a Memory"},{"type":"p","text":"A judgement is only worth collecting if the agent meets it again, so an answered question is kept as a `user_feedback` record in the library, carrying three things together:"},{"type":"ul","items":["what the task was going to do - the thing the user actually judged","how the agent arranged it, in the agent's own words","what the user answered, and anything they added"]},{"type":"p","text":"None of the three means much alone. The answer without the reasoning records that the user disliked something, with no way to tell what about it; the reasoning without the answer is what the agent already thought."},{"type":"h","text":"A Third Kind of Memory"},{"type":"p","text":"These records have their own folder, `user_feedback`, alongside `user_nature` and `states`."},{"type":"p","text":"They are kept apart because they are the only memory that records a judgement of the agent rather than a fact about the user or their world. Mixed in with everything else, a past misjudgement is reached only by accident - and an agent that cannot reach its own misjudgements repeats them."},{"type":"p","text":"Nothing walks the library to find them any more. What the agent meets again is the notification lessons: each add, edit, disable, delete or Bad notification is read by a model for what it says about the notifications the user wants, and the agent heartbeat gets those lessons before it adds more."},{"type":"h","text":"Scheduling Something Is Also a State"},{"type":"p","text":"A task is a moment and is executed; a state is a span and is only shown. Something the agent has undertaken to do is both - there is the instant it runs, and there is the stretch of time over which it is true that the agent means to do it. Writing only the task leaves the calendar silent about the second, which is the half the user reads."},{"type":"p","text":"So creating a scheduled task also writes a short state that accompanies it, with `source` of `task` and `task_id` naming the task. The span is deliberately small: it says *something is queued*, not *the agent is busy with this all week*, and it stops claiming the calendar shortly after the task has run."},{"type":"p","text":"This is also the first thing to write `State.task_id`. The field and the `task` source were specified in section 34.1 and had never been set by anything, so a state could claim to accompany a scheduled task while naming none - and three did."}]},{"number":"52.5","label":"52.5","id":"s52-5","title":"Three Ways a Run Can End","page":101,"blocks":[{"type":"p","text":"A run ends in one of exactly three ways, and the scheduler must record which:"},{"type":"ul","items":["**Completed.** The task is done and the thing it was for has happened. It is settled and nothing follows","**Delayed.** It could not be done now and should be tried again later. The task keeps its place and its identity","**To be checked.** It was carried out, and whether it achieved its purpose is not yet known. The task is not settled"]},{"type":"p","text":"The third was the one that was missing, and it was once the common case. In practice a run now ends completed or delayed. **To be checked** is still a recognised outcome, but a delivered notification is taken as finished, so it settles the task as completed: no check is scheduled, because a check would be a model task and only notifications run. *Got it* also settles the task directly. An outcome that cannot be recorded is an outcome that gets recorded as one of the others."},{"type":"p","text":"A delay must not consume the task's retry budget. Claiming a task for a run and delaying it are different events, and counting them together means a task the user keeps deferring runs out of attempts and disappears - the opposite of what deferring it asked for."},{"type":"p","text":"The same three endings apply after a user's answer (section 52.4). A question interrupts a task; the answer returns it to exactly this choice - settled or delayed."}]},{"number":"52.6","label":"52.6","id":"s52-6","title":"Two Templates, and What Each Answer Does","page":101,"blocks":[{"type":"p","text":"A question put to the user takes one of **three forms**, and no others:"},{"type":"ul","items":["A **reminder** - the agent is telling the user something it believes needs doing","A **permission** - the agent asking to do something before it does it. It is kept so that older questions can still be answered, but nothing raises it today: only the reminder and the notice are raised","A **passive notice** - the agent is telling the user something and wants no decision from them. *OK* closes the task, and *Add to to-do* closes it and lists it in To do on the Overview"]},{"type":"p","text":"Every option on every question declares what it does to the task: settle it, bring it back after the stated interval, or settle it and put it on the to-do list. A reminder offers *Got it*, *Remind me later* and *Add to to-do*; a notice offers *OK* and *Add to to-do*."},{"type":"p","text":"The passive form exists because the other two both ask something. A note the agent only wanted to say had to borrow a reminder's buttons and ask \"shall I remind you again?\" about a sentence that needed no answer - or carry no buttons at all, which leaves it in the list for ever. Dismissing is not the same as judging, and a notice that cannot be dismissed is a notice that accumulates."},{"type":"p","text":"This is what makes an answer worth keeping. An answer is evidence about the agent's judgement only if what it meant was fixed in advance - otherwise the record says the user chose the second option and nothing about what the second option was."},{"type":"p","text":"A user who wants no more of a notification says *Got it* to end this one, *Bad notification* to end it and ask for fewer like it, or disables or deletes it on the calendar. There must be a way of saying so that is not silence, because silence is indistinguishable from not having seen it. Only the permission form, which nothing raises any more, carries *Stop asking about this*; a reminder deliberately has no *Stop reminding me*."},{"type":"p","text":"**Every interruption the agent raises is one of the templates.** Not only the ones attached to a task on the calendar: a notification the agent chose to send is a decision it made about the user's attention, and it arrives with the options for answering it. The caller says which template it is, because only the caller knows whether it is telling, asking or merely mentioning - and a notice dressed as a reminder asks the user to decide something nobody meant to ask. A caller that names no template, or names one that does not exist, gets a reminder and the omission is logged: losing the interruption would be worse than choosing for it."},{"type":"p","text":"This does not extend to what the *system* raises about itself - a model being unavailable, a sign-in expiring. Those are not judgements the user is being asked to weigh, and giving them buttons would suggest the user had a decision to make where they have only a fact to read."},{"type":"p","text":"One interruption raises one question. A repeating reminder that fires again while the last one is still unanswered does not stack a second copy; the question already standing is the question."},{"type":"p","text":"**And one prompt.** The same applies to what is put on screen, for the same reason and one step later. A reminder that fires twice raises two notifications pointing at that one standing question, and answering either answers both - so showing both makes the user dismiss the same words twice, and the second tells them nothing they have not just read. A notification that names a question already waiting merges into it rather than queueing behind it, and the later wording wins, because a repeating reminder may have something new to say each time."},{"type":"p","text":"**An interruption is shown where it can be answered, and nowhere else.** Every one of them is a template with options attached, and the operating system's notification centre can carry none of them: it cannot be answered, and it is drawn by something this application does not control. Sending both put the same words on screen twice - once answerable, once not - and the copy the user reached first was usually the one they could do nothing with."},{"type":"p","text":"So nothing is handed to the system notifier at all, and there is no setting to turn it back on. A switch whose \"on\" position produces an interruption the user cannot answer is not a preference; it is a way of breaking the rule above. What the agent has to say appears in the agent, which also means there is one place to look for it."},{"type":"p","text":"Questions asked under an earlier naming must still be found and answered. A question already on screen when the software changes is not an acceptable thing to lose."},{"type":"p","text":"**The label travels with the option.** An option is a key, a label and an effect decided together, and whatever draws the buttons reads the label off the option rather than keeping its own table of keys to words. A second table drifts in one direction only: the templates are renamed, the table is not, and it goes on printing the old wording for the keys it knows and the bare key for the ones it does not. Worse, a screen that holds its own vocabulary tends to send its own vocabulary back, and an answer the server does not recognise is rejected - so the question stays, and the task behind it stays parked, which is the one outcome section 52.4 exists to prevent."},{"type":"p","text":"The same applies to the two template names. A question carries **which template it is** alongside the kind it was stored under, resolved by the one place that knows the old names, so that nothing downstream has to carry the mapping a second time in order to tell a permission from a reminder."}]},{"number":"52.7","label":"52.7","id":"s52-7","title":"Nothing Exists Without Saying Why","page":101,"blocks":[{"type":"p","text":"Every task, state and calendar entry carries **who decided it should exist** and **the judgement that led to it**. Neither is ever empty."},{"type":"p","text":"An agent that acts on its own judgement and leaves no account of that judgement gives the user two choices: accept everything, or switch it off. A reminder that turns out to be unwelcome is a different conversation when the user can read why the agent thought it was worth it, and it is the only way the agent's own decisions can be reviewed at all - by them, or by anything else."},{"type":"p","text":"**A user's own entry needs no justification.** They put it there; that is the reason. Asking them to type one would be the system demanding an explanation from the only participant who does not owe one, so anything they wrote is kept and anything they left blank becomes `added by user`."},{"type":"p","text":"
