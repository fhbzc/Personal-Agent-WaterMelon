**An agent-created thing with nothing recorded is different in kind.** It is not a thing with no reason - it is a thing whose reason was not written down, and the two read identically if both are blank. So it says so, and the omission is logged as what it is: a fault in whatever created it."},{"type":"p","text":"This is filled in where the thing is created rather than trusted to each caller, because a field that is optional is missing precisely where it matters."},{"type":"p","text":"Two consequences worth stating:"},{"type":"ul","items":["**A state written to accompany a task carries that task's reason.** They are two records of one decision, and letting them drift apart would leave the calendar and the agent's own context disagreeing about why something is happening","**The reason is part of the context an answer is built from.** A state is the agent describing the user's situation back to them and it can be wrong, so what the model reads includes the grounds and not only the claim (section 34.1)"]},{"type":"p","text":"Where it is shown: folded, in the entry's detail, not expanded. The requirement is that a reason is recorded and reachable, not that it is the first thing in the way - an earlier version showed it open and pushed everything else out of the card."}]},{"number":"53","label":"53.","id":"s53","title":"Task Classification","page":95,"blocks":[{"type":"p","text":"After reasoning about a task, the Agent Core decides whether the action is:"},{"type":"ol","items":["Immediate","Delayed"],"start":1}]},{"number":"54","label":"54.","id":"s54","title":"Immediate Tasks","page":95,"blocks":[{"type":"p","text":"Immediate tasks execute during the current agent invocation."},{"type":"p","text":"Example:"},{"type":"pre","text":"User: Summarize this file."},{"type":"p","text":"Agent:"},{"type":"pre","text":"reads file\ngenerates summary\nreturns result"}]},{"number":"55","label":"55.","id":"s55","title":"Delayed Tasks","page":96,"blocks":[{"type":"p","text":"If something should happen later, the agent schedules a notification: what to say, when, and whether it interrupts."},{"type":"p","text":"Work that has to be done is not scheduled. There is no Python in the chat and no script can be scheduled; longer work is proposed as a delegated work run, which starts only after the user approves its draft and plan."}]},{"number":"56","label":"56.","id":"s56","title":"Scheduled Task Schema","page":96,"blocks":[{"type":"p","text":"Recommended conceptual schema:"},{"type":"pre","text":"ScheduledTask:\n    id\n    title\n    description\n    created_at\n    scheduled_at\n    timezone\n    status\n    execution_type\n    script_path\n    model_config\n    task_payload\n    retry_policy\n    recurrence\n    runs\n    attempts\n    last_run_at\n    created_by\n    reason\n    metadata"},{"type":"p","text":"The only execution type is `notification`. A task's payload says whether it interrupts (`notify_user`) and which form it takes (`template`: reminder or notice). The executor still has handlers for the earlier types - python_script, agent_task, model_task, system_action, integration_action - but nothing can create or run them: the scheduler refuses them at creation, and cancels with a note any that turn up."}]},{"number":"56.1","label":"56.1","id":"s56-1","title":"The Verification Plan Is Made When the Task Is","page":96,"blocks":[{"type":"p","text":"A task may carry, from the moment it is created, what would count as it being finished. It is kept for the record only: nothing checks it afterwards, because a check would be a model task and only notifications run."},{"type":"ul","items":["what **completion** looks like, stated so that it can be recognised later","how long to wait before checking, which now sets only how long *Remind me later* waits before the notification comes back"]},{"type":"p","text":"Deciding this at creation is what makes it possible at all. Whoever creates the task knows why it exists; a later round knows only that a task ran."},{"type":"p","text":"A task with no such plan completes when it runs. That is the right default for the tasks it is true of - reporting something, showing something - and stating it as a default rather than leaving it as an assumption is what keeps it from being applied to the tasks it is false of."}]},{"number":"57","label":"57.","id":"s57","title":"Scheduler Loop","page":97,"blocks":[{"type":"p","text":"Conceptually:"},{"type":"p","text":"while scheduler_running:"},{"type":"pre","text":"load_due_tasks()"},{"type":"pre","text":"for task in due_tasks:\n    execute(task)"},{"type":"pre","text":"sleep_until_next_check()"},{"type":"p","text":"The target check frequency is approximately once per minute."},{"type":"p","text":"The implementation should avoid unnecessary model calls when no model reasoning is required."}]},{"number":"57.1","label":"57.1","id":"s57-1","title":"A Check Is Itself a Task","page":97,"blocks":[{"type":"p","text":"Removed. A run that ends \"to be checked\" is completed, and no checking task is created: a check is a model task, and only notifications run (section 52). The handler that ran checks survives in the executor, but nothing can reach it."}]},{"number":"58","label":"58.","id":"s58","title":"Model-Based Scheduled Tasks","page":98,"blocks":[{"type":"p","text":"Removed. Model-based scheduled tasks and their knowledge-graph retrieval are gone: only notifications are scheduled or run (section 52), and there is no graph retrieval anywhere (commit fcf74e1). Work that needs a model is proposed as a delegated work run, which starts only after the user approves its plan."}]},{"number":"59","label":"59.","id":"s59","title":"Scheduler Reliability","page":99,"blocks":[{"type":"p","text":"Scheduled tasks must be persisted."},{"type":"p","text":"Restarting the Personalized Agent should not silently delete scheduled events."},{"type":"p","text":"The Scheduler should support:"},{"type":"ul","items":["Persistent storage","Task status","Failed-task detection","Retry policies","Duplicate execution prevention","Cancellation","Rescheduling","Agent restart recovery"]},{"type":"p","text":"Recommended states include:"},{"type":"pre","text":"pending\nrunning\ncompleted\nfailed\ncancelled\ndisabled\nclosed"},{"type":"p","text":"`closed` is a notification the agent heartbeat decided is no longer needed: it stays on the calendar with the reason and never runs. `disabled` is shown as disabled by the user, and is never run either. A `cancelled` task records who cancelled it, when and why. After a restart, tasks left running by the previous process are recovered rather than lost."}]},{"number":"60","label":"60.","id":"s60","title":"Calendar Synchronization","page":100,"blocks":[{"type":"p","text":"Scheduler state and frontend Calendar state must use a single authoritative backend representation."},{"type":"p","text":"Do not maintain two independent schedules."},{"type":"p","text":"Required architecture:"},{"type":"pre","text":"        +------------------+\n         | Scheduler Store  |\n         +---------+--------+\n                   |\n      +------------+------------+\n      |                         |\n      v                         v\nScheduler Loop             Calendar UI"}]},{"number":"60.1","label":"60.1","id":"s60-1","title":"The Calendar and the Scheduler Edit Each Other","page":100,"blocks":[{"type":"p","text":"The calendar is an interface to the scheduler in both directions."},{"type":"p","text":"**An edit on the calendar reaches the task.** An event can be edited from its card - title, message, time and repeat - while it is pending or disabled; one that is running, completed, closed or cancelled is refused. It can be disabled, which keeps it on the calendar marked as disabled by the user and never runs it, or deleted, which takes it off the calendar after the user confirms and optionally says why. There is no dragging to move an event. Each add, edit, disable and delete, with the user's optional reason, is kept as a notification lesson the agent heartbeat learns from. The associated state (section 11.1) follows the same edit, because a state that still describes the old time is a record of something that is no longer true."},{"type":"p","text":"**A repeating event is edited as a whole series.** The calendar does not ask: Edit, Disable and Delete on any occurrence act on the series. The API can still act on **this occurrence** alone:"},{"type":"ul","items":["*This occurrence* - skipped or changed - is recorded as an override against the one occurrence. The series keeps its shape and the occurrences after it are unaffected","*All occurrences* changes the series; a new time or repeat starts it again from its next run and drops earlier overrides"]},{"type":"p","text":"A skipped or moved occurrence must not move the ones after it. What the series repeats on and when it next runs are separate facts, and treating an override as the new starting point drags the whole grid along with it."},{"type":"p","text":"**An event created on the calendar is a task.** An entry the user adds has the same properties a scheduled task has, and a user filling in a calendar form will not supply most of them."},{"type":"p","text":"So the event is created immediately, with what the user gave, and the rest is filled in afterwards by the agent from the context it can gather. The user is not made to wait for that and is not shown a form asking for a rationale or a verification plan. What is missing is filled; what the user stated is never overwritten."}]},{"number":"61","label":"61.","id":"s61","title":"Agent Identity and Application Protocol","page":100,"blocks":[{"type":"p","text":"Location:"},{"type":"pre","text":"./protocol/"},{"type":"p","text":"Each Personalized Agent has a persistent identity consisting of:"},{"type":"ul","items":["Agent ID","Public key","Private key"]},{"type":"p","text":"The Agent ID and public key can be read from the local API (`/api/protocol/identity`). No screen shows them yet."},{"type":"p","text":"The private key must remain secret."}]},{"number":"62","label":"62.","id":"s62","title":"Private Key Requirements","page":101,"blocks":[{"type":"p","text":"The private key must never be:"},{"type":"ul","items":["Displayed in the UI","Included in model prompts","Written to normal logs","Included in Raw Edits","Included in the library (memory records)","Returned to applications"]},{"type":"p","text":"Secure OS-backed credential storage should be used where possible."}]},{"number":"63","label":"63.","id":"s63","title":"Application Registration","page":101,"blocks":[{"type":"p","text":"Applications supporting the Personalized Agent protocol may allow users to register:"},{"type":"p","text":"Agent ID"},{"type":"p","text":"Public Key"},{"type":"p","text":"Permissions"},{"type":"p","text":"Permissions may include:"},{"type":"pre","text":"read\nwrite\nexecute"},{"type":"p","text":"application-specific operations"},{"type":"p","text":"Permissions belong to the external application's authorization model."}]},{"number":"64","label":"64.","id":"s64","title":"Authentication Concept","page":102,"blocks":[{"type":"p","text":"The application protocol should use cryptographic challenge-response authentication."},{"type":"p","text":"Conceptually:"},{"type":"p","text":"Agent"},{"type":"pre","text":"|\n| Agent ID\nv"},{"type":"p","text":"Application"},{"type":"pre","text":"|\n| random challenge\nv"},{"type":"p","text":"Agent"},{"type":"pre","text":"|\n| signed proof\nv"},{"type":"p","text":"Application"},{"type":"pre","text":"|\n| verify with registered public key\nv"},{"type":"p","text":"Authenticated Session"},{"type":"p","text":"The system should prove possession of the private key rather than transmitting it."}]},{"number":"64.1","label":"64.1","id":"s64-1","title":"The Browser Extension","page":124,"blocks":[{"type":"p","text":"Removed. The browser extension, its website integrations and the setting that switched them on were taken out (October 2026), together with private mode, which the extension's status reported. The browser is read from its own history only. The signed ingest endpoint of the integration protocol (sections 61-65) remains for other external applications."}]},{"number":"65","label":"65.","id":"s65","title":"Cryptographic Design Requirement","page":103,"blocks":[{"type":"p","text":"A custom unreviewed cryptographic algorithm must not be invented."},{"type":"p","text":"Before implementation, the protocol must formally define:"},{"type":"ul","items":["Signing algorithm","Public-key format","Private-key storage","Challenge generation","Replay prevention","Session establishment","Key rotation","Key revocation","Permission revocation"]},{"type":"p","text":"Standard, well-reviewed cryptographic libraries and protocols should be preferred."}]},{"number":"66","label":"66.","id":"s66","title":"Agent Core Execution Workflow","page":103,"blocks":[{"type":"p","text":"The model is called from:"},{"type":"ol","items":["The user's direct instructions, in the chat","The agent heartbeat","Work runs the user has approved, each in its own process","Customized Recommendation, on its own schedule","The lessons engine, which reads the user's own actions"],"start":1},{"type":"p","text":"There is no data management heartbeat any more (commit fcf74e1)."}]},{"number":"67","label":"67.","id":"s67","title":"Direct User Instruction Workflow","page":104,"blocks":[{"type":"p","text":"User Instruction"},{"type":"pre","text":"|\nv"},{"type":"p","text":"Agent Core (with the conversation so far, older turns summarised when it is long)"},{"type":"pre","text":"|\nv"},{"type":"p","text":"Reason About Task"},{"type":"pre","text":"|\n+------------+\n|            |\nv            v"},{"type":"p","text":"Immediate       Delayed"},{"type":"p","text":"Execution       Scheduler"},{"type":"pre","text":"|            |\n+------+-----+\n       |\n       v\n  Record Raw Edit\n       |\n       v\n Respond to User"},{"type":"p","text":"Nothing is retrieved from memory before the model is asked: the chat answers from the instruction and the conversation it was asked in. What is delayed is a notification; work that needs doing later is proposed as a work run instead."}]},{"number":"68","label":"68.","id":"s68","title":"Heartbeat Workflow","page":105,"blocks":[{"type":"p","text":"Heartbeat Timer"},{"type":"pre","text":"|\nv"},{"type":"p","text":"Load Checklist Snapshot (leaving out paused steps and the steps of functions that are switched off)"},{"type":"pre","text":"|\nv"},{"type":"p","text":"Read the Window: the activity since the last review that got an answer, plus the states running now. Anything in it can be opened by its id; nothing beyond it is searched."},{"type":"pre","text":"|\nv"},{"type":"p","text":"Step 1: Analyse User State (write states)"},{"type":"pre","text":"|\nv"},{"type":"p","text":"Step: People"},{"type":"pre","text":"|\nv"},{"type":"p","text":"Step: Notify (immediate or scheduled actions)"},{"type":"pre","text":"|\nv"},{"type":"p","text":"Step: To-dos (tick what has finished; skipped when none are open)"},{"type":"pre","text":"|\nv\n       Raw Edits\n            |\n            v\nMove \"summarised until\" forward, only if step 1 answered\n            |\n            v\n           Exit"},{"type":"p","text":"Each step is one model call, and each gets its own copy of the same window. Step 2, who the user is, is paused: the user's nature is learned from their lessons instead. A late look at a stretch that was never read runs step 1 alone."},{"type":"p","text":"An instant trigger on new on-screen text (a meeting invitation, an agreed time) runs the Notify step alone, for that window, outside the timer. Customized Recommendation and the state heartbeat, which groups states into tasks, run on their own clocks and are not part of this workflow."}]},{"number":"69","label":"69.","id":"s69","title":"Data Heartbeat Workflow","page":106,"blocks":[{"type":"p","text":"Removed. The Data Heartbeat, with its node and edge updating, compaction and \"mark processed\" step, was deleted on 2026-10-06 together with the knowledge graph's indexer and library search. Raw activity is now read only by the agent heartbeat (its window), the Overview and the page-visit history, and is removed by age after the raw-activity keeping period (eight days by default), whether or not it was read."}]},{"number":"70","label":"70.","id":"s70","title":"Model Management","page":107,"blocks":[{"type":"p","text":"The Personalized Agent must support multiple Large Language Model providers and let the user choose which models it thinks with, and in what order."},{"type":"p","text":"The models are kept as one ordered list in Settings \u003e General \u003e Models. The first entry is the Primary Model."},{"type":"p","text":"*Amended 2026-10-16:* the list may be emptied: the last model is removed like any other. Emptied, it stays empty - the model chosen before there was a list does not come back in its place - and every call that needs a model is refused with \"there is no model on your list\" until one is added; the page says so where the list was.","amended":true},{"type":"p","text":"Different model providers may use different authentication mechanisms. The architecture must therefore separate:"},{"type":"ul","items":["Model selection","Model provider","Authentication method","Credential state","Model availability","Usage/quota state"]},{"type":"p","text":"The system must not assume that all model providers use API keys."}],"amendment_note":"2026-10-16: the user asked that the last model on the list can be removed too.","amended":true},{"number":"71","label":"71.","id":"s71","title":"Primary Model","page":108,"blocks":[{"type":"p","text":"The user keeps an ordered list of models in Settings \u003e General \u003e Models. The Primary Model is simply the first entry on that list. Each entry carries its own reasoning effort and a switch saying whether it sees pictures or reads text only."},{"type":"p","text":"Conceptually, each entry is:"},{"type":"p","text":"Settings"},{"type":"pre","text":"|\nv"},{"type":"p","text":"Model Configuration"},{"type":"pre","text":"|\n+-- Provider\n+-- Model\n+-- Authentication Method\n+-- Credential / Login Status\n+-- Availability Status"},{"type":"p","text":"For example:"},{"type":"p","text":"Primary Model"},{"type":"p","text":"Provider: \u003cprovider\u003e"},{"type":"p","text":"Model: \u003cmodel\u003e"},{"type":"p","text":"Authentication:"},{"type":"pre","text":"Account Login / OAuth"},{"type":"p","text":"Status:"},{"type":"pre","text":"Connected"},{"type":"p","text":"or:"},{"type":"p","text":"Primary Model"},{"type":"p","text":"Provider: \u003cprovider\u003e"},{"type":"p","text":"Model: \u003cmodel\u003e"},{"type":"p","text":"Authentication:"},{"type":"pre","text":"API Key"},{"type":"p","text":"Status:"},{"type":"pre","text":"Available"},{"type":"p","text":"The exact list of supported providers and models may evolve over time and should not be hard-coded into the frontend."}]},{"number":"72","label":"72.","id":"s72","title":"Model Usage Hierarchy","page":109,"blocks":[{"type":"p","text":"Every part of the agent uses the model list. A call goes to the first model on the list that can answer, so the Primary Model is the default reasoning model for:"},{"type":"ul","items":["Direct user instructions","Agent reasoning","Heartbeat reasoning","Scheduled model-based tasks"]},{"type":"p","text":"The roles that resolve a model are the primary role, the heartbeat role and the scheduled-task role. There is no separate data-heartbeat role."},{"type":"p","text":"The heartbeat and scheduled-task roles may still be pinned to one model through hidden settings, and a pinned role uses only that model, not the list. The interface does not offer these overrides."}]},{"number":"73","label":"73.","id":"s73","title":"Authentication Methods","page":110,"blocks":[{"type":"p","text":"The Model Provider layer must support multiple authentication mechanisms."},{"type":"p","text":"At minimum, the architecture must support:"},{"type":"ol","items":["API Key Authentication","Account Login / OAuth Authentication"],"start":1},{"type":"p","text":"Additional authentication mechanisms may be added later through the same provider abstraction."},{"type":"p","text":"Supporting a mechanism means a user can complete it end to end for at least one provider the application ships with, not only that the provider abstraction has a place for it."}]},{"number":"74","label":"74.","id":"s74","title":"API Key Authentication","page":111,"blocks":[{"type":"p","text":"Some model providers require the user to provide an API key."},{"type":"p","text":"The Settings interface should support:"},{"type":"p","text":"Authentication Method:"},{"type":"pre","text":"API Key"},{"type":"p","text":"API Key:"},{"type":"pre","text":"[••••••••••••••••]"},{"type":"p","text":"Status:"},{"type":"pre","text":"Connected / Invalid / Unavailable"},{"type":"p","text":"API keys must be stored securely."},{"type":"p","text":"They must never be:"},{"type":"ul","items":["Stored in the Knowledge Graph","Included in Raw Events","Included in Raw Edits","Included in model prompts","Printed in logs","Displayed in plaintext after initial entry","Included in Debugger output"]},{"type":"p","text":"Where available, operating-system secure credential storage should be used."},{"type":"p","text":"Examples include the appropriate OS credential/keychain service rather than normal configuration files."},{"type":"p","text":"*Amended 2026-10-16:* a keychain that refuses to keep a secret does not stop the agent. macOS refuses an application whose signature does not match it, and the 1.0.0 macOS build was such an application - its Info.plist was written after it was signed - so it quit on start, its identity key unstored, before its window or its menu-bar icon appeared. The refusal is logged and remembered, and from then on that installation keeps its secrets in the encrypted file used where there is no keychain at all; what the keychain held before is still read from it. The macOS build signs the bundle again after the Info.plist is written - ad hoc when there is no signing identity - and the release check verifies that signature, since it runs with the keychain out of reach and could not see the refusal itself.","amended":true},{"type":"p","text":"*Amended 2026-10-16:* and a macOS build signed by nobody does not use the keychain at all. Signed ad hoc - all a build without a developer's certificate can be - it is known to the keychain by the exact bytes of one version, so after every update macOS would ask the user again before handing back what the last version kept, and a \"Deny\" would leave the agent without its keys and with a new identity. Such a build keeps its secrets in the encrypted file from its first start; anything the keychain already held is read from it once and moved into the file, so the user is asked at most once. Run from source, or signed by a developer, the keychain is used as before.","amended":true}],"amendment_note":"2026-10-16: the user installed the macOS release; it showed no icon and quit at once. Run from Terminal it said the keychain refused it (-67030, executable not signed).","amended":true},{"number":"75","label":"75.","id":"s75","title":"Account Login / OAuth Authentication","page":112,"blocks":[{"type":"p","text":"Some model providers may authenticate through a user account rather than a manually supplied API key."},{"type":"p","text":"The Settings interface must therefore support account-based authentication."},{"type":"p","text":"Conceptually:"},{"type":"p","text":"Authentication Method:"},{"type":"pre","text":"Account Login"},{"type":"p","text":"Account:"},{"type":"pre","text":"user@example.com"},{"type":"p","text":"Status:"},{"type":"pre","text":"Logged In"},{"type":"p","text":"[Log Out]"},{"type":"p","text":"If authentication is required:"},{"type":"p","text":"Authentication Method:"},{"type":"pre","text":"Account Login"},{"type":"p","text":"Status:"},{"type":"pre","text":"Not Logged In"},{"type":"p","text":"[Log In]"},{"type":"p","text":"The authentication process may use OAuth or another provider-supported account authorization mechanism."},{"type":"p","text":"The exact implementation depends on the provider."},{"type":"p","text":"The core agent must interact with a common authentication abstraction rather than directly implementing provider-specific login behavior throughout the application."}]},{"number":"75.1","label":"75.1","id":"s75-1","title":"Account Login Initiation Requirement","page":112,"blocks":[{"type":"p","text":"Displaying account authentication state is not sufficient."},{"type":"p","text":"Selecting Log In must initiate an authorization flow. It must not only report whether a credential already exists."},{"type":"p","text":"For a provider whose account authentication is browser based, the application must:"},{"type":"ul","items":["Open the provider's authorization page in the user's browser","Receive the authorization result through a loopback redirect, a pasted authorization code, or another completion mechanism the provider supports","Exchange that result for the provider's tokens","Store the tokens through the Credential Manager","Update the credential state to authenticated without requiring an application restart"]},{"type":"p","text":"For a provider whose account authentication is delegated to an external tool, the application must:"},{"type":"ul","items":["Detect whether the tool is present on this machine","Offer to run the tool's login command on the user's behalf","Report the outcome in the Settings interface","Detect the resulting credential without requiring an application restart"]},{"type":"p","text":"If a provider offers no account authentication mechanism that the application is able to complete on the current machine, the Settings interface must not present Account Login as a selectable method for that provider. It must still disclose the method, showing why it cannot be completed here and what the user can do about it, as required by section 77."},{"type":"quote","text":"Silently omitting a method the provider does in fact support is its own failure: the user is left believing the provider offers only the methods that remain visible."},{"type":"quote","text":"An implementation that reports that no credential was found and asks the user to configure the environment by hand does not satisfy this requirement."},{"type":"p","text":"Instructing the user to set an environment variable or to run a command in a terminal may be offered as a fallback, but never as the only outcome of selecting Log In."},{"type":"p","text":"Section 84 continues to apply to any tokens obtained through this flow."}]},{"number":"75.2","label":"75.2","id":"s75-2","title":"Browser-Based Account Login","page":112,"blocks":[{"type":"p","text":"Account login must be completed from within the application."},{"type":"p","text":"The user presses one control and finishes in their browser. They must not be required to open a terminal, run a command, edit an environment variable, or leave the application to read instructions."},{"type":"p","text":"The application hosts the flow:"},{"type":"ol","items":["Obtain the authorization URL for the provider","Open that URL in the user's default browser","Display the same URL in the application, so a user whose browser did not open can follow it","Accept the completion - a loopback redirect the application listens for, or a code the user pastes back into the application's own window","Complete the exchange and record the resulting credential","Report the outcome in the same place the sign-in was started, without requiring the user to press the control a second time and without an application restart"],"start":1},{"type":"quote","text":"Opening a terminal for the user to finish the sign-in in does not satisfy this requirement."},{"type":"p","text":"Where the provider's account credential is issued by an external tool rather than by an endpoint the application may call directly, the application drives that tool as a subprocess: it captures the authorization URL the tool emits, opens the browser itself, collects the completion in its own interface, and passes it back to the tool. The tool's console must not become the user's interface."},{"type":"p","text":"A tool that renders only to a terminal is driven through a pseudo-terminal the application allocates and owns. Handing the user to a console the application does not control is the failure this requirement exists to prevent, and a tool being interactive is not an exemption from it."},{"type":"quote","text":"Instructing the user to run a command themselves and paste the result back is not an implementation of this section. The application runs the command."},{"type":"h","text":"Completion Is Not One Shape"},{"type":"p","text":"A sign-in may finish in more than one way, and the application must accept whichever way this one did."},{"type":"p","text":"The same tool, on the same machine, may complete either by handing the result back through the browser - in which case the user is told they are done and is never shown a code - or by asking for a code the user brings back. Which happens is not the application's choice to make."},{"type":"p","text":"The application must therefore watch for completion from the moment the authorization begins, rather than only when the user submits something:"},{"type":"ul","items":["A sign-in that completed on its own must be recognised without further user action, and reported as signed in","The interface must not continue to ask for a code that no longer exists","A code submitted after the sign-in already completed is not an error","A tool that returns a credential and then keeps running must not be waited on to exit; the credential arriving is the completion"]},{"type":"quote","text":"A sign-in that has in fact succeeded must never be reported as one that is no longer running."},{"type":"p","text":"More than one such tool may be able to complete the sign-in. The application must use whichever is present on the machine rather than requiring one particular tool, and must name the tool it is using in the interface, because the choice determines which account and which billing the resulting credential draws on."},{"type":"p","text":"Where the tool returns a credential to the application rather than storing one itself, that credential is a secret under sections 83 and 84: it is placed in the Credential Manager immediately, and is never displayed, logged, written to the Knowledge Graph, or returned to any caller - including in the tool output the application surfaces when a sign-in fails."},{"type":"p","text":"The interface must state, before the user signs in:"},{"type":"ul","items":["Which tool will perform the sign-in","Which account and billing arrangement the resulting credential uses","Where the credential is stored, and whether it travels when the agent root is copied (section 110.1)"]},{"type":"p","text":"The application must not present itself as another application in order to obtain a credential. It uses a client identity the provider has issued to it, or an authorization mechanism the provider documents for this purpose; reusing a client identity belonging to a different application is not an acceptable implementation of this section."},{"type":"p","text":"The sign-in must be cancellable, must time out rather than wait indefinitely, and must report a failure with the reason."},{"type":"p","text":"Where the resulting credential is stored outside the agent root - for example by an external tool that owns its own credential store - section 110.1 applies: the application must make clear that this credential does not travel when the root is copied."}]},{"number":"75.3","label":"75.3","id":"s75-3","title":"Using a Stored Sign-In","page":112,"blocks":[{"type":"p","text":"A sign-in is performed once. After that the stored credential is used without asking."},{"type":"p","text":"The application must not prompt for authentication that it already has. Where a credential exists and works, the provider is simply used."},{"type":"p","text":"The application must, however, know when that stops being true:"},{"type":"ul","items":["The stored credential is verified when the application starts, so that an expired sign-in is reported while the user is present and can act, rather than discovered later by a background task","Where verification finds that the credential is no longer accepted, the user is asked to sign in again - once, through the notification requirements of sections 87 and 88, naming the provider and the reason","The prompt is not repeated for the same failure, and it is withdrawn when the credential works again (sections 91, 92)","A credential that is merely rate limited or temporarily unreachable is not a failed sign-in and must not produce one"]},{"type":"quote","text":"Asking a user to sign in when the application is already signed in is an error, and so is failing quietly when it is not."},{"type":"h","text":"Being Told Is Not the Same as Being Nagged"},{"type":"p","text":"The prompt can be dismissed."},{"type":"p","text":"Dismissing it fixes nothing, and the application must not pretend otherwise: the credential is still unusable, and that remains visible where state is shown. What dismissing ends is the interruption, which has done its work once the user has read it."},{"type":"ul","items":["A dismissed prompt does not return for the same condition","It returns when the condition is genuinely new: after the credential works again, a later failure is news and is raised","Dismissing is not fixing, so nothing about the credential changes, and every other report of its state is unaffected"]},{"type":"quote","text":"A message the user cannot put away is one they learn to ignore, including the next time it matters."}]},{"number":"76","label":"76.","id":"s76","title":"Model Provider Interface","page":113,"blocks":[{"type":"p","text":"Model providers should implement a common interface."},{"type":"p","text":"Conceptually:"},{"type":"pre","text":"class ModelProvider:"},{"type":"pre","text":"def list_models(self) -\u003e list:\n    ..."},{"type":"pre","text":"def get_auth_methods(self) -\u003e list:\n    ..."},{"type":"pre","text":"def get_auth_status(self):\n    ..."},{"type":"pre","text":"def authenticate(self, config):\n    ..."},{"type":"pre","text":"def logout(self):\n    ..."},{"type":"pre","text":"def check_availability(self):\n    ..."},{"type":"pre","text":"def invoke(self, request):\n    ..."},{"type":"p","text":"Provider-specific implementations may support different capabilities."},{"type":"p","text":"For example:"},{"type":"pre","text":"ModelProvider\n    |\n    +-- Provider A\n    |      └── API Key\n    |\n    +-- Provider B\n    |      └── OAuth\n    |\n    +-- Provider C\n           ├── API Key\n           └── Account Login"},{"type":"p","text":"The Agent Core must not need to know how a particular provider authenticates."}]},{"number":"76.1","label":"76.1","id":"s76-1","title":"A Local Client as a Provider","page":113,"blocks":[{"type":"p","text":"A provider need not be an API this application calls. It may be a program on the user's machine that is already licensed to answer."},{"type":"p","text":"The application may ship adapters for more than one such client. For example, a Codex adapter invokes the installed client non-interactively, uses its own sign-in rather than extracting a credential, uses the model selected by that signed-in client rather than assuming every account can select the same model identifier, and runs each request in an ephemeral read-only sandbox. The agent still decides whether any requested action runs through its own tool layer and sandbox."},{"type":"p","text":"Where such a client exists, is signed in, and can answer non-interactively, the application may use it as a provider: it sends the request, and uses what comes back."},{"type":"p","text":"This is how a subscription is used without borrowing its credential. The application holds no credential for such a provider, stores none, and the work is billed wherever that client's account is billed."},{"type":"quote","text":"A subscription licenses a client, not this application. Taking that client's credential and calling the API with it is not using the subscription - it is impersonating the client, and the provider refuses it."},{"type":"p","text":"Requirements:"},{"type":"ul","items":["The client is used only if it is installed and reports itself signed in; both are checked locally, without a request that costs anything","Where the user's account is a subscription and no usable client is installed, the application says which client would let them use it, rather than reporting that nothing can be configured","The client acts only through the agent. What the agent may do is decided by the agent's tool layer and its sandbox (sections 31, 107), and routing actions through another program goes around both. Where the client can take tools natively, it is given the agent's tools and nothing else: for the command-line Claude client, the application serves the request's tools from a private local MCP server (on 127.0.0.1, at an address holding a secret) for the length of that one call, refuses every other MCP server, and runs each call the client makes through the agent's own tool layer and sandbox. The client's own tools stay denied, with two exceptions: its web search and fetch, when the user has chosen the model's own web search (the default), and its file-reading tools, limited by deny rules to the places the agent may read","Each call is run without keeping a session of its own, and ends when the client falls silent rather than at a fixed timeout","It runs inside the agent workspace, so that nothing it does can reach outside the root (section 110.1)","Its answer is subject to the same handling as any provider's: the same normalized availability states, the same failure classification, the same reporting of what it cost","The interface says answers are coming from that client, and whose account they are billed to"]},{"type":"p","text":"A client that cannot take tools natively - Codex, and the command-line Claude client when a call comes with no tool runner - is offered a convention of its own for the tool-call protocol, and its reply is read from the front rather than whole."},{"type":"p","text":"**Strictly is not the same as wholly, and the difference reached the user as fact.** Reading it whole means requiring the reply to be exactly one call and treating anything longer as an answer. What that meets in practice is a reply that opens with a perfectly good call and then keeps going - the model continuing the transcript by writing the tool's reply for it, because a transcript that shows tool results is a transcript a model can continue. Read whole, that is \"not a call\", so it became the answer: a raw JSON call followed by invented records, four of whose six ids existed nowhere in the library."},{"type":"p","text":"So the front of the reply decides. If it opens with a call, it is a call, and whatever follows is discarded - the tool is run and the real result supplied. **Nothing a model writes after its own call can be a tool result**, because tool results do not come from the model; and the client is told so, since the mistake is invisible once it has been made."},{"type":"p","text":"Discarding it is only half. What goes back into the transcript as *what you said last turn* must be the call and not the whole reply, or an invented result is read back to the model a turn later as its own words, sitting immediately above the real one - teaching it turn by turn that writing results is what it does here."},{"type":"p","text":"**And the client is told what its own refusal means.** A borrowed client has tools of its own, none of which are the agent's, so reaching for an agent tool that way is answered with \"no such tool\". Left unexplained, the model reports that to the user as a missing tool: the user goes looking for a fault, and the tool is sitting in the list the model was given. The instruction says what the message means and what to do instead, and says plainly not to report it as absence."},{"type":"p","text":"**The client acts through the agent, or not at all.** A borrowed client can schedule, remind, notify and delegate for itself, and to the model those look like perfectly good ways to do what the user asked. They are not: they last as long as one invocation and then stop existing, while the agent has a scheduler that survives restarts. Asked to give a reminder at two o'clock, the model made one inside a subprocess that had already exited, and reported - accurately and uselessly - that it was \"session-only\". Anything that must outlive the reply is denied to the client by name and told to go through the agent's own tools, and a promise made about something that does not persist is worse than a refusal."},{"type":"p","text":"**It runs with none of the user's own connectors.** A client reads the MCP configuration of whoever installed it, so the agent's model calls were inheriting document connectors and anything else the user had set up in their own copy - tools this application never granted, cannot see and does not sandbox. The model reached for them, and described its abilities in terms of them. What the agent may do is decided by the agent's tool layer, and that decision is worth nothing if another program's configuration can add to it."},{"type":"p","text":"**The client answers as the agent, not as itself.** A borrowed client is a whole assistant with a tool set of its own, and that tool set is switched off here. So it must be told that the tools offered in the convention are its tools for this conversation, that calling one really runs it, and that it is not to describe what it can and cannot do in terms of the program it happens to be running inside. Without that it answers about the wrong thing: it reported that its session had no way to list scheduled tasks, in a reply written after it had listed them, because the empty set it was describing was the host's and not the agent's. A caveat like that is worse than no caveat - it is the agent telling the user, in good faith, that a working part of itself does not exist."},{"type":"p","text":"**A tool result is not the user speaking.** The API carries a tool result on a user turn. That is the API's convention and invisible inside it, but a client that takes a transcript has to be given roles in text, and a result rendered as the user's words reads as the user pasting data in. The model then disowns the answer it builds on it - crediting its own memory for what it has just this moment looked up. What a tool returned is labelled as what it is."},{"type":"p","text":"*Amended 2026-10-17:* CODEX TOO RUNS WITH NONE OF THE USER'S OWN, AND IS GIVEN THE AGENT'S TOOLS AS TOOLS. It had been called with the user's Codex configuration loaded, and so with what they installed for their own use - a browser, computer use, a Node REPL server, plugins, hooks - which the agent never granted; and it was offered the agent's tools only as words. Codex reaches for tools natively all the same: a real run found its reviewer trying its own shell instead of the agent's `read_file` (on that machine the shell could not even start - Codex's helper sat at a path of 260 characters), so the work was judged without being opened, and asked to write a file it answered that it could not. Now every call skips the user's configuration (`--ignore-user-config`, `--ignore-rules`; a Codex too old for that has its MCP servers emptied) with their sign-in still theirs, and, as for Claude Code, the agent's tools are served to it for the call by the agent's own MCP server (`mcp_bridge`), run by the agent under its guard, the call ended when it falls silent or the run is stopped rather than at a fixed time. ITS OWN TOOLS ARE KEPT WHERE THE AGENT'S PERMISSIONS STILL HOLD, AND ONLY THERE (`codex_provider.OWN_TOOLS_OFF`): its web search, when the settings say the model's own (as Claude Code's); its code mode, through which it calls every tool, the agent's too - measured, not assumed: inside it there is no `require`, no `process`, no `fetch`, no file of any folder, only the tools it is given; and its `apply_patch`, which stays in that list, is refused by the read-only sandbox (\"writing is blocked\"). Its shell, file editing and picture viewing stay off: Codex's sandbox cannot be kept out of the places the agents may not read, as Claude Code's reading tools are by rules naming them. And NO AGENT OF ITS OWN: its multi-agent tools stayed in code mode's list with the feature switched off, and a helper agent was started from there - outside the agent's sight, guard and count of what the run spent - so the depth of agents below the call is set to none (`agents.max_depth=0`), and the tools are gone. The model and the effort the user's configuration names are still read from it - only those two - so \"Codex default\" means what it did.","amended":true},{"type":"p","text":"*Amended 2026-10-18:* WHICH TOOLS CODEX HAS IS ASKED OF IT, NOT ASSUMED. Its own tools are turned off by name, and a name not on the list - a tool a later Codex adds - stays on; its multi-agent tools stayed with their feature off. So before a call whose reading must stay sealed (a way or a try of the Work debugger) is given to Codex, the installed program is asked what its code mode can call - once per program file, version and model, since which tools a model is given differs - and only what is measured to read nothing may be there: the MCP resource tools, which reach only the agent's own server, its patch tool, which the read-only sandbox refuses, the clock, and the agent's own tools (`CodexProvider.confined`, `OWN_TOOLS_ALLOWED`). Anything else, or no list that can be read, and that Codex is not used there - the call goes to the next model on the list, or is refused saying which tool it was - and its row in Settings says so. Found confined, it is used like Claude Code.","amended":true},{"type":"p","text":"*Amended 2026-10-18:* A CLIENT'S OWN WEB TOOLS ARE HELD TO THE AGENT'S CHECKS, AND THE CHECKS ARE WIDER. The agent's own web tools check two things (`runtime/web_guard.py`): a search carries words, not data - nothing longer than a sentence, nothing that looks like a key, a token or something encoded - and a page is opened only when nothing read can travel in its address, since asking for a page sends its address to the site and a page read may tell the model to send what it read that way. The model's own search, the default, had bypassed both: Claude Code's WebFetch could open any address the model made up, and so could Codex's live search. NOW CLAUDE CODE'S WebSearch AND WebFetch ARE HOOKED: for each call they are offered with, the call's own server (the one that serves the agent's tools) answers a hook before and after each search and page - this application started as the hook (`--web-hook`), asking the call's guard - refused before it runs when the check fails, its results known after it, so a page its search found can be opened. Neither tool is allowed by the command: each is let through by the hook's answer alone, so a hook that cannot run, or a guard that cannot be asked, lets nothing through - measured with the client itself, as was that a flag taking names, left with none, swallows the next option (the hooks were lost so, and are no longer). A call with no guard to hold them to is offered the agent's own web tools instead. CODEX'S OWN SEARCH RUNS ON OPENAI'S SERVERS, where no hook of Codex's reaches (its own hooks guide says so of hosted tools): it is offered from OpenAI's cached index only (`web_search=\"cached\"`), which opens no live page, beside the agent's own web tools, which read the live web under the checks. THE CHECKS ON A PAGE ARE WIDER, the user's decision: besides an address that exists - found in a search, on a page read, in the user's instruction, files or records - or its site's front page, a page may be opened on a site the user named, on a reference site (documentation, package registries, encyclopaedias, whose owners see nobody's visits), at a known address made shorter, or, on a site already seen, at a short address with no query none of whose words is the user's alone: each either never appeared in what was read of the user's, or appeared on a public page of another site too - a page cannot make the user's words public for its own site by listing them - and no number of four digits or more of the user's at all. A site made to collect what is sent to it (request bins, tunnels) is opened only at an address that exists. The Connections round, whose web tools had no check at all, is held to the same guard, and so are the pictures it fetches from addresses the model names.","amended":true},{"type":"p","text":"*Amended 2026-10-27:* A MODEL'S OWN SEARCH, ALWAYS, AND NEVER THE APP'S BESIDE IT (the user's decisions). There is no \"Search with\" setting any more: a model with search of its own (Claude Code, Codex) always uses it, held to the checks as above, and is never offered the app's `web_search` beside it - anywhere, in Work, Chat, Connections or the heartbeat - since Codex, given both, chose the app's, met DuckDuckGo's human check and gave up as if nothing were there. The app's page reader (`fetch_url`) stays for every model; only a model without search of its own (an API such as DeepSeek) is given the app's search (Brave with the user's key, else DuckDuckGo). A call with no guard to hold a client's own search to has no search, not the app's. CODEX'S OWN SEARCH IS SEEN BY THE CHECKS: its JSON says each search as it streams - what it asked, and the site and snippet of each result, not its address - and the call's guard takes the sites as found and the snippets as public words (`CodexProvider._searched`, `WebGuard.found`), so an article on one of them can be read with `fetch_url`. Its search runs in its code mode, which is kept on where it searches (measured on Codex 0.165: off, \"code-mode host is disabled\" and no search); its shell, browser and computer stay off. A CODEX TOO DEEP FOR WINDOWS IS STARTED FROM A SHORT PATH: installed by npm under WinGet's Node, its search helper sat at a path of exactly 260 characters and never started (\"failed to spawn code-mode host\"); now, where its helper's path is 250 characters or more, Codex is started from hard links to its files in the agent's data folder (`internal/clients/codex/\u003cversion\u003e`) - the same files, no space taken, made again for a new version and the old version's let go. A link to its folder would not do: Codex finds its helper from its real path.","amended":true},{"type":"p","text":"*Amended 2026-10-27:* AN ADDRESS MADE UP ON ANY SITE, A FEW (the user's decisions). The fifth way a page may be opened - a short address made up, with no query and none of the user's own words - had held only on a site already seen; a forecast's address on a weather site the model knew of was refused, and work could not get on. It now holds on any site, with the same checks, and its name held to them too (short parts, no long number, nothing key-like, no word of the user's alone), and A FEW: five such addresses on a site not seen, and thirty such sites in a run or turn, so nothing can be spelled out an address at a time (`MOST_MADE_UP_PER_SITE`, `MOST_NEW_SITES`). A site made to collect what is sent to it is still opened only at an address that already exists there. What looks like a key is judged piece by piece between the address's separators (`key_like_piece`): an article's name, words joined by hyphens, is not one - it had been taken for one, and a real forecast page was refused. Each refusal says what to do instead (search for the page, or open it without its query).","amended":true},{"type":"p","text":"*Amended 2026-10-27:* CHAT ON THE CHECKED ROUTE, AND WHAT IT LOOKED UP KEPT (the user's decisions: Option A, and Chat as the heartbeat's input). Chat is held as Work is: each turn has a guard of its own, primed with the conversation; a client that can runs the app's tools in the call (`tool_runner`) and its own search and reading go through the guard's hooks; the app's `web_search` and `fetch_url` are offered (the first never to a model with its own). What was searched for and read, in order - by either - is the guard's record (`WebGuard.looked`) and is kept with the reply (`looked_up`, with the tools it used), and the heartbeat reads it beside the reply as what it was: no rule says what to keep of Chat - that is the heartbeat model's to judge. A cited direct-chat message (`msg_`) is now linked as material, and its turn kept whole: the user's message and the agent's reply (`Materials._chat_turn`; PR #8, items 1 and 2).","amended":true},{"type":"h","text":"Which Client, Chosen Explicitly"},{"type":"p","text":"A machine may have more than one licensed client - a command-line client and a desktop application - and they can be signed in to different accounts. Which one answers is therefore the user's explicit choice, not a search order they cannot see."},{"type":"p","text":"Being told \"the client is signed in\" means nothing if the user cannot tell which client was asked, or whose account will be billed for the answer."},{"type":"ul","items":["Each kind of client is a provider of its own - the Claude Code CLI and the Claude desktop app - and the user adds the one they mean to the model list as a model of its own. There is no \"whichever is installed\" choice","Every kind of client the application can use is offered, whether or not it is installed","A client that is not installed is not hidden. It is offered, and choosing it says plainly that it is not installed and where to get it - which is the answer the user was looking for","A provider runs only its own client and never substitutes the other. Falling back quietly means the account that gets billed is not the one the user picked","A client installed somewhere the application does not know to look is named directly, by choosing its program file rather than typing a path","Wherever the application reports that this provider is signed in, it names the client it asked"]},{"type":"h","text":"Asking Whether It Is Signed In"},{"type":"p","text":"Asking a client whether it is signed in has three answers, not two: signed in, not signed in, and **could not ask**."},{"type":"p","text":"Reporting the third as the second is worse than saying nothing. It sends the user to fix a sign-in that was never broken, while the real fault - that this application could not run the client - goes unmentioned. Each of the three is reported as itself, and the reason a probe failed is kept and shown."},{"type":"ul","items":["A probe that could not be run, timed out, or answered unreadably is reported as exactly that, naming the client and the reason","A client that ran and said it is signed out is reported as signed out, which is the case the user can act on","Failing to ask is not grounds to refuse the user an answer. The client itself is the authority on its own sign-in, so the request is attempted anyway and the client's own refusal, if it comes, is what gets reported","The answer is remembered for a short while, because asking starts a process and the panels that read it refresh on a timer","What is remembered is tied to the client it describes. An answer about one client must never be reported for another - two clients can be signed in to different accounts, and the bill follows the one that answers"]},{"type":"h","text":"How Such a Client Is Actually Invoked"},{"type":"p","text":"A local client is a command-line program, and a command line is not a neutral pipe. Four of its properties decide whether this works at all, and each of them fails quietly rather than loudly:"},{"type":"ul","items":["**The request goes in on standard input, never as an argument.** A conversation grows with every turn - history, tool results, retrieved context - and an operating system caps how long a command line may be. Passing the prompt as an argument works in testing, where conversations are short, and then fails for exactly the users who have talked to the agent the longest.","**A tool the client must not use is named explicitly, and every name is one the client recognises.** A name the client does not know can make it discard the restriction entirely and grant everything - the failure is silent, and it fails open. The restriction is therefore the second layer, not the first: the first is that the client is run in a mode where no tool can be approved, so a tool needing approval is refused whatever the list says.","**The text is decoded as UTF-8, with undecodable bytes replaced rather than fatal.** A client's output carries whatever the user's own material contained. A decoding error must not be indistinguishable from the model failing to answer.","**Failure is read from both output streams.** Such clients report some failures - an expired sign-in among them - on standard output with a non-zero exit. Reading only the error stream reports these as an empty failure, which tells the user nothing and hides the one condition they could have fixed."]},{"type":"quote","text":"These are not defensive extras. Each one was a real failure before it was a rule, and each presented as the agent simply not answering."}],"amendment_note":"2026-10-17: Codex now runs with none of the user's own Codex setup, its own tools kept only where the agent's permissions still hold, and the agent's tools served to it over MCP, as to Claude Code. 2026-10-18: a client's own web tools are held to the agent's checks on the web (Claude Code by hooks, Codex's search cached only), and the checks on a page are wider. 2026-10-27: a model's own search always, never the app's beside it; an address made up on any site, a few; Chat on the checked route, what it looked up kept with the reply; Codex's own search seen by the checks, and started from a short path where Windows' could not hold it.","amended":true},{"number":"77","label":"77.","id":"s77","title":"Authentication Capability Model","page":114,"blocks":[{"type":"p","text":"Each provider should expose supported authentication mechanisms."},{"type":"p","text":"Conceptually:"},{"type":"pre","text":"{\n    \"provider\": \"example_provider\",\n    \"authentication_methods\": [\n        \"api_key\",\n        \"oauth\"\n    ]\n}"},{"type":"p","text":"The Settings UI should dynamically show only authentication options supported by that provider."},{"type":"p","text":"For example, if a provider supports only OAuth, the UI must not display an API Key input."},{"type":"p","text":"If a provider supports both, the user may select between the available methods where permitted by that provider."},{"type":"p","text":"A provider should advertise an authentication method only when the application can complete that method on the current machine."},{"type":"p","text":"Capability means supported and completable, not merely named. A method that can never succeed in the current environment should be omitted rather than offered and then refused."},{"type":"p","text":"An authentication method that the provider supports but that cannot be completed on this machine must still be disclosed. The interface must show it, mark it as unavailable, and state both the reason it cannot be completed and the remedy - rather than omitting it, which misrepresents what the provider supports."},{"type":"quote","text":"A method that is merely blocked by a missing prerequisite is not the same as a method the provider does not offer, and the interface must not render the two identically."}]},{"number":"78","label":"78.","id":"s78","title":"Credential State","page":115,"blocks":[{"type":"p","text":"Authentication state should use a normalized representation."},{"type":"p","text":"Recommended states include:"},{"type":"pre","text":"not_configured\nauthentication_required\nauthenticating\nauthenticated\nexpired\ninvalid\nrevoked\nerror"},{"type":"p","text":"Authentication state must be accessible to:"},{"type":"ul","items":["Settings","Agent Core","The agent heartbeat","The state heartbeat","Scheduler","Debugger"]},{"type":"p","text":"without exposing the underlying credential."}]},{"number":"79","label":"79.","id":"s79","title":"Model Availability State","page":116,"blocks":[{"type":"p","text":"Authentication success does not necessarily mean that a model is usable."},{"type":"p","text":"The system should independently maintain model availability state."},{"type":"p","text":"Recommended states include:"},{"type":"pre","text":"available\nauthentication_required\ncredential_invalid\nquota_exhausted\nrate_limited\nmodel_unavailable\nprovider_unavailable\nnetwork_unavailable\npermission_denied\nunknown_error"},{"type":"p","text":"This distinction is important."},{"type":"p","text":"For example:"},{"type":"pre","text":"Authenticated: Yes"},{"type":"p","text":"Model Available: No"},{"type":"pre","text":"Reason: quota_exhausted"},{"type":"p","text":"is different from:"},{"type":"pre","text":"Authenticated: No\nReason: authentication_required"}]},{"number":"80","label":"80.","id":"s80","title":"Provider Availability Check","page":117,"blocks":[{"type":"p","text":"The model abstraction should expose a normalized availability check."},{"type":"p","text":"Conceptually:"},{"type":"pre","text":"class ModelAvailability:"},{"type":"pre","text":"available: bool\nreason: str | None"},{"type":"pre","text":"authentication_valid: bool"},{"type":"pre","text":"quota_status: str | None\nrate_limit_status: str | None"},{"type":"pre","text":"provider_status: str | None"},{"type":"pre","text":"checked_at: datetime"},{"type":"p","text":"Not every provider exposes exact quota information."},{"type":"p","text":"Therefore, the implementation should use the strongest information available from each provider."},{"type":"p","text":"For example, availability may be inferred from:"},{"type":"ul","items":["Provider quota APIs","Account usage APIs","Authentication status","Provider error responses","Rate-limit responses","Failed lightweight requests","Model permission responses"]},{"type":"p","text":"The provider adapter is responsible for translating provider-specific failures into normalized system states."},{"type":"h","text":"A Limit the Provider States"},{"type":"p","text":"The one failure certain to end by itself must not be filed as the one nobody knows what to do about."},{"type":"p","text":"A provider that runs as a local client says it has stopped serving in its own words, and those words are not an error code: *\"You've hit your session limit · resets 11:50pm (Europe/Lisbon)\"*. Matched against a list of known phrases it said nothing - it does not contain \"rate\" - and a wait-and-retry became `unknown_error`."},{"type":"p","text":"It is recognised by the shape of what it says rather than by one spelling, because it is the client's own wording and has already been written more than one way. It is temporary, it asks nothing of the user, and **when it comes back is part of the answer**: the stated reset is kept where a caller deciding whether to wait can read it, instead of being parsed again out of a sentence."},{"type":"p","text":"**And a failure is reported in the provider's words, not in its telemetry.** The client prints its envelope on standard output even when it exits non-zero, and reading only the exit code threw that away - so the reason became the raw JSON, cut off mid-field by the length limits between there and the log. What the user saw was a wall of zeroed counters that did not say, and could not be made to say, that there had been no answer. Where there is genuinely nothing to quote, the report says the exit code and that there was no message."}]},{"number":"81","label":"81.","id":"s81","title":"API Usage and Quota","page":118,"blocks":[{"type":"p","text":"For API-based models, the system should track usage information where technically available."},{"type":"p","text":"Possible fields include:"},{"type":"pre","text":"request_count\ninput_tokens\noutput_tokens\ntotal_tokens\nestimated_cost\nremaining_quota\nrate_limit_remaining\nquota_reset_time"},{"type":"p","text":"Providers may expose only some of these values."},{"type":"p","text":"Missing provider information must not be fabricated."},{"type":"p","text":"The Debugger should distinguish between:"},{"type":"p","text":"Known Provider Value"},{"type":"p","text":"and:"},{"type":"p","text":"Unavailable / Not Reported by Provider"}]},{"number":"82","label":"82.","id":"s82","title":"Model Settings Interface","page":119,"blocks":[{"type":"p","text":"Settings \u003e General \u003e Models shows the models the agent thinks with, in order."},{"type":"p","text":"Each row names its provider and model, how hard it thinks (its reasoning effort), whether it sees pictures or reads text only, and its state - answering, ready, not connected, or why it cannot answer. Each row can be moved up, moved down or removed, and a provider whose models are read from the client offers to refresh them."},{"type":"pre","text":"Models, in order\n    1. \u003cprovider\u003e / \u003cmodel\u003e   effort   [answering]   Up  Down  Remove\n    2. \u003cprovider\u003e / \u003cmodel\u003e   effort   [ready]       Up  Down  Remove\n    + Add a model"},{"type":"p","text":"Adding a model is one form: what kind it is (an API with a key, or a service on this computer), which one, the authentication method, the key or sign-in, and the model. It then joins the list. A table of every provider and its credential remains available below, collapsed. There are no per-subsystem override controls."},{"type":"p","text":"When a model billed by the token sits below a subscription service, the card warns (\"Mind the order\") that work will go on, and be billed, whenever the service cannot answer."},{"type":"p","text":"The system should validate a selected model before treating the configuration as operational."},{"type":"h","text":"Provider and Model Are One Choice"},{"type":"p","text":"A model belongs to a provider. The two settings are not independent, and the interface must not allow a combination that cannot work."},{"type":"ul","items":["Changing the provider must carry the model with it: a model that the newly selected provider does not offer is replaced with one that it does","The models offered for selection are the models of the selected provider, in a form that can be stored and read back without ambiguity","A configured model that the provider does not offer must be reported as what it is - a setting to correct, naming the model, the provider and the models available - and the request must not be sent"]},{"type":"quote","text":"Sending a model a provider does not offer produces an error from the provider naming a model the user never chose. That is a fault in the application, not an explanation for the user."},{"type":"h","text":"Choosing Is Done Where Providers Are Shown"},{"type":"p","text":"The interface that lists the providers must also be where one is chosen, and must show which one is in use."},{"type":"p","text":"Listing a provider, reporting it as signed in and ready, and offering no way to use it leaves the user to discover that the choice is made somewhere else entirely - in a settings list, under a name they have to know to look for. They will reasonably conclude the thing they just set up does not work."},{"type":"ul","items":["A provider joins the model list in one action, and its place on the list is what decides when it answers","The model currently answering is marked as such","Registering a credential and choosing the model are one act: the form that takes the key or sign-in ends with \"Add to the list\", so a provider the user has just set up is one the agent uses"]},{"type":"h","text":"Registering and Choosing Are One Form"},{"type":"p","text":"An earlier interface showed registering a credential and choosing the provider that answers as two separate panels. A user who completed a credential and saw the word \"authenticated\" reasonably believed the agent now used it, when they had only registered it."},{"type":"p","text":"The model list removes the gap: adding a model registers its credential and puts it on the list in the same form, and the list is the only place where what answers is decided."},{"type":"ul","items":["The list says in plain words that each call goes to the first model that works, and what makes it pass to the next","The table of every provider and its credential - by what method each is registered, whether it is ready, and what it has cost - stays available, collapsed under the list","The control that adds is worded as adding to the list, not as saving a setting"]}]},{"number":"83","label":"83.","id":"s83","title":"Credential Storage","page":120,"blocks":[{"type":"p","text":"Credentials must be managed by a dedicated Credential Manager."},{"type":"p","text":"Conceptually:"},{"type":"p","text":"Agent Components"},{"type":"pre","text":"|\nv"},{"type":"p","text":"Credential Manager"},{"type":"pre","text":"|\n+-- Windows secure storage\n|\n+-- macOS secure storage\n|\n+-- Linux secure storage"},{"type":"p","text":"Other modules should retrieve authorization capability through the Credential Manager or Model Provider rather than reading raw secrets directly."},{"type":"p","text":"The Knowledge Graph must never be used as credential storage."}]},{"number":"84","label":"84.","id":"s84","title":"OAuth Token Handling","page":121,"blocks":[{"type":"p","text":"OAuth implementations may involve:"},{"type":"ul","items":["Access tokens","Refresh tokens","Expiration timestamps","Account identifiers","Provider scopes"]},{"type":"p","text":"These values must be treated as credentials."},{"type":"p","text":"OAuth refresh tokens must never be included in:"},{"type":"ul","items":["Model prompts","Knowledge Graph nodes","Raw Edits","Application logs","Debugger output"]},{"type":"p","text":"Token refresh should be handled by the provider authentication layer."},{"type":"p","text":"If automatic refresh fails, the model state should transition to:"},{"type":"pre","text":"authentication_required"},{"type":"p","text":"or another appropriate normalized error state."}]},{"number":"85","label":"85.","id":"s85","title":"Authentication Events","page":122,"blocks":[{"type":"p","text":"Authentication state changes should generate internal system events."},{"type":"p","text":"The events published are:"},{"type":"p","text":"model.available"},{"type":"p","text":"model.authentication_required"},{"type":"p","text":"model.authentication_failed"},{"type":"p","text":"model.quota_exhausted"},{"type":"p","text":"model.rate_limited"},{"type":"p","text":"model.unavailable"},{"type":"p","text":"model.recovered"},{"type":"p","text":"An expired sign-in is reported as model.authentication_required; there is no separate \"authenticated\" or \"authentication expired\" event. model.recovered is published when a model that had a failure state works again."},{"type":"p","text":"These events are consumed by:"},{"type":"ul","items":["Settings","Debugger","The sign-in prompt","The state heartbeat, which resumes its open round at once when a model recovers"]},{"type":"p","text":"Credentials themselves must never be included in these events."}]},{"number":"86","label":"86.","id":"s86","title":"Data Heartbeat Model Availability Requirement","page":122,"blocks":[{"type":"p","text":"There is no longer a Data Heartbeat (section 69). Every background component that needs a model - the agent heartbeat, the state heartbeat, scheduled model tasks - goes through the model manager, and the manager checks the model before the call."},{"type":"p","text":"The sequence is:"},{"type":"p","text":"Background Component Needs a Model"},{"type":"pre","text":"|\nv"},{"type":"p","text":"Model Manager Resolves the Model (the first on the list)"},{"type":"pre","text":"|\nv"},{"type":"p","text":"Check Authentication, Model Availability and API / Usage Availability"},{"type":"pre","text":"|\n+----------------------+\n|                      |\n| Available            | User must act\nv                      v"},{"type":"p","text":"Make the Call            Refuse; pass the call to the next model on the list"},{"type":"pre","text":"                       |\n                       v\n               No model on the list can answer\n                       |\n                       v\n               The heartbeat stops, tells the user,\n               and leaves its unread activity unread"},{"type":"p","text":"The agent heartbeat stops at the first refused step, notifies the user when the user must act, and does not move its \"summarised until\" mark forward, so the stretch is read later. The state heartbeat keeps its round open and tries again after at most two minutes, or at once when the model recovers. The stored sign-in is also checked when the application starts, so an expired sign-in is reported when the user can act on it."},{"type":"p","text":"This check is a hard system requirement."}]},{"number":"87","label":"87.","id":"s87","title":"Mandatory Data Heartbeat Authentication Warning","page":124,"blocks":[{"type":"p","text":"When any part of the agent finds that an account-based model requires login or re-authentication, the system must notify the user. The user is asked once to sign in to that provider again, whichever component found it."},{"type":"p","text":"The failure must not remain silent."},{"type":"p","text":"Examples include:"},{"type":"ul","items":["User has never logged in","OAuth authorization expired","Refresh token is invalid","Account authorization was revoked","Required account permission is missing"]},{"type":"p","text":"The notification should clearly identify:"},{"type":"ul","items":["Which model/provider is affected","Why the agent cannot use it","What action the user needs to take"]},{"type":"p","text":"For example:"},{"type":"p","text":"Sign in to \u003cprovider\u003e again. The agent could not use the stored \u003cprovider\u003e sign-in. Reason: the session has expired."},{"type":"p","text":"Open Settings \u003e General \u003e Models and sign in again."},{"type":"p","text":"The system must not expose internal tokens or authentication secrets in the notification."}]},{"number":"88","label":"88.","id":"s88","title":"Mandatory Data Heartbeat API Availability Warning","page":125,"blocks":[{"type":"p","text":"When a background heartbeat cannot continue because an API-based model's capacity is unavailable, and no later model on the list can answer, the heartbeat that needed it must tell the user that it is paused and why."},{"type":"p","text":"This includes conditions such as:"},{"type":"ul","items":["API key missing","API key invalid","API key revoked","Account quota exhausted","Credit/billing limit reached where reported by the provider","Model access not available under the account","Other provider responses that indicate continued background processing cannot occur"]},{"type":"p","text":"For example, from the agent heartbeat:"},{"type":"p","text":"Heartbeat paused. The heartbeat model is unavailable: API quota exhausted."},{"type":"p","text":"Open Settings \u003e General \u003e Models."},{"type":"p","text":"The state heartbeat records why its round is blocked and when it will try again."},{"type":"p","text":"This notification requirement is mandatory."}]},{"number":"88.1","label":"88.1","id":"s88-1","title":"A Block That Is a Sign-In Asks for a Sign-In","page":130,"blocks":[{"type":"p","text":"Where processing stops because a sign-in has expired or been refused, the user is asked to sign in - not told that something is paused."},{"type":"p","text":"Both statements are true. Only one of them names the thing the user can do. \"Data processing is paused, open Settings to review the model configuration\" sends someone to read a screen; \"sign in to this provider again\" is the single action that fixes it."},{"type":"ul","items":["A block whose cause is authentication raises the same sign-in request that any other component raises for the same cause, so it reaches the same prompt with the same way out","A block whose cause is anything else - a rate limit, an exhausted quota, a provider that is down - does **not** ask for a sign-in. Signing in again fixes none of those, and asking sends the user to do pointless work","One problem produces one message. A pause notice *and* a sign-in request for the same cause is being told twice, in two different sets of words, pointing at two different remedies"]},{"type":"h","text":"The Prompt Does the Navigating"},{"type":"p","text":"Offering to sign in and then leaving the user in a settings screen to find the right provider among the others leaves most of the work still to do."},{"type":"ul","items":["The prompt names the provider that is failing and which part of the agent it is stopping","Acting on it opens the sign-in for **that** provider, already selected, and shows where it is on the screen","Dismissing it stops the message, not the problem. The state remains visible where state belongs"]}]},{"number":"89","label":"89.","id":"s89","title":"Rate Limiting vs. Persistent Unavailability","page":125,"blocks":[{"type":"p","text":"Temporary rate limiting should be distinguished from persistent model unavailability."},{"type":"p","text":"For example:"},{"type":"p","text":"HTTP/provider state:"},{"type":"pre","text":"temporary_rate_limit"},{"type":"p","text":"Behavior:"},{"type":"p","text":"the same model is tried again later according to provider policy; the call is not passed to another model (the same holds for a timeout)"},{"type":"p","text":"versus:"},{"type":"p","text":"state:"},{"type":"pre","text":"quota_exhausted"},{"type":"p","text":"or a usage limit the provider states (for example a session limit and when it resets)"},{"type":"p","text":"Behavior:"},{"type":"p","text":"the call passes to the next model on the list"},{"type":"p","text":"if no model on the list can answer, background work pauses and the user is told (sections 86, 88)"},{"type":"p","text":"The provider adapter should determine whether an error is:"},{"type":"ul","items":["Temporary/retryable","Persistent/user-action-required","Unknown"]},{"type":"p","text":"Persistent user-action-required failures must trigger a notification."},{"type":"h","text":"What the Classification Is For"},{"type":"p","text":"The distinction decides what the application does, not merely what it displays."},{"type":"p","text":"A condition the user must act on - no credential, one that is not accepted, a model the provider does not offer, an exhausted quota - means the request cannot succeed. The application says so, and does not send it."},{"type":"p","text":"A temporary condition is not grounds for refusing a request the user has just made. It must be attempted:"},{"type":"quote","text":"An availability check is evidence about the past. The request is the authoritative answer, and it costs what the check costs."},{"type":"ul","items":["A request the user initiated is attempted when the only objection is a temporary condition, and the provider's answer is what is reported","A successful attempt clears the condition: what is known about the model is what last happened, not what a probe once saw","Work the application schedules for itself is different: it may defer, because deferring loses nothing and retrying immediately spends the same exhausted quota","Where a temporary condition is met by waiting, the waiting must be bounded and visible, and must not itself generate the traffic it is waiting out"]},{"type":"h","text":"A Status Code Is Not a Diagnosis"},{"type":"p","text":"A response is classified by what it says, not only by its code."},{"type":"p","text":"A rate limit states what remains and when to return - in its quota headers, in a retry-after
