ide it the to-do TRACKS ALL ITS WORK: a line saying where each version stands (\"V1 finished · V2 going · V3 plan\"), opened out into a row each, the newest first - its plan waiting for the user (Open the plan), starting, going and what it is doing this moment, paused, waiting for you (from the runs going, asked every four seconds), finished with what it handed over (Open the result), or stopped (See it in Work). A run that ends makes the to-dos be asked again at once, so its version says how it ended without waiting for the Overview's next look (`of_todos` gives every version, oldest first).","amended":true},{"type":"p","text":"*Amended 2026-10-26:* WHAT THE USER GETS, AND HOW (the user's decisions; `agent/work/handed.py`). A piece of work ends with something the user USES, and it is handed to them in the form most convenient for that - not as whatever file was easiest to write: an email to send is not a .md to copy from. Every way's work agent hands each result over with `hand_over`, one item of a kind: an EMAIL (to, cc, bcc, subject, body) opens in the user's own mail as a new message, filled in - Gmail's or Outlook's compose page in their own browser, where they are signed in, or the computer's mail program by a mailto: link; an EVENT opens in their calendar, filled in (Google Calendar's or Outlook's page, or an .ics file their calendar program opens); TEXT to paste is copied; a FILE opens in the program it opens with (one that would run as a program is shown in its folder), a FOLDER opens; an ANSWER is shown. NOTHING IS SENT, SAVED OR SUBMITTED for them, and the agent never signs in anywhere nor writes to their accounts: a link only opens a page filled in. A body too long for a link (over 7,500 characters of link) is left out of it, to be copied and pasted. Where it opens is the user's setting - Your mail, Your mail account, Your calendar - \"auto\" by default: found from the windows they had open (Gmail or Outlook, the Gmail account a Gmail window's title names most, Google Calendar or Outlook's), else the computer's own. The plan names each deliverable in its form and how they get it; the contract's deliverables say how each is HANDED AS, and the reviewer asks whether that is the most convenient; whether to also keep a file is the agent's to judge. What is handed over is read by the reviewer and the final checks as it will be opened. The run shows WHAT YOU GET first - an email as a message, an event with its time - with what opens it; a to-do's \"Open the result\" opens what was handed over first. Not tried against Gmail or Outlook themselves - their compose pages' links are as they are documented, and long links are cut at a cautious length.","amended":true},{"type":"p","text":"*Amended 2026-10-26:* START IS ANSWERED AT ONCE. Setting work going - its project made, its folders granted, room found, its process started and heard from - took seconds, and the box stayed open, its Start pressed, all that while. Now Start is answered at once and the work is set going apart (`WorkDrafts.start_apart`): the draft is \"starting\" until it is \"started\" - with what starting it said, waiting for room among it - or is back where it was with why not; the box closes at once, the page asks the draft how it went, and one that did not start is opened again with why, to change and Start again. A draft left \"starting\" when the application closed is ready to be started again. A to-do whose work is starting is Ongoing. The quick agent is told today's date, as the work agent is: not told, it ran code to learn it.","amended":true},{"type":"p","text":"Delegated work given no folder still needs somewhere to write. Its output folder is `agent_work/\u003cthe work's name\u003e`, using the plan's title with the characters a folder name cannot hold removed. If a folder of that name already exists, the date and time are appended to the name, with a counter if that name is taken too. Two pieces of work with the same name are told apart by when they were made, and neither writes into the other's folder."}],"amendment_note":"2026-10-16: the user asked for a keyboard shortcut, Ctrl+Alt+D, set in Settings \u003e Shortcuts, that opens the Delegate work box empty, to be filled in; right-click entries in other programs (a browser extension, macOS Services, file managers, editors) were planned and put off, the stores and signing not yet bought.","amended":true},{"number":"119.4","label":"119.4","id":"s119-4","title":"Every Deliverable Comes With a README","page":148,"blocks":[{"type":"p","text":"*Module: `agent/work/runner.py` (`_readme`, `README_PROMPT`, `README_MARK`).*"},{"type":"p","text":"**Every run that made something ends by writing a README** in the work's folder, in the display language. The work agent writes it with its reading tools, from the files themselves, in short headed sections: **what was made**; **where it is**, each file or change by its path; **how to check it**, meaning what to open or run and what the user should see, which is how they accept the work; **how to use it**, with exact commands where there are any; and **what is not done**, and what would come next. The prompt tells the agent to write only what the files show and not to give a step it has not checked."},{"type":"p","text":"The README is written at the wrap-up of any run that has a contract and changed files that still exist. That includes runs that end unfinished, whose README says what exists so far and what is left. The single-model variant has no tree of cards, so it is given what was asked, its report and the files it changed, and writes the same README from those."},{"type":"p","text":"**The user's own README is never overwritten.** Every README a run writes begins with a fixed marker line (`README_MARK`). If the folder already has a `README.md` that does not begin with the marker, the run's README is written beside it as `README-deliverable.md`. A README the run wrote earlier is replaced, because it is the run's own. The plan the user approves always lists the README among its deliverables (section 119.1), so the user knows to expect it."}]},{"number":"120","label":"120.","id":"s120","title":"Each Run in a Process of Its Own, Within What the Computer Has Free","page":148,"blocks":[{"type":"p","text":"*Modules: `agent/work/child.py`, `agent/work/governor.py`, `common/children.py`, `agent/work/runner.py` (`_apart`, `start_waiting`).*"},{"type":"p","text":"**Each run is now a child process** (`work_in_subprocess`, on by default). The agent writes a **spec** (`spec.json`) into a folder of its own under `work_children/` and starts the program with `--work-child`. The child builds a smaller application on the same root, with no listeners, heartbeats, page or desktop, and does the whole start itself: the checks, any rollback, then the run. It writes a **reply** (`reply.json`) saying that the run started, or why it did not, and the agent waits up to 90 seconds for that reply. After that the two sides talk only through files:"},{"type":"ul","items":["every half second the child writes a **snapshot** (`snapshot.json`) of where the run stands, while its events go to the run's session log as before. The page shows a live run from these files in the same way it shows a run from before the agent last started;","pause, resume, stop and the user's answers are appended to a **control** file (`control.jsonl`), which the child reads on the same beat."]},{"type":"p","text":"The child is started below normal priority. It cannot outlive the agent: on Windows every child is in a job object that the system closes when the agent ends, elsewhere a watcher does the same job (`common/children.py`), and the child itself exits when the agent's process is gone. A run therefore never keeps going with nobody to show it, and it can be continued later from its last milestone. Drafts are collected and planned in a child of the same kind. Runs of the Experience debugger stay in the agent's process, because they seal the application's own code while they run."},{"type":"h","text":"A Governor Decides How Many"},{"type":"p","text":"Because runs no longer share the agent's process, several can go at once, one per piece of work. How many is decided by a **governor** that looks at the computer every five seconds:"},{"type":"ul","items":["**How many runs may go:** one for every four processor cores and every 1.5 GB of free memory, never more than four. One run may always start when none is going, unless free memory is under 0.75 GB.","**A waiting queue.** A run asked for while there is no room is not refused. It waits, with the reason shown (\"the computer is busy\", \"short of memory\", or how many runs are going already), and the first one asked for is the first one started when room appears.","**Busy processors.** When the average of the last three looks is 85% or more, every process of every run, child processes included, is set to the lowest priority so the user's own programs come first. The runs return to below normal once the average falls to 60%.","**Short memory.** When less than 8% of memory is free, the newest run is paused, with the reason shown. The governor resumes the runs it paused once more than a fifth of memory is free."]},{"type":"p","text":"*Amended 2026-10-17:* ONE POOL FOR EVERYTHING SIDE BY SIDE (`common/pool.py`). The runs of work were not the only thing going in parallel: the state heartbeat's summaries and status calls, the learning of projects (by the button and by itself) and an issue of the Newspaper each counted only their own, so together they could take the machine. Now each takes a place in one pool before it starts, and the runs and an issue are counted in it by asking them. How many places there are is decided from everything going, together, by the rules that decided the heartbeat's calls (whether the user is at the computer, the processor, memory, the battery, a provider refusing): never fewer than one. A place that comes free goes to the kind waiting with the fewest going - with room for four and four kinds waiting, one each, not all four to the runs - and between kinds with as many going, by priority: a run of the user's work, then a project they asked to learn, then the grouping of states, then the Newspaper, then the learning updated by itself. With room for only one, priority alone decides; nothing going is stopped for it. The governor above still decides, for a run, the memory and the busy processors. And no child the agent starts on Windows has a console window of its own unless it asks for one: from a process without one - the installed application, tests run in the background - every git call had opened a window.","amended":true},{"type":"p","text":"*Amended 2026-10-17:* the WORK DEBUGGER'S WAYS take their turn too. A way still runs in the agent's own process, but it is started only when the governor and the pool have room, as a run of the user's work is; while there is none it waits in the same queue - first asked, first started - and the way says so, why and how far along, with a way not to start it after all; it starts by itself when its turn comes. Every run going counts, the debugger's included, and the newest run of either kind is the one paused when memory is short. EVERY PROCESS THE AGENT STARTS runs a step below the user's own programs - on Windows its priority class, which what it starts inherits; elsewhere the watcher's niceness. It is not a limit: with nothing else wanting the processors they have all of them, and only while the user's own programs want them do those go first. A full run of the tests is started the same way. And should a process ever outlive the application - the job that ends them with it could not be made, or a watcher was killed with it - those carrying the marks of the application's own folders (the guard its children load, the folder each run in a process of its own is told about) are found and ended when it starts again.","amended":true},{"type":"p","text":"*Amended 2026-10-18:* THE WORK DEBUGGER'S WAYS GO EACH IN A PROCESS OF THEIR OWN TOO, as the user's runs do: a way run in the agent's process shared its time with everything else there, and a long one made the page and the other ways slow. Its process is started where the way would have started - when its turn in the same queue comes - finds its way of its project by the way's own name, and is followed, paused, answered and stopped through the same files as a run of the user's. The code seal goes with it: the AGENT holds the application's own code sealed for the way from before its process starts, waiting until the seal is on the disk, and gives it back when that process ends, however it ends; it alone counts every way that goes, so it alone changes the seal. The way's process is told the code is held for it: it takes it as sealed, and nothing it does - its own start or end - ever opens it while another way still runs.","amended":true}],"amendment_note":"2026-10-17: one pool for everything the agent runs side by side - balanced between kinds, then by priority; no console window for a child on Windows.","amended":true},{"number":"120.1","label":"120.1","id":"s120-1","title":"A Run's Own Loopback, and a Browser to Test With","page":148,"blocks":[{"type":"p","text":"*Modules: `runtime/isolation.py` (`own_loopback`, `run_container`), `runtime/guard.py` (`_own_loopback_only`), `runtime/browser.py`, `runtime/agent_browser.py`, `runtime/sandbox.py`, `agent/work/runner.py` (`network_rules`).*"},{"type":"p","text":"Without loopback an agent could only call the framework's test client, which shows nothing of what a person would see. Several runs now go at once, and the Experience debugger's three ways run side by side, so loopback must belong to one run at a time. **Each run's code gets a loopback of its own, where the operating system can provide one.**"},{"type":"ul","items":["**Windows:** each run's code runs in an AppContainer of its own, named from a hash of the run's folder. Windows lets processes in the same container reach each other on loopback, and blocks other containers and the computer itself. It was measured here and needs no administrator change. A container's profile is deleted when the run's last child process ends.","**Linux with bubblewrap:** the run gets its own network namespace, with an empty network and a loopback of its own.","**macOS (Seatbelt) and Landlock:** no loopback at all, because these can open loopback only to every program at once, or share ports between all processes."]},{"type":"p","text":"The in-process guard enforces the same rule from inside the run (`own_loopback`). On the two backends above, connections are allowed only to loopback addresses. No name other than localhost is looked up, and Unix sockets are refused, because a Unix socket is a door to another program. The system keeps everything else out. The prompts tell agents which rule holds on this machine. Where loopback is open, they also tell the agent to take a free port rather than a fixed one, since other runs may be going, and to start the server, wait for it and test it with a real client in the same script."},{"type":"h","text":"A Browser of the Run's Own"},{"type":"p","text":"Testing what a person would see needs a browser. The browser is not the user's Chrome, which holds the user's accounts and whose crash reporter cannot start inside a container. It is Google's **Chrome for Testing headless shell**, downloaded only when the user asks for it in Settings (Browser testing). It comes only from Google's own storage, its checksum is verified, and it is kept in the application's protected state, where no run can write."},{"type":"p","text":"A run is given it only where it has a loopback of its own. There the browser is the one program besides Python that the run's code may start, and it reaches only the servers that run started. Runs drive it through a small standard-library helper (`from agent_browser import Browser`) to load a page, click, type, wait and take screenshots. Each run starts from a **fresh, empty profile**, created in the run's runtime folder and deleted when the browser closes. The screenshots stay in the work's folder as evidence the user and the reviewer can open."}]},{"number":"120.2","label":"120.2","id":"s120-2","title":"A Run Waits on the Model Rather Than Failing","page":148,"blocks":[{"type":"p","text":"*Module: `agent/work/runner.py` (`_call`, `model_trouble`, `_wait_for_model`, `answer`).*"},{"type":"p","text":"A failed call now asks the run for one of three things, decided by `model_trouble`:"},{"type":"ul","items":["**Temporary**: a timeout, or the provider unavailable, overloaded or out of reach. The call is made again by itself after 5 and 20 seconds, then after 60, 120, 300 and 600 seconds, the last wait repeating, and the run carries on. Each attempt is shown in the live session. Retrying cannot go on forever, though, because each attempt may spend usage before it is cut off. A call that has failed this way for an hour becomes **stuck** and waits for the user.","**A usage limit**, which resets by itself. The run waits, shows when the limit resets, and looks again a minute after that time. If the provider did not say when, it looks every ten minutes.","**Something only the user can mend**: a sign-in, a key, a model not offered, credit. The run waits, says what failed and where to mend it, and looks again after a minute and then every ten minutes. A fix made in Settings, or outside the application, is picked up without the user having to tell the run."]},{"type":"p","text":"While a run waits, its status is *waiting for you*, and the list of runs shows that it is waiting on the model rather than on a package. The wait is recorded in the run's plan as one of the user's requests (the last fifty are kept). The time spent waiting does not count against the run's time limit. However a wait is scheduled, the run never looks at the model again sooner than a minute after the last look."},{"type":"p","text":"The waiting run offers two buttons. **End the run** stops it as not finished, makes no further model call in that session, and lets the user continue it later. **Try again now** lets the call go out at once. Before that call is made, the models manager's **availability cache is cleared** (`invalidate`). Without that step, the cache could answer \"try again now\" with the failure it remembered from the last check instead of asking the model, and the button would appear to do nothing."},{"type":"p","text":"*Amended 2026-10-17:* A CALL'S INPUT IS IN A FILE BEFORE THE CLIENT STARTS, not written to it by a thread of the agent's once it has (`common/children._input_file`). Claude Code waits three seconds for its input and then gives up (\"no stdin data received in 3s\"); with the agent's process busy - two debugger runs, a learning and a heartbeat at once on a loaded computer - that thread was not given its turn in time, five calls failed in a quarter of an hour, and a run of work ended with one of them. The file holds the same bytes the pipe carried and is removed when the call ends. And that failure is now one for the moment: the call is made again, not the run ended.","amended":true}],"amendment_note":"2026-10-17: a call's input is in a file before the client starts (Claude Code gave up after three seconds without it), and that failure is retried.","amended":true},{"number":"121","label":"121.","id":"s121","title":"Models in Order, and What Each Call Cost","page":148,"blocks":[{"type":"p","text":"*Modules: `models/manager.py` (`chain`, `set_chain`, `invoke`, `switches`), `models/prices.py`, `common/observability/model_calls.py`, `common/observability/started.py`.*"},{"type":"p","text":"**The models are now a list, in the user's order** (`model_chain`, in Settings \u003e General \u003e Models), each entry with its own reasoning effort. Each call goes to the first model on the list that works. Not every failure passes the call on. A model that **cannot answer as things stand** passes the call to the next model (`switches`). That covers anything only the user can mend (a sign-in, a key, credit, a model not offered, a client not installed) and a usage limit. A timeout or a busy moment does **not** pass the call on: that failure is raised so the caller can try the same model again (section 120.2). The reasoning is that a run should not change models mid-task because of a single slow answer. If no model on the list can answer, the failure of the **first** model is raised, because that is the one the user chose first. A role with its own override model (heartbeat, scheduled task) uses only that model. An installation from before the list behaves as before: the primary model, then the fallback if it was turned on."},{"type":"h","text":"What Each Call Cost"},{"type":"p","text":"**Each call records which model answered and what it cost.** The model is recorded under its own name where the provider gives one, for example the full model id when the request said only \"opus\". The cost comes from the first of these that is available:"},{"type":"ol","items":["the cost the provider reports, as some providers do for each call;","the model's list price from `prices.py`, which counts input read from the provider's cache and input written to it separately. A write costs twice the input price for providers whose cache lasts an hour and a quarter more for a five-minute cache;","the price in the provider's own model catalog."],"start":1},{"type":"p","text":"If none of these exists, the cost is left empty rather than guessed. On a subscription, the cost shown is what the same calls would have cost at list price, since the subscription itself is what is actually paid."},{"type":"p","text":"Calls are kept on disk for 400 days, so a trend survives restarts. Calls made before costs were counted get theirs filled in from the list prices (`fill_costs`). Cached input tokens are now passed through as well. Before that, one machine recorded 11,084 input tokens across 4,139 calls, because the cached input that mattered was never written down. Each call also records the language it was told to write in (section 122) and **whether the user started it** with a button (`by_user`). Without that flag, a function the user ran by hand would be charged to that function's background running cost, and the function would look more expensive to keep switched on than it is."}]},{"number":"122","label":"122.","id":"s122","title":"Languages Said at the Call","page":148,"blocks":[{"type":"p","text":"*Modules: `common/languages.py` (`Language`, `in_display`, `in_english`), `models/manager.py`, `common/output_languages.py`, `heartbeat/states/english_copies.py`, `heartbeat/connections/round.py`.*"},{"type":"p","text":"The agent speaks to the user in one of five display languages (Chinese, English, Spanish, Japanese, Korean), but much of what it writes is for its own use and must be in English: keywords, states, search words."},{"type":"p","text":"*Amended 2026-10-15:* there are nine display languages now - English, Chinese, Spanish, Japanese, Korean, Russian, French, German, Italian - and the whole interface is shown in the one chosen (section 134).","amended":true},{"type":"p","text":"**A model call now says its language in one way only, at the call:** `language=in_display(...) + in_english(...)`. Each part names what it covers, for example \"the plan\" in the display language plus \"the keywords\" in English. The models manager turns this into the instruction the model receives and **puts it first in the system prompt**, whole (`Language.compose`): the display language and what is written in it, followed immediately by each English exception, explained as being \"kept for the agent's own use and compared with one another\". Saying it first means the examples that follow cannot outvote it. Putting each exception straight after the rule means the model reads the exception together with the rule it qualifies, instead of after it has already applied the rule."},{"type":"p","text":"**Each call records the language it carried** (`model_calls.language`, stored as JSON rows). The **Language debugger** tab sets that record beside the code. Every time it is opened, it reads the source with Python's own parser (`output_languages.py`) and lists every place a language is stated: internal, display, or mixed. It lists every model call that states none, and every prompt that still names a language in its own words, which the rest cannot see. It also shows, for each task over the last seven days, the language its calls actually carried. A language added, changed or removed in the code appears there with nothing maintained by hand."},{"type":"h","text":"English Copies"},{"type":"p","text":"Comparison and measurement are done in English, because the embedding model reads only English, while the user reads their own language. So where the display language is not English, a task's words (title, summary, where, goal, doing, status) and a project's name and status carry an English copy (`in_english`). The copy is written in the same call that writes the words. Each copied field is stamped with a short hash of the words it was copied from. A field with no copy, or with a copy of different words, is translated in a backfill (`english_copies.fill`)."},{"type":"p","text":"The backfill runs at the end of a state round, while no part of the round can write, and before a Customized Recommendation issue is made (section 126). It translates up to 40 fields per call and at most six calls at a time, leaving the rest for the next time. A copy is kept only if the source words are still the ones that were translated. Each recommendation story likewise carries its English in the same call, and that English is what \"more like this\" and \"not interested\" are measured by. When the user reads English, none of this runs, because the words they read are already the copy."}],"amendment_note":"2026-10-15: Russian, French, German and Italian added to the display languages - nine in all - and the whole interface shown in them from fixed tables (section 134).","amended":true},{"number":"123","label":"123.","id":"s123","title":"The Local API Answers Only Its Own Key","page":148,"blocks":[{"type":"p","text":"*Modules: `api/access.py`, `api/server.py`, `common/own_interface.py`, `__main__.py` (`--sign-in`).*"},{"type":"p","text":"Once a run's code could reach local ports, the rule that an agent writes only in its own folder would have been one request away from failing. So **every `/api/` request now carries a secret the agents cannot read.**"},{"type":"ul","items":["**The key.** It is 32 random bytes, made once per installation and kept in the protected credentials folder, which the agents' tools refuse to read, the guard refuses inside a run's code, and the operating system hides where it isolates a run. The file is restricted to the user, and the key is registered so that no log ever prints it. The application's own clients (the desktop, tests, the user's scripts) send it in the `X-PA-Key` header.","**The browser's sign-in.** A page cannot be handed the key, because anything the server puts in a page another program could fetch the same way. Instead the desktop opens the page through a **sign-in link carrying a single-use ticket** that lives two minutes. A link printed for a run without a window (`--sign-in`), or opened from Explorer while the agent is still starting, lives fifteen minutes. The ticket is an expiry time and a random nonce, signed with the key, so it needs no stored state. Spent nonces are remembered until they would have expired, so a ticket works only once. The server answers the link by setting a cookie and redirecting to the page asked for, and only to a page of its own. The cookie is HttpOnly, SameSite=Strict and lasts only for the session, and its value is derived from the key rather than being the key. A cookie was chosen over the page holding the key because a page would keep the key in plain text in the browser profile, which an agent may read. Also, the run's deck is shown in a frame, and frames and images can send a cookie but not a header.","**The checks a cookie needs.** A browser sends a cookie to every port of 127.0.0.1, so a page an agent serves on its own port could make the user's browser call the API with the cookie attached. The cookie is therefore honoured only when the browser's own `Sec-Fetch-Site` header says the request came from this page. A request that names another origin is refused even with the key. A request must name this server as its host, which defeats DNS rebinding."]},{"type":"p","text":"Tickets appear in URLs, and URLs end up in browser history, which the listener reads. The listener already skips this application's own pages, and every event it records has any ticket cut out (`scrub_sign_in`). In any case, a ticket copied from the history was spent within a second of being made."},{"type":"p","text":"The few routes other applications use to connect, through the external protocol, stay open without the key, because those applications prove who they are with key pairs of their own. Registering through them is limited to pushing events."}]},{"number":"124","label":"124.","id":"s124","title":"One Lessons Engine","page":148,"blocks":[{"type":"p","text":"Everything the agent learns about how the user wants things done is learned by one engine, `heartbeat/lessons/engine.py`. There are three kinds: **notification lessons**, **connection lessons** and **how you work** (the natures of their work, `heartbeat/lessons/natures.py`). One algorithm for all three means a fix in one is a fix in all of them."},{"type":"h","text":"Evidence First, Then a Lesson"},{"type":"p","text":"A lesson is never written from one event. It is a rule with explicit conditions, and beside it the evidence that supports it and the evidence that contradicts it. A cycle (`learn`) runs over whatever is new:"},{"type":"ul","items":["**Ingest** - each new piece of evidence is given features (its source, the kind of event, the person, English keywords) in one batched call","**Match** - code shortlists up to 20 rules per piece by shared features; the model then judges each pair as supports, contradicts or unrelated, and the judgement is kept with its reason","**Induce** - evidence nothing explains goes to a pool; three or more alike pieces are shown together and the model may propose one rule for them","**Score** - each piece weighs 1 for an action, 2 with a reason the user gave, 1.5 for a correction of the agent, halving every 60 days; confidence is (S + 1) / (S + C + 2)","**Decide** - a candidate is promoted at support 3 and confidence 0.75; a lesson below 0.6 is revised, narrowed or retired from its evidence side by side; lessons resting on the same evidence are merged; one with no support for 120 days retires","**Publish** - the agent is given only the lessons in force, each with its id, how sure it is and how many cases back it - never the raw actions"]},{"type":"p","text":"The work kind is promoted sooner (support 1.5, confidence 0.7), because one stage of the user's work is a whole episode rather than one click. Its natures stay in the library where they were; the engine keeps a rule with the same id and writes back onto each nature whether it is in force and how sure it is, for the reviewer to weigh."},{"type":"h","text":"Only the User's Own Actions Move a Lesson"},{"type":"p","text":"What counts as evidence is what the user did: added, deleted, edited, disabled, called a notification bad - with their reason when they gave one. The user undoing something the agent did on a lesson (`used`, then `outcome`) is a correction against each lesson it followed."},{"type":"p","text":"What the agents do is never evidence. A decision the user left alone for three days stops being waited on (`settle_uses`), but leaving something alone is not something the user did, and it moves nothing; nor does the reviewer reopening a piece of work. Such evidence recorded by earlier versions is removed once (`forget_the_agents_own`) and every lesson scored again. Otherwise the agent would grow surer of whatever it already did."},{"type":"p","text":"The user's own say over a lesson - confirm, reject, pin, edit its words - always wins over the scoring."},{"type":"h","text":"When It Runs"},{"type":"p","text":"Never on the user's click: an edit is written down, and the cycle runs with the state heartbeat's round for each kind with something new (`due`, `learn_due`), or when the user presses Learn now. A kind whose function is turned off is not learned. Patterns and principles over the lessons in force are grouped by experience's own builder (`heartbeat/lessons/groups.py`) when the lessons changed."},{"type":"p","text":"*Amended 2026-10-17:* the lessons are no longer shown to the user. Their tab is now the LESSONS DEBUGGER, among the debuggers, and like them it is left out of an installed build: the lessons are how the agent reads what the user did - for whoever develops it. The lessons package stays on the Overview, for the user: everything learned about how they work - the lessons, what Work learned, the natures - carried to another computer and loaded there. On Connections, a change the user makes is said to teach the agent how they want their connections kept, not to be \"a lesson\".","amended":true},{"type":"p","text":"The lessons package (`heartbeat/lessons_package.py`) does not carry the engine's rules but the user's actions themselves; loaded on another computer, each becomes evidence there (`App.lessons_catch_up`) and is learned from again."}],"amendment_note":"2026-10-17: the Lessons tab became the Lessons debugger - for whoever develops the agent, not shown in an installed build; the lessons package stays on the Overview.","amended":true},{"number":"125","label":"125.","id":"s125","title":"Connections","page":148,"blocks":[{"type":"p","text":"`heartbeat/connections/` keeps the user's contacts: people, their accounts and public profiles, and their dated activity (`store.py`)."},{"type":"h","text":"Where People Come From"},{"type":"p","text":"From three places only:"},{"type":"ul","items":["**What the user had in front of them** - step 2 of the agent heartbeat (`people.py`) reads the same window step 1 read and finds who the user *deals with*: wrote to, met, works with on a document or a project. A name read in the news, an author of a paper, a public figure, a name in code - none of these is a contact unless the window also shows the user dealing with them. When in doubt, they are left out.","**The public web** - looked up by the round (`round.py`) for a person whose news is older than 30 days and matters to the user's current work, and for an important one (closeness 4 or 5) unseen for 45 days, at most 3 a round. Only a search and public pages: the agent never signs in, never posts and never contacts anyone; a page that needs a sign-in is not read. Pictures come the same way (`avatars.py`): a GitHub account's own picture, or a public page's sharing image, fetched with no cookie, at most 2 MB.","**The user** - adding, editing, merging and deleting in the Connections panel."]},{"type":"p","text":"Every fact carries when it happened, when it was found and when it was written, so the model can judge what has gone out of date."},{"type":"h","text":"The User's Changes Are Lessons"},{"type":"p","text":"Each add, edit, delete and merge is recorded with who did it, the before and after, and the reason if one was given. The user's own become evidence for the connection lessons (section 124), and the last 100 are kept word for word; older ones are folded into one summary by the model. A deleted person is kept, marked deleted, so a person the user removed is not added back on a hunch - only on stronger, newer evidence, said why."},{"type":"p","text":"On a contact's profile, what the agent found on the web may replace what the user wrote: it is newer than their memory of it, and their change is still in the history."},{"type":"h","text":"The User's Own Profile"},{"type":"p","text":"The user is a person of their own (`is_self`), looked up as a contact is - at most once in 20 hours - and never listed among the contacts. Their profile is protected the other way round: nothing the agent finds changes it. A finding about their name, organisation, role, place, profession or profile links is put in an **inbox** (`propose_for_me`) to accept or dismiss; accepted, the change is made as the user's; dismissed, the same change is never asked again. Changes to the user's own profile are not connection lessons - they say nothing of how the user deals with other people."},{"type":"h","text":"Merges and One Spelling"},{"type":"p","text":"Two entries that are one person are merged after a preview (`merge_preview`) that shows every account, piece of activity, other name and tag that will move and every empty field that will be filled; the kept person's main relationship and organisation stay main. Organisations and profile labels that mean the same are written one way from then on (`canonical`, `merge_names`), so a later finding is spelled as the first."},{"type":"p","text":"*Amended 2026-10-21:* A DIFFERENT PERSON IS NOT AN UPDATE, AND AN ENTRY CAN BE SPLIT. The people step was told only to avoid duplicates, and one contact took the names of five people - a co-author first, then a professor met by email (both academic, seen in one stretch), then those copied on his email - each new name written as another name of the first. It is now told the other side too: names that cannot be one person's, or a different organisation with nothing tying them, are someone else; two people seen together - one window, one email, one organisation, one topic - are two; when it cannot tell, it adds, since a duplicate is merged later and two people made one is worse. And it may SPLIT an entry that is more than one person: each other person in it, with their names, accounts and activity (each piece of activity is listed with its id), made an entry of their own; never one the user merged.","amended":true},{"type":"p","text":"*Amended 2026-10-21:* THE CONNECTION DEBUGGER. Every change to the contacts, newest first - who made it, when, what it was before and after - and, for a change the agent made from a model's answer (the people step, a Newspaper round's web look-up), the start of what the model was asked and answered; the whole of each call is kept in a file of its own (`connections/debug/\u003cday\u003e/`) and opens from there. A debugger: an installed build has none of it.","amended":true}],"amendment_note":"2026-10-21: the people step is told that different names or organisations are another person, and may split an entry; the Connection debugger shows every change with what the model was asked and answered.","amended":true},{"number":"126","label":"126.","id":"s126","title":"Customized Recommendation","page":148,"blocks":[{"type":"p","text":"Customized Recommendation is a newspaper made for the user: a page for each thing they are doing, each searched on the public web for what they have not seen. It has its own tab."},{"type":"h","text":"The Reading Log"},{"type":"p","text":"After each agent heartbeat, what was read since the last time - the browser's pages, how long each window was in front, the screen text and the words of screenshots - is put together into **pieces**, one per thing read or watched (`heartbeat/reading/log.py`). One call triages them; at most 8 thin public pages are fetched again in full - never an address whose opening does something (unsubscribe, confirm, sign in), one carrying a key, or a site of mail, files or shared documents. Each piece is extracted, in English, into its kind, topics, entities and points, and placed in the nearest **topic** (`topics.py`) when within 0.55, else it starts one. A topic's weight is not stored; it is worked out from its pieces' engagement, halving every 14 days."},{"type":"h","text":"From Subjects to Pages"},{"type":"p","text":"`heartbeat/connections/recommend.py` starts from what the user is doing now: each task or project with something in it in the last 14 days, and each reading topic. A topic whose centre is within 0.5 of a task goes onto that task's page. At most 8 pages; beyond that the two nearest are put together. A subject the user said \"not interested\" to at least twice, more often than anything for it, is left out."},{"type":"p","text":"Each page is searched **from its detail** - the states of its tasks, the titles and points of what was read - never from its heading. Someone who watches restaurant reviews wants restaurant reviews, not food prices."},{"type":"h","text":"Checked in Code, Not by the Model"},{"type":"p","text":"Each story is measured against the page's own detail on this machine's embedding model. Below 0.35 it is not printed; from 0.42 it is close; between, broad - and a page carries at most 2 broad stories, never more than half its close ones. The thresholds were measured: stories the user found closely related came out 0.45-0.58; food prices for restaurant reviews, 0.30. A story within 0.78 of something already read, or 0.85 of one shown in a recent issue, is the same story and is left out. News of someone the user knows is kept even when it is near no page, on a page of its own."},{"type":"p","text":"The score is gain x relevance x freshness (halving every 7 days) - not how long something was watched, so a lot of one kind of video does not drown the rest."},{"type":"h","text":"The User's Say"},{"type":"p","text":"Each story offers \"more like this\", \"not interested\" and \"already knew\" - one per story; changing it takes the previous one back. \"Already knew\" counts *for* the topic and is kept as a known piece, so what is like it is not news next time. Stories near ones the user wanted more of score 1.25 times; near ones they turned away, 0.6."},{"type":"h","text":"Its Own Clock and Front Page"},{"type":"p","text":"Issues are made by their own clock (`schedule.py`), apart from the heartbeats: at the times of day the user chose, 08:00 by default, in this computer's time zone, checked once a minute. Times missed while the computer was off make one issue on return, looking back to the last issue (a day at least, a week at most). Every time can be removed; then no issue is made by itself, only with \"Make an issue now\". The times are edited where they stand in the tab and saved as they change. Each issue has a front page - the best story of each page, at most 6 - and the newest 100 issues are kept."},{"type":"p","text":"*Amended 2026-10-15:* a reading topic is a subject only when it is an INTEREST: read on two days and for a minute at least, or for ten minutes in all, or three different things read in it (an evening of papers, each open less than a minute between other windows, is one). A piece on screen less than three seconds does not count. What was looked up to get one thing done - how to fix an error, how to install something, an assistant's help with a problem - is logged as the kind `help` and is never an interest. A merged page keeps the whole list of what it was made of, so a story can be traced to each part (`heartbeat/connections/recommend.py`).","amended":true},{"type":"p","text":"*Amended 2026-10-16:* a story begins with how it ties to what the user is doing: its first sentence, written with it, links it in passing to something specific - the task, the file, the talk, the question they are stuck on, or what they read or watched on that page's subject - the way a friend who knows their work would put it, so they want to read on; never a label like \"why this matters\", and none at all when there is no real link. A story that has one is not also given the labelled reasons beneath it.","amended":true},{"type":"p","text":"*Amended 2026-10-16:* what is enjoyed and what is worked at are interests by different rules. The reading log says of each thing read or watched why it was - work (a job, studies, research, a task, however personal) or leisure (films, music, shows, games, recaps, sport, browsing for pleasure). Work keeps the rule above. A topic mostly of leisure is an interest only when it lasts: on three different days at least a week apart from first to last, within a month, with something of it lately - one film recap watched once for seventeen minutes had made a page of an actor's next film. A page of something enjoyed is told to recommend more of the pleasure in the form it is enjoyed - someone who listens to a great deal of piano gets pieces, performances and concerts, not lessons, unless what they watched was lessons - and enjoyed and worked-at subjects share a page only as a last resort. A story on a topic's page is labelled with the page's name alone, as a section is; its opening says why it is there.","amended":true},{"type":"p","text":"*Amended 2026-10-17:* on screen Customized Recommendation is called **Newspaper** - its tab, its masthead, its function in Settings and its settings - as each issue is laid out as one; the code and the settings keep their names (`recommend`, `module_recommend_enabled`, `recommend_times`).","amended":true},{"type":"p","text":"*Amended 2026-10-16:* a task is a subject of the recommendations by the same two rules. A task of leisure is labelled so, and reaches the recommendations even where its summary judged it \"not a task\" - which had kept every evening's films from them - but only when it lasts, by the rule for leisure above; a project is one of leisure only when every task of it is.","amended":true},{"type":"p","text":"*Amended 2026-10-18:* ONLY CLOSE STORIES. The pages carried a few BROAD stories - a step to the side, the same field - among the close ones; the user decided against them. A story is printed only from `CLOSE_AT` (it was printed from 0.35, now 0.42), and the search is asked for nothing else. The ranking is unchanged: gain x relevance x freshness. WHAT THE PAGES ARE MADE FROM, with tasks and projects made per run (section 37, as amended) - the user's rule: the user's STATES, newest first, until their events add up to twenty-four hours, or there are no more - at nine in the morning with one state of ten minutes, the days before are read back until the twenty-four hours are full - each given with its time and length (twelve hours at first; the user made it a day). A state already written into a task comes under that task's PROJECT, with the project's line and what is being worked on in it; one no run has read yet comes alone, its project not looked for. Not the latest run's tasks: a run started by hand may hold two hours. Routine counts toward the hours and makes no page; a project of leisure still makes one only when it lasts. A project's weight is the hours of its events among them. EVERY PROJECT IS A PAGE OF ITS OWN - the user's rule: a page is about a project, its states the detail under it, and two projects never share one; what was read and watched goes together, and onto the nearest project's page only if it must. A project is a page only with an hour of its events among the twenty-four hours: the states of one touched for less, and those no run has read yet, go each under the project page nearest it in meaning - one of leisure only under a project of leisure, one of work only under one of work, as a page is searched as one or the other - or are left out. THE PAGES ARE SEARCHED FOUR AT A TIME: one after another, a dozen pages of two to five minutes each made an issue take twenty minutes (measured on the user's record).","amended":true},{"type":"p","text":"*Amended 2026-10-21:* AN ISSUE BY ITSELF ONLY WITH ITS SWITCH ON. Beside its times, Newspaper has a switch, \"Make an issue by itself\" (`recommend_auto_on`): an issue is made by itself only while it is on and a time is set - off and none at first, as Work's learning. Where issues were made before, the switch is turned on once, and the times kept (08:00 where none was ever set).","amended":true}],"amendment_note":"2026-10-15: a reading topic gets a page only when it is an interest - one-off glances (a product page for 12 seconds, a 4-second video, a fix looked up for an error) each made a page the user never wanted.","amended":true},{"number":"127","label":"127.","id":"s127","title":"Pictures and Documents","page":148,"blocks":[{"type":"p","text":"`runtime/documents.py` reads what is not text - pictures, PDFs, Word, PowerPoint and Excel - so every model can use it, whether it sees pictures or not."},{"type":"h","text":"Read on This Computer"},{"type":"p","text":"Words in a picture are read by the operating system's own OCR (`platform_layer/ocr.py`), and no picture is sent anywhere for it:"},{"type":"ul","items":["**Windows** - Windows.Media.Ocr, through PowerShell; adding a language is one of Windows' optional parts and asks for an administrator once","**macOS** - the Vision framework, through PyObjC","**Linux** - which has no OCR of its own: RapidOCR (English and Chinese) added to the application's own Python, or Tesseract if the system has it"]},{"type":"p","text":"A picture is read in every one of the five display languages the machine has, and the reading most in its own script is kept. Settings \u003e Display shows which languages are present, with a button to add the rest."},{"type":"p","text":"*Amended 2026-10-15:* there are nine display languages now - English, Chinese, Spanish, Japanese, Korean, Russian, French, German, Italian - and the whole interface is shown in the one chosen (section 134).","amended":true},{"type":"p","text":"A PDF gives each page's text; a page with fewer than 30 characters is taken for a scan and its words read off its picture, for at most 40 pages."},{"type":"h","text":"One Reading per File"},{"type":"p","text":"What was read of a file is kept as a copy named by the SHA-256 of its bytes, in the application's own folder, never beside the file. Read again, the copy is used; a file whose bytes changed is a different file. At most 5,000 copies are kept, the least recently used going first. A screenshot is read in the background as it is taken, so its copy exists before anything asks for it."},{"type":"h","text":"Only to Models That See Pictures"},{"type":"p","text":"A read_file tool answers with the words - always - and the picture itself, at most 1568 pixels on its longest side. Whether a model sees pictures is known from its provider and its name (`models/vision.py`), and the user can say otherwise for any model. A model that sees pictures gets the picture; one that reads text only gets the words and a line saying a picture was not shown. Codex is given its pictures with `--image`."},{"type":"p","text":"*Amended 2026-10-16:* VIDEO. None of the models the agent runs on - the Claude API, Claude Code, Codex, the OpenAI-compatible ones - takes a video as it is, so a work run watches one with a tool of the agent's own, the same for every model (`read_video`, `runtime/video.py`; read_file passes a video to it): frames taken evenly over the part asked for, each a picture with the words read in it, and what is said, line by line with its time, recognised on the processor by faster-whisper, whose model is fetched once, the first time, runs on half the processor at most - it shares the agent's own process - and is let go two minutes after it was last used, as the embedding model is. A start, an end and how many frames narrow it to a moment; speech is read thirty minutes at a time. Everything it makes is written into the run's own folder, under `videos/`, and read from there when the video is asked for again; nothing is written beside the video. A frame whose words hold a password or a code is not kept and not shown, its words given with it hidden, as is what is said.","amended":true},{"type":"h","text":"Passwords and Codes Hidden Before Anything Is Kept"},{"type":"p","text":"`common/credentials_guard.py` cuts passwords, one-time codes and keys out of what the listener records - screen text, titles, addresses, assistant conversations - and out of the words read off a picture. It works by keywords in the five display languages and by the shapes keys and tokens have; no model decides, so no password is ever put before a model to ask whether it is one. The value is replaced with \"[hidden]\" and the label stays, so a sign-in can still be seen to have happened. The account is kept: what was done is of no use without whose account it was done in. A screenshot whose words show a credential is not kept at all, and a picture whose words held one is never given to a model. The protection is the Privacy setting \"Hide passwords and codes\", on by default."},{"type":"p","text":"*Amended 2026-10-15:* there are nine display languages now - English, Chinese, Spanish, Japanese, Korean, Russian, French, German, Italian - and the whole interface is shown in the one chosen (section 134).","amended":true}],"amendment_note":"2026-10-15: Russian, French, German and Italian added to the display languages - nine in all - and the whole interface shown in them from fixed tables (section 134).","amended":true},{"number":"128","label":"128.","id":"s128","title":"Triggers and What Waits for a Time","page":148,"blocks":[{"type":"h","text":"Acting at Once"},{"type":"p","text":"`heartbeat/core/triggers.py` watches the listener's events and, when what is on the screen matches a rule, runs the one step that rule is for on that window alone - not a whole heartbeat. Two rules exist:"},{"type":"ul","items":["**Invitation** - a meeting invitation is in front (\"Yes No Maybe\", an .ics, \"Accept Decline\", and their Chinese equivalents)","**Time agreed** - a time is being agreed (\"works for me\", \"see you on\", and Chinese equivalents), though the message with the time may be folded away"]},{"type":"p","text":"Both run the notification step only, as one model call, given the window read whole (its text and the words in its latest picture), the notifications already on the calendar, what is waiting for a time and the notification lessons. The model is told what *just appeared* separately and to act on that alone; the rest of the window is history."},{"type":"p","text":"Matching is a look at words, with no model, in the listener's own thread. What makes it safe to run unattended is what it refuses to match:"},{"type":"ul","items":["**Only what is new in that window** - a line shown in the last 12 hours does not match again, so a conversation scrolled back, or a terminal where these words were discussed hours ago, is not a reason","**A window is its handle** while it is open, not its title, which a terminal changes as it works","**The first look after start-up only learns** what a window shows: after a restart everything on screen reads as new, and none of it is","**Once in ten minutes** per window, and 12 seconds after a match for the page to settle","**Nobody there, nothing runs** - no keyboard or mouse for 180 seconds","Never the agent's own windows"]},{"type":"p","text":"Triggers belong to the Calendar management function and stop when it is turned off."},{"type":"h","text":"Waiting for a Time"},{"type":"p","text":"`heartbeat/core/pending.py` keeps what the user agreed to whose time is not known yet. The notification step writes one rather than a notification at a guessed time; every one open is given to every later notification step. When the time is seen, the step adds the notification and resolves the waiting item in the same answer, saying where the time came from; when it is called off, it drops it, saying why. An open item with the same title is not written twice. They are listed on the Calendar, where the user can take one off or reword it."}]},{"number":"129","label":"129.","id":"s129","title":"Notifications That Say What Happens","page":148,"blocks":[{"type":"h","text":"Every Button Says What Happens"},{"type":"p","text":"The fixed templates of `agent/feedback/templates.py` now carry their consequence in the label:"},{"type":"ul","items":["**Got it (no more notifications)**","**Remind me in N minutes** - the agent's own interval when it chose one, said in minutes, hours or days; 900 seconds when it chose none. The pop-up's own button reminds in 30 minutes (`App.REMIND_LATER_MINUTES`)","**Add to to-do (no more notifications; listed in To do on the Overview)** - offered on every template","**Bad notification (no more notifications + fewer similar ones in future)** - dismissed, and recorded as evidence for the notification lessons"]},{"type":"p","text":"A notice that asks nothing (the passive template) has only \"OK (no more notifications)\" and Add to to-do, and its pop-up offers no remind button."},{"type":"h","text":"Remind Me Later Moves the Event"},{"type":"p","text":"`App.remind_later` dismisses the notification and moves the event itself to half an hour later - a one-off is put back on the calendar at its new time, not copied. A repeating one's series is not moved: it gets one postponed reminder, made the first time and moved again on each later press. One reminder stays one row on the calendar however often it is postponed."},{"type":"h","text":"The To-Do List"},{"type":"p","text":"`App.notification_to_todo` dismisses the notification, answers its question (if one is pending) as \"put on the to-do list\", and adds the item to `todo_items` (`agent/feedback/todo_list.py`) - once per notification. The list is shown as **To do** on the Overview, beside the Summary task's progress bars, with the open items only."},{"type":"p","text":"Only the user removes an item, by hand: the × turns into \"Remove it? Yes / No\". The agent never marks one done - an item the user chose to keep is not the agent's to judge finished. The Overview also offers to hand an item to the agent (Delegate work, section 119), which gathers the context and drafts a plan for the user to check."},{"type":"p","text":"This is distinct from the **next steps** of the user's tasks and projects, which the agent heartbeat's to-do step (`step_todo`) still ticks when the activity shows one finished - the message sent, the change deployed - each with a sentence saying why, and which the user can untick."},{"type":"p","text":"*Amended 2026-10-18:* There are no next steps of tasks any more (section 37, as amended), and no step ticks them; the To do list here is the user's own, unchanged.","amended":true}],"amendment_note":"2026-10-18: no step ticks next steps of tasks any more; the To do list is the user's own.","amended":true},{"number":"130","label":"130.","id":"s130","title":"Settings in Views","page":148,"blocks":[{"type":"p","text":"Settings is divided into six views, and the last one open is opened again:"},{"type":"ul","items":["**General** - the models in order (section 121), Startup (start when I sign in), the heartbeats in minutes, and web search","**Display** - the language the agent writes and speaks in, text size, and which OCR languages this computer has","**Avatar** - the avatar, alive as on the desktop, with buttons to show it waiting, talking, thinking and notifying, and what it is called","**Functions** - what the agent does by itself (below)","**Privacy** - what is listened to, one switch per source, each saying what the agent loses without it and what it costs the computer; and Hide passwords and codes","**Others** - browser testing and every other setting"]},{"type":"h","text":"Edited in Place"},{"type":"p","text":"Every value is a live control. The first change in a card shows a bar - \"Not saved yet\", Save, Cancel - that stays in sight under the page's sticky header while the user scrolls; typing shows it with the first letter. Nothing is written until Save; Cancel reads the settings again. A change held in one card survives saving another."},{"type":"h","text":"Functions and What They Cost"},{"type":"p","text":"`common/modules.py` lists what runs by itself - Task organisation, Calendar management, Connections, Customized Recommendation, Experience learning - with Activity and states as the core that cannot be turned off. Each says what it does and what turning it off means. Every model call records its task, and `module_of` maps the task to a function, so each function shows its calls, tokens and estimated cost over the last 72 hours, its share of what the automatic functions spent and its share of everything. Shares are by cost, or by tokens when nothing had a cost. A bar beside each is pale for little and deep red for the most."},{"type":"p","text":"What the user starts - work runs, chat, scheduled tasks, lessons, Experience's tasks into stages - is counted apart and has no switch. A function can also be run with a button, and its calls carry the same task either way; `common/observability/started.py` opens a window while a run the user started is going, so those calls are counted as started by the user. Otherwise a function would look dearer to keep on than it is."}]},{"number":"131","label":"131.","id":"s131","title":"The Watermelon Avatar","page":148,"blocks":[{"type":"p","text":"The first avatar, Watermelon (`agent/character/watermelon.py`), is drawn in code rather than kept as pictures: a melon with stripes that follow its curve and a gloss, on a bed of leaves. The body and leaves are painted once; the face is drawn on them every frame, so it can respond:"},{"type":"ul","items":["**idle** - breathing slowly, blinking every few seconds, eyes on the pointer","**hover** - eyes closed in a smile","**click** - a hop and a squash","**talking** - the mouth opening and closing","**thinking** - eyes up, a row of thought bubbles","**notification** - brows up, cheeks pink, a red \"!\" and a hop"]},{"type":"p","text":"The cheeks are pink only for a notification, not when it smiles on hover, so a blush always means there is something for the user."},{"type":"h","text":"Drawn Live on the Desktop"},{"type":"p","text":"The desktop window (`ui/desktop.py`) aims the eyes from between them toward the pointer, fully turned at 150 pixels; with the pointer still for 12 seconds it looks ahead. It redraws often while something moves and seldom while it only breathes. Hover is decided from where the pointer is, not from enter and leave events, which come and go as the pointer crosses see-through pixels and made the smile flicker. Edges are made fully opaque or fully clear, because a half-transparent edge takes on the colour the window keys out and shows as a fringe."},{"type":"p","text":"It **faces the middle of the screen** (`facing_for`): on the right half it faces left, on the left half right, and within 40 pixels of the middle it keeps its direction, so dragging it across does not flicker."},{"type":"p","text":"The settings page draws the same face in SVG over the same body and leaves, from the shared description `RIG`, so the preview in Settings \u003e Avatar is the same character."},{"type":"h","text":"Its Name and Icons"},{"type":"p","text":"What the avatar - and so the agent - is called (`avatar_name` in `agent/character/manager.py`) is the name the user gave it; with none, the avatar's own display name. It is used for the windows' titles, the tray's tooltip and the hover text. Once, on upgrade, the old default avatar is replaced by Watermelon and its old default name, which nobody chose, is cleared."},{"type":"p","text":"The taskbar and title-bar icons and the tray icon (`ui/tray.py`) are drawn from the live avatar at their own size and cut to the figure (`fitted`), with a 3% margin, because a frame is mostly empty around the figure and the icon looked smaller than other programs'."},{"type":"p","text":"*Amended 2026-10-28:* ON A MAC, DRAWN BY A NATIVE VIEW (PR #5). On the Tk of Python's own installer (8.6.16) a clear window drew no pictures, so the avatar sat on a dark tile. It is now drawn by an AppKit image view laid over a clear window (`ui/macos_avatar.py`), Tk still owning the window's place, its moods and the mouse - the view lets every click through to Tk. Measured on a Mac Studio (Tk 8.6.16): seen whole on the wallpaper, clear round it, dragged, hidden and shown, its moods and a character loaded again; a tenth of a core at thirty frames a second, against a fifth for Tk's own drawing. Where the view cannot be had, Tk's own clear window on a Tk known to show the character (8.6.15), else the plain tile; a view that fails to draw gives way to Tk at once. Its edges are drawn as they are there, not cut to whole pixels as for Windows' keyed colour.","amended":true}],"amendment_note":"2026-10-28: on a Mac the avatar is drawn by a native view over a clear window (pull request 5), seen whole on the Tk where a clear Tk window drew no pictures.","amended":true},{"number":"132","label":"132.","id":"s132","title":"The Workspace Is Not the User's Activity","page":148,"blocks":[{"type":"p","text":"The file listener now leaves the whole workspace unheard by default (`default_directory_exclusions` in `common/config/schema.py`), not only its memory folder. Everything there is made and kept by the agents - work runs, the chat's files (section 132.1), the memory library, scratch - and each run writes from its own process (section 120), which no ownership claim in the listener could cover. Nothing about the user is lost: what the user does with what was made is seen by the window and screen listeners."},{"type":"p","text":"Existing installations are moved once (`ConfigStore._workspace_unheard_once`): the line for the memory folder becomes the line for the workspace, in the settings and the user's own defaults, and the user's other lines are kept. The move is marked as done, so a user who takes the workspace out of the exclusions in Settings keeps it out."},{"type":"p","text":"The exclusion is a default like any other, editable in Settings, and the agent's internal folder - its settings, database and logs - stays excluded beside it. The reasoning that kept the rest of the workspace audible earlier, that the user's documents might live there, no longer holds: the workspace is the agents' own place, and a run's thousands of writes recorded as the user's activity would bury what the user actually did."}]},{"number":"132.1","label":"132.1","id":"s132-1","title":"Where Chat's Files Are Kept","page":148,"blocks":[{"type":"p","text":"Files a chat makes are kept per conversation, in `workspace/Chat/\u003cconversation title\u003e/`. The folder is chosen when the conversation first writes a file and kept from then on, even if the conversation's title changes, so its files stay in one place. When two conversations share a title, a timestamp is added to the later one's folder name, and neither writes into the other's."},{"type":"p","text":"Scratch - generated scripts and temporary files - is kept apart, in `workspace/agent/.agent_runtime` (section 111), so a conversation's folder holds only what was made for the user."},{"type":"p","text":"Each conversation's folder is set per tool call, not once for the chat as a whole, so two conversations going at once never mix their files."},{"type":"p","text":"*Amended 2026-10-16:* each conversation in Chat's list has its own menu, as in other chat applications: Pin, Rename, Delete. Pinned ones are listed apart, above the rest, and are never left out of the list. A rename is the user's name for it and nothing renames it afterwards. A deletion is asked once, in the row itself, and then the conversation goes with its messages, what was summed up of them and the follow-up questions asked about them. The files it made stay where they are: they were made for the user and are the user's.","amended":true}],"amendment_note":"2026-10-16: the user asked that each conversation in the chat's list can be deleted with a cross.","amended":true},{"number":"133","label":"133.","id":"s133","title":"Packaging","page":148,"blocks":[{"type":"h","text":"The Debugger Carried Unless Left Out"},{"type":"p","text":"A build from source carries the Debugger by default, as a build from source is a developer's; `build.py --no-debugger` leaves it out. `build/common.py` excludes the `personalized_agent.debugger` package from PyInstaller when the no-debugger environment flag is set. Leaving it out of the build, rather than switching it off, is the point (section 14.34): a setting can be turned back on; a module that was never packaged cannot. Run from source, the debuggers are always there."},{"type":"p","text":"The releases users download are built by GitHub Actions with `--no-debugger`, and published with a `SHA256SUMS.txt` of their files and a build-provenance attestation, so a download can be checked against what the workflow built from the tagged source."},{"type":"p","text":"`build_flags.debugger_available` asks whether the package can be imported, so the answer cannot drift from what was packaged. Without it, no route under `/api/debugger` is registered, and the page removes every debugger tab - the Debugger, Experience, Heartbeat, Chat, nature, reading and language debuggers - moving the computer-usage panel back to the Overview."},{"type":"h","text":"The Installer's Language"},{"type":"p","text":"The Windows installer (`build/windows/installer.iss`) asks first which of the five display languages to use - English, Chinese, Spanish, Japanese, Korean - and speaks it from then on. After installing it always runs the program with `--display-language \u003ccode\u003e`. That respects the user's own choice (`__main__._set_display_language`): if they chose a language themselves - kept in user-defaults.json in the agent root, which a reinstall leaves alone - it stays. Otherwise the installer's language is set as the installer's, not the user's, so a later install in another language may still change it until they choose."},{"type":"p","text":"*Amended 2026-10-15:* there are nine display languages now - English, Chinese, Spanish, Japanese, Korean, Russian, French, German, Italian - and the whole interface is shown in the one chosen (section 134).","amended":true},{"type":"h","text":"Starting at Sign-In"},{"type":"p","text":"The installer's last page asks whether the agent starts at sign-in, ticked by default, and runs `--autostart on` as the user who installed it. Left unticked, it runs `--autostart off`, so the program's own default (on) does not turn it back on at first start. The uninstaller removes the entry and Explorer's Delegate work menu."},{"type":"p","text":"`platform_layer/autostart.py` uses each system's own mechanism in the user's own area, needing no administrator: the HKCU Run key on Windows, a LaunchAgent on macOS, an XDG autostart entry on Linux. The setting `start_at_login` is the truth: each start puts the system's entry back in line with it, with the program as it was started now - the installed executable, or Python with run.py, the same root and headless if headless - so a moved installation is followed and one switched off stays off."},{"type":"p","text":"*Amended 2026-10-15:* after where the program goes, the installer asks WHERE THE DATA IS KEPT - `%USERPROFILE%\\PersonalizedAgent` by default, the previous choice on an upgrade, never inside Program Files - and writes it beside the program. A folder that already holds an agent's data is used only if the user says so; No keeps them on the page to choose another. Uninstalling removes the program and leaves the data folder.","amended":true},{"type":"p","text":"*Amended 2026-10-16:* the data folder is `\u003cprogram folder\u003e\\data` by default, following the program folder while the user has not typed one of their own; an upgrade keeps the one chosen before. A folder that needs administrator rights to write to - Program Files, the Windows folder, ProgramData, or any folder this user cannot write to - is refused on the page itself: it says why, and Next stays off until another is chosen, for the program works as the user and never as an administrator. Uninstalling empties the program's folder and keeps the data folder inside it. And starting at sign-in is one entry for every copy of the program: an entry that starts another copy still on this machine is that copy's - never overwritten or removed by this one - so the installer's last page will not finish with it ticked, and Settings will not save it on, until it is unticked; an entry whose program is gone is nobody's and is taken. The installed program's own folder is never listened to, wherever it was installed.","amended":true}],"amendment_note":"2026-10-15: Russian, French, German and Italian added to the display languages - nine in all - and the whole interface shown in them from fixed tables (section 134).","amended":true},{"number":"134","label":"134.","id":"s134","title":"The Interface in the Display Language","page":148,"blocks":[{"type":"p","text":"*Modules: `api/web/lang/\u003ccode\u003e.json`, `api/web/i18n.js`, `common/interface_words.py`, `scripts/interface_words.py`, `tests/test_interface_languages.py`.*","amended":true},{"type":"p","text":"Every word the application itself shows - its tabs, headings, buttons, labels, the explanations under its settings, the states it names, the avatar's and the tray's menus, the notification's buttons and the avatar's hover panel - is shown in the display language. Nothing is translated on the fly: each language has a fixed table, English on the left and the language's own words on the right, and every one of the interface's texts is in every table, a word a language writes as English included.","amended":true},{"type":"p","text":"A text with a number, a name or another phrase inside it is one entry with numbered places (\"{0} states read\"). It is found in a text left to right, its words in order, in one pass - a pattern with several open places, tried against a long explanation, never finishes - and what fills each place is itself shown in the language when it is one of the table's texts. Dates and times the page writes follow the language too.","amended":true},{"type":"p","text":"The page translates what it draws as it draws it and leaves alone what is not the application's: what the agent wrote, the user's own records, names, paths, code, and what is typed in a text box (its placeholder is the application's, and is translated). The desktop reads the same tables, so a menu says what the page says.","amended":true},{"type":"p","text":"The tables are kept whole by a check, not by memory: `scripts/interface_words.py` reads every text the page's sources can show - their string and template literals, split at the markup, each inserted value a numbered place - and the server's settings, and lists what is not in every table; the test fails until it is. A text the page puts together at run time can still slip past, so a change to what a screen says is followed by a look at it in a language other than English. A text is written so a table can hold it: one whole phrase, not pieces glued together with an English plural.","amended":true}],"amendment_note":"2026-10-15: new - the user asked that every menu change with the display language, from a table, never translated on the fly.","amended":true}]</script>
<script>
"use strict";

const SECTIONS = JSON.parse(document.getElementById("doc-data").textContent);
const byId = new Map(SECTIONS.map((s) => [s.id, s]));
const $ = (sel) => document.querySelector(sel);

const escapeHtml = (value) =>
  String(value).replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/* ------------------------------------------------------------- searching */
let query = "";

function sectionText(section) {
  if (section._text) return section._text;
  const parts = [section.label, section.title];
  for (const block of section.blocks) {
    if (block.items) parts.push(block.items.join(" "));
    else parts.push(block.text);
  }
  section._text = parts.join(" ").toLowerCase();
  return section._text;
}

function matches(section) {
  return !query || sectionText(section).includes(query);
}

function highlight(html) {
  if (!query) return html;
  const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  // Operates on already-escaped HTML, and never inside a tag.
  return html.replace(new RegExp(`(?![^<]*>)(${escaped})`, "gi"), "<mark>$1</mark>");
}

/* -------------------------------------------------------------- contents */
function depthOf(section) {
  return section.number ? section.number.split(".").length : 1;
}

function renderToc() {
  const toc = $("#toc");
  const visible = SECTIONS.filter(matches);
  const visibleIds = new Set(visible.map((s) => s.id));
  toc.innerHTML = "";

  if (!visible.length) {
    toc.innerHTML = '<p class="toc-empty">No section contains that text.</p>';
    return;
  }
  for (const section of SECTIONS) {
    const depth = depthOf(section);
    const row = document.createElement("button");
    row.type = "button";
    row.className = "toc-row" + (depth === 2 ? " child" : depth > 2 ? " grandchild" : "");
    row.dataset.id = section.id;
    if (!visibleIds.has(section.id)) row.classList.add("hidden");
    row.innerHTML =
      `<span class="num">${escapeHtml(section.label || "—")}</span>` +
      `<span class="label">${escapeHtml(section.title)}</span>` +
      `<span class="page">${section.amended ? '<span class="amend">§</span> ' : ""}` +
      `p${section.page}</span>`;
    row.addEventListener("click", () => {
      location.hash = section.id;
      if (window.matchMedia("(max-width: 900px)").matches) $("#rail").classList.remove("open");
    });
    toc.appendChild(row);
  }
  markActive(currentId);
}

function markActive(id) {
  for (const row of document.querySelectorAll(".toc-row")) {
    const active = row.dataset.id === id;
    row.classList.toggle("active", active);
    if (active) row.scrollIntoView({ block: "nearest" });
  }
}

/* --------------------------------------------------------------- reading */
const AMENDED_ON = "2026-08-30";

function renderBlocks(section) {
  const html = [];
  for (const block of section.blocks) {
    const amended = block.amended ? ' class="amended-block"' : "";
    if (block.type === "p") html.push(`<p${amended}>${highlight(escapeHtml(block.text))}</p>`);
    else if (block.type === "h") html.push(`<h2>${highlight(escapeHtml(block.text))}</h2>`);
    else if (block.type === "quote")
      html.push(`<blockquote>${highlight(escapeHtml(block.text))}</blockquote>`);
    else if (block.type === "pre")
      html.push(`<pre>${highlight(escapeHtml(block.text))}</pre>`);
    else if (block.type === "ul" || block.type === "ol") {
      const tag = block.type;
      const items = block.items
        .map((item) => `<li>${highlight(escapeHtml(item))}</li>`)
        .join("");
      html.push(`<${tag}${amended}>${items}</${tag}>`);
    }
  }
  return html.join("");
}

let currentId = null;

function show(id) {
  const section = byId.get(id) || SECTIONS[0];
  currentId = section.id;
  const index = SECTIONS.indexOf(section);
  const previous = SECTIONS[index - 1];
  const upcoming = SECTIONS[index + 1];

  const jump = [];
  if (previous)
    jump.push(`<a class="prev" href="#${previous.id}"><span class="dir">Previous</span>` +
      `<span class="name">${escapeHtml(previous.label ? previous.label + " " : "")}` +
      `${escapeHtml(previous.title)}</span></a>`);
  if (upcoming)
    jump.push(`<a class="next" href="#${upcoming.id}"><span class="dir">Next</span>` +
      `<span class="name">${escapeHtml(upcoming.label ? upcoming.label + " " : "")}` +
      `${escapeHtml(upcoming.title)}</span></a>`);

  $("#content").innerHTML =
    `<p class="eyebrow"><span>${escapeHtml(section.label || "Title page")}</span>` +
    `<span class="src">PDF page ${section.page}</span></p>` +
    `<h1>${highlight(escapeHtml(section.title))}` +
    (section.amended ? '<span class="amend-badge">amended</span>' : "") + `</h1>` +
    (section.amendment_note
      ? `<div class="amend-note"><strong>Amendment · ${AMENDED_ON}</strong>` +
        `${escapeHtml(section.amendment_note)}</div>`
      : "") +
    renderBlocks(section) +
    (jump.length ? `<nav class="jump">${jump.join("")}</nav>` : "");

  $("#crumb").textContent =
    `${section.label ? section.label + " " : ""}${section.title}`;
  $("#prev").disabled = !previous;
  $("#next").disabled = !upcoming;
  markActive(section.id);
  document.querySelector(".page-wrap").scrollTo?.({ top: 0 });
  window.scrollTo({ top: 0 });
}

/* ------------------------------------------------------------------ wire */
function go(delta) {
  const index = SECTIONS.indexOf(byId.get(currentId));
  const target = SECTIONS[index + delta];
  if (target) location.hash = target.id;
}

$("#prev").addEventListener("click", () => go(-1));
$("#next").addEventListener("click", () => go(1));
$("#rail-toggle").addEventListener("click", () => $("#rail").classList.toggle("open"));

$("#search").addEventListener("input", (event) => {
  query = event.target.value.trim().toLowerCase();
  $("#search-clear").hidden = !query;
  const hits = SECTIONS.filter(matches).length;
  $("#search-note").textContent = query
    ? `${hits} of ${SECTIONS.length} sections match`
    : "";
  renderToc();
  if (currentId) show(currentId);
});

$("#search-clear").addEventListener("click", () => {
  $("#search").value = "";
  $("#search").dispatchEvent(new Event("input"));
  $("#search").focus();
});

document.addEventListener("keydown", (event) => {
  const typing = ["INPUT", "TEXTAREA"].includes(event.target.tagName);
  if (event.key === "/" && !typing) {
    event.preventDefault();
    $("#search").focus();
  } else if (event.key === "Escape" && typing) {
    $("#search").value = "";
    $("#search").dispatchEvent(new Event("input"));
    $("#search").blur();
  } else if (!typing && (event.key === "ArrowLeft" || event.key === "ArrowRight")) {
    go(event.key === "ArrowLeft" ? -1 : 1);
  }
});

window.addEventListener("hashchange", () => show(location.hash.slice(1)));

const numbered = SECTIONS.filter((s) => s.number && !s.number.includes(".")).length;
$("#doc-meta").textContent =
  `${numbered} sections · ${SECTIONS.length} entries · ${SECTIONS[SECTIONS.length - 1].page} pages`;
const amendedCount = SECTIONS.filter((s) => s.amended).length;
$("#doc-amend").textContent = amendedCount
  ? `${amendedCount} amended section${amendedCount > 1 ? "s" : ""} · marked in the text`
  : "";

renderToc();
show(location.hash.slice(1) || SECTIONS[0].id);
</script>

</body>
</html>
