<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Personalized Agent Spec</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
:root {
  --ground: #f7f8f7;
  --surface: #ffffff;
  --surface-sunken: #eef1f0;
  --ink: #16191c;
  --ink-soft: #3d464b;
  --muted: #5c6672;
  --rule: #e1e5e4;
  --rule-strong: #cbd2d0;
  --accent: #0f6e63;
  --accent-soft: #d8ebe7;
  --accent-ink: #0a4a43;
  --mark: #ffe6a3;
  --mark-ink: #4a3a08;
  --shadow: 0 1px 2px rgba(22, 25, 28, .05), 0 8px 24px rgba(22, 25, 28, .06);

  --sans: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --serif: "Source Serif 4", ui-serif, Georgia, "Times New Roman", serif;
  --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

  --rail: 310px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #101413;
    --surface: #171c1b;
    --surface-sunken: #1e2524;
    --ink: #e6eae8;
    --ink-soft: #c3ccc9;
    --muted: #97a3a0;
    --rule: #262e2d;
    --rule-strong: #37423f;
    --accent: #4fd1be;
    --accent-soft: #16302c;
    --accent-ink: #8fe6d8;
    --mark: #4a3f18;
    --mark-ink: #ffe6a3;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #101413;
  --surface: #171c1b;
  --surface-sunken: #1e2524;
  --ink: #e6eae8;
  --ink-soft: #c3ccc9;
  --muted: #97a3a0;
  --rule: #262e2d;
  --rule-strong: #37423f;
  --accent: #4fd1be;
  --accent-soft: #16302c;
  --accent-ink: #8fe6d8;
  --mark: #4a3f18;
  --mark-ink: #ffe6a3;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .35);
  color-scheme: dark;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--serif);
  font-size: 17px;
  line-height: 1.62;
  -webkit-font-smoothing: antialiased;
}

/* ---------------------------------------------------------------- shell */
.shell { display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); min-height: 100vh; }

/* ----------------------------------------------------------------- rail */
.rail {
  position: sticky; top: 0; height: 100vh;
  display: flex; flex-direction: column;
  background: var(--surface);
  border-right: 1px solid var(--rule);
}
.rail-head { padding: 20px 20px 14px; border-bottom: 1px solid var(--rule); }
.doc-kicker {
  font-family: var(--mono); font-size: 11px; letter-spacing: .1em;
  text-transform: uppercase; color: var(--accent); margin: 0 0 6px;
}
.doc-title {
  font-family: var(--sans); font-weight: 600; font-size: 19px; line-height: 1.25;
  margin: 0 0 4px; letter-spacing: -.01em; text-wrap: balance;
}
.doc-meta { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }

.search-wrap { padding: 12px 16px; border-bottom: 1px solid var(--rule); }
.search-field { position: relative; display: flex; align-items: center; }
.search-field svg { position: absolute; left: 10px; width: 14px; height: 14px; color: var(--muted); }
#search {
  width: 100%; padding: 8px 30px 8px 30px;
  font-family: var(--sans); font-size: 13.5px; color: var(--ink);
  background: var(--surface-sunken); border: 1px solid transparent; border-radius: 7px;
}
#search::placeholder { color: var(--muted); }
#search:focus { outline: none; border-color: var(--accent); background: var(--surface); }
.search-clear {
  position: absolute; right: 6px; border: 0; background: none; cursor: pointer;
  color: var(--muted); font-family: var(--mono); font-size: 15px; line-height: 1; padding: 4px;
}
.search-note { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-top: 7px; }

.toc { flex: 1; overflow-y: auto; padding: 8px 0 40px; scrollbar-width: thin; }
.toc-row {
  display: grid; grid-template-columns: 3.6em 1fr auto; align-items: baseline; gap: 8px;
  width: 100%; text-align: left; padding: 5px 16px 5px 14px;
  border: 0; background: none; cursor: pointer; color: var(--ink-soft);
  font-family: var(--sans); font-size: 13.5px; line-height: 1.35;
  border-left: 2px solid transparent;
}
.toc-row:hover { background: var(--surface-sunken); color: var(--ink); }
.toc-row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.toc-row .num {
  font-family: var(--mono); font-size: 11.5px; color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.toc-row .page {
  font-family: var(--mono); font-size: 10.5px; color: var(--muted); opacity: .75;
  font-variant-numeric: tabular-nums;
}
.toc-row.child { padding-left: 30px; font-size: 12.5px; }
.toc-row.child .num { font-size: 10.5px; }
.toc-row.grandchild { padding-left: 46px; font-size: 12.5px; }
.toc-row.active {
  background: var(--accent-soft); color: var(--accent-ink);
  border-left-color: var(--accent); font-weight: 500;
}
.toc-row.active .num, .toc-row.active .page { color: var(--accent-ink); }
.toc-row.hidden { display: none; }
.toc-group { display: flex; align-items: center; }
.toc-toggle {
  width: 18px; height: 18px; margin-left: 6px; flex: none;
  border: 0; background: none; cursor: pointer; color: var(--muted);
  font-family: var(--mono); font-size: 10px; line-height: 1;
}
.toc-toggle:hover { color: var(--accent); }
.toc-empty { padding: 16px; font-family: var(--sans); font-size: 13px; color: var(--muted); }

/* ---------------------------------------------------------------- reader */
.reader { display: flex; flex-direction: column; min-width: 0; }
.reader-bar {
  position: sticky; top: 0; z-index: 5;
  display: flex; align-items: center; gap: 12px;
  padding: 10px 28px; background: color-mix(in srgb, var(--ground) 88%, transparent);
  backdrop-filter: blur(8px); border-bottom: 1px solid var(--rule);
}
.crumb {
  font-family: var(--mono); font-size: 11.5px; letter-spacing: .06em;
  text-transform: uppercase; color: var(--muted); margin-right: auto;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.nav-btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 11px; border: 1px solid var(--rule-strong); border-radius: 7px;
  background: var(--surface); color: var(--ink-soft); cursor: pointer;
  font-family: var(--sans); font-size: 12.5px; white-space: nowrap;
}
.nav-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.nav-btn:disabled { opacity: .38; cursor: default; }
.nav-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.rail-toggle { display: none; }

.page-wrap { padding: 34px 28px 96px; display: flex; justify-content: center; }
article { width: 100%; max-width: 46rem; }

.eyebrow {
  font-family: var(--mono); font-size: 11.5px; letter-spacing: .12em;
  text-transform: uppercase; color: var(--accent); margin: 0 0 10px;
  display: flex; align-items: baseline; gap: 10px;
}
.eyebrow .src { color: var(--muted); letter-spacing: .06em; }
h1 {
  font-family: var(--sans); font-weight: 600; letter-spacing: -.018em;
  font-size: clamp(1.7rem, 1.2rem + 1.6vw, 2.3rem); line-height: 1.16;
  margin: 0 0 26px; text-wrap: balance;
}
h2 {
  font-family: var(--sans); font-weight: 600; font-size: 1.12rem;
  letter-spacing: -.006em; margin: 34px 0 -6px; color: var(--ink);
}
article > * + * { margin-top: 16px; }
p { margin: 0; color: var(--ink-soft); }
ul, ol { margin: 0; padding-left: 1.35em; color: var(--ink-soft); display: grid; gap: 6px; }
li::marker { color: var(--accent); }
ol li::marker { font-family: var(--mono); font-size: .85em; }

pre {
  margin: 0; padding: 15px 18px; overflow-x: auto;
  background: var(--surface-sunken); border: 1px solid var(--rule);
  border-radius: 9px; font-family: var(--mono); font-size: 12.5px;
  line-height: 1.55; color: var(--ink); white-space: pre; tab-size: 4;
}
blockquote {
  margin: 0; padding: 4px 0 4px 20px; border-left: 3px solid var(--accent);
  font-size: 1.04rem; color: var(--ink);
}
mark { background: var(--mark); color: var(--mark-ink); border-radius: 2px; padding: 0 1px; }

/* Amendments are content the PDF does not contain; they are always labelled. */
.amend-badge {
  font-family: var(--mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase;
  color: var(--accent); border: 1px solid var(--accent); border-radius: 999px;
  padding: 1px 7px; margin-left: 8px; vertical-align: middle; white-space: nowrap;
}
.amend-note {
  border-left: 3px solid var(--accent); background: var(--surface);
  padding: 10px 14px; border-radius: 0 9px 9px 0; font-size: .95rem;
}
.amend-note strong { font-family: var(--sans); font-size: .82rem; letter-spacing: .04em;
  text-transform: uppercase; color: var(--accent); display: block; margin-bottom: 4px; }
.amended-block { border-left: 3px solid var(--accent); padding-left: 14px; }
.toc-row .amend { color: var(--accent); font-family: var(--mono); font-size: 10px; }

.jump {
  margin-top: 44px; padding-top: 20px; border-top: 1px solid var(--rule);
  display: flex; gap: 12px; justify-content: space-between;
}
.jump a {
  flex: 1 1 0; min-width: 0; text-decoration: none; color: var(--ink-soft);
  border: 1px solid var(--rule); border-radius: 9px; padding: 12px 14px;
  background: var(--surface); display: block;
}
.jump a:hover { border-color: var(--accent); color: var(--accent); }
.jump a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.jump .dir {
  font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em;
  text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 3px;
}
.jump .name {
  font-family: var(--sans); font-size: 13.5px; display: block;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.jump a.next { text-align: right; }

.results { display: grid; gap: 2px; }
.result {
  width: 100%; text-align: left; border: 0; background: none; cursor: pointer;
  padding: 12px 14px; border-radius: 9px; color: var(--ink-soft);
  font-family: var(--serif); font-size: 14.5px; line-height: 1.5;
}
.result:hover { background: var(--surface); }
.result .rnum {
  font-family: var(--mono); font-size: 11px; color: var(--accent);
  letter-spacing: .06em; display: block; margin-bottom: 2px;
}
.result .rtitle { font-family: var(--sans); font-weight: 500; color: var(--ink); }

@media (max-width: 900px) {
  .shell { grid-template-columns: 1fr; }
  .rail {
    position: fixed; z-index: 20; width: min(88vw, var(--rail));
    transform: translateX(-101%); transition: transform .22s ease; box-shadow: var(--shadow);
  }
  .rail.open { transform: none; }
  .rail-toggle { display: inline-flex; }
  .page-wrap { padding: 24px 18px 80px; }
  .reader-bar { padding: 10px 16px; }
}
@media (prefers-reduced-motion: reduce) {
  .rail { transition: none; }
}
</style>

</head>
<body>
<div class="shell">
  <aside class="rail" id="rail">
    <div class="rail-head">
      <p class="doc-kicker">Draft architecture specification</p>
      <h1 class="doc-title">Personalized Agent</h1>
      <div class="doc-meta" id="doc-meta">System Design and Implementation Specification</div>
      <div class="doc-meta" id="doc-amend" style="margin-top:6px"></div>
    </div>
    <div class="search-wrap">
      <div class="search-field">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"
             aria-hidden="true"><circle cx="7" cy="7" r="4.5"></circle><path d="M10.5 10.5 14 14"></path></svg>
        <input id="search" type="search" placeholder="Search the specification" autocomplete="off"
               aria-label="Search the specification">
        <button class="search-clear" id="search-clear" hidden aria-label="Clear search">×</button>
      </div>
      <div class="search-note" id="search-note"></div>
    </div>
    <nav class="toc" id="toc" aria-label="Table of contents"></nav>
  </aside>

  <main class="reader">
    <div class="reader-bar">
      <button class="nav-btn rail-toggle" id="rail-toggle" aria-label="Show contents">Contents</button>
      <span class="crumb" id="crumb"></span>
      <button class="nav-btn" id="prev" aria-label="Previous section">← Prev</button>
      <button class="nav-btn" id="next" aria-label="Next section">Next →</button>
    </div>
    <div class="page-wrap"><article id="content"></article></div>
  </main>
</div>

<script id="doc-data" type="application/json">[{"number":"","label":"","id":"title","title":"Personalized Agent System Design and Implementation Specification","page":1,"blocks":[{"type":"p","text":"Document Status: Draft Architecture Specification"},{"type":"p","text":"Target Platforms: Windows, macOS, Linux"},{"type":"p","text":"Primary Backend Language: Python"},{"type":"p","text":"Purpose: Implementation specification for an AI-powered personalized desktop agent"}]},{"number":"1","label":"1.","id":"s1","title":"Introduction","page":1,"blocks":[]},{"number":"1.1","label":"1.1","id":"s1-1","title":"Purpose","page":1,"blocks":[{"type":"p","text":"The Personalized Agent is a cross-platform desktop AI agent designed to continuously understand user activity, maintain structured long-term contextual knowledge, proactively assist the user, and execute immediate or delayed tasks."},{"type":"p","text":"The system combines:"},{"type":"ul","items":["A desktop agent interface","User activity monitoring","Long-term memory kept as folders of readable files (the library)","Periodic AI reasoning through heartbeat processes","A delayed-task scheduler","Extensible integrations with desktop applications through the local application protocol","Work the user delegates, planned with the user and then carried out in a separate process","Strong filesystem and execution security boundaries","Cross-platform operating-system abstraction"]},{"type":"p","text":"The agent should behave as a persistent personal assistant while remaining observable, configurable, and controllable by the user."}]},{"number":"2","label":"2.","id":"s2","title":"Core Design Principles","page":1,"blocks":[{"type":"p","text":"The implementation must follow the principles below."}]},{"number":"2.1","label":"2.1","id":"s2-1","title":"Modular Architecture","page":2,"blocks":[{"type":"p","text":"Major system responsibilities must be separated into independent modules."},{"type":"p","text":"At minimum:"},{"type":"ul","items":["Frontend Agent","Overview","States / Settings","Listener","Heartbeat","State Heartbeat","Data Management (the library)","Scheduler","Work (delegated runs)","Lessons","Platform Abstraction","Runtime / Sandbox","External Application Protocol"]},{"type":"p","text":"Each function the agent performs by itself - task organisation, calendar management, connections, Customized Recommendation, experience learning - is a module the user can switch off in Settings \u003e Functions; the core of activity recording and state writing is always on."},{"type":"p","text":"Modules should communicate through clearly defined interfaces rather than directly depending on each other's internal implementation."}]},{"number":"2.2","label":"2.2","id":"s2-2","title":"Cross-Platform by Design","page":2,"blocks":[{"type":"p","text":"Windows, macOS, and Linux are first-class supported platforms."},{"type":"p","text":"Operating-system-specific behavior must be isolated behind a platform abstraction layer."},{"type":"p","text":"Higher-level modules must not contain scattered platform checks such as:"},{"type":"p","text":"if platform == \"windows\":"},{"type":"pre","text":"..."},{"type":"p","text":"elif platform == \"macos\":"},{"type":"pre","text":"..."},{"type":"p","text":"unless located inside the platform-specific implementation layer."}]},{"number":"2.3","label":"2.3","id":"s2-3","title":"Security by Enforcement","page":3,"blocks":[{"type":"p","text":"Security-sensitive requirements must be enforced programmatically."},{"type":"p","text":"They must never rely exclusively on model instructions such as:"},{"type":"p","text":"Do not write outside the user workspace."},{"type":"p","text":"The most important system security invariant is:"},{"type":"quote","text":"No process controlled by the Personalized Agent may write outside the user-authorized writable workspace."},{"type":"p","text":"The authorized area is the workspace plus any folder the user explicitly grants to a piece of work. A grant is made by the user, names one folder, can never be a whole drive, the home folder itself or the application's own state, and is enforced by the runtime exactly as the workspace is."},{"type":"p","text":"This requirement applies to:"},{"type":"ul","items":["The main agent","Model-generated scripts","Scheduler scripts","Subprocesses","Temporary files","Downloads","Archive extraction","Tool execution","Model-generated code","Child processes"]},{"type":"p","text":"Whenever technically possible, this should be enforced at both:"},{"type":"ol","items":["Application level","Operating-system or sandbox level"],"start":1}]},{"number":"2.4","label":"2.4","id":"s2-4","title":"Event Collection and Interpretation Must Be Separate","page":3,"blocks":[{"type":"p","text":"The Listener records what happened."},{"type":"p","text":"The heartbeats determine what the event means: the agent heartbeat reads the recent window of activity and writes states, and the state heartbeat groups states into tasks."},{"type":"p","text":"Listener implementations must not directly modify the library."},{"type":"p","text":"Required flow:"},{"type":"p","text":"User / Computer Activity"},{"type":"pre","text":"|\nv"},{"type":"p","text":"Listener Provider"},{"type":"pre","text":"|\nv"},{"type":"p","text":"Normalized Event"},{"type":"pre","text":"|\nv"},{"type":"p","text":"Raw Event Storage"},{"type":"pre","text":"|\nv"},{"type":"p","text":"Agent Heartbeat (writes states)"},{"type":"pre","text":"|\nv"},{"type":"p","text":"State Heartbeat (groups states into tasks)"},{"type":"pre","text":"|\nv"},{"type":"p","text":"Library"},{"type":"p","text":"Raw activity is kept for eight days by default (`raw_activity_keep_days`) and then removed."}]},{"number":"2.5","label":"2.5","id":"s2-5","title":"Expensive Knowledge Processing Must Be Asynchronous","page":4,"blocks":[{"type":"p","text":"Foreground agent interactions should remain responsive."},{"type":"p","text":"Expensive operations such as:"},{"type":"ul","items":["Knowledge aggregation","Relationship generation","Large-content compression","Grouping states into tasks, and embedding them"]},{"type":"p","text":"should normally be deferred to background work on its own clock - the state heartbeat, the Customized Recommendation clock - or to a child process, as the embedding model and every work run are. Work runs are admitted, slowed and paused by a resource governor so that the user's own programs come first."}]},{"number":"2.6","label":"2.6","id":"s2-6","title":"User Control","page":5,"blocks":[{"type":"p","text":"The user must retain visibility and control over:"},{"type":"ul","items":["Which activity sources are recorded (one at a time, in Privacy)","Agent configuration","Heartbeat configuration","Models","Scheduled tasks","Agent identity","What the agent remembers (the library's files, readable and editable)","Which background functions run (Settings \u003e Functions)","Runtime resource consumption","Listener permissions"]}]},{"number":"3","label":"3.","id":"s3","title":"High-Level Architecture","page":5,"blocks":[{"type":"p","text":"The system consists of the following major components:"},{"type":"pre","text":"                 +----------------------+\n                 |      Desktop UI      |\n                 |                      |\n                 | Agent / Overview /   |\n                 | Calendar /           |\n                 | Connections /        |\n                 | Experience / Lessons |\n                 | / Chat / Settings    |\n                 +----------+-----------+\n                            |\n                            v\n                 +----------------------+\n                 |      Agent Core      |\n                 +----------+-----------+\n                            |\n       +--------------------+--------------------+\n       |                    |                    |\n       v                    v                    v\n+-------------+      +-------------+      +-------------+\n|  Scheduler  |      |  Heartbeat  |      |   Listener  |\n+-------------+      +-------------+      +------+------+\n                                                 |\n+-------------+                                  v\n|  Work runs  |                       +-------------------+\n| (child      |                       | Normalized Events |\n|  processes, |                       +---------+---------+\n|  governor)  |                                 |\n+-------------+                                 v\n                                      +-------------------+\n                                      | Raw Event / Edit  |\n                                      |      Storage      |\n                                      +---------+---------+\n                                                |\n                                                v\n                                      +-------------------+\n                                      | Agent Heartbeat / |\n                                      | State Heartbeat   |\n                                      +---------+---------+\n                                                |\n                                                v\n                                      +-------------------+\n                                      | Library (states,  |\n                                      | tasks, user       |\n                                      | nature, feedback) |\n                                      +-------------------+"},{"type":"p","text":"The page also carries a Customized Recommendation tab, and, in a build that carries the debuggers, the Debugger and the per-part debugger tabs (section 14)."},{"type":"pre","text":"Platform-specific behavior:\n        |\n        v\n+-------------------+\n| Platform Layer    |\n| Win/macOS/Linux   |\n+-------------------+"},{"type":"pre","text":"Execution:\n        |\n        v\n+-------------------+\n| Runtime / Sandbox |\n+-------------------+"}]},{"number":"4","label":"4.","id":"s4","title":"Recommended Project Structure","page":7,"blocks":[{"type":"p","text":"/"},{"type":"p","text":"├── agent/"},{"type":"p","text":"│   ├── character/"},{"type":"p","text":"│   ├── overview/"},{"type":"p","text":"│   ├── state/"},{"type":"p","text":"│   ├── dialog/"},{"type":"p","text":"│   └── core/"},{"type":"p","text":"│"},{"type":"p","text":"├── listener/"},{"type":"p","text":"│   ├── core/"},{"type":"p","text":"│   ├── browser/"},{"type":"p","text":"│   ├── filesystem/"},{"type":"p","text":"│   ├── application/"},{"type":"p","text":"│   ├── integrations/"},{"type":"p","text":"│   └── providers/"},{"type":"p","text":"│"},{"type":"p","text":"├── heartbeat/"},{"type":"p","text":"│   ├── core/"},{"type":"p","text":"│   ├── checklist/"},{"type":"p","text":"│   └── models/"},{"type":"p","text":"│"},{"type":"p","text":"├── data_manage/"},{"type":"p","text":"│   ├── graph/"},{"type":"p","text":"│   ├── storage/"},{"type":"p","text":"│   ├── retrieval/"},{"type":"p","text":"│   ├── raw_edit/"},{"type":"p","text":"│   └── data_heartbeat/"},{"type":"p","text":"│"},{"type":"p","text":"├── scheduler/"},{"type":"p","text":"│   ├── core/"},{"type":"p","text":"│   ├── tasks/"},{"type":"p","text":"│   ├── storage/"},{"type":"p","text":"│   └── execution/"},{"type":"p","text":"│"},{"type":"p","text":"├── platform/"},{"type":"p","text":"│   ├── base/"},{"type":"p","text":"│   ├── windows/"},{"type":"p","text":"│   ├── macos/"},{"type":"p","text":"│   └── linux/"},{"type":"p","text":"│"},{"type":"p","text":"├── runtime/"},{"type":"p","text":"│   ├── sandbox/"},{"type":"p","text":"│   ├── filesystem/"},{"type":"p","text":"│   ├── process/"},{"type":"p","text":"│   └── permissions/"},{"type":"p","text":"│"},{"type":"p","text":"├── protocol/"},{"type":"p","text":"│   ├── identity/"},{"type":"p","text":"│   ├── authentication/"},{"type":"p","text":"│   └── permissions/"},{"type":"p","text":"│"},{"type":"p","text":"├── common/"},{"type":"p","text":"│   ├── config/"},{"type":"p","text":"│   ├── events/"},{"type":"p","text":"│   ├── logging/"},{"type":"p","text":"│   └── models/"},{"type":"p","text":"│"},{"type":"p","text":"├── tests/"},{"type":"p","text":"│"},{"type":"p","text":"├── requirements.txt"},{"type":"p","text":"└── README.md"},{"type":"p","text":"Additional modules may be introduced where necessary."},{"type":"p","text":"The architecture matters more than exact folder naming."},{"type":"p","text":"The current tree differs from this first sketch. Memory is `data_manage/library/`, beside `raw_edit/` and `storage/`; the graph is kept unused in the top-level `deprecated/`, and there is no retrieval package and no data heartbeat. The listener holds `core/`, `providers/` (application, assistant, browser, filesystem, screen, screenshot) and `integrations/`. The heartbeats live in `heartbeat/core` and `heartbeat/states`, beside `checklist/`, `connections/`, `experience/`, `lessons/` and `reading/`. Delegated work is `agent/work/`. The platform package is `platform_layer/`. The web interface and its local API are `api/`, and `debugger/`, `models/`, `ui/` (desktop window, tray, selection button) and `resources/` are packages of their own."}]},{"number":"5","label":"5.","id":"s5","title":"Frontend Agent Module","page":10,"blocks":[{"type":"p","text":"Location:"},{"type":"pre","text":"./agent/"},{"type":"p","text":"The Agent module provides the user's primary interaction point."}]},{"number":"6","label":"6.","id":"s6","title":"Character System","page":11,"blocks":[{"type":"p","text":"Location:"},{"type":"pre","text":"./agent/character/"},{"type":"p","text":"The agent may support multiple visual characters."},{"type":"p","text":"Character appearances should be constructed from image assets."},{"type":"p","text":"The initial implementation does not require dynamically generated 3D models."},{"type":"p","text":"The architecture should allow additional character packages to be installed later."},{"type":"p","text":"A character package may contain:"},{"type":"pre","text":"character_name/\n    manifest.json\n    idle/\n    talking/\n    thinking/\n    notification/\n    assets/"},{"type":"p","text":"The exact animation system may vary depending on the frontend framework."},{"type":"p","text":"A package may instead carry a rig - layers plus face geometry - that the application animates itself. The shipped avatar, Watermelon, works this way, and it is the default and the only one shipped: its body and leaves are painted once and its face is drawn every frame, so its eyes follow the pointer, it blinks, and its face answers what the agent is doing - a smile on hover, a hop on a click, a moving mouth while talking, thought bubbles while thinking. Its cheeks turn pink only for a notification, not when it smiles on hover, so that the colour means something has arrived. The settings page draws the same face in SVG from the same rig."},{"type":"p","text":"What the agent and its avatar are called is the name the user gives; where they give none, it is the avatar's own name."}]},{"number":"7","label":"7.","id":"s7","title":"Agent Desktop Interaction","page":11,"blocks":[{"type":"p","text":"The desktop agent supports the following interactions."},{"type":"p","text":"*Amended 2026-10-26:* NOTHING SLOW ON THE WINDOW'S THREAD AS IT COMES UP (the user: the application felt stuck at start). Its log showed the window not answering for a second at a time through its first forty seconds: opening a page - a double click - looked on that thread for every browser on the PATH, seconds with the disk busy, so the click seemed not taken and was made again; the folder dialog's unseen warm-up held it six seconds; and the listener's first passes - every assistant session read, the record of opened files asked - took the interpreter from its animation. Pages are opened off that thread, and the browsers are looked for in the background as soon as the agent is up; the warm-up is not done on Windows, where adding a work directory has the system's own chooser, and elsewhere only once the user has left the computer alone; and those two first passes wait a minute - the assistant's place to read from is fixed at once, and the opened-files record reaches back fifteen minutes - so nothing is missed by the wait.","amended":true}],"amendment_note":"2026-10-26: pages opened off the desktop window's thread, the folder dialog's warm-up not on Windows and only when idle elsewhere, the listener's first passes a minute late.","amended":true},{"number":"7.1","label":"7.1","id":"s7-1","title":"Single Click","page":11,"blocks":[{"type":"p","text":"Single-clicking the agent opens the conversation interface."},{"type":"p","text":"The user may enter natural-language instructions."},{"type":"p","text":"The conversation the agent window opens is a conversation: consecutive messages belong to one thread, and the agent answers each with the previous ones in view."},{"type":"p","text":"It is the same conversation the rest of the application shows. There is one agent, one memory and one set of conversations; the window on the desktop and the conversation interface inside the application are two ways into the same thing, not two agents."},{"type":"quote","text":"A window that starts a new conversation for each message is not a conversation interface. It answers every message as though it were the first."},{"type":"p","text":"The conversation opens as the application's own conversation interface, in a window showing that and nothing else - not a second conversation interface built again in the desktop toolkit."},{"type":"p","text":"There is one conversation interface in the system, and building a second one in a different toolkit produces two that drift apart: different rendering, different behaviour, and defects that have to be found and fixed twice. It also inherits whatever that toolkit imposes - a borderless, always-on-top character window is not a window the system activates, so a dialog owned by it may open and then refuse the keyboard entirely."},{"type":"p","text":"The window opened from the agent shows the conversation alone. Reaching the rest of the application is the double click and the right-click menu; the conversation is what a single click is for."},{"type":"p","text":"Quitting is likewise not queried. A user who chooses Quit from the menu has already said what they want, and nothing is lost by it: state is persisted as it is produced, and starting the agent again restores it. A confirmation adds a step and no information."}]},{"number":"7.2","label":"7.2","id":"s7-2","title":"Double Click","page":12,"blocks":[{"type":"p","text":"Double-clicking the agent opens the Overview interface."}]},{"number":"7.3","label":"7.3","id":"s7-3","title":"Right Click","page":12,"blocks":[{"type":"p","text":"Right-clicking the agent opens a short menu: Delegate work, Chat, Overview, Hide avatar and Quit. The tray icon offers the same menu, which is how a hidden avatar is brought back. Settings and the other panels are tabs of the page that Overview opens."}]},{"number":"7.4","label":"7.4","id":"s7-4","title":"Proactive Conversation","page":12,"blocks":[{"type":"p","text":"The agent may proactively open a conversation interface when it determines that relevant information should be communicated to the user."},{"type":"p","text":"Examples may include:"},{"type":"ul","items":["Reminders","Important detected events","Suggestions","Completed scheduled tasks","Agent-generated recommendations"]},{"type":"p","text":"Proactive interruption behavior should be configurable."}]},{"number":"7.4.1","label":"7.4.1","id":"s7-4-1","title":"A Bubble, and It Waits","page":12,"blocks":[{"type":"p","text":"Everything the agent raises on its own initiative appears as a bubble beside the character. It does not open a window and it does not take focus."},{"type":"p","text":"The shape is the whole point. A window arrives in front of whatever the user is doing and has to be dealt with before they can carry on; a bubble sits beside the character and can be left there. The agent's judgement about what is worth saying is not reliable enough to justify the first, and section 52.4 exists precisely because that judgement has to be checked rather than trusted."},{"type":"p","text":"**Bubbles queue.** One is shown at a time."},{"type":"ul","items":["A bubble carries the choices it is asking about and stays until one is chosen. It does not time out and does not dismiss itself, because a proactive message that vanishes unanswered is an interruption that bought nothing","While one is waiting the rest are counted, and that count is kept current as more arrive - a number drawn once when the bubble opened is wrong by the time it is read","The next bubble appears only when the current one has been answered"]},{"type":"p","text":"A bubble the agent raised by itself is marked as such, with a background of its own. \"The agent noticed something\" and \"the thing you asked for is finished\" deserve different reactions, and a user who cannot tell them apart gives both the same one."}]},{"number":"7.5","label":"7.5","id":"s7-5","title":"Hovering","page":12,"blocks":[{"type":"p","text":"Resting the pointer on the agent shows its current state, without clicking and without opening a panel."},{"type":"p","text":"The agent runs on its own schedule and the user cannot otherwise see it. What is shown must therefore be what is happening now and what is about to happen:"},{"type":"ul","items":["The agent's name","The model in use, and whether it is currently usable","When the state heartbeat last grouped what the user did, when it will next, and how many tasks it is working through","When the agent heartbeat last ran and how long until the next one","The next scheduled task, and when it is due","Every piece of delegated work in progress: its name, where it stands, how long it has run and what it has spent","Whether activity recording is off","Anything currently requiring the user: an expired sign-in, a model that cannot be used"]},{"type":"p","text":"Times are shown as durations from now - \"in 4 minutes\", \"12 minutes ago\" - because that is the question being asked. A timestamp the user has to subtract from the current time does not answer it."},{"type":"quote","text":"A component that is disabled says so. Showing nothing where a countdown belongs is indistinguishable from a countdown that has stopped."},{"type":"p","text":"The display is placed where it can be read: beside the agent on whichever side has room, and always fully on screen. The agent is usually at an edge of the display - that is where such a thing is kept - so a fixed offset from it puts the readout off the screen."},{"type":"p","text":"The text in it is sized by the user. The same size governs everything the agent puts on screen in its own small windows - this readout, and what it says when it speaks - because they are read in the same conditions, at whatever distance and resolution the user's display happens to have. A size fixed by the application is a size that is right for some displays and unreadable on others, and the user cannot argue with it."},{"type":"ul","items":["The size is a setting, with a range that keeps the windows usable","A window is sized from its text, not fixed: a larger size inside a fixed window only cuts the message off, which defeats setting it","A new size applies to the next window shown, without restarting the application","A value outside the range, however it got into the settings, is brought back into it rather than allowed to break the window"]},{"type":"p","text":"The display updates while it remains open, and disappears when the pointer leaves. It is built from state the application already holds and must not itself cause work - no model calls, no network, no processing - because pointing at the agent must never change what the agent does."}]},{"number":"8","label":"8.","id":"s8","title":"Overview Module","page":12,"blocks":[{"type":"p","text":"Location:"},{"type":"pre","text":"./agent/overview/"},{"type":"p","text":"The Overview is a front page of what the user needs to know: the tasks the agent has grouped from their activity, with the to-dos beside them; what the models spent, by kind of work; and the lessons package. The Calendar is a tab of its own. The record of computer usage (section 9) sits in the Debugger in a build that carries the debuggers, and at the foot of the Overview in a build without them, such as the released installers."},{"type":"p","text":"*Amended 2026-10-16:* the record of computer usage is the Debugger's alone. A build without the Debugger shows it nowhere - not at the foot of the Overview - for the hours spent in each application are the agent's raw material, not something the user needs to know.","amended":true},{"type":"p","text":"*Amended 2026-10-27:* CHAT AND THE CALENDAR, WHICHEVER CLIENT (the user's decision, from PR #3, built on what is here rather than merged). Claude Code and Codex are told the same of the agent's tools (models/providers/local_tools.TOOL_PROTOCOL, the longer words Claude Code had, with \"the calendar\" said to be the application's own - not a browser's, Google's or Outlook's, nor the client's own reminders); Codex is told them as its own developer instructions (-c developer_instructions), as Claude Code is as its system prompt - in the prompt still through npm's codex.cmd (cmd.exe would read the line again), past what a command line holds, or once a Codex refuses the setting. Chat's prompt says what the application has - calendar, tasks, to-do, work, connections, notifications - and that it acts only through its tools, never saying it did what it has no tool for; a time not wholly said is taken from the conversation and the user's clock, put on, and said back; a meeting goes on silently; it is said to be on only once schedule_task gave its task_id. The time and the zone are in every call's prompt. Work's web tools take public code and data hosts (GitHub and its raw files, GitLab, Bitbucket, Codeberg, PyPI's files, npm's registry, jsDelivr, unpkg, Zenodo, figshare, schemastore) as reference sites - none shows an owner who asked for what - but not the pages users host there (github.io), which run their owner's scripts.","amended":true},{"type":"p","text":"*Amended 2026-10-27:* WHAT THE MODELS SPENT IS SHOWN IN EVERY BUILD (reported by a user: the Overview's Token usage was empty). The card had moved from the Debugger to the Overview, but still asked the Debugger's routes - which a build without the Debugger does not serve - so in every released build it showed nothing, whatever the model. It asks routes of its own: the latest calls with what kind of work spent each, and the totals per day, cut at the reader's midnight. Only what the chart draws is sent.","amended":true}],"amendment_note":"2026-10-27: the Overview's Token usage asks routes of its own (/api/tokens, /api/tokens/by_day), served in every build - it asked the Debugger's, and was empty in every released one. Earlier, 2026-10-16: the user asked that what lives in the Debugger stay there: with no Debugger panel, computer usage (total time, activity by hour, usage by application) is not shown.","amended":true},{"number":"9","label":"9.","id":"s9","title":"Activity Overview","page":13,"blocks":[{"type":"p","text":"The Activity Overview displays how the user has used the computer."},{"type":"p","text":"The panel should include:"},{"type":"ul","items":["Total computer usage time","Usage time by application","Usage distribution","Recent applications","Historical activity"]},{"type":"p","text":"Selecting an application should allow the user to inspect related activity logs."},{"type":"p","text":"For example:"},{"type":"p","text":"Google Chrome"},{"type":"pre","text":"2h 17m"},{"type":"p","text":"VS Code"},{"type":"pre","text":"1h 42m"},{"type":"p","text":"Slack"},{"type":"pre","text":"53m"},{"type":"p","text":"Clicking an application can expose associated events such as:"},{"type":"ul","items":["Active periods","Window activity","Browser navigation where applicable","File interaction where available"]},{"type":"p","text":"The frontend must obtain these records from backend APIs rather than accessing Listener storage directly."},{"type":"h","text":"A Client That Went Away"},{"type":"p","text":"The panel refreshes on a timer and reloads whenever the user navigates, so a request still being answered when the tab closes is ordinary and happens several times an hour. Writing the answer to a socket nobody is holding fails, and that is not a fault."},{"type":"p","text":"What made it look like one was what happened next. The failed write was treated as a failed request, so the handler tried to send a 500 - down the same closed socket, which failed the same way, with nothing left to catch it. What reached the user was two stack traces, one nested inside the other, naming neither the route nor the reason."},{"type":"p","text":"So a write with nobody to write to ends the exchange rather than starting an error response, and is logged as what it is. The quiet is for that one named family of connection errors: anything else still reports, still returns a 500, and still gets its traceback in the log."},{"type":"h","text":"Period Accounting"},{"type":"p","text":"Every figure the Overview shows must state the period it covers, and must cover only that period."},{"type":"quote","text":"A per-day figure is that day's activity. A window bounded only at its start is a running total, and a series of such windows reports the same number for every entry."},{"type":"p","text":"Historical activity is reported per calendar day in the user's own timezone. A day with no recorded activity reports zero rather than being omitted, so a gap is visible as a gap."},{"type":"h","text":"Activity Over Time"},{"type":"p","text":"The Overview must show how activity was distributed through the day, not only what it totalled."},{"type":"p","text":"A time series over the last day is required, resolved to the hour, showing which applications were in use in each hour rather than a single undifferentiated total. Applications must be distinguishable from one another, and the distinction must be labelled."},{"type":"p","text":"A period shown by time of day must also say which day, because a window of the last twenty-four hours crosses midnight: an hour labelled only \"09:00\" is ambiguous between today and yesterday. The period covered must be stated, and where the series spans more than one date, the point at which the date changes must be identifiable within it."},{"type":"h","text":"Pages and Files"},{"type":"p","text":"The Overview reports what the user actually did, not only which application they did it in."},{"type":"p","text":"Where the Listener records browsing, the Overview must show the individual pages visited - their titles and their addresses - and not only that a browser was in use. Where it records filesystem activity, the Overview must show the individual files worked on - their names and their locations - and not only that an editor was open."},{"type":"quote","text":"\"Chrome, 2h 17m\" does not tell the user what they read. \"VS Code, 1h 42m\" does not tell them what they worked on. The panel is a record of activity, and an application name is the least specific thing it knows."},{"type":"p","text":"Each must be presented as its own view, covering the same period as the rest of the panel:"},{"type":"ul","items":["Pages: title, address, how many visits, and when it was last visited","Files: name, containing location, what happened to it, how many changes, and when it last changed","Both ordered by how much they were used, not alphabetically or by chance","Both able to say that nothing was recorded, distinguishably from having recorded nothing"]},{"type":"p","text":"This displays only what the Listener already collected. It grants no new collection: the settings of section 25 decide what exists to be shown, a source that is disabled contributes nothing, and a page or file excluded by an allowlist or denylist, or recorded while the user was away, must not appear here. Where a source is off, the panel must say that this is why it is empty, rather than presenting an empty list as though nothing happened."},{"type":"h","text":"Selection"},{"type":"p","text":"Selecting an application is a persistent choice, not a momentary one:"},{"type":"ul","items":["The selected application must remain selected, and its inspected activity must remain displayed, when the panel refreshes on its own","This applies to whatever the user has opened, not only to the application. A panel that refreshes on a timer and rebuilds the application's log over an open page takes the user back out of it while they are reading it - which, from where they sit, is the panel closing itself for no reason they can see","The current selection must be visually distinguishable in the list it was made from","Only elements that respond to selection may present themselves as selectable; a read-out must not offer the affordance of a control","Inspected activity must be presented as readable rows, not as raw stored records","A selection the user made is one they can undo. There must be a way to select nothing and return to looking at everything, without having to select something else instead","What a selection reveals is shown beside the list it was made from, so that selecting and seeing the result are one glance rather than two. A result placed a screen away from its control reads as nothing having happened","The two are given room in proportion to what they hold: the list is a column of names, the inspected activity is a log. Where the window is too narrow for both, they stack rather than being squeezed, and nothing in the interface refers to where the panel sits, because that changes with the width"]},{"type":"h","text":"Opening a Row Is Not Selecting It"},{"type":"p","text":"An application in the usage list can be opened where it stands, to show what it was used for, without becoming the selected one."},{"type":"p","text":"The two are different questions. \"What sites was the browser on?\" is a glance; \"show me everything about the browser\" is a commitment that replaces whatever the inspection panel was showing. A single control cannot serve both, because then every glance costs the user the thing they were already looking at."},{"type":"ul","items":["The row carries two controls: a small arrow that opens it in place, and the name, which selects it","Opening a row changes nothing else on the panel. The inspection panel keeps whatever it was showing, and no selection is made","What a row opens onto is what that application actually recorded - the sites for a browser, the files for an editor - and which of those it is follows the events, not a list of known program names, so an application nobody has classified still shows whatever it did record","A row with nothing to open onto has no arrow. An arrow that opens onto nothing is a promise the row cannot keep","Each entry says how much it accounts for, ordered by that, and a page listed there opens in its own right just as it does anywhere else"]},{"type":"h","text":"One Site Inside an Application"},{"type":"p","text":"A site opened from an application's row can itself be chosen, and the log then shows only what happened on it."},{"type":"p","text":"Asking about one site is a narrower version of the same question, not a different one, so the answer keeps its shape: the same stretches of use, carrying only what belongs to that site."},{"type":"ul","items":["The log says plainly that it is narrowed, names the site, and offers the way back to the whole application","A stretch of use that never touched the site is absent from the answer, not shown as an empty stretch. An empty stretch would say the user was there and did nothing, which is not what happened","Files belong to the application, not to the site, so a view of one site does not carry them","The site being viewed is marked in the list it was chosen from","Choosing the site already in view widens the log again, the same way choosing the selected application clears it","A site with nothing recorded narrows to nothing, and says so"]},{"type":"h","text":"Watched by Default, Narrowed by Choice"},{"type":"p","text":"The filesystem monitor watches every drive on the machine by default, and the user removes what they would rather it did not see."},{"type":"p","text":"The agent cannot notice what it is not looking at. A narrow default leaves the feature reporting itself as running while recording almost nothing - which is worse than being off, because the user believes their work is being seen when it is not."},{"type":"ul","items":["The default is everything, and narrowing it is a decision the user makes rather than one made quietly for them","What is watched is visible as one list, so what the agent can see is answerable at a glance","Watching everything is only usable because the exclusions carry the churn that would otherwise drown it: the machine's own directories, package and build caches, and the agent's own files. None of that is the user's activity","A directory is **browsed to, not typed**. A typed path can be misspelt, can name something that is not a directory, and can be silently wrong for as long as nobody checks. Typing reappears only on a machine where no chooser can run, and says that is why"]},{"type":"quote","text":"A stored setting does not change when its default does. A value written by an older version stays until something changes it, so a default corrected later leaves existing installations on the old value - visibly configured, invisibly wrong."},{"type":"h","text":"Which Application a Page or a File Belongs To"},{"type":"p","text":"Joining recorded activity to the application it belongs to is not a matter of comparing the names as they were stored, because the sources do not agree on them."},{"type":"p","text":"Time is counted under the process name the system reports. Browsing is recorded under the name of the history source it was read from. A file change names no application at all, because the filesystem reports a change, not a culprit. Joined literally, these never meet - every row would offer nothing to open, and the panel would look empty while holding the data."},{"type":"ul","items":["One application is one row whatever spelling reached it. The differences are of case and of the executable suffix, and nothing else, so they are removed before matching","Only the names the usage list is actually keyed by are join targets. Matching against every name seen anywhere lets a differently-spelled source claim the row and file its activity under one that does not exist","The same attribution governs the inspected activity, not only the usage list. Asking the store for one application by name returns only what was recorded under that exact name - the focus events, and nothing else - so a stretch of use gathered that way is always empty of the pages and files that made it up","Activity that names no application belongs to whichever application was in focus when it happened. This is an inference, and it is the honest one available: it is right for the case that matters - the user was working in the editor when the file changed - and where nothing was in focus it declines to guess rather than attributing the activity at random"]},{"type":"h","text":"What an Interaction Consisted Of"},{"type":"p","text":"Inspecting an application shows the stretches of use it was actually made of, and what was open during each."},{"type":"p","text":"A list of durations answers \"how long\" and never \"doing what\", which is the question someone opens this panel with. The pages and files therefore belong to the stretch of use they happened in, rather than sitting in a separate list the user has to line timestamps up against by hand."},{"type":"ul","items":["Each stretch of use is shown with when it ran, how long it lasted, and how much was recorded during it","What was recorded during a stretch is revealed on request, not all at once. A day's activity expanded in full is not a record anyone can read","A stretch with nothing recorded in it says so, and does not offer to be opened onto nothing","Work done through a coding assistant is the interaction, and it belongs to the stretch it ran in. A terminal is only where it happened: a stretch of terminal use reporting \"nothing recorded\" while a session ran inside it is describing the window rather than the work. What was said is shown where the conversation was recorded (section 18, as amended), and the shape of the session where it was not","A session is re-reported each time it grows, so one stretch can hold the same session many times over. It is summarised once. What was *said* is different every time and is all kept","An application that opens no pages and touches no watched file has still been doing something, and what it was doing is in its **window title**. A terminal, a chat window, a slide deck: the title names the project, the command or the document. Without it, such a stretch reports \"nothing recorded\" when the record existed and was simply not being looked at","**A stretch ends when the user leaves the application, not when the window title changes.** The title was never the boundary: it is what varied *inside* the stretch, and it is listed there. Bounded by the title instead, switching tab ended one stretch of browsing and began another - measured on one machine, **127 stretches of the browser, 81% of them under thirty seconds, median six**, and seventeen stretches of a second browser for two minutes of use. Expanded, each held a line or two, which is not a record of an evening. Under the same rule they become eight and three","**Stretches that overlap are joined.** A window's reported duration covers time the next window of the same application also reports, because the title changing is what ends one and begins the other: 90 of 217 consecutive stretches overlapped on that machine, so a rule that joined only stretches separated by a gap left nearly half of them apart for the one reason that is not a reason","**The time spent is the union, and the span is a separate fact.** A stretch shared with another window spans the moments spent elsewhere in the middle of it, so end-minus-start counts another application's time as this one's, and adding the pieces counts overlapping seconds twice. Both are shown - \"4m of 8m\" - because the duration alone reads as the whole stretch and the span alone is not this application's","A title that did not change during a stretch is one thing, not several. A title being animated - a glyph spun at the front of it several times a second while a task runs - is also one thing, and the leading decoration is stripped before comparing. Judged by character category rather than by a list of known glyphs, because the list of symbols people animate with is not one worth maintaining","Activity since the last stretch ended has not been dropped: it is still going on, is shown as such, and belongs at the top - it is the most recent thing the user did, and the most likely thing they came to look for","Which stretch is open is remembered by **the stretch**, not by its position in the list. The panel is rebuilt on every refresh and by then the list has moved: a newer stretch of use goes on the front and everything shifts down. Held by position, \"the first row is open\" comes to mean a different first row, so the stretch the user opened closes itself seconds later while another springs open in its place","**The agent's own model calls are not the user's activity, and are not shown as any.** The provider answers by running a coding assistant on this machine, which files a transcript of every run in the same store the Listener reads. Those turns are dropped on the way out as well as on the way in, because the ones already recorded are what the user is looking at now (section 18, as amended)","**A page belongs to a browser, and to no other kind of application.** A browser answers to two names - what it calls itself and what its process is called - and the rule that strips a `.exe` joins those for Chrome and Firefox but not for Edge, which calls itself Edge and runs as `msedge.exe`. The two never met, so pages read in Edge were attributed by focus instead: measured on one machine, **16 of 17 went to an SSH client**. The browser capture extension, since removed, had the same result for a different reason, naming itself \"browser\", which is not any application. Where the name can be joined it is used; where it cannot, the window in front is the honest guess **only if that window is a browser**, and otherwise there is no guess to make","**An assistant session is placed by where it was worked in, not by what was on screen.** A session is started in a terminal and then runs for minutes or hours while the user reads something else, so the window in front when its transcript last grew says nothing about where the work was happening. Asked that way, a session of 14,646 exchanges appeared under the browser because a video was playing while it ran, and the same rule filed assistant work under the chat client and under the **lock screen**. What does say where a session lives is the turns the user typed, because typing into an assistant means being in its window; a session whose conversation was not recorded offers no such evidence and is not attributed at all, the browser being no better an answer than none. That is the default installation, where recording what was said is off until an assistant is ticked - and the answer to \"a terminal that says nothing recorded while a session ran in it\" is then the **window title**, which a coding assistant sets to the task it is working on. A title is a fact about the window; the attribution would have been a guess about the work","**What the agent wrote to its own records is not activity either.** Every memory the agent writes arrives as a file change with no application on it, and was handed to whichever window was in front - one stretch of the browser held 217 of them. Ownership is what distinguishes these (section 39.1), and for changes already recorded the place is what is left to read it by: the memory folders and the internal storage, and never the rest of the workspace, where the user's own documents and downloads live","**This application's own panel is not a site the user visited.** The interface is served over HTTP and opened in the ordinary browser, so every look at the Overview and every trip to Settings went into the browser history like any other page and came back as browsing: on one machine `127.0.0.1:8756` was the sixth most visited host in the record, ahead of the search engine. It is the least useful of these to record, because the agent already knows every interaction with its own interface - it served them. A loopback address alone is never enough to decide this, since people develop on the same machine; it is the configured port that says the address is ours. What is dropped is the navigation - the URL, the site it counts towards, the page in a list of pages. **The window title stays**, because the browser genuinely was showing that page, and what an application was doing is not something to blank out"]},{"type":"h","text":"The Log Covers the Window the Tab Claims"},{"type":"p","text":"Selecting an application read **the newest N events** and built its stretches of use out of whatever those happened to span."},{"type":"p","text":"A day is mostly file changes - on one machine, 17,301 of the 21,182 events in twenty-four hours - so a count-bounded read covers however long the newest N of those last: measured there, **213 minutes** of the day the tab said it was showing, with nothing said about the rest. \"What was I doing yesterday evening\" is the question this panel is opened with, and it was being answered about this afternoon."},{"type":"p","text":"It is bounded by **time**, the same window the rest of the tab is showing, and the answer says which window that was. A ceiling on the number of events remains, so that a pathological day cannot make the panel unbounded - and when it is reached the panel says the oldest is not shown, because a panel that shows a slice and calls it a day is worse than one that says it is a slice."},{"type":"p","text":"**What is not worth reading is excluded in the query.** A window of time builds every row in it into an object first, and every one of those 17,301 file changes was the agent writing its own memory: read, parsed, and thrown away by the filter that knows they are not activity. Excluded where the rows are selected, the same window costs **120 ms instead of 480**. A directory change goes the same way - it is recorded for the directory and never read for anything, because every file inside it arrives separately."},{"type":"h","text":"Clicking Through It Is Not a Round Trip"},{"type":"p","text":"Selecting an application, opening one of its stretches of use and showing more of them are three different weights of thing, and they were all one request."},{"type":"p","text":"The activity log is drawn from one answer. Expanding a stretch, showing the earlier ones and opening out a cut title change only how that answer is drawn, so each is a redraw of what is already here. Asked for again, they cost a round trip per click and the panel was laid out over the top of itself."},{"type":"p","text":"Opening an application's breakdown, choosing a site inside it, and opening out a cut label are the same kind of thing one level up: they change only how the answers already in hand are drawn, and each re-fetched all seven answers behind the tab and rebuilt every panel, both charts included. The caret cost a reload of the whole tab, which is what made clicking one feel like waiting for it. Narrowing to a site is the exception that proves it - that does change what the log answers, so the log is asked again and nothing else is."},{"type":"p","text":"**And a prefix is a range, not a pattern.** \"The newest N events of this kind\" was written with `LIKE 'browser.%'`, and `LIKE` is case-insensitive by default, which makes it unusable as a prefix scan - so the index on (kind, time) could not serve it and the query walked the whole table newest-first looking for the 851 browser events among fifty thousand. Written as a range it reads them off the index: **70 ms to 4 ms**, and opening a page went from 136 ms to 9 ms. Where the query also has a time bound the planner prefers the other index and loses about ten milliseconds; that is the trade, and it is worth it twice over."},{"type":"p","text":"Behind them, the query that reads the newest events had no index to read them from. Every index on raw activity leads with a column that query does not filter on - the event type, the application, whether it has been processed - so \"the newest N events, whatever they are\" scanned the whole table and sorted it in a temporary B-tree to hand back the first two thousand: on one installation, **49,522 rows and 271 ms**, on every click and every expansion. It is a plain index on the timestamp, and an accounting the reader should never have been able to feel."},{"type":"h","text":"The Log Has a Length"},{"type":"p","text":"The inspected activity is a column beside a list, not a page of its own, and it must stay a length someone can read."},{"type":"p","text":"A day of use is hundreds of entries. Laid out in full, the panel pushes everything below it off the screen and the user scrolls past their own activity looking for the end of it - which is the same as not showing it."},{"type":"ul","items":["A few of the most recent stretches are shown, and the rest are behind a single control that says how many there are","That control works in both directions: what was unfolded can be folded again","One stretch of use can itself hold hundreds of entries. It shows the most recent of them and states plainly how many it is not showing, rather than becoming unreadable the moment it is opened","The same applies to any list of visits shown for a page","How far one application's log was unfolded says nothing about the next. Selecting a different application, or clearing the selection, starts folded again"]},{"type":"h","text":"A Cut Line Carries Its Own Handle"},{"type":"p","text":"Where a single line is too long for the log - a window title, a page title, an address - it is cut where it stops being scannable, and the cut itself is the control that undoes it."},{"type":"p","text":"A cut with no handle is worse than either showing the line whole or leaving it out. It hides that there was ever more to see, and gives the reader no way to ask for it. So the remainder is not discarded and it is not hidden: the line ends in a small toggle that says how much more there is, and opens it in place."},{"type":"ul","items":["The toggle is part of the line it belongs to, not a control beside it, and it states the size of what it is holding back","It works in both directions: an opened line offers to fold again","It opens one line, not every line like it. Lines are opened one at a time because they are read one at a time","Which lines were opened is remembered, so that a panel refreshing on its own does not fold up what the user was reading","A line that already fits gets no toggle. A control that does nothing is noise"]},{"type":"quote","text":"This applies wherever such a line appears - inside a stretch of use, under an application in the usage list, and in a page's own record - and it is the same handle each time."},{"type":"h","text":"The Arrow Says What It Is For"},{"type":"p","text":"A list whose rows can be opened says so, once, until the first one is opened."},{"type":"p","text":"A small arrow at the head of a row is easy not to notice, and a feature nobody notices is one that is not there. So the list carries a single line saying what the arrow does, and stops carrying it as soon as any row is open - at that point the user has found it, and the reminder is clutter."},{"type":"p","text":"Selecting the row that is already selected clears the selection. The control that made a choice is the first place someone reaches to undo it, and letting it serve both costs nothing."},{"type":"h","text":"A Page Is Also Something The User Did"},{"type":"p","text":"A page recorded in an interaction can be asked about in its own right."},{"type":"p","text":"Having found the page they were looking for, the user's next question is about that page - when else they were on it, how often, in which application - and that question is not answerable from a list of applications. So a page is openable from wherever it appears, and shows its own record:"},{"type":"ul","items":["Every recorded visit, most recent first, with the application it happened in","How many visits in total, and which applications they were made from","A way back to where the page was opened from, because opening a page is a step down into detail, not a move to somewhere else","A page with nothing recorded says so, rather than presenting an empty table as an answer"]}]},{"number":"10","label":"10.","id":"s10","title":"Calendar Panel","page":14,"blocks":[{"type":"p","text":"The Calendar displays tasks and events maintained by the Scheduler."},{"type":"p","text":"Users must be able to:"},{"type":"ul","items":["View scheduled tasks","Edit scheduled time","Reschedule tasks","Edit task metadata","Disable tasks","Delete tasks"]},{"type":"p","text":"Calendar modifications must modify the actual Scheduler state."},{"type":"p","text":"The Calendar is not simply a visual representation."},{"type":"p","text":"Required synchronization:"},{"type":"p","text":"Calendar UI"},{"type":"pre","text":"|\nv"},{"type":"p","text":"Scheduler API"},{"type":"pre","text":"|\nv"},{"type":"p","text":"Persistent Scheduler Storage"},{"type":"p","text":"Similarly:"},{"type":"p","text":"Agent creates delayed task"},{"type":"pre","text":"|\nv"},{"type":"p","text":"Scheduler"},{"type":"pre","text":"|\nv"},{"type":"p","text":"Calendar immediately reflects task"},{"type":"h","text":"Calendar Surface"},{"type":"p","text":"The Calendar must present a calendar: a dated grid of days, in the conventional form users already know from a calendar application."},{"type":"p","text":"The grid is the panel's primary surface and is always present. It is drawn from the date, not from the data:"},{"type":"quote","text":"An empty calendar shows an empty month, not an empty list. A period with nothing scheduled must still render its days, weekday headings and date numbers."},{"type":"p","text":"The following are required of the surface:"},{"type":"ul","items":["A month view showing every day of the displayed month in weeks, including the leading and trailing days needed to complete the first and last week, visually distinguished from the days of the month itself","Weekday headings, and a date number in every day cell","The current day distinguished from every other day","Navigation to the previous and next period, and a direct return to the current period, with the displayed period named","Each scheduled task placed in the day it falls on, showing its time and title, and distinguishing its status","A day with more tasks than its cell can show must say how many more, rather than silently truncating","Selecting a day shows that day's tasks in full, and offers scheduling on that day"]},{"type":"p","text":"A single day, with hours as rows, is offered beside the month (see Zooming In below); there is no week view."},{"type":"p","text":"Below the grid is a list of what the user agreed to whose time is not yet known. When the agent sees the time, it puts the item on the calendar and takes it off the list."},{"type":"p","text":"**The count is a control, not a caption.** Saying \"+13 more\" satisfies the requirement not to truncate silently, and still leaves the thirteen unreachable from where the user is looking. Selecting the day lists them, but a number sitting in the cell reads as something to press, and pressing it should do what it looks like it does: the cell opens and shows all of them, and offers to fold back up. The day the agent put sixteen things on is exactly the day worth looking at, and it was the day the grid said least about."},{"type":"p","text":"The editing requirements above apply wherever a task is shown, and section 10's synchronization requirement is unchanged: an edit made on the calendar surface changes Scheduler state, not a view of it."},{"type":"h","text":"A Time Is Something You Can Point At"},{"type":"p","text":"The calendar draws hours, and clicking one means that hour."},{"type":"p","text":"Drawing a grid of times and then treating every click as \"this day\" wastes the grid: the reason to draw hours at all is so the user can aim at one. Pointing at four o'clock on Thursday says **when** - the user still says what."},{"type":"ul","items":["A slot is half an hour, which is fine enough to mean something and coarse enough to hit","Clicking one fills the time into the form for a new task. It does not create anything: a stray click must not become an event","The slot that was chosen is marked, so what the form is about to schedule is visible on the grid rather than only in a field","A slot already holding a task is still a slot; clicking the task opens the task, and clicking beside it picks the time"]},{"type":"h","text":"An Event Opens Beside Itself"},{"type":"p","text":"Clicking an event shows the event, in a card next to the thing that was clicked."},{"type":"p","text":"A chip has to fit inside a slot, so it can carry a name and a time and nothing else. Everything else the task has - what kind it is, whether it repeats, when it last ran and what happened - would otherwise live only in a table somewhere else, and the user would have to know to go there."},{"type":"ul","items":["The detail opens **beside** the event, not centred on the screen. A card in the middle of the window covers the grid, points at nothing, and leaves the reader to find their place again when it closes. Beside it, the answer stays next to the question and the grid stays visible around it","It moves only as far as it must to stay on screen: to the other side of the event when there is no room, and no further up than the window forces. A card that has drifted somewhere arbitrary no longer reads as belonging to what was clicked","The screen behind it is not dimmed. The backdrop exists to catch the click that dismisses, not to hide the grid the user is still reading","Escape closes it, and so does a click anywhere outside it","The detail carries what the chip could not, and offers what can be done with the task: edit it, disable it, or delete it","Opening an event changes nothing. Looking at a task must not act on it","Deleting asks first, in the card itself, because it is the one action that cannot be undone - and asks why, optionally, because what the user removes is how the agent learns which notifications they want","The detail opens from the chips on the grid; the Calendar tab has no separate task list"]},{"type":"h","text":"The Grid Has to Be a Calendar"},{"type":"p","text":"The day view is laid out the way the month view is: a grid whose cells are big enough to read."},{"type":"p","text":"An hour must be tall enough for an event to carry its own name. Below that, a title is truncated to an ellipsis - a chip that says nothing while taking the room of one that would say something, which is worse than showing no chip at all."},{"type":"ul","items":["A slot is tall enough for a line of text, and an event's name is what it shows","In a time grid the chip does not repeat the time. The row it sits in already says when, and repeating it spends exactly the width the name needs","In the month view the chip does show the time, because there is no hour row there to say it"]},{"type":"h","text":"Zooming In"},{"type":"p","text":"Two views: the month, and a single day."},{"type":"p","text":"A week has to fit seven columns and cannot give any one day the room to be read, let alone aimed at, so there is no week view; zooming in goes straight to the day."},{"type":"ul","items":["The day view is one column of the same half-hour slots, at a size the user can actually hit","A day is reached by double-clicking it in the month view, or by choosing the day view directly","The day view opens at the start of the working day, or at the day's first event if that is earlier, rather than at midnight. A day that opens at the top opens on the eight hours nobody schedules, and every visit would begin by scrolling"]}]},{"number":"11","label":"11.","id":"s11","title":"States Module","page":15,"blocks":[{"type":"p","text":"Location:"},{"type":"pre","text":"./agent/state/"},{"type":"p","text":"The control surface is the page's Settings tab and, in a build that carries the debuggers, the Debugger and the per-part debuggers (experience, nature, reading, language, chat, heartbeat, state heartbeat). There is no graph view: memory is a library of files (section 39.1)."}]},{"number":"11.1","label":"11.1","id":"s11-1","title":"States Are Internal","page":15,"blocks":[{"type":"p","text":"A state is internal. The agent writes it, and nothing closes it: it stops describing the present when its end passes. No user action addresses one directly."},{"type":"p","text":"States remain inspectable in the Debugger, laid out the way the calendar is, with every state reachable and each one expanding to its detail. That is where an internal thing belongs - visible to whoever is working on the system and absent for everyone else. A build made from source carries the debuggers by default; `build.py --no-debugger` leaves them out, and the released installers and downloads are built that way. In a build made without the Debugger (section 14.34) there is no way to see states at all, which is correct."},{"type":"p","text":"What the user does act on is the two things that are theirs:"},{"type":"p","text":"| | what it is | who makes it | who ends it |"},{"type":"p","text":"|---|---|---|---|"},{"type":"p","text":"| **Scheduled task** | something to be done at a time | the user or the agent | running to completion, or the user cancelling it |"},{"type":"p","text":"| **Calendar entry** | a drawing of a task, on a grid | nobody - it is a view | it is redrawn |"},{"type":"p","text":"| **State** | what is true over a span | the agent | its own end time |"},{"type":"p","text":"What the user sees of states is what they add up to - the tasks on the Overview, which the state heartbeat groups from them."},{"type":"p","text":"Every scheduled task writes a state when the task is created, so that what the agent believes is going on always has something behind it. The reverse does not hold: a state needs no task, and most have none."},{"type":"p","text":"An edit on the calendar reaches the associated state as well as the task (section 60.1). The state is internal, not independent."}]},{"number":"12","label":"12.","id":"s12","title":"Settings","page":15,"blocks":[{"type":"p","text":"Initial settings include:"},{"type":"ul","items":["Display language","Character / avatar","Font size","Heartbeat interval","The models the agent uses, in order of preference","Writable workspace","Listener configuration","Notification preferences"]},{"type":"p","text":"The settings system should be schema-driven and extensible."},{"type":"p","text":"Settings are grouped into views - General, Display, Avatar, Functions, Privacy, Others - and edited where they stand: changing a value shows a Save bar on its card, which stays in view while the user scrolls, and nothing is stored until Save is pressed. The models are one ordered list: each call goes to the first that works, and moves to the next when one cannot answer."},{"type":"h","text":"Setting Explanations"},{"type":"p","text":"A label names a setting; it does not expla
