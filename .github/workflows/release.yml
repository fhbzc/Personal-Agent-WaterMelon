name: Release build

# Run by hand first (Actions > Release build > Run workflow): everything is
# built and attested, and nothing is published - a dry run. Pushing a tag
# v* runs it again and publishes the release.
#
# Tests gate the release; beside them, three native runners each build the
# downloads for their own operating system WITHOUT the Debugger (build.py
# --no-debugger): what users install never carries it. Nothing is published
# unless the tests pass - the builds just do not wait for them (43 minutes
# one after the other, about 28 side by side). Every file is given a stable name, a SHA-256 in
# SHA256SUMS.txt, and a build-provenance attestation signed by GitHub, so
# anyone can check which commit and which workflow made it:
#   gh attestation verify <file> --repo <owner>/<repo>
# The builds are not code-signed; signing secrets are used if ever added.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The whole suite, on Windows: the system it is developed and checked on.
  # macOS and Linux run the tests of what differs there - the OS isolation
  # of agent code - on their own build runners below.
  tests:
    name: Automated tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run the test suite
        run: python scripts/run_tests.py
      - name: Build-time validation
        run: python build.py --validate-only

  build:
    name: Build ${{ matrix.target }}
    permissions:
      contents: read
      id-token: write       # to sign the attestation
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
          - os: macos-latest
            target: macos
            # The Python whose macOS installer carries Tk 8.6.15: on 8.6.16
            # (3.12.10's) the character's clear window shows no picture
            # (ui/desktop.py CLEAR_ON_TK).
            python: "3.12.9"
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python || '3.12' }}

      - name: The Tk the application carries
        run: python -c "import sys, tkinter; print('Python', sys.version.split()[0], 'Tk', tkinter.Tcl().call('info', 'patchlevel'))"

      # torch's Linux wheels on PyPI bring CUDA with them - three gigabytes in
      # every Linux download, over GitHub's limit for a release file - though
      # the sentence model runs on the processor. The CPU-only wheel goes in
      # first; requirements.txt then finds torch already there. (Windows and
      # macOS wheels on PyPI are CPU-only already.)
      - name: Install the CPU-only torch (Linux)
        if: matrix.target == 'linux'
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Install Linux packaging tools
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb dpkg-dev fuse libfuse2 bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          sudo mv appimagetool-x86_64.AppImage /usr/local/bin/appimagetool

      - name: Install Inno Setup
        if: matrix.target == 'windows'
        run: choco install innosetup --no-progress -y

      # The OS isolation of agent code, exercised for real on each runner
      # (AppContainer, Seatbelt, bubblewrap).
      - name: OS isolation of agent code
        env:
          PA_EXPECT_OS_ISOLATION: "1"
        run: python -m pytest -q -rs tests/test_isolation.py

      # THE PROJECT'S OWN SIGNING CERTIFICATE (macOS), where it is set
      # (secrets MACOS_CERT_P12, base64, and MACOS_CERT_PASSWORD): one
      # identity from version to version, so what macOS allowed the agent
      # (Accessibility, Screen Recording) stays allowed after an update.
      # Not Apple's: not notarized. Without it the app is signed ad hoc.
      - name: The signing certificate (macOS)
        if: matrix.target == 'macos'
        shell: bash
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$CERT_P12" ]; then echo "no signing certificate: signed ad hoc"; exit 0; fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          lock=$(uuidgen)
          security create-keychain -p "$lock" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$lock" "$keychain"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$lock" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          name="Personal Agent WaterMelon Code Signing"
          security find-certificate -c "$name" -p "$keychain" > "$RUNNER_TEMP/signing.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/signing.pem"
          security find-identity -v -p codesigning "$keychain"
          echo "SIGN_AS=$name" >> "$GITHUB_ENV"

      - name: Build the application, without the Debugger
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY || env.SIGN_AS }}
          MACOS_NOTARY_PROFILE: ${{ secrets.MACOS_NOTARY_PROFILE }}
        run: python build.py --platform ${{ matrix.target }} --skip-tests --no-debugger

      - name: Release validation on a clean machine
        if: matrix.target != 'linux'
        run: python scripts/release_validation.py --report validation-${{ matrix.target }}.json
      - name: Release validation on a clean machine (Linux)
        if: matrix.target == 'linux'
        run: xvfb-run -a python scripts/release_validation.py --report validation-linux.json

      # One stable name per download, so the README's
      # releases/latest/download/<name> links always point at the newest.
      - name: Name the downloads
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          d="dist/${{ matrix.target }}"
          take() { src=$(ls $1 2>/dev/null | head -1 || true); [ -n "$src" ] || { echo "missing: $1"; exit 1; }; cp "$src" "release/$2"; }
          case "${{ matrix.target }}" in
            windows)
              take "$d/PersonalAgentWaterMelon-Setup*.exe"            PersonalAgentWaterMelon-Setup-windows-x64.exe
              take "$d/PersonalAgentWaterMelon-*-windows-portable.zip" PersonalAgentWaterMelon-portable-windows-x64.zip ;;
            macos)
              take "$d/PersonalAgentWaterMelon.pkg" PersonalAgentWaterMelon-macos.pkg
              take "$d/PersonalAgentWaterMelon.dmg" PersonalAgentWaterMelon-macos.dmg ;;
            linux)
              take "$d/*.deb"                    PersonalAgentWaterMelon-linux-x86_64.deb
              take "$d/*.AppImage"               PersonalAgentWaterMelon-linux-x86_64.AppImage
              take "$d/*-linux-x86_64.tar.gz"    PersonalAgentWaterMelon-portable-linux-x86_64.tar.gz ;;
          esac
          ls -l release
          # GitHub takes no release file of 2 GiB or more: stop here, not at publishing.
          for f in release/*; do
            size=$(wc -c < "$f")
            [ "$size" -lt 2147483648 ] || { echo "too large for a release: $f ($size bytes)"; exit 1; }
          done

      - name: Attest where each download was built from
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release/*

      - name: Upload the downloads
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: release/*
          if-no-files-found: error

  release:
    name: Publish the release
    needs: [tests, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: source
          sparse-checkout: docs/release-notes
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        working-directory: artifacts
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      # WHAT THIS VERSION CHANGES first - the README's update log entry,
      # kept in docs/release-notes/<tag>.md, which the application's "what
      # is new" window shows after an update - then how the downloads are
      # made and checked.
      - name: Release notes
        run: |
          notes="source/docs/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then cat "$notes" > body.md; echo >> body.md; echo "---" >> body.md; echo >> body.md; fi
          cat >> body.md <<'TEXT'
          Downloads for every system are below. They are built without the Debugger, by this repository's
          release workflow, from the commit this release is tagged at.

          **Check a download:** compare it with `SHA256SUMS.txt`, and confirm where it was built from with
          `gh attestation verify <file> --repo REPOSITORY`.

          The builds are not signed by Microsoft or Apple: Windows SmartScreen and macOS Gatekeeper warn on
          first start. The macOS app is signed with this project's own certificate, so what macOS allows it
          stays allowed after an update.
          See the README's *First start* section.
          TEXT
          sed -i "s#REPOSITORY#${GITHUB_REPOSITORY}#; s/^          //" body.md
          cat body.md
      # PUBLISHED AS A PRE-RELEASE: there to download and try, and offered
      # by no application's updates (platform_layer/updater.py reads no
      # pre-release) until it is made the latest by hand:
      #   gh release edit <tag> --prerelease=false --latest
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          prerelease: true
          make_latest: false
          body_path: body.md
