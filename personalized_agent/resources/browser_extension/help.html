<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Delegate work - not connected</title>
<style>
  :root { --ink: #1d232c; --muted: #5d6673; --paper: #ffffff; --line: #d9dee5; }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #e6e9f0; --muted: #a2abb8; --paper: #16191f; --line: #2e3440; }
  }
  body { margin: 0; background: var(--paper); color: var(--ink);
         font: 16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 36rem; margin: 3rem auto; padding: 0 16px; }
  h1 { font-size: 1.35rem; margin: 0 0 .75rem; }
  p { margin: .5rem 0; }
  .why { color: var(--muted); font-size: .9rem; border-top: 1px solid var(--line);
         padding-top: .75rem; margin-top: 1.25rem; word-break: break-word; }
</style>
</head>
<body>
<main>
  <h1 id="head">The agent is not connected to this browser yet</h1>
  <p id="do">Open Personal Agent WaterMelon, go to Settings, then General, and press
    "Install the browser extension". It connects this browser to the agent on this
    computer.</p>
  <p id="then">Then right-click the page again and pick Delegate work.</p>
  <p class="why" id="why" hidden></p>
</main>
<script src="help.js"></script>
</body>
</html>
