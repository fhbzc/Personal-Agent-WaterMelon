<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Delegate work - Personal Agent WaterMelon</title>
<style>
  :root { color-scheme: light dark; --bg: #f6f7fb; --ink: #1f2937; --muted: #6b7280; --accent: #3b6fe0; }
  @media (prefers-color-scheme: dark) { :root { --bg: #15171c; --ink: #e5e7eb; --muted: #9ca3af; --accent: #7aa2ff; } }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font: 14px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif; }
  main { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
  .spin { width: 26px; height: 26px; border-radius: 50%; border: 3px solid color-mix(in srgb, var(--accent) 25%, transparent);
    border-top-color: var(--accent); animation: turn .8s linear infinite; }
  @keyframes turn { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
  h1 { font-size: 17px; font-weight: 600; margin: 0; }
  p { margin: 0; color: var(--muted); }
</style>
</head>
<body>
<main>
  <div class="spin" aria-hidden="true"></div>
  <h1 id="title">Delegate work</h1>
  <p id="said">Opening&hellip;</p>
</main>
<script src="opening.js"></script>
</body>
</html>
